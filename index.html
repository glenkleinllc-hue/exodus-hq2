/* Supabase runs pg-safeupdate, which refuses a DELETE or UPDATE with no WHERE
   clause. That has now bitten twice — first the gym logs, then the students —
   and both times it failed silently for days. So it is checked here, before
   anything leaves the browser, and a mistake is loud instead of quiet. */
function unsafeSql(q){
  var t=String(q||"").replace(/\s+/g," ");
  var bad=[];
  t.split(";").forEach(function(part){
    var p2=part.trim(); if(!p2) return;
    if(/^delete\s+from\s+[a-z_.]+\s*$/i.test(p2)) bad.push(p2);
    else if(/^delete\s+from\s/i.test(p2) && !/\swhere\s/i.test(p2)) bad.push(p2);
    else if(/^update\s/i.test(p2) && !/\swhere\s/i.test(p2)) bad.push(p2);
  });
  return bad.length ? bad[0].slice(0,90) : null;
}

/* Run SQL. Resolves with rows, or rejects. Never throws into the UI. */
function sbSql(query){
  var unsafe=unsafeSql(query);
  if(unsafe){
    /* refuse to send it — a bare DELETE would wipe a table if the guard were
       ever switched off, and a bare UPDATE would touch every row */
    return Promise.reject(new Error(
      "Refused to send SQL with no WHERE clause: "+unsafe+". This is a bug — tell Glen."));
  }
  if(!(window.cowork&&window.cowork.callMcpTool))
    return Promise.reject(new Error("no connector"));
  SYNC.state="saving"; SYNC.queued++; sbBadge();
  return window.cowork.callMcpTool(SB,{project_id:SB_PROJ, query:query})
    .then(function(r){
      SYNC.queued--;
      var txt="";
      try{ txt = r && r.content && r.content[0] ? r.content[0].text : ""; }catch(e){}
      if(r && r.isError) throw new Error(txt||"query failed");
      /* the connector wraps rows in an untrusted-data fence; pull the JSON out */
      var m = String(txt).match(/\[[\s\S]*\]/);
      var rows=[];
      if(m){ try{ rows=JSON.parse(m[0]); }catch(e){ rows=[]; } }
      if(SYNC.queued<=0){ SYNC.queued=0; SYNC.state="ok"; SYNC.lastAt=new Date(); }
      sbBadge();
      return rows;
    })
    .catch(function(e){
      SYNC.queued=Math.max(0,SYNC.queued-1);
      SYNC.state="error"; SYNC.lastError=(e&&e.message)||String(e); sbBadge();
      throw e;
    });
}

    var vals=rows.map(function(r){
      return "("+qv(r.title)+","+qv(r.url)+","+qv(r.track||"Getting Hired")+","+qv(r.note||"")+")";});
    var sql="delete from training_library where true;";
    if(vals.length) sql+=" insert into training_library (title,url,track,note) values "+vals.join(",")+";";
    return sbRun(sql);
  },

  students: function(){
    var list=stuList();
    if(!list.length) return sbRun("update students set active=false where true;");
    var vals=list.map(function(pp){
      return "("+qv(pp.name)+","+qv(stuGet(pp.name,"phone",pp.contact))+","+qv(stuGet(pp.name,"email",""))+","
        +qv(stuGet(pp.name,"journey","Just Joined"))+","+qv(stuGet(pp.name,"goal",""))+","
        +qv(stuGet(pp.name,"situation",pp.notes))+","+qv(stuGet(pp.name,"updates",""))+",true)";});
    return sbRun("update students set active=false where true;"
      +" insert into students (name,phone,email,journey,goal,situation,updates,active) values "+vals.join(",")
      +" on conflict (name_key) do update set phone=excluded.phone, email=excluded.email,"
      +" journey=excluded.journey, goal=excluded.goal, situation=excluded.situation,"
      +" updates=excluded.updates, active=true;");
  },

  /* THIS IS WHY NOTES WERE NOT SAVING.
     It used to push L.notes straight off STATE.leads — but STATE is only
     rebuilt by refreshContacts(), which runs on blur. So while you typed, the
     debounced save fired against whatever STATE happened to hold, which was the
     value from before you started. One lead ended up with a note of just "1":
     the first keystroke, saved once, then never updated.

     It now reads the same place the page reads from — the per-lead overrides —
     so what gets pushed is always exactly what is on screen. */
  lead: function(name){
    var L=leadBy(name); if(!L) return Promise.resolve();
    var o=cnGet(L.name);
    var nt=ntGet(L.name);                       /* null means never edited */

    var phone = o.p || L.phone || "";
    var email = o.e || L.email || "";
    var ig    = o.s || L.ig    || "";
    if(STATUSES.indexOf(st)<0) st = L.stage;
    var x=lxGet(L.name);
    var came = x.came ? (x.came.length===7 ? x.came+"-01" : x.came) : null;
    var prec = x.came ? (x.came.length===7 ? "month" : "day") : "day";
    return sbRun("insert into leads (name,phone,email,instagram,stage,source,notes,owed,contingent,deferred,write_off,came_in,came_in_precision,follow_up_on,follow_up_note,detail) values ("
      +qv(L.name)+","+qv(phone)+","+qv(email)+","+qv(ig)+","+qv(st)+","+qv(L.funnel)+","
      +qv(notes)+","+qn(L.owed)+","+qn(L.contingent)+","+(L.deferred?"true":"false")+","
      +(L.writeOff?"true":"false")+","+qv(came)+","+qv(prec)+","+qv(x.fu||null)+","
      +qv(x.funote||null)+","+qv(x.detail||null)+") "
      +"on conflict (name_key) do update set phone=excluded.phone, email=excluded.email,"
      +" instagram=excluded.instagram, stage=excluded.stage, notes=excluded.notes,"
      +" owed=excluded.owed, contingent=excluded.contingent,"
      +" came_in=excluded.came_in, came_in_precision=excluded.came_in_precision,"
      +" follow_up_on=excluded.follow_up_on, follow_up_note=excluded.follow_up_note,"
      +" detail=excluded.detail;"
      +"update leads set priority="+(prGet(L.name)?"true":"false")
      +" where name_key="+qv(keyOf(L.name))+";");
  },

  priority: function(name){
    return sbRun("update leads set priority="+(prGet(name)?"true":"false")
      +" where name_key="+qv(keyOf(name))+";");
  },

  /* the safe. Three small lists, replaced wholesale so the order sticks. */
  vault_accounts: function(){ return vaultPush("accounts"); },
  vault_expenses: function(){ return vaultPush("expenses"); },
  vault_logins:   function(){ return vaultPush("logins"); },

  overrides: function(){
    var keys=["chase","conting","members"];
    var vals=keys.map(function(k){
      var v=LS("ov_"+k);
      return "("+qv("ov_"+k)+","+qv((v===null||v==="")?"":String(v))+")";});
    return sbRun("insert into settings (key,value) values "+vals.join(",")
      +" on conflict (key) do update set value=excluded.value;");
  },

  cash: function(){
    var v=LS("cash_collected");
    if(v===null||v==="") return sbRun("delete from settings where key='cash_collected';");
    return sbRun("insert into settings (key,value) values ('cash_collected',"+qv(String(v))+") "
      +"on conflict (key) do update set value=excluded.value;");
  },

  activity: function(name){
    var acts=actLoad(name), k=keyOf(name);
    var vals=acts.map(function(a){
      return "((select id from leads where name_key="+qv(k)+"),"+qv(k)+","+qv(a.t)+","+qv(a.d)+")";});

    if(vals.length) sql+=" insert into lead_activity (lead_id,name_key,body,happened_at) values "+vals.join(",")+";";

  },

  payment: function(name,amount){
    var k=keyOf(name);
    return sbRun("delete from payments where name_key="+qv(k)+";"
      +(qn(amount)>0 ? " insert into payments (name_key,amount) values ("+qv(k)+","+qn(amount)+");" : ""));
  },

  social: function(){
    var vals=PLATS.map(function(pl){
      var tbl={tiktok:"tiktok",ig:"instagram",yt:"youtube"}[pl.k];
      return "("+qv(tbl)+","+qn(LS("fol_"+pl.k)||"0")+")";});
    return sbRun("insert into social_accounts (platform,followers) values "+vals.join(",")
      +" on conflict (platform) do update set followers=excluded.followers;");
  },

  posts: function(dateKey){
    var vals=PLATS.map(function(pl){
      var tbl={tiktok:"tiktok",ig:"instagram",yt:"youtube"}[pl.k];
      return "("+qv(tbl)+","+qv(dateKey)+","+qn(LS("post_"+pl.k+"_"+dateKey)||"0")+")";});
    return sbRun("insert into social_posts (platform,posted_on,count) values "+vals.join(",")
      +" on conflict (platform,posted_on) do update set count=excluded.count;");

  brands: function(){

      +"on conflict (key) do update set value=excluded.value;");
  },

  /* conversation history and the audit trail */
  said: function(agent,role,body){

    return sbRun("insert into conversations (agent_id,role,body) values ("
      +qv(agent)+","+qv(role)+","+qv(body)+");");
  },
  /* An audit entry is the least important thing in the app, so it must never be
     able to break a real save. Unknown agent ids were being rejected by the
     foreign key and silently binned — "system" was not in the allowed list. */
  acted: function(agent,action,target,payload){
    var who=String(agent||"system").toLowerCase();
    if(["claudia","jordan","claude","system"].indexOf(who)<0) who="system";
    return sbRun("insert into agent_actions (agent_id,action,target,payload) values ("
      +qv(who)+","+qv(action)+","+qv(target)+","+qv(JSON.stringify(payload||{}))+"::jsonb);");
  },
  remember: function(agent,fact,weight,scope){
    if(!fact) return Promise.resolve();
    var w=parseInt(weight,10); if(!(w>=2&&w<=5)) w=3;   /* the column is checked 2..5 */
    return sbRun("insert into agent_memory (agent_id,scope,fact,weight,source) values ("
      +qv(agent)+","+qv(scope||"general")+","+qv(fact)+","+w+",'chat');");
  }
};

/* ==================== BACKFILL ====================
   THE BUG THIS FIXES.
   The write-through layer only ever fired when something CHANGED. Anything
   already typed before that layer existed stayed in localStorage and never
   reached Postgres. localStorage does not travel between domains, so moving to
   the live site looked like every meal, workout, note and student had vanished
   — they were sitting in the old browser the whole time.

   This pushes the entire local cache up in one go. It runs automatically the
   first time it notices the database is emptier than the browser, and there is
   a button in Notes to run it by hand. */
var SYNCED_FLAG="backfilled_v2";

function sbBackfill(force){
  if(!force && LS(SYNCED_FLAG)==="1") return Promise.resolve({skipped:true});

  var did=[];
  function count(n,label){ if(n) did.push(n+" "+label); }

  /* gym */
  var meals=fdLoad(), workouts=wkLoad(), weights=wtLoad();
  count(meals.length,"meals"); count(workouts.length,"workouts"); count(weights.length,"weigh-ins");

  /* the consistency squares, however many days back they go */
  var days=[];
  for(var d=0; d<420; d++){
    var dd=new Date(); dd.setDate(dd.getDate()-d);
    var k=dkey(dd), v=LS("cs_"+k);
    if(v==="g"||v==="b"||v==="r") days.push({d:k,s:v});
  }
  count(days.length,"tracked days");

  /* notes per room */
  var notes=[];
  ["office","sales","content","gym","assistant"].forEach(function(r){
    var b=LS("notes_"+r); if(b && b.trim()) notes.push({r:r,b:b});});
  count(notes.length,"note pages");

  /* whiteboard */
  var wb=[];
  [["target","wb_target"],["goal","wb_goal"],["working","wb_working"],
   ["broken","wb_broken"],["trying","wb_trying"],["why","wb_why"]].forEach(function(x){
    var v=LS(x[1]); if(v && v.trim()) wb.push({s:x[0],b:v});});
  count(wb.length,"whiteboard slots");

  /* the week */
  var wk=[], stamp=LS("week_stamp")||weekStamp();
  var wkiso=(function(){var pp=String(stamp).split("-");
    return pp[0]+"-"+("0"+pp[1]).slice(-2)+"-"+("0"+pp[2]).slice(-2);})();
  for(var w=0; w<7; w++){
    var plan=LS("week_plan_"+w)||"", lab=dayLabel(w), done=LS("week_done_"+w)==="1";
    if(plan.trim()||done) wk.push({d:w,l:lab,p:plan,k:done});
  }
  count(wk.length,"planned days");

  var training=LJ("train_rows",[]);      count(training.length,"training links");
  var students=stuList();                count(students.length,"students");

  /* per-lead notes, stages, contacts, activity and payments */
  var leadPatch=[], acts=[], pays=[];
  STATE.leads.forEach(function(L){
    var k=keyOf(L.name);
    var st=LS("st_"+k), nt=LS("nt_"+k), cn=LS("cn_"+k), pay=LS("pay_"+k);
    var pr=LS("pr_"+k);
    if(st||nt||cn||pr) leadPatch.push({k:k,name:L.name,st:st,nt:nt,cn:cn,pr:pr});
    if(pay && parseFloat(pay)>0) pays.push({k:k,a:parseFloat(pay)});
    var a=actLoad(L.name);
    a.forEach(function(x){ acts.push({k:k,t:x.t,d:x.d}); });
  });
  count(leadPatch.length,"lead edits"); count(acts.length,"activity entries");
  count(pays.length,"payments");

  var targets=[["calories","goal_kcal"],["protein","goal_prot"],
               ["carbs","goal_carb"],["fat","goal_fat"]];

  /* social */
  var fol=[], posts=[];
  PLATS.forEach(function(pl){
    var tbl={tiktok:"tiktok",ig:"instagram",yt:"youtube"}[pl.k];
    var f=LS("fol_"+pl.k); if(f) fol.push({p:tbl,f:qn(f)});
    for(var dd2=0; dd2<120; dd2++){
      var day=new Date(); day.setDate(day.getDate()-dd2);
      var c=LS("post_"+pl.k+"_"+dkey(day));
      if(c && qn(c)>0) posts.push({p:tbl,d:dkey(day),c:qn(c)});
    }
  });
  count(posts.length,"posting days");

  /* ---- build one statement per table, skipping anything empty ---- */
  var sql=[];
  function ins(table, cols, rows, build){
    if(!rows.length) return;
    sql.push("insert into "+table+" ("+cols+") values "
      + rows.map(build).join(",") + " on conflict do nothing");
  }

  if(meals.length) sql.push("delete from meals where true");
  ins("meals","eaten_on,eaten_at,body,calories,protein_g,carbs_g,fat_g",meals,function(m){
    var d=new Date(m.d);
    return "("+qv(d.toISOString().slice(0,10))+","+qv(d.toISOString())+","+qv(m.what)+","
      +qn(m.kcal)+","+qn(m.p)+","+qn(m.c)+","+qn(m.f)+")";});

  if(workouts.length) sql.push("delete from workouts where true");
  ins("workouts","trained_on,body",workouts,function(w){
    return "("+qv(new Date(w.d).toISOString().slice(0,10))+","+qv(w.t)+")";});

  if(weights.length) sql.push("delete from weights where true");
  ins("weights","weighed_on,pounds",weights,function(w){
    return "("+qv(w.d)+","+qn(w.w)+")";});

  days.forEach(function(x){
    var map={g:"trained",b:"work",r:"missed"};
    sql.push("insert into day_states (the_day,state) values ("+qv(x.d)+","+qv(map[x.s])+")"
      +" on conflict (the_day) do update set state=excluded.state");});

  notes.forEach(function(n){
    sql.push("insert into room_notes (room,body) values ("+qv(n.r)+","+qv(n.b)+")"
      +" on conflict (room) do update set body=excluded.body");});

  wb.forEach(function(x){
    sql.push("insert into whiteboard (slot,body) values ("+qv(x.s)+","+qv(x.b)+")"
      +" on conflict (slot) do update set body=excluded.body");});

  wk.forEach(function(x){
    sql.push("insert into week_plan (week_start,day_of_week,label,plan,done) values ("
      +qv(wkiso)+","+x.d+","+qv(x.l)+","+qv(x.p)+","+(x.k?"true":"false")+")"
      +" on conflict (week_start,day_of_week) do update set label=excluded.label,"
      +" plan=excluded.plan, done=excluded.done");});

  if(training.length) sql.push("delete from training_library where true");
  ins("training_library","title,url,track,note",training,function(r){
    return "("+qv(r.title)+","+qv(r.url)+","+qv(r.track||"Getting Hired")+","+qv(r.note||"")+")";});

  students.forEach(function(pp){
    sql.push("insert into students (name,phone,email,journey,goal,situation,updates,active) values ("
      +qv(pp.name)+","+qv(stuGet(pp.name,"phone",pp.contact))+","+qv(stuGet(pp.name,"email",""))+","
      +qv(stuGet(pp.name,"journey","Just Joined"))+","+qv(stuGet(pp.name,"goal",""))+","
      +qv(stuGet(pp.name,"situation",pp.notes))+","+qv(stuGet(pp.name,"updates",""))+",true)"
      +" on conflict (name_key) do update set phone=excluded.phone, email=excluded.email,"
      +" journey=excluded.journey, goal=excluded.goal, situation=excluded.situation,"
      +" updates=excluded.updates, active=true");});

  leadPatch.forEach(function(L){
    var c={}; try{ c=L.cn?JSON.parse(L.cn):{}; }catch(e){ c={}; }
    var sets=[];
    if(L.st) sets.push("stage="+qv(stageFix(L.st)));
    if(L.nt) sets.push("notes="+qv(L.nt));
    if(c.p)  sets.push("phone="+qv(c.p));
    if(c.e)  sets.push("email="+qv(c.e));
    if(c.s)  sets.push("instagram="+qv(c.s));
    if(L.pr!==null&&L.pr!==undefined&&L.pr!=="") sets.push("priority="+(L.pr==="1"?"true":"false"));
    if(sets.length) sql.push("update leads set "+sets.join(", ")+" where name_key="+qv(L.k));
  });

  var cashv=LS("cash_collected");
  if(cashv!==null&&cashv!=="")
    sql.push("insert into settings (key,value) values ('cash_collected',"+qv(String(cashv))+") "
      +"on conflict (key) do update set value=excluded.value");

  if(acts.length){
    sql.push("delete from lead_activity where true");
    ins("lead_activity","lead_id,name_key,body,happened_at",acts,function(a){
      return "((select id from leads where name_key="+qv(a.k)+"),"+qv(a.k)+","+qv(a.t)+","+qv(a.d)+")";});
  }
  if(pays.length){
    sql.push("delete from payments where true");
    ins("payments","name_key,amount",pays,function(x){ return "("+qv(x.k)+","+x.a+")"; });
  }
  targets.forEach(function(t){
    var v=qn(LS(t[1])||"0");
    if(v) sql.push("insert into nutrition_targets (metric,target) values ("+qv(t[0])+","+v+")"
      +" on conflict (metric) do update set target=excluded.target");});
  fol.forEach(function(f){
    sql.push("insert into social_accounts (platform,followers) values ("+qv(f.p)+","+f.f+")"
      +" on conflict (platform) do update set followers=excluded.followers");});
  posts.forEach(function(x){
    sql.push("insert into social_posts (platform,posted_on,count) values ("
      +qv(x.p)+","+qv(x.d)+","+x.c+") on conflict (platform,posted_on) do update set count=excluded.count");});
  var pitch=LS("script_pitch");
  if(pitch && pitch.trim())
    sql.push("insert into settings (key,value) values ('script_pitch',"+qv(pitch)+")"
      +" on conflict (key) do update set value=excluded.value");

  if(!sql.length){ LS(SYNCED_FLAG,"1"); return Promise.resolve({nothing:true}); }

  /* run them in small batches so one bad row cannot lose the lot */
  var batches=[], per=12;
  for(var b2=0;b2<sql.length;b2+=per) batches.push(sql.slice(b2,b2+per).join("; "));

  var ok=0, failed=0;
  return batches.reduce(function(chain, batch){
    return chain.then(function(){
      return sbSql(batch).then(function(){ ok++; }).catch(function(){ failed++; });
    });
  }, Promise.resolve()).then(function(){
    if(!failed) LS(SYNCED_FLAG,"1");
    return {pushed:did, batches:batches.length, ok:ok, failed:failed};
  });
}

var MEMORY={claudia:"",claude:"",jordan:""};
var HISTORY={claudia:[],jordan:[],claude:[]};   /* what was actually said, restored on boot */
var SBLEADS=[];        /* the pipeline straight out of Postgres — the source of truth */
var SBFORMS=[];        /* form submissions, straight out of Postgres */

/* Turn a Postgres row into the same shape parseLeads() produces, so every
   panel downstream cannot tell the difference. */
function sbToLead(r){
  /* a retired stage name still lands in the right place rather than resetting */
  var st=stageFix(r.stage||"New Lead");
  if(STATUSES.indexOf(st)<0) st="New Lead";
  return {name:r.name, contact:r.phone||"", secondary:r.email||"",
    funnel:r.source||"Supabase", notes:r.notes||"", notesBase:r.notes||"", month:"",
    stage:st, stageBase:st,
    owed:parseFloat(r.owed)||0, contingent:parseFloat(r.contingent)||0,
    deferred:!!r.deferred, writeOff:!!r.write_off,
    flag:r.flag||null, flagBase:r.flag||null,
    phone0:r.phone||"", email0:r.email||"", social:r.ig||"", fromDb:true};
}

function sbPull(){
  var one="select json_build_object("
    +"'meals',      (select coalesce(json_agg(json_build_object('d',eaten_at,'what',body,'kcal',calories,'p',protein_g,'c',carbs_g,'f',fat_g) order by eaten_at),'[]'::json) from meals),"
    +"'workouts',   (select coalesce(json_agg(json_build_object('d',trained_on,'t',body) order by trained_on),'[]'::json) from workouts),"
    +"'weights',    (select coalesce(json_agg(json_build_object('d',weighed_on,'w',pounds) order by weighed_on),'[]'::json) from weights),"
    +"'days',       (select coalesce(json_agg(json_build_object('d',the_day,'s',state)),'[]'::json) from day_states),"
    +"'targets',    (select coalesce(json_agg(json_build_object('m',metric,'t',target)),'[]'::json) from nutrition_targets),"
    +"'notes',      (select coalesce(json_agg(json_build_object('r',room,'b',body)),'[]'::json) from room_notes),"
    +"'week',       (select coalesce(json_agg(json_build_object('s',week_start,'d',day_of_week,'l',label,'p',plan,'k',done)),'[]'::json) from week_plan),"
    +"'wb',         (select coalesce(json_agg(json_build_object('s',slot,'b',body)),'[]'::json) from whiteboard),"
    +"'training',   (select coalesce(json_agg(json_build_object('title',title,'url',url,'track',track,'note',note) order by created_at desc),'[]'::json) from training_library),"
    +"'students',   (select coalesce(json_agg(json_build_object('name',name,'phone',phone,'email',email,'journey',journey,'goal',goal,'situation',situation,'updates',updates)),'[]'::json) from students where active),"
    +"'social',     (select coalesce(json_agg(json_build_object('p',platform,'f',followers)),'[]'::json) from social_accounts),"
    +"'posts',      (select coalesce(json_agg(json_build_object('p',platform,'d',posted_on,'c',count)),'[]'::json) from social_posts where posted_on >= current_date - 30),"
    +"'stages',     (select coalesce(json_agg(json_build_object('k',name_key,'s',stage,'n',notes,'p',phone,'e',email,'i',instagram,'pr',priority,"
    +"                 'came',came_in,'prec',came_in_precision,'fu',follow_up_on,'funote',follow_up_note,'detail',detail)),'[]'::json) from leads),"
    +"'forms',      (select coalesce(json_agg(json_build_object('name',name,'email',email,'phone',phone,'interest',interest,'at',submitted_at,'gid',gmail_id,'self',is_self_test) order by submitted_at desc),'[]'::json) from form_submissions),"
    +"'leads',      (select coalesce(json_agg(json_build_object('name',name,'phone',phone,'email',email,'ig',instagram,'stage',stage,'source',source,'notes',notes,'owed',owed,'contingent',contingent,'deferred',deferred,'write_off',write_off,'flag',flag) order by name),'[]'::json) from leads),"
    +"'acts',       (select coalesce(json_agg(json_build_object('k',name_key,'t',body,'d',happened_at) order by happened_at desc),'[]'::json) from lead_activity),"
    +"'pays',       (select coalesce(json_agg(json_build_object('k',name_key,'a',amount)),'[]'::json) from payments),"
    +"'brands',     (select value from settings where key='brand_notes'),"
    +"'cash',       (select value from settings where key='cash_collected'),"
    +"'vacct',      (select coalesce(json_agg(json_build_object('label',label,'kind',kind,'institution',institution,'last4',last4,'balance',balance,'limit_amt',limit_amt,'note',note) order by sort),'[]'::json) from vault_accounts),"
    +"'vexp',       (select coalesce(json_agg(json_build_object('label',label,'amount',amount,'cadence',cadence,'due_day',due_day,'category',category,'paid_with',paid_with,'active',active,'note',note) order by sort),'[]'::json) from vault_expenses),"
    +"'vlog',       (select coalesce(json_agg(json_build_object('label',label,'username',username,'secret',secret,'url',url,'note',note) order by sort),'[]'::json) from vault_logins),"
    +"'ovs',        (select coalesce(json_object_agg(key,value),'{}'::json) from settings where key like 'ov!_%' escape '!'),"
    +"'memory',     (select coalesce(json_agg(json_build_object('a',agent_id,'r',remembered)),'[]'::json) from agent_context),"
    +"'history',    (select coalesce(json_agg(json_build_object('a',agent_id,'r',role,'b',body,'at',said_at) order by said_at),'[]'::json) "
    +"                from (select * from conversations order by said_at desc limit 120) h)"
    +") as blob;";

  return sbSql(one).then(function(rows){

function readDrive(id){return window.cowork.callMcpTool(DRIVE,{fileId:id})
  .then(function(r){var d=unwrap(r);return d.fileContent||d.content||"";});}
var BOOTED=false;
function boot(){
  if(BOOTED) return;
  BOOTED=true;
  /* Supabase is the source of truth. The Drive sheet is the backup: it fills in
     anyone the database has never seen, and it is what we fall back to if the
     database cannot be reached at all. */
  sbPull()
  .then(function(){
    /* Anything typed before the sync layer existed only lived in this browser.
       Push it up once so it can never be stranded again. */
    return sbBackfill(false).then(function(r){
      if(r && r.pushed && r.pushed.length) return sbPull();
    }).catch(function(){});
  })
  .then(function(){
    if(SBLEADS.length){
      STATE.leads = SBLEADS.concat(mlLoad().map(mlToLead));
      refreshContacts();
      drawBuilding();
    }
    /* The pull lands after the first paint, so anything already on screen is
       showing pre-sync numbers — that is how a phone ended up saying $430 while
       the laptop said $1,600. Repaint whatever is open. */
    try{ redraw(); if(VIEW==="home") drawDash(); }catch(e){}
    return readDrive(LEADS_ID)
      .then(function(md){
        var sheet = parseLeads(md);
        if(!SBLEADS.length){
          /* database empty or unreachable — run off the sheet and seed the db */
          STATE.leads = sheet.concat(mlLoad().map(mlToLead));
          STATE.source = "sheet";
          refreshContacts();
          sbSeedFromSheet(sheet);
        } else {
          /* database wins. Anyone only in the sheet gets added, nothing overwritten. */
          var have = {};
          SBLEADS.forEach(function(x){ have[keyOf(x.name)] = true; });
          var fresh = sheet.filter(function(x){ return !have[keyOf(x.name)]; });
          STATE.source = "supabase";
          if(fresh.length){
            STATE.leads = SBLEADS.concat(fresh).concat(mlLoad().map(mlToLead));
            refreshContacts();
            sbSeedFromSheet(fresh);
          }
        }
      })
      .catch(function(){
        STATE.sheetErr = true;
        if(!SBLEADS.length) STATE.err = "Couldn't reach Supabase or the Drive sheet.";
        else STATE.source = "supabase";
      });
  })
  .then(function(){ return readDrive(JOBS_ID).then(function(md){STATE.jobs=parseJobs(md);})
    .catch(function(){STATE.jobsErr=true;});})
  .then(function(){return window.cowork.callMcpTool(GMAIL,{query:"from:submissions@formsubmit.co",pageSize:50})
    .then(function(r){
      var fromMail=parseForms(unwrap(r).threads)||[];
      /* de-duplicate on name so a lead that came through both routes appears once */
      var seen={};
      var merged=fromMail.concat(SBFORMS).filter(function(f){
        var k=keyOf(f.name)+"|"+(f.email||"").toLowerCase();
        if(seen[k]) return false; seen[k]=1; return true;});
      merged.sort(function(a,b){return (b.date||0)-(a.date||0);});
      STATE.forms=merged;
      if(fromMail.length) sbSyncForms();
    })
    .catch(function(){
      /* no mailbox on this host — the webhook rows are the whole list */
      STATE.forms=SBFORMS;
      if(!SBFORMS.length) STATE.formErr=true;
    });})
  .then(function(){var a=new Date(),b=new Date(Date.now()+21*86400000);
    return window.cowork.callMcpTool(CAL,{calendarId:"glenkleinllc@gmail.com",
      startTime:a.toISOString(),endTime:b.toISOString(),orderBy:"startTime",pageSize:60})
      .then(function(r){STATE.events=unwrap(r).events||[];})
      .catch(function(){STATE.calErr=true;});})
  .then(function(){
    drawBuilding();renderPanel(LS("panelOpen")!=="0");
    paintTopBar();
    var lastH=Math.floor(nowHour());
    setInterval(function(){
      paintTopBar();
      var h=Math.floor(nowHour());
      if(h!==lastH){ lastH=h; drawBuilding(); }   /* light and routines shift on the hour */
    },20000);
  });
}

/* Push anyone the sheet knows about and the database does not. Never updates an
   existing row — the database is ahead of the sheet by definition. */
function sbSeedFromSheet(rows){
  if(!rows||!rows.length) return Promise.resolve();
  var vals=rows.slice(0,200).map(function(x){
    return "("+qv(x.name)+","+qv(x.phone0||x.contact)+","+qv(x.email0||x.secondary)+","
      +qv(x.social)+","+qv(x.stage)+","+qv(x.funnel)+","+qv(x.notes)+","
      +qn(x.owed)+","+qn(x.contingent)+","+(x.deferred?"true":"false")+","
      +(x.writeOff?"true":"false")+")";});
  return sbRun("insert into leads (name,phone,email,instagram,stage,source,notes,owed,contingent,deferred,write_off) values "
    +vals.join(",")+" on conflict (name_key) do nothing;");
}

/* Keep the form submissions table in step with Gmail, so nothing is only ever
   in an inbox. */
function sbSyncForms(){
  if(!STATE.forms||!STATE.forms.length) return Promise.resolve();
  var vals=STATE.forms.slice(0,120).map(function(f){
    return "("+qv(f.name)+","+qv(f.email)+","+qv(f.phone)+","+qv(f.interest)+","
      +qv(f.date?new Date(f.date).toISOString():null)+","+qv(f.id||f.gmailId||null)+","
      +(f.self?"true":"false")+")";});
  return sbRun("insert into form_submissions (name,email,phone,interest,submitted_at,gmail_id,is_self_test) values "
    +vals.join(",")+" on conflict (gmail_id) do nothing;");
}

function collectedRaw(){var t=0;paidMembers().forEach(function(p){

   type over any of them — the sheet was never complete and he knows the real
   figures. An override is remembered; clear the box and it goes back to the sum. */
function numOv(key){
  var v=LS("ov_"+key);
  if(v===null||v==="") return null;
  var n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));

  chase:sum(by(L,function(x){return x.owed>0&&!x.deferred;}),function(x){return x.owed;}),
  defer:sum(by(L,function(x){return x.owed>0&&x.deferred;}),function(x){return x.owed;}),
  conting:sum(by(L,function(x){return x.contingent>0;}),function(x){return x.contingent;}),
  collected:collectedRaw()};}
function money(){
  var r=moneyRaw();
  var c=numOv("chase"), g=numOv("conting"), k=cashOverride();
  return {
    chase:  c===null?r.chase:c,
    defer:  r.defer,
    conting:g===null?r.conting:g,
    collected: k===null?r.collected:k
  };
}

   highlight is driven from JS: the room under the mouse goes to full
   brightness, everything else drops back, and a name tag follows the cursor. */

var NAV_NAMES={

};

function rtipShow(txt,sub,ev){
  var t=document.getElementById("rtip"); if(!t)return;
  var host=document.querySelector(".tower"); if(!host)return;
  var r=host.getBoundingClientRect();
  t.innerHTML=txt;
  t.style.left=(ev.clientX-r.left)+"px";
  t.style.top =(ev.clientY-r.top)+"px";
  t.classList.add("show");
}
function rtipHide(){
  var t=document.getElementById("rtip"); if(t)t.classList.remove("show");
}

function hotAt(px,py){
  for(var i=0;i<HOT.length;i++){
    var z=HOT[i];
    if(px>=z.x&&px<=z.x+z.w&&py>=z.y&&py<=z.y+z.h) return z;
  }
  return null;
}
function zoneAt(px,py){
  for(var i=0;i<HZ.length;i++){
    var z=HZ[i];
    if(px>=z.x&&px<=z.x+z.w&&py>=z.y&&py<=z.y+z.h) return z;
  }
  return null;
}

/* Turn a mouse position into floor-plan coordinates. The svg is width:100%
   height:auto, so it keeps the viewBox aspect ratio and there is no letterbox
   to correct for — one clean scale factor. */
/* How the viewBox lands on the screen. Two things this has to get right:

   1. A zoomed viewBox does not start at 0,0 any more, so its x/y offset has to
      be added back. Without that every tap while zoomed lands in the wrong room.
   2. An SVG keeps its aspect ratio. If the element is wider than the viewBox
      shape — which happens on a phone the moment max-height clamps it — the
      drawing is letterboxed and centred, so screen pixels and plan units are
      not a straight ratio. Scale by the SHORT side and offset by the bars.

   Everything that maps between screen and plan goes through this, so hit-testing
   and the overlaid link anchors can never disagree. */
function planMap(svg){
  var r=svg.getBoundingClientRect();
  var vb=(svg.getAttribute("viewBox")||"0 0 1300 1000").split(/\s+/).map(Number);
  if(!r.width||!r.height||!vb[2]||!vb[3]) return null;
  var scale=Math.min(r.width/vb[2], r.height/vb[3]);   /* xMidYMid meet */
  return {
    rect:r, vb:vb, scale:scale,
    ox:r.left+(r.width  - vb[2]*scale)/2,
    oy:r.top +(r.height - vb[3]*scale)/2
  };
}
function planPoint(ev,svg){
  var m=planMap(svg); if(!m) return null;
  return {x: m.vb[0] + (ev.clientX-m.ox)/m.scale,
          y: m.vb[1] + (ev.clientY-m.oy)/m.scale};
}

/* The lit overlay. Drawn as the very last thing in the svg so it is on top of
   the furniture, the walkers, the walls — everything. */
function paintHover(z,isHot){
  var lay=document.getElementById("hilite"); if(!lay)return;
  if(!z){ lay.innerHTML=""; return; }
  var col = z.npc==="claude" ? "#84cc16" : z.npc==="claudia" ? "#22d3ee"
          : z.npc==="jordan" ? "#c8a86a"

  /* a room gets a soft outline; something you can click gets a solid one */
  var fo = isHot ? ".1"  : ".045";
  var sw = isHot ? 3.5   : 3;
  var so = isHot ? "1"   : ".9";
  lay.innerHTML=
     '<rect x="'+z.x+'" y="'+z.y+'" width="'+z.w+'" height="'+z.h+'" rx="6" '
    +'fill="'+col+'" opacity="'+fo+'"/>'
    +'<rect x="'+z.x+'" y="'+z.y+'" width="'+z.w+'" height="'+z.h+'" rx="6" '
    +'fill="none" stroke="'+col+'" stroke-width="'+sw+'" opacity="'+so+'"/>'
    +(isHot?'<rect x="'+(z.x+4)+'" y="'+(z.y+4)+'" width="'+(z.w-8)+'" height="'+(z.h-8)+'" rx="4" '
      +'fill="none" stroke="'+col+'" stroke-width="1.2" opacity=".45"/>':"");
}

/* window.open() is blocked inside this sandboxed frame, so anything that leaves
   the page has to be a genuine anchor the user clicks. These are transparent
   <a> tags positioned exactly over their object on the floor plan. */
function placeHotLinks(){
  var host=document.getElementById("hotlinks"), svg=document.getElementById("bld");
  if(!host||!svg) return;
  var m=planMap(svg);
  if(!m){ host.innerHTML=""; return; }
  var par=host.parentNode;
  var pr=(par&&par.getBoundingClientRect)?par.getBoundingClientRect():{left:0,top:0};
  /* same scale and same letterbox offset the hit-test uses */
  var sx=m.scale, sy=m.scale;
  var dx=m.ox-pr.left-m.vb[0]*m.scale, dy=m.oy-pr.top-m.vb[1]*m.scale;

  var out="";
  HOT.forEach(function(z,i){
    if(!z.link) return;
    var url = z.key==="discord"   ? DISCORD_ROOM
            : z.key==="spotify"   ? SPOTIFY
            : z.key==="talentflx" ? TALENTFLX
            : z.key==="meet"      ? MEET
            : z.key==="gcal"      ? CALLINK : null;
    if(!url) return;
    out+='<a class="hotlink" data-hi="'+i+'" href="'+url+'" target="_blank" rel="noopener" '
      +'title="'+esc(z.label+" — "+(z.sub||""))+'" style="left:'+(dx+z.x*sx)+'px;top:'+(dy+z.y*sy)+'px;'
      +'width:'+(z.w*sx)+'px;height:'+(z.h*sy)+'px"></a>';
  });
  host.innerHTML=out;

  var as=host.querySelectorAll(".hotlink");
  for(var a=0;a<as.length;a++){
    (function(el){
      var z=HOT[parseInt(el.getAttribute("data-hi"),10)];
      el.onmouseenter=function(ev){ HOVKEY="h:"+z.label; paintHover(z,true); rtipShow(z.label,z.sub||"",ev); };
      el.onmousemove =function(ev){ rtipShow(z.label,z.sub||"",ev); };
      el.onmouseleave=function(){ HOVKEY=null; paintHover(null); rtipHide(); };
    })(as[a]);
  }
}

function wireHover(){
  var svg=document.getElementById("bld"); if(!svg)return;
  buildZones();
  HOVKEY=null; paintHover(null); rtipHide();

  npcBox(null);
  /* the highlight layer goes last so it paints over everything */
  var old=document.getElementById("hilite");
  if(old&&old.parentNode) old.parentNode.removeChild(old);
  svg.insertAdjacentHTML("beforeend",'<g id="hilite" style="pointer-events:none"></g>');
  /* the anchors need the svg laid out, so place them on the next frame */
  if(window.requestAnimationFrame) window.requestAnimationFrame(placeHotLinks);
  else setTimeout(placeHotLinks,30);

  svg.onmousemove=function(ev){
    var pt=planPoint(ev,svg); if(!pt)return;
    var ht=hotAt(pt.x,pt.y);
    var rm=zoneAt(pt.x,pt.y);
    var k=ht?("h:"+ht.label):(rm?rm.key:null);
    if(k!==HOVKEY){
      HOVKEY=k;
      paintHover(ht||rm,!!ht);
      var gs=svg.querySelectorAll(".flr");
      var lit=ht?ht.key:(rm?rm.key:null);
      for(var i=0;i<gs.length;i++){
        if(gs[i].getAttribute("data-f")===lit) gs[i].classList.add("hov");
        else gs[i].classList.remove("hov");
      }
    }
    if(ht&&ht.npc){ rtipHide(); npcBox(ht.npc); }
    else {
      npcBox(null);
      if(ht)      rtipShow(ht.label,ht.sub||"",ev);
      else if(rm) rtipShow(rm.label,"",ev);
      else        rtipHide();
    }
    svg.style.cursor = ht ? "pointer" : "default";
  };
  svg.onmouseleave=function(){
    HOVKEY=null; paintHover(null); rtipHide(); npcBox(null);
    var gs=svg.querySelectorAll(".flr");
    for(var i=0;i<gs.length;i++) gs[i].classList.remove("hov");
  };
  /* Only the objects do anything. Clicking bare floor is just clicking floor —
     except on a phone zoomed out, where tapping a room zooms into it. */
  svg.onclick=function(ev){
    var pt=planPoint(ev,svg); if(!pt)return;
    var z=hotAt(pt.x,pt.y);
    if(isPhone() && !MZOOM && !STATE.roof && !STATE.base && !z){
      var rm=zoneAt(pt.x,pt.y);
      if(rm && mRoomOf(rm.key)){ mOpen(rm.key); return; }
    }
    if(!z)return;
    if(z.link){
      if(z.key==="discord") window.open(DISCORD_ROOM,"_blank");
      if(z.key==="spotify")   window.open(SPOTIFY,"_blank");
      if(z.key==="talentflx") window.open(TALENTFLX,"_blank");
      if(z.key==="meet")      window.open(MEET,"_blank");
      if(z.key==="gcal")      window.open(CALLINK,"_blank");
      return;
    }
    if(z.nav){
      closePanel(); rtipHide();
      if(z.key==="in"  ){STATE.roof=false;STATE.base=false;}
      if(z.key==="out" ){STATE.roof=true; STATE.base=false;}
      if(z.key==="down"){STATE.base=true; STATE.roof=false;}
      if(z.key==="up"  ){STATE.base=false;STATE.roof=false;}
      drawBuilding();
      return;
    }
    /* some things are just there to look at */
    if(z.noop || !FLOORS[z.key]) return;
    STATE.floor=z.key; STATE.tab=z.tab||0;
    rtipHide(); drawTower(); drawNav(); wireHover();
    var wn=winOpen(z.key); wn.tab=z.tab||0; renderWins();
  };
}

/* One entry point so the roof toggle just works everywhere. */
/* The whole floor is 1300 wide. On a phone that is about 3px per foot, so the
   answer is not to hide it — it is to zoom into one room at a time. The viewBox
   does the zooming, and because hit-testing reads the viewBox back out of the
   SVG, every desk and door stays tappable at whatever zoom you are at. One
   drawing, fully interactive, legible on a 390px screen. */
var FRAME=[1300,1000];
var MZOOM=null;                 /* phone: which room the plan is zoomed into */
function isPhone(){ return (window.innerWidth||1400)<=820; }

function frameBox(){
  if(isPhone() && MZOOM && !STATE.roof && !STATE.base){
    var r=mRoomOf(MZOOM);
    if(r) return r.box.join(" ");
  }
  return "0 0 "+FRAME[0]+" "+FRAME[1];
}
function applyFrame(){
  var el=document.getElementById("bld");
  if(el) el.setAttribute("viewBox", frameBox());
}
function setFrame(w,h){ FRAME=[w,h]; applyFrame(); }

/* zoom the plan into a room, or back out to the whole floor */
function mZoomTo(k){
  MZOOM = (k && k!==MZOOM) ? k : null;
  applyFrame();
  placeHotLinks();
  drawMobileStack();
}
function drawBuilding(){
  var rp=document.getElementById("roomsm");
  if(STATE.roof){
    setFrame(1460,780);          /* letterbox — the whole building in one look */
    closePanel();                /* nothing covering it */
    drawExterior(); if(rp)rp.innerHTML="";
    drawNav(); wireHover(); drawMobileStack(); return; }
  if(STATE.base){
    setFrame(1300,1000);
    drawBasement(); if(rp)rp.innerHTML="";
    drawNav(); wireHover(); drawMobileStack(); return; }
  setFrame(1300,1000);
  drawTower();
  drawNav(); wireHover();
  drawMobileStack();
  wireMobileTyping();
}

   to scroll past, no plan the width of a bus. */

function mOpen(k,tab){
  tab=tab||0;
  /* Opening a room means leaving the dashboard. Without this, anything that
     called mOpen directly opened the room underneath a dashboard that was still
     covering the whole screen — nothing visible, nothing tappable. */
  if(VIEW!=="floor"){
    VIEW="floor"; LS("view","floor");
    try{ document.body.classList.remove("homeview"); paintSwitch(); }catch(e){}
  }
  MVIEW=k; STATE.floor=k; STATE.tab=tab;
  /* the real plan zooms to the room — no second copy of the drawing */
  MZOOM=k; STATE.roof=false; STATE.base=false;
  WINS.slice().forEach(function(w){ if(w.room!==k) winClose(w.id); });
  var ex=WINS.filter(function(w){return w.room===k;})[0];
  if(ex){ ex.min=false; ex.tab=tab; renderWins(); }
  else { var wn=winOpen(k); wn.tab=tab; renderWins(); }
  document.body.classList.add("mroom");
  applyFrame();
  drawTower(); drawNav(); wireHover();
  drawMobileStack();
}

  MVIEW=null; MZOOM=null;

/* On a phone the keyboard slides up over whatever you were typing into. Nudging
   the focused field into the middle of what is left is the whole fix. */
function wireMobileTyping(){
  if(window.__mtype) return; window.__mtype=1;
  /* A missing listener API must never stop the building from drawing. */
  if(!document.addEventListener) return;
  document.addEventListener("focusin",function(ev){
    if(window.innerWidth>820) return;
    var t=ev.target; if(!t||!t.tagName) return;
    var tag=t.tagName.toLowerCase();
    if(tag!=="input" && tag!=="textarea" && tag!=="select") return;
    setTimeout(function(){
      try{ t.scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){}
    },320);
  });
}

/* ============================ VOICE ============================ */
/* Browser speech: recognition for the mic, synthesis for her replies.
   Both are optional — if the browser lacks them the buttons say so. */
var SPEAK = LS("speak")==="1";
var REC=null, RECON=false;

function ttsReady(){ return typeof speechSynthesis!=="undefined"; }
function srCtor(){ return window.SpeechRecognition||window.webkitSpeechRecognition||null; }

function pickVoice(){
  if(!ttsReady())return null;
  var vs=speechSynthesis.getVoices()||[];
  /* prefer a natural female English voice */
  var want=["Samantha","Google UK English Female","Google US English","Microsoft Aria","Microsoft Jenny","Karen","Serena","Zira"];
  for(var i=0;i<want.length;i++){
    for(var j=0;j<vs.length;j++) if(vs[j].name.indexOf(want[i])>=0) return vs[j];}
  for(var k=0;k<vs.length;k++) if(/^en/i.test(vs[k].lang)) return vs[k];
  return vs[0]||null;
}
/* ==================== THE AGENTS' VOICES ====================
   Three real voices from ElevenLabs, one each. The key lives on the server, so
   the page asks /api/speak for an mp3 and plays it — nothing secret is ever in
   the browser.

   Two things this must never do: go silent, or talk over itself. So the browser
   voice stays as a fallback for every case where ElevenLabs cannot answer (no
   key, out of characters, running inside Cowork with no network), and every new
   line stops whatever was already playing.

   VOICE_LIVE goes false the first time the server says the key is missing, so we
   stop hammering a route that cannot work and drop straight to the local voice
   for the rest of the session. */
var VOICE_LIVE = null;        /* null = not tried yet, true = working, false = fall back */
var VOICE_AUDIO = null;       /* whatever is playing right now */
var VOICE_NOTE = "";          /* why it fell back, for the toggle's tooltip */

/* ---------- why the voices were silent on a phone ----------
   iOS will not let a page play audio unless the play() call can be traced back
   to something the user physically did. Ours could not: you tap Send, we go and
   ask the server for an mp3, and by the time it arrives the tap is long over.
   Safari rejects it, quietly.

   The fix is to create ONE audio element during a real tap and start it on a
   fragment of silence. That marks the element as user-approved for the rest of
   the session, and every later reply just swaps its src. Same element, already
   unlocked, so it plays.

   playsinline matters too, or iOS takes the audio fullscreen. */
var VOICE_EL = null, VOICE_UNLOCKED = false, VOICE_PENDING = null;

/* The last resort. A floating button that plays audio already sitting in the
   element — tapping it is a gesture, so no browser can refuse. */
function voiceChip(){
  var old=document.getElementById("voicechip");
  if(old&&old.parentNode) old.parentNode.removeChild(old);
  if(!VOICE_PENDING||!document.body) return;
  var b=document.createElement("button");
  b.id="voicechip"; b.className="voicechip";
  b.innerHTML="&#128266; Tap to hear it";
  b.onclick=function(){
    var a=VOICE_PENDING; VOICE_PENDING=null;
    if(a){ try{ a.play(); VOICE_UNLOCKED=true; VOICE_NOTE=""; }catch(e){} }
    if(b.parentNode) b.parentNode.removeChild(b);
  };
  document.body.appendChild(b);
  setTimeout(function(){ if(b.parentNode&&VOICE_PENDING) b.parentNode.removeChild(b); }, 20000);
}
/* A real 0.03s of silence. The one that shipped before had a zero-length data
   chunk — a broken file — so Safari refused to play it and the unlock never
   happened. It has to be a file the browser can actually decode. */
var SILENT_WAV = "data:audio/wav;base64,UklGRiQCAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQACAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==";

function voiceEl(){
  if(!VOICE_EL && typeof Audio!=="undefined"){
    VOICE_EL = new Audio();
    VOICE_EL.preload = "auto";
    try{ VOICE_EL.playsInline = true;
         VOICE_EL.setAttribute("playsinline",""); }catch(e){}
  }
  return VOICE_EL;
}

/* Called from the first tap anywhere. Cheap, silent, and only does anything once. */
function unlockAudio(){
  if(VOICE_UNLOCKED) return;
  var a=voiceEl(); if(!a) return;
  try{
    a.src = SILENT_WAV;
    var p = a.play();
    if(p && p.then) p.then(function(){ VOICE_UNLOCKED=true; }).catch(function(){});
    else VOICE_UNLOCKED = true;
  }catch(e){}
}
(function(){
  if(!document.addEventListener) return;
  function once(){
    unlockAudio();
    document.removeEventListener("touchend", once, true);
    document.removeEventListener("mousedown", once, true);
    document.removeEventListener("keydown", once, true);
  }
  document.addEventListener("touchend", once, true);
  document.addEventListener("mousedown", once, true);
  document.addEventListener("keydown", once, true);
})();

function voicesPossible(){
  return VOICE_LIVE!==false && !!window.__EXODUS_HOSTED__ && typeof Audio!=="undefined";
}

/* what a voice should not read out loud */
function speakable(text){
  return String(text||"")
    .replace(/\[\[[\s\S]*?\]\]/g," ")            /* never read an action block */
    .replace(/https?:\/\/\S+/g," link ")
    .replace(/[*_`#>|]/g," ")
    .replace(/[·•▲✕→←↑↓✓]/g," ")
    /* the whole number, not just its first digit — "$140" was becoming "1 dollars 40" */
    .replace(/\$\s?(\d[\d,]*(?:\.\d+)?)/g,"$1 dollars")
    .replace(/\s+/g," ").trim();
}

function sayLocal(text){
  if(!ttsReady())return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(speakable(text).slice(0,900));
    var v=pickVoice(); if(v)u.voice=v;
    /* a rough nod to each character until the real voices are on */
    if(VOICE_WHO==="jordan"){ u.rate=1.16; u.pitch=0.9; }
    else if(VOICE_WHO==="claude"){ u.rate=0.9; u.pitch=0.82; }
    else { u.rate=1.02; u.pitch=1.06; }
    speechSynthesis.speak(u);
  }catch(e){}
}

/* who is talking. Set before say() so the right voice is asked for. */
var VOICE_WHO="claudia";
function sayAs(who,text){ VOICE_WHO=who||"claudia"; say(text); }

function say(text){
  unlockAudio();          /* harmless if already done */
  if(!SPEAK||!text) return;
  var clean=speakable(text);
  if(!clean) return;

  stopSpeaking();

  if(!voicesPossible()){ sayLocal(text); return; }

  var who=VOICE_WHO;
  var headers={"Content-Type":"application/json"};
  try{
    var tk=localStorage.getItem("exodus_hq_token");
    if(tk) headers["x-hq-token"]=tk;
  }catch(e){}

  /* api/voice.js is its own function. Editing hq.js in place kept failing on
     GitHub, and there was no reason to put these routes in there anyway. */
  fetch("/api/voice?route=speak",{
    method:"POST", headers:headers,
    body:JSON.stringify({text:clean.slice(0,1200), agent:who})
  }).then(function(r){
    if(!r.ok){
      return r.json().catch(function(){return {};}).then(function(j){
        /* 503 means no key was ever set — stop asking. Anything else may be
           temporary, so keep the route alive and just fall back this once. */
        if(r.status===503){ VOICE_LIVE=false; VOICE_NOTE="No ElevenLabs key on the server."; }
        else VOICE_NOTE=(j && j.error) ? String(j.error) : ("Voice server said "+r.status+".");
        throw new Error(VOICE_NOTE);
      });
    }
    return r.blob();
  }).then(function(blob){
    if(!blob || !blob.size) throw new Error("Empty audio.");
    VOICE_LIVE=true; VOICE_NOTE="";
    var url=URL.createObjectURL(blob);
    /* the same element that was unlocked by a tap — a brand new Audio() here
       would be blocked on iOS every single time */
    var a=voiceEl();
    if(!a){ sayLocal(text); return; }
    VOICE_AUDIO=a;
    a.onended=a.onerror=function(){ try{URL.revokeObjectURL(url);}catch(e){} };
    a.src=url;
    var pl=a.play();
    if(pl && pl.catch) pl.catch(function(err){
      /* Still refused. Rather than fall back to the robot voice and leave you
         wondering, keep the audio loaded and offer a button — a tap on that IS
         a gesture, so it is guaranteed to play. Belt and braces. */
      VOICE_PENDING = a;
      VOICE_NOTE = (err && err.name==="NotAllowedError")
        ? "your phone wants a tap before it will play sound"
        : "audio would not start on its own";
      try{ voiceChip(); }catch(e){ sayLocal(text); }
    });
  }).catch(function(){
    sayLocal(text);
  });
}

function stopSpeaking(){
  try{ speechSynthesis.cancel(); }catch(e){}
  if(VOICE_AUDIO){ try{ VOICE_AUDIO.pause(); }catch(e){} VOICE_AUDIO=null; }
}

/* what the speaker button should say when you hover it */
function voiceLabel(){
  if(!SPEAK) return "Voice off";
  if(VOICE_LIVE===true) return "Real voice on";
  if(VOICE_NOTE) return "Browser voice — "+VOICE_NOTE;
  if(!window.__EXODUS_HOSTED__) return "Browser voice — real voices need the live site";
  return "Voice on";
}

/* ---- one microphone, three agents ----
   The recogniser was wired straight into Claudia. It now takes a target so
   Jordan and Claude get the same thing, including the same honest diagnostics
   when a sandboxed frame refuses mic access. */
var MICWHO="claudia";
var MICTARGET={
  claudia:{ inputs:["ci","mci"], btns:["mic","mmic"],
            note:function(t){ STATE.chat.push({r:"sys",t:t}); paintLog(); },
            send:function(q){ ask(q); } },
  jordan :{ inputs:["jci"],      btns:["jmic"],
            note:function(t){ JCHAT.push({r:"ai",t:t}); jPaint(); },
            send:function(q){ jAsk(q); } },
  claude :{ inputs:["tci"],      btns:["tmic"],
            note:function(t){ TCHAT.push({r:"ai",t:t}); tPaint(); },
            send:function(q){ tAsk(q); } }
};
function micT(){ return MICTARGET[MICWHO]||MICTARGET.claudia; }

function startMic(who){
  if(who) MICWHO=who;
  var T=micT(), C=srCtor();
  if(!C){ T.note("This browser has no speech recognition. On iPhone use Safari, "
    +"or use the keyboard's own microphone key next to the space bar — that types "
    +"straight into the box and works everywhere."); return; }
  if(RECON){ if(REC&&REC.__stop) REC.__stop(); else { try{REC.stop();}catch(e){} } return; }
  try{ REC=new C(); }
  catch(e){ T.note("Could not start the recogniser: "+e.message); return; }
  /* continuous, or it stops dead at your first natural pause and you lose the
     rest of the sentence. You decide when it ends by tapping the mic again. */
  REC.lang="en-US"; REC.interimResults=true; REC.continuous=true; REC.maxAlternatives=3;
  var heard="", got=false, stopping=false;
  RECON=true; micPaint(true);

  REC.onresult=function(ev){
    got=true;
    var interim="";
    /* Only FINAL results go into heard. The old code concatenated finals AND
       interims together on every event, so half-recognised words were being
       glued on next to their own corrected versions. */
    for(var i=ev.resultIndex;i<ev.results.length;i++){
      var r=ev.results[i];
      if(r.isFinal){
        /* the recogniser offers several guesses — take the one it is surest of */
        var best=r[0], bc=(r[0].confidence||0);
        for(var a=1;a<r.length;a++) if((r[a].confidence||0)>bc){ best=r[a]; bc=r[a].confidence||0; }
        heard += (heard?" ":"") + String(best.transcript).trim();
      } else interim += r[0].transcript;
    }
    var shown=(heard+(interim?" "+interim:"")).trim();
    T.inputs.forEach(function(id){var t=document.getElementById(id); if(t)t.value=shown;});
    micBar(shown?"Heard so far":"Listening… speak now", shown||null);
  };
  REC.onerror=function(ev){
    var code=(ev&&ev.error)||"unknown";
    /* a silent moment is not a failure — keep listening */
    if(code==="no-speech" && !stopping && RECON) return;
    RECON=false; micPaint(false);
    T.note({
      "not-allowed":"Microphone blocked. This page runs in a sandboxed frame, which usually cannot request mic access — that is the most likely cause. It will work once we are on Vercel.",
      "service-not-allowed":"The browser refused mic access for this frame. Sandboxed pages are normally blocked from using the microphone.",
      "no-speech":"Did not catch anything. Tap the mic and speak a little sooner.",
      "audio-capture":"No microphone found on this machine.",
      "network":"Speech recognition needs a network connection and could not reach the service.",
      "aborted":"Listening stopped."
    }[code]||("Speech recognition error: "+code));
  };
  REC.onend=function(){
    /* A pause can end the session even in continuous mode. If he has not tapped
       stop, start it again so a breath does not cut him off mid-sentence. */
    if(!stopping && RECON){
      try{ REC.start(); return; }catch(e){}
    }
    RECON=false; micPaint(false);
    var q=micFix(heard.trim());
    if(q){
      T.inputs.forEach(function(id){var t=document.getElementById(id); if(t)t.value=q;});
      T.send(q);
    }
    else if(got) T.note("Nothing came through. Try again.");
  };
  REC.__stop=function(){ stopping=true; try{REC.stop();}catch(e){} };
  try{ REC.start(); }
  catch(e){
    RECON=false; micPaint(false);
    T.note("Could not open the microphone: "+e.message
      +". If your phone never asked permission, check Settings, Safari, Microphone."); }
}
/* ================= MAKING SENSE OF WHAT IT HEARD =================
   No general recogniser has ever seen "Jadon", "Claudefort", "Schwarzaneager"
   or "TalentFlx". It returns whatever ordinary English sounds closest, so
   "call Jadon" comes back as "call Jaden" or "call Jade on".

   This runs over the transcript afterwards and snaps near-misses back onto the
   words that actually exist in your world — every lead name in the CRM, the
   three agents, and the handful of business terms. It only replaces a word when
   the match is close, so ordinary speech is left alone. */
function micVocab(){
  var out=[];
  (STATE.leads||[]).forEach(function(x){
    String(x.name||"").split(/\s+/).forEach(function(w){
      if(w.length>=4) out.push(w);
    });
    if(String(x.name||"").indexOf(" ")>0) out.push(x.name);
  });
  ["Claudia","Jordan","Claudefort","Schwarzaneager","Exodus","TalentFlx",
   "Discord","Bangkok","Calendly","Stripe","Amazon","TikTok","Instagram",
   "founding","member","pipeline","objection","placement","onboarding",
   "warm","demo","dead","collected","commission"].forEach(function(w){out.push(w);});
  var seen={}, uniq=[];
  out.forEach(function(w){ var k=w.toLowerCase(); if(!seen[k]){seen[k]=1;uniq.push(w);} });
  return uniq;
}

/* how many single-character edits apart two words are */
function editDist(a,b){
  a=a.toLowerCase(); b=b.toLowerCase();
  if(a===b) return 0;
  if(Math.abs(a.length-b.length)>3) return 99;
  var prev=[], cur=[], i, j;
  for(j=0;j<=b.length;j++) prev[j]=j;
  for(i=1;i<=a.length;i++){
    cur[0]=i;
    for(j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1,
        prev[j-1] + (a.charAt(i-1)===b.charAt(j-1)?0:1));
    }
    prev=cur.slice();
  }
  return prev[b.length];
}

function micFix(text){
  if(!text) return text;
  var vocab=micVocab();
  if(!vocab.length) return text;

  /* two-word names first, so "Jade on" can become "Jadon" */
  var words=text.split(/\s+/);
  for(var i=0;i<words.length-1;i++){
    var pair=words[i]+words[i+1];
    for(var v=0;v<vocab.length;v++){
      var t=vocab[v];
      if(t.indexOf(" ")>=0) continue;
      if(t.length<5) continue;
      if(editDist(pair.replace(/[^a-z]/gi,""), t)<=1){
        words.splice(i,2,t); break;
      }
    }
  }

  /* then single words */
  return words.map(function(w){
    var bare=w.replace(/[^a-zA-Z']/g,"");
    if(bare.length<4) return w;
    /* already a word we know — but adopt its proper capitalisation, since these
       are names and "kyle" should come back as "Kyle" */
    for(var k=0;k<vocab.length;k++)
      if(vocab[k].toLowerCase()===bare.toLowerCase())
        return (vocab[k]===bare) ? w : w.replace(bare, vocab[k]);
    var best=null, bd=99;
    for(var v=0;v<vocab.length;v++){
      var t=vocab[v];
      if(t.indexOf(" ")>=0) continue;
      var d=editDist(bare,t);
      /* the longer the word, the more slack — but never more than a third of it */
      var allow = bare.length>=8 ? 2 : 1;
      if(d<=allow && d<bd){ bd=d; best=t; }
    }
    if(!best) return w;
    /* keep whatever punctuation was attached */
    return w.replace(bare, best);
  }).join(" ");
}

/* You said they could not hear you. Part of that was the recogniser cutting off
   at a pause, which is fixed — but the other part was that nothing on screen
   ever told you whether it was listening, so there was no way to tell the
   difference between "not hearing me" and "not even on".

   The button now turns red and pulses, the label says LISTENING, and a bar
   appears above the composer showing your words appearing as you speak. */
function micPaint(on){
  ["mic","mmic","jmic","tmic"].forEach(function(id){
    var b=document.getElementById(id); if(!b)return;
    b.classList.toggle("rec",on);
    b.innerHTML = on ? "&#9632;" : "&#127908;";
    b.title = on ? "Listening — tap to stop and send"
                 : "Tap, speak, tap again when you are done";
  });
  micBar(on ? "Listening… speak now, then tap the square to send" : null);
}

/* the live strip above whichever composer is in use */
function micBar(msg, words){
  var host=document.getElementById("micbar");
  if(!host){
    if(!msg || !document.body) return;
    host=document.createElement("div"); host.id="micbar"; host.className="micbar";
    document.body.appendChild(host);
  }
  if(!msg){ if(host.parentNode) host.parentNode.removeChild(host); return; }
  host.innerHTML='<span class="mb-dot"></span>'
    +'<span class="mb-t">'+esc(msg)+'</span>'
    +(words?'<span class="mb-w">'+esc(words)+'</span>':'')
    +'<button class="mb-x" id="mb-stop">Done</button>';
  var st=document.getElementById("mb-stop");
  if(st) st.onclick=function(){
    if(REC&&REC.__stop) REC.__stop(); else { try{REC.stop();}catch(e){} }
  };
}

/* He can move leads and log calls himself, same protocol Claude uses. */
function jRunActions(text){
  var done=[], out=String(text||"");
  var re=/\[\[CRM\s*(\{[\s\S]*?\})\s*\]\]/g, m, found=[];
  while((m=re.exec(out))!==null) found.push(m);
  found.forEach(function(hit){
    var o=null;
    try{ o=JSON.parse(hit[1]); }catch(e){ return; }
    if(!o||!o.type) return;

    if(o.type==="stage"){
      /* a retired stage name still lands somewhere sensible */
      var wantStage=stageFix(o.stage);
      if(!o.name||STATUSES.indexOf(wantStage)<0) return;
      stSet(o.name,wantStage); refreshContacts();
      SBW.lead(o.name); SBW.acted("jordan","set_stage",o.name,o);
      done.push(o.name+" moved to "+wantStage);

    } else if(o.type==="priority"){
      /* the purple dot — flag or unflag someone Glen is actively chasing */
      if(!o.name) return;
      var want=(o.on===false||o.on==="false")?false:true;
      prSet(o.name,want); refreshContacts();
      SBW.priority(o.name); SBW.acted("jordan","set_priority",o.name,o);
      done.push(o.name+(want?" flagged as a priority":" taken off priority"));

    } else if(o.type==="activity"){
      if(!o.name||!o.body) return;
      actAdd(o.name,String(o.body));
      SBW.activity(o.name); SBW.acted("jordan","log_activity",o.name,o);
      done.push("Logged against "+o.name);

    } else if(o.type==="note"){
      if(!o.name||!o.body) return;
      ntSet(o.name,String(o.body)); refreshContacts();
      SBW.lead(o.name); SBW.acted("jordan","note",o.name,o);
      done.push("Note saved on "+o.name);

    } else if(o.type==="pull_form"){
      var f=MISSCACHE.filter(function(x){return keyOf(x.name)===keyOf(o.name);})[0];
      if(!f) return;
      var mine=mlLoad(), rec=formToLead(f);
      if(!alreadyMine(rec.name)){
        mine.push(rec); mlSave(mine);
        actAdd(rec.name,"Pulled in by Jordan from the form submission.");
        var base=STATE.leads.filter(function(x){return !x.manual;});
        STATE.leads=base.concat(mlLoad().map(mlToLead)); refreshContacts();
        SBW.lead(rec.name); SBW.activity(rec.name);
        SBW.acted("jordan","pull_form",rec.name,o);
        done.push(rec.name+" pulled into the pipeline");
      }
    } else if(o.type==="dismiss_form"){
      if(!o.name) return;
      var dz=LJ("forms_dismissed",[]);
      if(dz.indexOf(keyOf(o.name))<0){ dz.push(keyOf(o.name)); LJset("forms_dismissed",dz); }
      sbRun("update form_submissions set pulled_into_crm=true where lower(btrim(coalesce(name,'')))="
        +qv(keyOf(o.name)));
      SBW.acted("system","dismiss_form",o.name,o);
      done.push(o.name+" taken off the front desk");

    } else if(o.type==="dedupe_forms"){
      var n=dedupeForms();
      done.push(n ? ("Collapsed "+n+" duplicate"+(n===1?"":"s")+" on the front desk")
                  : "No duplicates left to collapse");

    } else if(o.type==="whiteboard"){
      var slots={target:"wb_target",goal:"wb_goal",working:"wb_working",
                 broken:"wb_broken",trying:"wb_trying",why:"wb_why"};
      var k=slots[String(o.slot||"").toLowerCase()];
      if(!k||!o.body) return;
      LS(k,String(o.body)); SBW.whiteboard();
      SBW.acted("jordan","whiteboard",o.slot,o);
      done.push("Wrote on the whiteboard — "+o.slot);
    }
  });
  out=out.replace(/\[\[CRM\s*\{[\s\S]*?\}\s*\]\]/g,"").replace(/\n{3,}/g,"\n\n").trim();
  return {text:out, done:done};
}

/* He can write to the gym for Glen. askClaude only returns text, so he ends a
   reply with one or more action lines and this parses them out, performs the
   write, strips them from what Glen reads, and reports what it did. Anything
   malformed is ignored rather than guessed at. */
function tRunActions(text){
  var done=[], out=String(text||"");
  var re=/\[\[LOG\s*(\{[\s\S]*?\})\s*\]\]/g, m;
  var found=[];
  while((m=re.exec(out))!==null) found.push(m);
  if(!found.length) return {text:out, done:done};

  found.forEach(function(hit){
    var o=null;
    try{ o=JSON.parse(hit[1]); }catch(e){ return; }
    if(!o||!o.type) return;

    if(o.type==="food"){
      var kc=parseInt(o.kcal,10)||0;
      if(!o.what||!kc) return;
      var a=fdLoad();
      a.push({d:new Date().toISOString(), what:String(o.what),
        kcal:String(kc), p:String(parseInt(o.p,10)||0),
        c:String(parseInt(o.c,10)||0), f:String(parseInt(o.f,10)||0)});
      fdSave(a);
      SBW.acted("claude","log_meal",o.what,o);
      done.push("Logged "+o.what+" — "+kc+" cal, "+(parseInt(o.p,10)||0)+"g protein");

    } else if(o.type==="workout"){
      if(!o.what) return;
      var w=wkLoad();
      var when=o.date ? new Date(o.date+"T12:00:00") : new Date();
      if(isNaN(when)) when=new Date();
      w.push({d:when.toISOString(), t:String(o.what)});
      wkSave(w);
      LS("cs_"+dkey(when),"g"); SBW.day(dkey(when),"g");
      SBW.acted("claude","log_workout",o.what,o);
      done.push("Logged workout — "+o.what);

    } else if(o.type==="weight"){
      var wv=parseFloat(o.w);
      if(isNaN(wv)) return;
      var day=o.date||dkey(new Date());
      var ws=wtLoad().filter(function(x){return x.d!==day;});
      ws.push({d:day,w:String(wv)});
      ws.sort(function(p2,q2){return new Date(p2.d)-new Date(q2.d);});
      wtSave(ws);
      SBW.acted("claude","log_weight",String(wv),o);
      done.push("Logged weight — "+wv);

    } else if(o.type==="note"){
      if(!o.text) return;
      var prev=LS("notes_gym")||"";
      var stamp=(new Date().getMonth()+1)+"/"+new Date().getDate();
      LS("notes_gym", (prev?prev+"\n":"")+stamp+" — "+String(o.text));
      SBW.note("gym"); SBW.acted("claude","note",o.text,o);
      SBW.remember("claude", o.text, 3, "training");
      done.push("Added to gym notes");

    } else if(o.type==="day"){
      var st=String(o.state||"").toLowerCase();
      if(["g","b","r"].indexOf(st)<0) return;
      var dk2=o.date||dkey(new Date());
      LS("cs_"+dk2, st); SBW.day(dk2,st);
      SBW.acted("claude","mark_day",dk2,o);
      done.push("Marked the day "+(st==="g"?"trained":st==="b"?"work":"missed"));

    } else if(o.type==="target"){
      var map={calories:"goal_kcal",protein:"goal_prot",carbs:"goal_carb",fat:"goal_fat"};
      var k=map[String(o.what||"").toLowerCase()];
      var val=parseInt(o.value,10);
      if(!k||!val) return;
      LS(k,String(val)); SBW.targets();
      SBW.acted("claude","set_target",o.what,o);
      done.push("Set your "+o.what+" target to "+val);
    }
  });

  out=out.replace(/\[\[LOG\s*\{[\s\S]*?\}\s*\]\]/g,"").replace(/\n{3,}/g,"\n\n").trim();
  return {text:out, done:done};
}

function openPanel(){

/* ==================== WORKING WINDOWS ====================
   One floating window per room. Drag them by the title bar, minimise them to
   the strip at the bottom, keep several open at once and copy between them.
   Only one window per room, so clicking the same desk twice just brings it
   forward instead of stacking duplicates. */
var WINS=[], WID=0, WZ=30, DRAG=null;

function winFind(room){ for(var i=0;i<WINS.length;i++) if(WINS[i].room===room) return WINS[i]; return null; }
function winFocus(w){ w.z=++WZ; w.min=false; }

function winOpen(room){
  var w=winFind(room);
  if(w){ winFocus(w); renderWins(); return w; }
  var n=WINS.length;
  w={id:"win"+(++WID), room:room, tab:0, min:false, z:++WZ,
     x:26+((n*28)%150), y:22+((n*24)%120),
     w:Math.min(880, Math.max(560, (function(){
       var h2=document.getElementById("wins");
       return h2&&h2.clientWidth ? h2.clientWidth-90 : 860; })())),
     h:Math.min(660, Math.max(420, (function(){
       var h2=document.getElementById("wins");
       return h2&&h2.clientHeight ? h2.clientHeight-70 : 620; })()))};
  WINS.push(w);
  renderWins();
  return w;
}
function winClose(id){
  for(var i=0;i<WINS.length;i++) if(WINS[i].id===id){
    if(WINS[i].room==="sales") OPENLEAD=null;
    WINS.splice(i,1); break; }
  renderWins();
}
function closePanel(){ WINS=[]; renderWins(); }

/* renderPanel is kept so every existing call site still works */
function renderPanel(open){
  if(open) winOpen(STATE.floor);
  else renderWins();
}

/* Is an agent conversation on screen right now? On a phone that decides whether
   the floor plan gets out of the way. */
function chatIsOpen(){
  return WINS.some(function(w){
    if(w.min) return false;
    if(w.room==="assistant") return w.tab===0;
    if(w.room==="sales")     return w.tab===0;
    if(w.room==="gym")       return w.tab===0;
    return false;
  });
}
function renderWins(){
  var host=document.getElementById("wins"); if(!host) return;
  try{ document.body.classList.toggle("mchatopen", chatIsOpen()); }catch(e){}

      +'width:'+w.w+'px;height:'+w.h+'px;z-index:'+w.z+'">'
      +'<div class="wtitle" data-drag="'+w.id+'">'
        +'<span class="wic">'+R.ic+'</span>'
        +'<b>'+esc(R.nm)+'</b><span class="wno">'+esc(R.no)+'</span>'
        +'<button class="wbtn" data-min="'+w.id+'" title="Minimise">&#8211;</button>'
        +'<button class="wbtn x" data-close="'+w.id+'" title="Close — everything is saved">&times;</button>'
      +'</div>'
      +'<div class="wbody">'+tabs+'<div class="tb">'+tabBody()+'</div></div>'
      +'<div class="wgrip" data-size="'+w.id+'" title="Drag to resize"></div>'
      +'</div>';
  });

    tb.innerHTML=mins.map(function(w){
      return '<button class="tbi" data-restore="'+w.id+'">'
        +'<span>'+FLOORS[w.room].ic+'</span>'+esc(FLOORS[w.room].nm)+'</button>';}).join("")
      +(mins.length>1?'<button class="tbi all" id="tb-all">Restore All</button>':"");
  }

  wireWins();

  if(tr) tPaint();

  if(jd) jPaint();

function wireWins(){
  /* bring a window forward when you touch it anywhere */
  var ws=document.querySelectorAll(".win");
  for(var i=0;i<ws.length;i++) ws[i].onmousedown=function(){
    var w=null,id=this.getAttribute("data-w");
    for(var k=0;k<WINS.length;k++) if(WINS[k].id===id) w=WINS[k];
    if(w&&w.z<WZ){ w.z=++WZ; this.style.zIndex=w.z; }
  };

  var tabs=document.querySelectorAll("[data-wt]");
  for(var t=0;t<tabs.length;t++) tabs[t].onclick=function(){
    var id=this.getAttribute("data-wt"), n=parseInt(this.getAttribute("data-t"),10);
    for(var k=0;k<WINS.length;k++) if(WINS[k].id===id){
      if(WINS[k].room==="sales"&&n!==0) OPENLEAD=null;
      WINS[k].tab=n; winFocus(WINS[k]); }
    renderWins();};

  var mn=document.querySelectorAll("[data-min]");
  for(var m=0;m<mn.length;m++) mn[m].onclick=function(ev){
    if(ev&&ev.stopPropagation)ev.stopPropagation();
    var id=this.getAttribute("data-min");
    for(var k=0;k<WINS.length;k++) if(WINS[k].id===id) WINS[k].min=true;
    renderWins();};

  var cl=document.querySelectorAll("[data-close]");
  for(var c=0;c<cl.length;c++) cl[c].onclick=function(ev){
    if(ev&&ev.stopPropagation)ev.stopPropagation();
    winClose(this.getAttribute("data-close"));};

  var rs=document.querySelectorAll("[data-restore]");
  for(var r=0;r<rs.length;r++) rs[r].onclick=function(){
    var id=this.getAttribute("data-restore");
    for(var k=0;k<WINS.length;k++) if(WINS[k].id===id) winFocus(WINS[k]);
    renderWins();};
  var ra=document.getElementById("tb-all");
  if(ra) ra.onclick=function(){ WINS.forEach(function(w){w.min=false;}); renderWins(); };

  /* the corner grip resizes */
  var gs=document.querySelectorAll("[data-size]");
  for(var g=0;g<gs.length;g++) gs[g].onmousedown=function(ev){
    var id=this.getAttribute("data-size"), w=null;
    for(var k=0;k<WINS.length;k++) if(WINS[k].id===id) w=WINS[k];
    if(!w) return;
    winFocus(w);
    DRAG={w:w, resize:true, ox:ev.clientX-w.w, oy:ev.clientY-w.h};
    if(ev.stopPropagation) ev.stopPropagation();
    if(ev.preventDefault) ev.preventDefault();
  };

  /* dragging by the title bar */
  var dh=document.querySelectorAll("[data-drag]");
  for(var d=0;d<dh.length;d++) dh[d].onmousedown=function(ev){
    var id=this.getAttribute("data-drag"), w=null;
    for(var k=0;k<WINS.length;k++) if(WINS[k].id===id) w=WINS[k];
    if(!w) return;
    winFocus(w);
    DRAG={w:w, ox:ev.clientX-w.x, oy:ev.clientY-w.y};
    if(ev.preventDefault) ev.preventDefault();
  };
}

/* one pair of listeners for all dragging, attached once */
function winDragInit(){
  document.onmousemove=function(ev){
    if(!DRAG) return;
    var host=document.getElementById("wins");
    var el=document.querySelector('.win[data-w="'+DRAG.w.id+'"]');
    if(DRAG.resize){
      DRAG.w.w=Math.max(340, ev.clientX-DRAG.ox);
      DRAG.w.h=Math.max(240, ev.clientY-DRAG.oy);
      if(el){ el.style.width=DRAG.w.w+"px"; el.style.height=DRAG.w.h+"px"; }
      return;
    }
    var maxX=host?host.clientWidth-120:2000, maxY=host?host.clientHeight-40:2000;
    DRAG.w.x=Math.max(-40,Math.min(maxX, ev.clientX-DRAG.ox));
    DRAG.w.y=Math.max(0,  Math.min(maxY, ev.clientY-DRAG.oy));
    if(el){ el.style.left=DRAG.w.x+"px"; el.style.top=DRAG.w.y+"px"; }
  };
  document.onmouseup=function(){ DRAG=null; };
}

/* ---------------- boardroom: the seven day glance ----------------
   Sunday to Saturday, always in that order, always the same seven boxes. It
   wipes itself every Sunday so Monday morning is never last week's list. This
   is deliberately NOT the Google Calendar — that is the Calls tab. This is the
   shape of Glen's week: which days Amazon owns and what he intends to do with
   the rest. */
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DAYFULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var AMAZON=[1,4,5,6];                 /* Mon, Thu, Fri, Sat */

function weekStamp(){
  var d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-d.getDay());   /* back to Sunday */
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function weekRoll(){
  /* a new Sunday means a clean board */
  var have=LS("week_stamp"), now=weekStamp();
  if(have!==now){
    for(var i=0;i<7;i++){ LS("week_plan_"+i,""); LS("week_done_"+i,""); }
    LS("week_stamp",now);
    return true;
  }
  return false;
}
function dayLabel(i){
  var v=LS("week_lab_"+i);
  if(v!==null&&v!==undefined&&v!=="") return v;
  return AMAZON.indexOf(i)>=0 ? "Amazon" : "Off";
}
/* ---- Claudia plans the week ----
   She already knows the Amazon shifts, the pipeline, the follower gap and the
   date. This hands her the week as it stands and lets her fill the empty days
   around the shifts, then writes her plan straight into the boxes. */

  if(WKBUSY) return;

    WKMSG={bad:1,t:"Cannot reach Claudia right now."}; redraw(); return;
  }
  WKBUSY=true; WKMSG={wait:1,t:"Claudia is planning your week…"}; redraw();

  var today=new Date().getDay(), m=money();
  var days=[];
  for(var i=0;i<7;i++) days.push({
    i:i, day:DAYS[i], label:dayLabel(i),
    amazonShift:AMAZON.indexOf(i)>=0,
    isToday:i===today, alreadyDone:LS("week_done_"+i)==="1",
    currentPlan:LS("week_plan_"+i)||""
  });
  var L=STATE.leads||[];
  var facts={
    week:days,
    todayIs:DAYS[today],
    daysToBangkok:Math.max(0,Math.ceil((BANGKOK-new Date())/86400000)),
    tiktokFollowers:parseInt(LS("fol_tiktok")||"0",10),
    toTenK:Math.max(0,10000-parseInt(LS("fol_tiktok")||"0",10)),
    priorityLeads:L.filter(function(x){return prGet(x.name);})
      .map(function(x){return x.name+" — "+x.stage;}),

    joiningLater:L.filter(function(x){return x.stage==="Joining in Future";}).map(function(x){return x.name;}),
    owedNow:m.chase,
    peopleWhoOwe:L.filter(function(x){return x.owed>0&&!x.deferred;})

    untrackedForms:(STATE.forms||[]).filter(function(f){
      return !inCrm(f)&&!formDismissed(f)&&!f.self;}).length
  };

  var prompt="You are Claudia, Glen's chief of staff. Plan his week.\n\n"
   +"# THE RULES\n"
   +"Amazon shifts are fixed and cannot be moved — on those days he has a few hours, not a day. "
   +"Off days are where the real work goes. Today is "+DAYS[today]+"; do not plan days that have "
   +"already gone by, and do not overwrite a day he has already ticked off.\n"
   +"Everything is measured against Bangkok on 5 December 2026.\n\n"
   +"# WHAT A GOOD DAY LOOKS LIKE\n"

   +"call Marco and Kyle, 20 DMs\" — not \"work on content\". On a shift day give him two things "

   +(MEMORY.claudia ? "# WHAT YOU ALREADY KNOW\n"+MEMORY.claudia+"\n\n" : "");

/* One submission per person. formsubmit sends a mail for every submit, and the
   same person filling the form twice used to show up twice — so ten rows that
   were really five. This keeps the newest of each and hides the rest, locally
   and in Postgres. */
function formIdent(f){
  var e=(f.email||"").toLowerCase().trim();
  if(e) return "e:"+e;
  var ph=last10(f.phone||"");
  if(ph && ph.length===10) return "p:"+ph;
  return "n:"+keyOf(f.name||"");
}
function dedupeForms(){
  var seen={}, dupes=[], keep=[];
  /* newest first, so the one we keep is the most recent */
  var sorted=(STATE.forms||[]).slice().sort(function(a,b){ return (b.date||0)-(a.date||0); });
  sorted.forEach(function(f){
    var id=formIdent(f);
    if(seen[id]){ dupes.push(f); return; }
    seen[id]=true; keep.push(f);
  });
  if(!dupes.length) return 0;

  var dz=LJ("forms_dismissed",[]);
  dupes.forEach(function(f){
    var k=keyOf(f.name||f.email||"");
    if(k && dz.indexOf(k)<0) dz.push(k);
  });
  LJset("forms_dismissed",dz);

  /* in the database, collapse on email then on phone, keeping the newest row */
  sbRun(
    "with ranked as (select id, row_number() over ("
    + "partition by coalesce(nullif(lower(btrim(email)),''), nullif(regexp_replace(coalesce(phone,''),'\\D','','g'),''), lower(btrim(coalesce(name,'')))) "
    + "order by submitted_at desc nulls last, created_at desc) as rn from form_submissions) "
    + "update form_submissions f set pulled_into_crm = true from ranked r "
    + "where f.id = r.id and r.rn > 1");

  STATE.forms = keep;
  redraw();
  return dupes.length;
}
function formDismissed(f){
  var dz=LJ("forms_dismissed",[]);
  var k=keyOf(f.name||f.email||"");
  return k ? dz.indexOf(k)>=0 : false;
}
