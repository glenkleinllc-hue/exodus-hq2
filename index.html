  background:linear-gradient(168deg,#111a26,#0d131c);
  border:1px solid #24303f;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.wx-h{display:flex;align-items:center;gap:11px;padding:14px 18px;
  border-bottom:1px solid #1e2833;background:rgba(255,255,255,.02)}
.wx-hic{flex:none}
.wx-h b{font-size:17px;font-weight:800;letter-spacing:-.3px;color:#fff}
.wx-hs{font-size:11px;color:var(--mut);text-transform:capitalize}
.wx-x{margin-left:auto;background:none;border:0;color:var(--mut);font-size:24px;
  line-height:1;cursor:pointer;padding:0 2px}
.wx-x:hover{color:#fff}
.wx-b{flex:1;overflow-y:auto;padding:18px;-webkit-overflow-scrolling:touch}
.wx-big{display:flex;align-items:baseline;gap:11px;margin-bottom:15px}
.wx-big b{font-size:56px;font-weight:800;letter-spacing:-3px;color:#fff;line-height:.9}
.wx-big span{font-size:12.5px;color:var(--mut)}
.wx-facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;
  margin-bottom:14px}
.wx-facts div{padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06)}
.wx-facts b{display:block;font-size:17px;font-weight:800;color:#e9eff7;
  font-variant-numeric:tabular-nums}
.wx-facts i{display:block;font-style:normal;font-size:7.5px;font-weight:800;
  letter-spacing:1px;text-transform:uppercase;color:#66748a;margin-top:3px}
.wx-warn{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:10px;
  background:rgba(200,168,106,.1);border:1px solid rgba(200,168,106,.3);
  font-size:12.5px;color:#e8d3a8;margin-bottom:14px}
.wx-warn b{color:#fff;text-transform:capitalize}
.wx-sun{display:flex;gap:18px;font-size:11.5px;color:var(--mut);margin-bottom:16px}
.wx-sun b{color:#dbe3ee;font-variant-numeric:tabular-nums}
.wx-sec{font-size:8.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:#66748a;margin:0 0 9px;padding-bottom:7px;border-bottom:1px solid rgba(255,255,255,.06)}
.wx-hrs{display:flex;gap:5px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px;
  -webkit-overflow-scrolling:touch}
.wx-hr{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;
  gap:4px;padding:9px 4px;border-radius:9px;background:rgba(255,255,255,.028)}
.wx-hr i{font-style:normal;font-size:9px;font-weight:800;letter-spacing:.4px;
  text-transform:uppercase;color:#7b8697}
.wx-hr b{font-size:14px;font-weight:800;color:#e9eff7;font-variant-numeric:tabular-nums}
.wx-hr em{font-style:normal;font-size:9px;font-weight:700;color:#5b6478;
  font-variant-numeric:tabular-nums}
.wx-hr em.wet{color:var(--blu2)}
.wx-week{display:flex;flex-direction:column;gap:2px}
.wx-d{display:grid;grid-template-columns:74px 26px 34px 1fr 34px 40px;align-items:center;
  gap:8px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.045)}
.wx-d:last-child{border-bottom:0}
.wx-dn{font-size:12px;font-weight:700;color:#dbe3ee;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.wx-d svg{width:22px;height:22px}
.wx-lo{font-size:12px;color:#6f7a8a;text-align:right;font-variant-numeric:tabular-nums}
.wx-hi{font-size:12px;font-weight:800;color:#e9eff7;font-variant-numeric:tabular-nums}
.wx-bar{position:relative;height:5px;border-radius:3px;background:rgba(255,255,255,.07)}
.wx-bar i{position:absolute;top:0;height:5px;border-radius:3px;
  background:linear-gradient(90deg,#5b9bd5,#f6c65b)}
.wx-dr{font-size:10px;font-weight:700;color:#4a5462;text-align:right;
  font-variant-numeric:tabular-nums}
.wx-dr.wet{color:var(--blu2)}
.wx-src{margin-top:16px;font-size:10px;color:#4a5462}
@media (max-width:640px){
  .wxwrap{padding:0}
  .wxsheet{width:100%;height:100%;max-height:100vh;border-radius:0;border:0}
  .wx-d{grid-template-columns:62px 22px 30px 1fr 30px 34px;gap:6px}
  .wx-big b{font-size:48px}
}

/* ---- the desks ---- */
.ndesks{display:flex;gap:4px;flex-wrap:wrap;margin:9px 0 2px}
.ndesk{background:rgba(255,255,255,.035);border:1px solid #262d38;border-radius:7px;
  padding:5px 9px;cursor:pointer;font-family:inherit;font-size:9.5px;font-weight:800;
  letter-spacing:.7px;text-transform:uppercase;color:#7b8697;transition:.13s;
  display:inline-flex;align-items:center;gap:5px}
.ndesk:hover{color:#cfd7e3;border-color:#39424f}
.ndesk.on{background:var(--blu);border-color:var(--blu);color:#fff}
.ndesk i{font-style:normal;font-size:8.5px;font-weight:800;opacity:.6;
  font-variant-numeric:tabular-nums}

/* the masthead badge takes the publisher's own colour */
.nw-s{border-left:3px solid var(--sc,#5b7fb8);padding-left:7px;color:var(--sc,#8fb3e8)}

/* the coin symbol */
.cxs{font-style:normal;color:#7f8b9c;margin-right:2px;font-weight:700}
.cxp b{display:flex;align-items:baseline}



/* ---- headlines on the dashboard ---- */
/* Tasks on the left, headlines on the right. align-items:start so an empty
   task list does not stretch to the height of nine headlines. */
.todayrow.two{grid-template-columns:1fr 1.25fr;align-items:start}
@media (max-width:900px){ .todayrow.two{grid-template-columns:1fr} }
.tcard.news .newsbox{display:flex;flex-direction:column;gap:1px;margin-top:6px;
  max-height:360px;overflow-y:auto;-webkit-overflow-scrolling:touch}
@media (max-width:900px){ .tcard.news .newsbox{max-height:none} }
.nw{display:flex;align-items:flex-start;gap:9px;padding:9px 8px;border-radius:8px;
  text-decoration:none;color:inherit;transition:background .12s;
  border-bottom:1px solid rgba(255,255,255,.045)}
.nw:last-child{border-bottom:0}
a.nw:hover{background:rgba(255,255,255,.045)}
/* Wide enough for SMITHSONIAN, which is the longest masthead in the list and
   is one unbreakable word — anything narrower ran it into the headline. */
.nw-s{flex:none;width:86px;font-size:7.5px;font-weight:800;letter-spacing:.9px;
  line-height:1.3;text-transform:uppercase;color:var(--blu2);padding-top:3px;
  overflow:hidden;text-overflow:ellipsis}
.nw-t{flex:1;min-width:0;font-size:13px;line-height:1.42;color:#dde4ee;font-weight:600}
a.nw:hover .nw-t{color:#fff}
.nw-go{flex:none;color:#4a5462;font-size:12px;padding-top:2px}
a.nw:hover .nw-go{color:var(--blu2)}
.nw-none{padding:14px 8px;font-size:12px;color:var(--mut);line-height:1.5}

/* ---- the call script, full screen, readable across a room ---- */
body.scripting{overflow:hidden}
.scwrap{position:fixed;inset:0;z-index:1200;display:flex;align-items:center;
  justify-content:center;padding:22px;background:rgba(4,6,10,.82);
  backdrop-filter:blur(3px)}
.scsheet{width:min(880px,100%);max-height:92vh;display:flex;flex-direction:column;
  border-radius:16px;overflow:hidden;background:linear-gradient(168deg,#141a23,#0f141b);
  border:1px solid #2b3341;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.sc-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:13px 18px;
  border-bottom:1px solid #232a35;background:rgba(255,255,255,.02)}
.sc-part{font-size:8.5px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--mut)}
.sc-num{font-size:8.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:#0a0d12;background:var(--gold);border-radius:20px;padding:3px 9px}
.sc-t{flex:1 1 100%;font-size:19px;font-weight:800;letter-spacing:-.4px;color:#fff}
.sc-doc{font-size:10px;font-weight:800;letter-spacing:.6px;color:var(--blu2);
  text-decoration:none;border:1px solid rgba(75,123,212,.4);border-radius:7px;
  padding:5px 11px;margin-left:auto}
.sc-doc:hover{background:var(--blu);color:#fff}
.sc-x{background:none;border:0;color:var(--mut);font-size:24px;line-height:1;
  cursor:pointer;padding:0 2px}
.sc-x:hover{color:#fff}
.sc-b{flex:1;overflow-y:auto;padding:20px 22px 24px;-webkit-overflow-scrolling:touch}
/* The lines he actually says, at a size you can read at arm's length with a
   phone against your ear. Everything else is deliberately smaller. */
.sc-q{font-size:19px;line-height:1.5;color:#eef3fa;font-weight:600;margin:0 0 15px;
  padding-left:14px;border-left:3px solid var(--blu)}
.sc-story{font-size:15.5px;line-height:1.62;color:#dbe3ee;background:rgba(200,168,106,.07);
  border:1px solid rgba(200,168,106,.24);border-radius:10px;padding:14px 16px;margin-bottom:15px}
.sc-ul{margin:0 0 15px;padding-left:20px}
.sc-ul li{font-size:15px;line-height:1.55;color:#dde4ee;margin-bottom:8px}
.sc-proof{font-size:16px;line-height:1.55;color:#fff;font-weight:600;margin:0 0 15px;
  padding:13px 15px;border-radius:10px;background:rgba(34,197,94,.09);
  border:1px solid rgba(34,197,94,.26)}
.sc-warn{font-size:13px;line-height:1.5;color:#f3c9c6;background:rgba(212,115,111,.11);
  border:1px solid rgba(212,115,111,.35);border-radius:9px;padding:11px 13px;margin-bottom:12px}
.sc-note{font-size:12.5px;line-height:1.55;color:#8b95a5;padding:11px 13px;
  border-radius:9px;background:rgba(255,255,255,.028)}
.sc-f{display:flex;align-items:center;gap:12px;padding:11px 16px;
  border-top:1px solid #232a35;background:rgba(0,0,0,.24)}
.sc-nav{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:9px;
  padding:10px 16px;color:#cfd7e3;font-family:inherit;font-size:12.5px;font-weight:800;
  cursor:pointer;flex:none}
.sc-nav:hover:not([disabled]){background:rgba(255,255,255,.1);color:#fff}
.sc-nav.go{background:var(--blu);border-color:var(--blu);color:#fff}
.sc-nav.go:hover:not([disabled]){filter:brightness(1.12)}
.sc-nav[disabled]{opacity:.3;cursor:default}
.sc-dots{flex:1;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;min-width:0}
.sc-dot{width:9px;height:9px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:#39414f;transition:.12s}
.sc-dot:hover{background:#5b6478}
.sc-dot.on{background:var(--gold);transform:scale(1.25)}
.sc-of{flex:none;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--mut);font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .scwrap{padding:0}
  .scsheet{width:100%;max-height:100vh;height:100%;border-radius:0;border:0}
  .sc-t{font-size:17px}
  .sc-q{font-size:17.5px}
  .sc-b{padding:16px 15px 20px}
  .sc-dots{display:none}
  .sc-nav{flex:1}
}

/* a meeting asking to be deleted */
.mt-del{display:inline-flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:4px 8px;border-radius:8px;background:rgba(212,115,111,.12);
  border:1px solid rgba(212,115,111,.45)}
.mt-del em{font-style:normal;font-size:10.5px;font-weight:700;color:#f0b8b6}
.mt-del button{background:none;border:1px solid var(--line);border-radius:6px;
  padding:3px 9px;font-family:inherit;font-size:10px;font-weight:800;cursor:pointer}
.mt-dy{color:#ffb4b0;border-color:rgba(212,115,111,.6)!important}
.mt-dy:hover{background:var(--red);color:#fff}
.mt-dn{color:var(--mut)}
.mt-dn:hover{color:var(--ink);background:rgba(255,255,255,.06)}

/* ---- the two coins in the banner ---- */
.tb-cx{flex:none;display:flex;gap:7px;margin-right:10px}
.cxp{display:flex;flex-direction:column;gap:1px;padding:5px 9px;border-radius:9px;
  background:rgba(255,255,255,.03);border:1px solid #222a36;min-width:78px}
.cxp b{font-size:12.5px;font-weight:800;letter-spacing:-.3px;color:#e9edf4;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.cxp span{font-size:7.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:#6f7a8a;display:flex;gap:4px;align-items:baseline}
.cxp span i{font-style:normal;letter-spacing:.2px;font-variant-numeric:tabular-nums}
.cxp span i.up{color:var(--green)} .cxp span i.dn{color:var(--red)}

/* ---- a text she has written, waiting on him ---- */
.smsd{margin:0 0 11px;padding:13px 15px;border-radius:12px;
  background:linear-gradient(150deg,#17210f,#121a0d);
  border:1px solid #35461f;border-left:3px solid #84cc16}
.smsd-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.smsd-h b{font-size:10px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  color:#c7e59b}
.smsd-h span{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
.smsd-h .smsd-x{margin-left:auto;background:none;border:0;color:#5f6875;
  font-family:inherit;font-size:9px;font-weight:800;letter-spacing:1px;
  text-transform:uppercase;cursor:pointer}
.smsd-h .smsd-x:hover{color:var(--red)}
.smsd textarea{width:100%;min-height:64px;resize:vertical;padding:10px 12px;
  border-radius:9px;background:#0b110a;border:1px solid #2e3a22;color:#e6f0d8;
  font-family:inherit;font-size:13px;line-height:1.5}
.smsd textarea:focus{outline:none;border-color:#84cc16}
.smsd-f{display:flex;align-items:center;gap:9px;margin-top:10px;flex-wrap:wrap}
.smsd-go{background:#4d7c0f;border:0;border-radius:9px;padding:9px 18px;color:#fff;
  font-family:inherit;font-size:12px;font-weight:800;letter-spacing:.4px;cursor:pointer}
.smsd-go:hover{background:#5f9612}
.smsd-go[disabled]{opacity:.45;cursor:default}
.smsd-n{font-size:10.5px;color:var(--mut);line-height:1.45}
.smsd-n b{color:#c7e59b}

@media (max-width:640px){
  .tb-cx{order:9;width:100%;margin-right:0}
  .cxp{flex:1 1 0;min-width:0}
  .jarvis{padding:10px 12px;gap:10px}
  .jv-brief{padding:8px 12px}
  .jv-t b{font-size:14px}
}

/* =========================================================
   THE DASHBOARD
   The homepage. Quiet, flat, and readable at a glance. Rules it keeps to:
   one blue for anything interactive, numbers in tabular figures so columns
   line up, and no panel taller than a screen without its own scroll.
   ========================================================= */
.vswitch{display:flex;align-items:center;gap:7px;background:var(--raise);
  border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;
  color:var(--mut);font-family:inherit;font-size:11.5px;font-weight:700;
  letter-spacing:.4px;flex:none;transition:.14s}
.vswitch:hover{color:var(--ink);border-color:var(--blu);background:#262b35}
.vs-ic{width:14px;height:14px;display:block;opacity:.85}
.vs-ic svg{width:14px;height:14px;display:block}

.dash{display:none}
body.homeview .dash{display:block;margin-top:12px}
body.homeview .tower{display:none}

/* ---- today ---- */
.dsh-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:12px;
  margin-bottom:12px}
.dsh-today{background:var(--paper2);border:1px solid var(--line);border-radius:13px;
  padding:16px 18px;min-width:0;position:relative;overflow:hidden}
.dsh-today.amz{border-color:#33405c}
.dsh-today:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--blu)}
.dsh-today.amz:before{background:#5b78a8}
.dsh-today.tick:before{background:var(--green)}
.dt-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:3px}
.dt-day{font-size:19px;font-weight:800;letter-spacing:-.4px}
.dt-dat{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.8px;
  text-transform:uppercase}
.dt-tag{font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  border-radius:20px;padding:3px 10px;border:1px solid}
.dt-tag.amz{color:#a8bde0;border-color:#3d4d6b;background:rgba(91,120,168,.14)}
.dt-tag.off{color:var(--green);border-color:rgba(95,179,124,.4);background:rgba(95,179,124,.1)}
.dt-plan{font-size:14px;line-height:1.6;white-space:pre-wrap;margin-top:9px;
  min-height:44px;color:var(--ink)}
.dt-plan.none{color:var(--mut);font-style:italic}
.dt-act{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.dt-tk{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;
  color:var(--mut);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;
  letter-spacing:.4px;transition:.14s}
.dt-tk:hover{border-color:var(--blu);color:var(--ink)}
.dt-tk.on{border-color:rgba(95,179,124,.5);color:var(--green);background:rgba(95,179,124,.1)}

/* the next thing that needs doing */
.dsh-next{background:var(--paper2);border:1px solid var(--line);border-radius:13px;
  padding:15px 17px;min-width:0;display:flex;flex-direction:column}
.dn-h{font-size:9.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  color:var(--blu2);margin-bottom:11px}
.dn-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid #23282f;
  font-size:12.5px}
.dn-row:first-of-type{border-top:0}
.dn-row b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.dn-row i{font-style:normal;color:var(--mut);font-size:11px;flex:none}
.dn-dot{width:7px;height:7px;border-radius:50%;flex:none}
.dn-clear{color:var(--mut);font-size:12.5px;padding:12px 0}

/* ---- the seven days ---- */
.dsh-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;
  margin-bottom:14px}
.dw-d{background:var(--paper2);border:1px solid var(--line);border-radius:11px;
  padding:11px 11px 13px;min-width:0;min-height:112px;cursor:pointer;transition:.14s;
  display:flex;flex-direction:column}
.dw-d:hover{border-color:var(--blu)}
.dw-d.now{border-color:var(--blu);background:#1e2530}
.dw-d.done{opacity:.62}
.dw-n{font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:4px}
.dw-d.now .dw-n{color:var(--blu2)}
.dw-tick{color:var(--green);font-size:11px}
.dw-lab{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  margin-top:5px;color:#7f8b9c}
.dw-d.amz .dw-lab{color:#a8bde0}
.dw-p{font-size:11.5px;line-height:1.45;color:var(--ink);margin-top:7px;flex:1;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.dw-p.none{color:#5f6875;font-style:italic}
/* the editable versions */
.dw-ck{margin-left:auto;width:18px;height:18px;flex:none;border-radius:5px;cursor:pointer;
  background:transparent;border:1.6px solid #454e5c;color:#08120c;font-size:11px;
  line-height:1;padding:0;transition:.14s}
.dw-ck:hover{border-color:var(--green)}
.dw-ck.on{background:var(--green);border-color:var(--green)}
input.dw-lab-i{width:100%;margin-top:5px;background:transparent;border:1px solid transparent;
  border-radius:6px;padding:2px 4px;color:#7f8b9c;font-family:inherit;font-size:9.5px;
  font-weight:800;letter-spacing:.9px;text-transform:uppercase;transition:border-color .2s}
input.dw-lab-i.amz{color:#a8bde0}
input.dw-lab-i:hover{border-color:#2f3540}
input.dw-lab-i:focus{outline:none;border-color:var(--blu);color:var(--ink);
  text-transform:none;letter-spacing:0}
textarea.dw-pi{width:100%;flex:1;margin-top:6px;min-height:56px;resize:vertical;
  background:transparent;border:1px solid transparent;border-radius:7px;padding:4px 5px;
  color:var(--ink);font-family:inherit;font-size:11.5px;line-height:1.45;
  transition:border-color .2s}
textarea.dw-pi:hover{border-color:#2f3540}
textarea.dw-pi:focus{outline:none;border-color:var(--blu);background:var(--raise)}
textarea.dw-pi::placeholder{color:#4e5763;font-style:italic}

/* ---- the numbers ---- */
.dsh-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.dk-c{background:var(--paper2);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;min-width:0;cursor:pointer;transition:.14s}
.dk-c:hover{border-color:var(--blu)}
.dk-h{font-size:9px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;
  color:var(--mut)}
.dk-v{font-size:26px;font-weight:800;letter-spacing:-1.1px;margin-top:5px;
  font-variant-numeric:tabular-nums;line-height:1.05}
.dk-v.g{color:var(--green)} .dk-v.b{color:var(--blu2)}
.dk-v.a{color:var(--amber)} .dk-v.r{color:var(--red)}
.dk-d{font-size:10.5px;color:var(--mut);margin-top:4px}

/* ---- panels ---- */
.dsh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.dp{background:var(--paper2);border:1px solid var(--line);border-radius:13px;
  min-width:0;display:flex;flex-direction:column;overflow:hidden}
.dp-h{display:flex;align-items:center;gap:9px;padding:13px 16px 11px;
  border-bottom:1px solid #23282f}
.dp-t{flex:1;min-width:0;font-size:12.5px;font-weight:700;letter-spacing:.2px}
.dp-t em{font-style:normal;color:var(--mut);font-weight:600;font-size:11px;margin-left:6px}
.dp-go{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 11px;
  color:var(--mut);font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer;
  letter-spacing:.4px;flex:none;transition:.14s;white-space:nowrap}
.dp-go:hover{border-color:var(--blu);color:var(--ink)}
.dp-b{padding:6px 16px 15px;min-width:0}
.dp-b.tight{padding-top:2px}
.dp-scr{max-height:290px;overflow-y:auto}
.dp-none{color:var(--mut);font-size:12.5px;padding:18px 0;text-align:center}

/* a person to call */
.dcall{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #23282f}
.dcall:first-child{border-top:0}
.dcall .who{flex:1;min-width:0}
.dcall .who b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dcall .who i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);
  margin-top:2px;font-variant-numeric:tabular-nums}
.dcall .prdot2{width:8px;height:8px;border-radius:50%;background:#a855f7;flex:none}
.dcall .owe{font-size:11.5px;font-weight:700;color:var(--amber);
  font-variant-numeric:tabular-nums;flex:none}
.dcall .dbtn{background:rgba(75,123,212,.16);border:1px solid rgba(75,123,212,.5);
  border-radius:7px;padding:6px 12px;color:var(--blu2);font-family:inherit;
  font-size:10.5px;font-weight:800;letter-spacing:.6px;cursor:pointer;flex:none;transition:.14s}
.dcall .dbtn:hover{background:rgba(75,123,212,.3);color:#fff}
.dcall .dbtn[disabled]{opacity:.35;cursor:default}

/* a stage, small, beside a name */
.stgchip{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;border:1px solid;border-radius:20px;padding:1px 7px;
  margin-right:5px;vertical-align:1px}

/* stage bars */
.dstg{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:12px}
.dstg .nm{width:104px;flex:none;color:var(--mut);font-size:11px;font-weight:600}
.dstg .bar{flex:1;min-width:0;height:7px;border-radius:4px;background:#23282f;overflow:hidden}
.dstg .bar span{display:block;height:100%;border-radius:4px}
.dstg .n{width:26px;flex:none;text-align:right;font-weight:700;
  font-variant-numeric:tabular-nums;font-size:11.5px}

/* social */
.dsoc{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px solid #23282f}
.dsoc:first-child{border-top:0}
.dsoc .ic{width:30px;height:30px;border-radius:8px;flex:none;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:800}
.dsoc .mid{flex:1;min-width:0}
.dsoc .mid b{display:block;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.4px}
.dsoc .mid i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);margin-top:1px}
.dsoc .pt{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  border-radius:20px;padding:3px 9px;border:1px solid;flex:none}
.dsoc .pt.yes{color:var(--green);border-color:rgba(95,179,124,.42);background:rgba(95,179,124,.1)}
.dsoc .pt.no{color:#8a929f;border-color:var(--line)}
/* a live number versus one he typed in */
.livedot{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--green);margin-left:6px;vertical-align:middle;
  box-shadow:0 0 0 3px rgba(95,179,124,.16)}
.handdot{display:inline-block;margin-left:6px;font-size:9.5px;color:#6f7a8a;
  vertical-align:middle;font-weight:400}
.gup{color:var(--green);font-weight:700}
.gdn{color:var(--red);font-weight:700}

.dbar10{height:6px;border-radius:3px;background:#23282f;overflow:hidden;margin-top:11px}
.dbar10 span{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blu),var(--ice))}

/* small two-up facts */
.dfacts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:2px}
.dfact{background:var(--raise);border:1px solid #2b3038;border-radius:10px;padding:10px 12px}
.dfact b{display:block;font-size:17px;font-weight:800;letter-spacing:-.5px;
  font-variant-numeric:tabular-nums}
.dfact i{display:block;font-style:normal;font-size:9.5px;color:var(--mut);
  letter-spacing:1.1px;text-transform:uppercase;font-weight:700;margin-top:3px}
.dfact.g b{color:var(--green)} .dfact.a b{color:var(--amber)}
.dfact.r b{color:var(--red)}   .dfact.b b{color:var(--blu2)}

/* ============ MEETINGS AND CALLS ============ */
.dp.wide{grid-column:1 / -1}
.mtblock{margin-bottom:14px}
.mtb-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mtb-h b{font-size:13px}
.mtb-h span{flex:1;min-width:0;font-size:11px;color:var(--mut)}
.mt-cal{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px;
  padding:9px 11px;border:1px dashed #333b47;border-radius:9px}
.mt-cal span{flex:1;min-width:180px;font-size:11px;color:var(--mut)}
.mt-cal input{flex:1;min-width:200px;background:var(--raise);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;color:var(--ink);font-family:inherit;font-size:12px}
.mt-cal input:focus{outline:none;border-color:var(--blu)}
.mts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.mt{background:var(--raise);border:1px solid #2b3038;border-radius:11px;padding:10px 11px;
  min-width:0;border-left:3px solid var(--blu)}
.mt.past{border-left-color:var(--red)}
.mt-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
input.mt-nm{flex:1;min-width:110px;background:transparent;border:1px solid transparent;
  border-radius:6px;padding:4px 6px;color:var(--ink);font-family:inherit;font-size:13.5px;
  font-weight:700;transition:border-color .2s}
input.mt-nm:hover{border-color:#333b47}
input.mt-nm:focus{outline:none;border-color:var(--blu);background:var(--paper2)}
input.mt-at{flex:none;background:var(--paper2);border:1px solid var(--line);border-radius:6px;
  padding:4px 6px;color:var(--ink);font-family:inherit;font-size:11px;
  color-scheme:dark}
input.mt-at:focus{outline:none;border-color:var(--blu)}
.mt-when{font-size:9.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--blu2);white-space:nowrap}
.mt-when.late{color:var(--red)}
.mt-x{margin-left:auto;background:none;border:0;color:#4a5462;cursor:pointer;
  font-size:17px;line-height:1;padding:0 4px}
.mt-x:hover{color:var(--red)}
.mt-g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
input.mt-f{min-width:0;background:var(--paper2);border:1px solid var(--line);border-radius:7px;
  padding:6px 8px;color:var(--ink);font-family:inherit;font-size:11.5px}
input.mt-f:focus{outline:none;border-color:var(--blu)}
input.mt-f:nth-child(3){grid-column:1 / -1}
textarea.mt-nt{width:100%;margin-top:6px;min-height:44px;resize:vertical;
  background:var(--paper2);border:1px solid var(--line);border-radius:7px;padding:7px 8px;
  color:var(--ink);font-family:inherit;font-size:11.5px;line-height:1.5}
textarea.mt-nt:focus{outline:none;border-color:var(--blu)}
.mt-act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.mt-b{background:none;border:1px solid var(--line);border-radius:7px;padding:6px 11px;
  color:var(--mut);font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer;
  letter-spacing:.4px;transition:.14s}
.mt-b:hover{border-color:var(--blu);color:var(--ink)}
.mt-b.go{color:var(--blu2);border-color:rgba(75,123,212,.45);background:rgba(75,123,212,.12)}
.mt-b[disabled]{opacity:.35;cursor:default}

/* adding food straight from the dashboard */
.dfood{display:flex;gap:7px;margin-top:11px}
.dfood input{flex:1;min-width:0;background:var(--raise);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;color:var(--ink);font-family:inherit;font-size:12.5px}
.dfood input:focus{outline:none;border-color:var(--blu)}
.dfood .btn{flex:none}
.dfood-p{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.dfood-p:empty{display:none}

/* the safe, still shut */
.dlock{text-align:center;padding:14px 0 6px}
.dlock p{font-size:12px;color:var(--mut);margin:9px 0 12px}

/* ---- a module opened on top of the dashboard ---- */
body.dsheeting{overflow:hidden}
.dsheet-wrap{position:fixed;inset:0;z-index:900;display:flex;
  align-items:flex-start;justify-content:center;padding:34px 20px;
  background:rgba(6,8,12,.72);backdrop-filter:blur(3px);
  animation:dsIn .16s ease-out}
@keyframes dsIn{from{opacity:0}to{opacity:1}}
/* Expanded: the CRM gets the whole browser window, because that is where he
   works leads for an hour at a time and 1080px of it is not enough. */
.dsheet-wrap.wide{padding:14px}
.dsheet-wrap.wide .dsheet{width:100%;max-width:none;max-height:calc(100vh - 28px);
  height:calc(100vh - 28px)}
.dsheet{width:min(1080px,100%);max-height:calc(100vh - 68px);display:flex;
  flex-direction:column;min-width:0;
  background:var(--paper2);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 30px 70px rgba(0,0,0,.6);overflow:hidden;
  animation:dsUp .18s ease-out}
@keyframes dsUp{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
.dsheet-h{display:flex;align-items:center;gap:9px;flex:none;
  padding:12px 14px;border-bottom:1px solid #23282f;background:var(--raise)}
.dsheet-ic{font-size:15px;flex:none}
.dsheet-h b{font-size:13px;font-weight:700;flex:none}
.dsheet-no{flex:1;min-width:0;font-size:8.5px;font-weight:800;letter-spacing:1.6px;
  text-transform:uppercase;color:var(--mut);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.dsheet-fl{flex:none;background:none;border:1px solid var(--line);border-radius:7px;
  padding:6px 11px;color:var(--mut);font-family:inherit;font-size:10.5px;font-weight:700;
  cursor:pointer;letter-spacing:.4px;transition:.14s;white-space:nowrap}
.dsheet-fl:hover{border-color:var(--blu);color:var(--ink)}
.dsheet-x{flex:none;background:none;border:1px solid var(--line);border-radius:7px;
  width:30px;height:28px;color:var(--mut);font-size:17px;line-height:1;cursor:pointer;
  transition:.14s}
.dsheet-x:hover{border-color:var(--red);color:var(--red)}
.dsheet-b{flex:1;min-height:0;overflow-y:auto;padding:0}
.dsheet-b .wbody{padding:14px 16px 18px;min-width:0}

/* ============ THE OPERATOR DOCK ============
   Bottom-left corner, out of the way of everything, always there. The talking
   window is small on purpose: he wants to read his numbers while he talks. */
/* It used to be position:fixed in the bottom-left corner, and it covered
   whatever scrolled underneath it — the CRM search box most of all. It is a
   section of the page now, last in the flow, which is where Glen wants it. */
.opdock{position:static;margin:14px 0 4px;padding:14px 16px;border-radius:13px;
  background:linear-gradient(168deg,#11151c,#0c1015);
  border:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
body.dsheeting .opdock{display:none}
.opdock-h{display:flex;align-items:center;gap:9px;margin-bottom:-2px}
.opdock-h b{font-size:10px;font-weight:800;letter-spacing:1.6px;
  text-transform:uppercase;color:#e6ecf4}
.opdock-h span{font-size:10.5px;color:var(--mut)}
.opdock-h .brf{margin-left:auto;background:var(--blu);border:0;border-radius:8px;
  padding:7px 13px;color:#fff;font-family:inherit;font-size:10.5px;font-weight:800;
  letter-spacing:.4px;cursor:pointer;transition:.14s}
.opdock-h .brf:hover{filter:brightness(1.12)}

.opfaces{display:flex;gap:8px;flex-wrap:wrap}
.opf{position:relative;width:52px;height:52px;flex:none;border-radius:14px;
  overflow:hidden;cursor:pointer;padding:0;
  background:#12151b;border:1px solid #2f3540;transition:.16s;
  box-shadow:0 6px 18px rgba(0,0,0,.45)}
.opf:hover{border-color:var(--oc);transform:translateY(-2px)}
.opf.on{border-color:var(--oc);box-shadow:0 0 0 2px color-mix(in srgb,var(--oc) 40%,transparent),
  0 6px 18px rgba(0,0,0,.5)}
.opf svg{display:block;width:100%;height:100%}
.opf-dot{position:absolute;right:3px;top:3px;width:8px;height:8px;border-radius:50%;
  background:var(--green);box-shadow:0 0 0 2px #12151b}
.opf-nm{position:absolute;left:0;right:0;bottom:0;padding:2px 0 3px;
  background:linear-gradient(180deg,transparent,rgba(6,8,12,.92));
  font-size:7.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:#cfd6e1;text-align:center}

/* the conversation */
/* 380px was the width the corner could spare. It sits in the page now. */
.opchat{width:min(680px,100%);display:flex;flex-direction:column;
  background:linear-gradient(170deg,#1b212a,#151a21);
  border:1px solid #2f3540;border-left:3px solid var(--oc);border-radius:14px;
  box-shadow:0 22px 54px rgba(0,0,0,.6);overflow:hidden;
  animation:dkIn .16s ease-out}
@keyframes dkIn{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.dk-h{display:flex;align-items:center;gap:9px;padding:9px 11px;
  border-bottom:1px solid #23282f;background:rgba(255,255,255,.02)}
.dk-f{width:30px;height:30px;flex:none;border-radius:9px;overflow:hidden;background:#12151b}
.dk-f svg{display:block;width:100%;height:100%}
.dk-who{flex:1;min-width:0;line-height:1.15}
.dk-who b{display:block;font-size:12.5px;font-weight:700}
.dk-who i{display:block;font-style:normal;font-size:9px;color:var(--mut);
  letter-spacing:1px;text-transform:uppercase;font-weight:700;margin-top:1px}
.dk-b{flex:none;background:none;border:1px solid var(--line);border-radius:6px;
  padding:4px 9px;color:var(--mut);font-family:inherit;font-size:9.5px;font-weight:800;
  letter-spacing:.6px;cursor:pointer}
.dk-b:hover{border-color:var(--blu);color:var(--ink)}
.dk-x{flex:none;background:none;border:0;color:var(--mut);font-size:18px;line-height:1;
  cursor:pointer;padding:0 3px}
.dk-x:hover{color:var(--red)}
.dk-log{max-height:210px;overflow-y:auto;padding:10px 11px;display:flex;
  flex-direction:column;gap:7px}
.dk-hi{font-size:11.5px;color:var(--mut);font-style:italic;line-height:1.5}
/* pre-line, because the brief is written as lines — a greeting, two cities,
   the headlines, then his own words. Collapsed into one paragraph it reads as a
   wall and the verbatim quote stops standing out. */
.dk-m{font-size:12.5px;line-height:1.5;padding:7px 10px;border-radius:10px;max-width:88%;
  word-wrap:break-word;white-space:pre-line}
.dk-m.me{align-self:flex-end;background:rgba(75,123,212,.2);
  border:1px solid rgba(75,123,212,.34);color:#e9eff8}
.dk-m.them{align-self:flex-start;background:var(--raise);border:1px solid #2b3038}
.dk-m.did{align-self:flex-start;background:rgba(95,179,124,.12);
  border:1px solid rgba(95,179,124,.34);color:#bfe6cd;font-size:11px}
.dk-m.think{opacity:.6;font-style:italic}
.dk-f2{display:flex;align-items:center;gap:6px;padding:9px 10px;
  border-top:1px solid #23282f}
.dk-mic,.dk-spk{flex:none;width:34px;height:34px;border-radius:9px;cursor:pointer;
  background:var(--raise);border:1px solid var(--line);color:var(--ink);font-size:14px;
  padding:0;transition:.14s}
.dk-mic:hover,.dk-spk:hover{border-color:var(--blu)}
.dk-mic.on{background:var(--red);border-color:var(--red);color:#fff}
.dk-spk.on{border-color:rgba(95,179,124,.5)}
#dk-in{flex:1;min-width:0;background:var(--paper2);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;color:var(--ink);font-family:inherit;font-size:13px}
#dk-in:focus{outline:none;border-color:var(--blu)}
.dk-go{flex:none;background:rgba(75,123,212,.2);border:1px solid rgba(75,123,212,.5);
  border-radius:9px;padding:8px 13px;color:var(--blu2);font-family:inherit;font-size:11.5px;
  font-weight:800;cursor:pointer;letter-spacing:.4px}
.dk-go:hover{background:rgba(75,123,212,.34);color:#fff}

/* the page needs room for the faces */
body.homeview .wrap{padding-bottom:86px}

/* ============ DASHBOARD SECTIONS ============
   Each block is a titled section rather than a wall of equal cards, so the eye
   knows what it is looking at and in what order. */
.sec{margin-bottom:22px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px;
  padding-bottom:9px;border-bottom:1px solid #23282f}
.sec-h h2{font-size:15px;font-weight:800;letter-spacing:-.3px;flex:none}
.sec-s{flex:1;min-width:0;font-size:11px;color:var(--mut)}
.sec-b{flex:none;background:none;border:1px solid var(--line);border-radius:8px;
  padding:6px 12px;color:var(--mut);font-family:inherit;font-size:10.5px;font-weight:700;
  cursor:pointer;letter-spacing:.4px;transition:.14s;white-space:nowrap;text-decoration:none}
.sec-b:hover{border-color:var(--blu);color:var(--ink)}
.sec-b.hot{border-color:rgba(75,123,212,.55);color:var(--blu2);background:rgba(75,123,212,.12)}
.sec-b.script{border-color:rgba(201,162,92,.5);color:var(--amber);background:rgba(201,162,92,.1)}
.sec-b.script:hover{background:rgba(201,162,92,.22);color:#f0d9a8}

/* ---- analytics ---- */
.anrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.an-big{background:var(--paper2);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px;min-width:0}
.an-k{display:block;font-size:9px;font-weight:800;letter-spacing:1.7px;
  text-transform:uppercase;color:var(--mut)}
.an-big b{display:block;font-size:27px;font-weight:800;letter-spacing:-1.2px;margin-top:4px;
  font-variant-numeric:tabular-nums;line-height:1.05}
.an-big b.g{color:var(--green)} .an-big b.r{color:var(--red)}
.an-big b.a{color:var(--amber)} .an-big b.b{color:var(--blu2)}
.an-big i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);margin-top:4px}
.an-hint{margin-top:11px;padding:10px 13px;border:1px dashed #333b47;border-radius:10px;
  font-size:11.5px;color:var(--mut);line-height:1.5}
.an-hint b{color:var(--ink)}

.plats{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:11px}
.plat{background:var(--paper2);border:1px solid var(--line);border-radius:13px;
  padding:14px 15px 12px;min-width:0;border-top:3px solid var(--pc)}
.plat.third{opacity:.94}
.plat-h{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.plat-nm{flex:1;min-width:0;font-size:12.5px;font-weight:800;letter-spacing:.3px;
  text-transform:uppercase}
.conn{flex:none;display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:800;
  letter-spacing:1.1px;text-transform:uppercase;border:1px solid var(--line);
  border-radius:20px;padding:2px 9px;color:var(--mut);cursor:help}
.conn.live{color:var(--green);border-color:rgba(95,179,124,.45);background:rgba(95,179,124,.1)}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--green)}
.plat-n{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
input.folbig{width:auto;max-width:160px;min-width:0;background:transparent;
  border:1px solid transparent;border-radius:8px;padding:2px 6px;
  color:var(--ink);font-family:inherit;font-size:30px;font-weight:800;letter-spacing:-1.3px;
  font-variant-numeric:tabular-nums;transition:border-color .18s}
input.folbig:hover{border-color:#333b47}

/* Named .tsk, not .chk. ".chk" was already taken by the week's 19px day

textarea.dw-pi.big{min-height:92px}

/* the room picker is phone-only */
.rooms-m{display:none}

/* =========================================================
   MOBILE  —  phone-first layout
   ========================================================= */
/* ---------------------------------------------------------------
   EVERYTHING BELOW IS THE PHONE.
   It has to be the LAST thing in this stylesheet. It used to sit near the
   top, which meant several hundred desktop rules came after it and quietly
   won on source order. A later rule setting .wtitle back to display flex beat
   the phone rule hiding it, so the window title bar reappeared on phones, and
   a later wrapping rule beat the single scrolling row of tabs. Same
   specificity, later wins. Keeping the phone rules last is the whole fix.
   --------------------------------------------------------------- */

/* ==================== PHONE ====================
   Everything here is inside a max-width query, so the desktop layout is
   untouched. The building is NOT hidden on a phone — it is the point of the
   app. It is shown small, and tapping a room zooms the drawing into that room
   so every desk, door and screen inside is big enough to hit with a thumb. */
.mstack, .mtopstats, .mzoom{display:none}

@media (max-width: 820px){

  /* The markup order suits a desktop. On a phone the column is reordered so it
     reads: numbers, building, zoom strip, then whatever is open. */
  /* THE ONE THAT BROKE EVERYTHING.
     .tower is a flex column, and a flex child defaults to min-width:auto —
     "never shrink below your own content". The zoom strip's content is ~718px
     wide, so it refused to be 390 and dragged .tower, .sect and .wrap out to
     718 with it. Every panel then inherited that width and ran off the screen.
     overflow-x:auto on the strip did nothing, because the element itself was
     the thing refusing to be narrow.

     min-width:0 on every child is the fix. Then the strip scrolls inside 390px
     instead of making the page 718px. */
  .tower{padding:0;border:0;background:none;box-shadow:none;
    display:flex;flex-direction:column;min-width:0;max-width:100%}
  .tower > *{min-width:0;max-width:100%}
  .wrap, .sect{min-width:0;max-width:100%;overflow-x:clip}
  #mtopstats{order:0}
  .tower > svg.bld{order:1}
  #mzoom{order:2}
  #mstack{order:3}
  #wins{order:4}
  #taskbar{order:5}
  #roomsm{order:6}

  /* ---- the building, always visible ---- */
  /* THE BLACK BARS.
     An SVG always keeps the shape of its viewBox. Set width:100% and the height
     follows exactly, and there is no spare room — no bars. Put ANY max-height on
     it and the box becomes wider than the drawing wants, so the drawing centres
     itself and pads both sides with background. That was the black space.

     So: no max-height, ever. Width drives, height follows, the drawing fills the
     frame edge to edge at every zoom level. A room crop that happens to be tall
     is simply tall — which is right, because it is legible. */
  .tower > svg.bld{display:block;width:100%;height:auto;max-width:100%;max-height:none;
    border-radius:12px;background:#181c23;border:1px solid #1b2230;
    touch-action:pan-x pan-y pinch-zoom}
  body.mroom .tower > svg.bld{max-height:none}
  /* the frame around it must not add its own margin either */
  .tower{padding:0;border:0;background:none;box-shadow:none}
  .hotlinks{overflow:hidden}

  .navb, .rtip, .wgrip, .scrim, .rooms-m, .taskbar{display:none !important}

  /* ---- the numbers ---- */
  .mtopstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}
  .mstat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    border-radius:9px;padding:9px 6px;text-align:center;min-width:0}
  .mstat b{display:block;font-size:16px;font-weight:800;color:#fff;letter-spacing:-.6px;
    font-variant-numeric:tabular-nums;line-height:1}
  .mstat i{display:block;font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:.7px;
    text-transform:uppercase;color:var(--mut);margin-top:4px;line-height:1.2}

  /* ---- the zoom strip ---- */
  .mzoom{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;margin:9px 0 4px;padding-bottom:2px;
    min-width:0;max-width:100%}
  .mzoom::-webkit-scrollbar{display:none}
  .mzb{flex:none;display:flex;align-items:center;gap:6px;min-height:42px;padding:0 13px;
    border-radius:10px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:#a9b3c2;
    white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .mzb i{font-style:normal;font-size:15px;line-height:1}
  .mzb.on{background:color-mix(in srgb,var(--ac,#3b82f6) 20%,transparent);
    border-color:var(--ac,#3b82f6);color:#fff}
  .mzb.wide{flex:1;justify-content:center}

  /* ---- the stack ---- */
  .mstack{display:block}

  .mquick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}
  .mquick button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    min-height:68px;padding:9px 4px;border-radius:11px;cursor:pointer;font-family:inherit;
    background:linear-gradient(160deg,#1f242c,#232830);border:1px solid #232c3a;
    color:#c9d2df;font-size:10.5px;font-weight:800;line-height:1.2;text-align:center;
    -webkit-tap-highlight-color:transparent}
  .mquick button i{font-style:normal;font-size:20px;line-height:1}
  .mquick button:active{border-color:#3b82f6;color:#fff}

  .mrooms{display:flex;flex-direction:column;gap:8px}
  .mroom{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:linear-gradient(160deg,#1c2028,#1e2229);
    border:1px solid #232c3a;border-left:3px solid var(--ac);
    border-radius:12px;padding:13px 14px;cursor:pointer;font-family:inherit;
    min-height:66px;-webkit-tap-highlight-color:transparent}
  .mroom:active{background:linear-gradient(160deg,#232830,#262b34);border-color:var(--ac)}
  .mri{font-size:23px;line-height:1;flex:none;width:28px;text-align:center}
  .mrt{flex:1;min-width:0}
  .mrt b{display:block;font-size:15.5px;font-weight:800;color:#fff;letter-spacing:-.2px}
  .mrt i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:3px;line-height:1.35}
  .mrc{flex:none;font-size:15px;color:var(--ac)}

  .mgo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
  .mgo button{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
    border-radius:10px;padding:14px 8px;color:#a9b3c2;font-family:inherit;font-size:12px;
    font-weight:800;cursor:pointer}
  .mgo button:active{background:rgba(255,255,255,.1);color:#fff}

  /* ---- the room header ---- */
  .mrhd{display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:8;
    margin:6px 0 9px;padding:9px 11px;border-radius:12px;
    background:rgba(9,13,19,.95);backdrop-filter:blur(9px);
    border:1px solid #232c3a;border-left:3px solid var(--ac)}
  .mrbk{flex:none;width:42px;height:42px;border-radius:10px;font-size:25px;line-height:1;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
    color:#dbe3ee;font-family:inherit;cursor:pointer;padding:0 0 3px}
  .mrbk:active{background:rgba(255,255,255,.14)}
  .mrhn{flex:1;min-width:0}
  .mrhn b{display:block;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrhn i{display:block;font-style:normal;font-size:8px;font-weight:800;letter-spacing:1.1px;
    text-transform:uppercase;color:var(--mut);margin-top:3px}
  .mrhi{flex:none;font-size:21px}

  /* ---- windows become the page ----
     Everything in here is belt and braces against a single wide child pushing
     the whole panel off the screen. min-width:0 is the important one: a flex or
     grid child defaults to min-width:auto, which refuses to shrink below its
     content, and one long email address or unbroken URL then drags the entire
     row wider than the phone. */
  .wins{position:static;inset:auto;pointer-events:auto;max-width:100%;overflow-x:hidden}
  .win, .wbody, .wbody > *{max-width:100%;min-width:0}
  .wbody{overflow-x:hidden}
  .wbody div, .wbody section, .wbody label, .wbody p, .wbody span{min-width:0}
  .wbody table{table-layout:fixed;width:100%}
  .wbody pre, .wbody code{white-space:pre-wrap;word-break:break-word}
  .wbody a, .wbody b, .wbody i, .wbody td, .wbody th{overflow-wrap:anywhere}
  .mono{overflow-wrap:anywhere}
  .grid2 > *, .grid3 > *, .lc-g > *, .af-grid > *, .dirhead > *{min-width:0}
  .card, .kpi, .cardv{min-width:0;max-width:100%}
  .card .v, .cchero b{overflow-wrap:anywhere}
  .win{position:static !important;left:auto !important;top:auto !important;
    width:auto !important;height:auto !important;min-width:0;
    margin:0;border:0;background:none;box-shadow:none;z-index:auto !important}
  .wtitle{display:none}
  .wbody{overflow:visible;max-height:none;padding:0 0 26px}

  /* one scrolling row, never four stacked ones. The base .tabs rule sets
     flex-wrap:wrap and display:flex alone does not undo it. */
  .wbody .tabs{position:sticky;top:56px;z-index:6;display:flex;flex-wrap:nowrap;
    gap:6px;overflow-x:auto;overflow-y:hidden;min-width:0;max-width:100%;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -2px 12px;
    padding:9px 2px;border-bottom:0;
    background:rgba(9,13,19,.96);backdrop-filter:blur(9px);border-radius:10px}
  .wbody .tabs::-webkit-scrollbar{display:none}
  /* the dead space where the hidden title bar used to be */
  .win{gap:0}
  .wbody{padding-top:0}
  .wbody .tabs::-webkit-scrollbar{display:none}
  .wbody .tab{flex:none;padding:0 16px;font-size:13.5px;min-height:46px;
    display:flex;align-items:center}
  /* anything scrolled to must clear the sticky header and tabs */
  .wbody > *, .wbody table tr{scroll-margin-top:124px}

  .tbox{position:static;left:auto;top:auto;transform:none;width:auto;margin-top:9px}
  .tbox.show{transform:none}
  .tb-face{width:58px;height:58px}
  .tb-line{font-size:13px}

  /* ================= TYPING =================
     16px is the threshold below which iOS zooms the whole page on focus, which
     is what made every field feel like a fight. Everything that takes text is
     at least that, and at least 48px tall so a thumb can find it. */
  input, textarea, select{font-size:16px !important;line-height:1.45}
  input, select{min-height:48px}
  textarea{min-height:88px}
  select, .jsel, .stsel{min-height:48px;padding:11px 12px}
  button, .cbtn, .fdbtn, .tbi{min-height:46px}
  /* the day tick on The Week was 19px — too small to hit reliably */
  /* both of these were a couple of pixels under a comfortable thumb — 34 and 36
     on a 40-ish target. Rounded up so the sweep is clean rather than nearly. */
  .chk{min-height:0;width:42px;height:42px;font-size:18px}
  .mc, .qd{min-height:0}
  .xbtn{min-height:0}
  .xbtn{width:42px;height:42px;font-size:19px}
  .mnav{min-height:46px;min-width:50px;font-size:16px}
  .mnav.today{min-width:0;font-size:12px}
  .sin,.vin,.cin,.lin{padding:12px 13px}
  .cn{min-height:48px;padding:11px 12px}
  .qrow input,.addbar input{min-height:50px}
  .qrow button,.addbar button{min-height:50px;font-size:14px}
  .bkrow{flex-wrap:wrap}
  .bkrow i{flex:1 1 100%;min-width:0;margin-bottom:3px}
  .bkrow input{flex:1 1 100%;min-height:48px;padding:11px 12px}

  /* talking to an agent should feel like a messaging app: the log takes what is
     left, the composer stays put. 100dvh shrinks when the keyboard opens.

     The plan above is hidden the moment a chat is open, because a keyboard plus
     a floor plan plus a conversation does not fit on a phone and the chat is
     what you came for. The zoom strip still gets you out. */
  body.mchatopen .tower > svg.bld{display:none}
  body.mchatopen .mtopstats{display:none}

  body.mroom .chat{display:flex;flex-direction:column;
    height:calc(100dvh - 260px);min-height:300px;border-radius:12px}
  body.mroom.mchatopen .chat{height:calc(100dvh - 150px)}
  .chat, .chat *{max-width:100%}
  .chat .log{overflow-x:hidden}
  .msg{word-break:break-word;overflow-wrap:anywhere}
  .chat-f{flex-wrap:nowrap}
  .chat-f textarea{min-width:0}
  body.mroom .chat .chat-h{flex:none}
  body.mroom .chat .log{flex:1 1 auto;max-height:none;overflow-y:auto;
    -webkit-overflow-scrolling:touch}
  body.mroom .chat-f{flex:none;position:sticky;bottom:0;z-index:4;
    background:rgba(9,13,19,.97);backdrop-filter:blur(9px);
    padding:11px 12px calc(11px + env(safe-area-inset-bottom))}
  body.mroom .chat-f textarea{min-height:50px;max-height:132px}

  .wbody table{display:block;border:0;table-layout:auto}

  .prdot{width:40px;height:40px;min-height:0 !important;flex:none;border-radius:50%;

  .wbody table tr{position:relative}

     contains the dot instead of trusting the label. */
  .wbody table td:has(> .prdot){position:absolute;top:13px;right:13px;
    width:auto !important;padding:0;margin:0;z-index:2}
  .wbody table td:has(> .prdot):before{display:none}
  .wbody table td[data-l="Priority"]{position:absolute;top:13px;right:13px;

  .wbody table td[data-l="Priority"]:before{display:none}
  .wbody table td.nm-c{padding-right:44px}

<script>
/* ==================== VERCEL SHIM ====================
   On Cowork this page talked to the outside world through window.cowork. On
   your own server that object does not exist, so this rebuilds it against the
   API routes in /api. Every call in the app below is unchanged — it still says
   window.cowork.callMcpTool(...) and window.cowork.askClaude(...).

   Nothing secret lives here. The Supabase key and the Anthropic key stay on the
   server; this page only ever holds the sign-in token. */
(function(){
  /* ONE FILE, TWO HOMES.
     Inside Cowork, window.cowork already exists and the real connectors are
     live — so this shim stands down completely and the page behaves exactly as
     it always has. On your own server there is no window.cowork, so the shim
     installs itself and routes everything through /api instead.

     That means there is only ever one file to edit. No divergence, no second
     copy to keep in step. */
  var HOSTED = !(window.cowork && typeof window.cowork.callMcpTool === "function");
  if (!HOSTED) return;                       // running in Cowork — nothing to do

  var TOKEN = null;
  try { TOKEN = localStorage.getItem("exodus_hq_token"); } catch(e){}

  function post(path, payload){
    return fetch(path, {
      method:"POST",
      headers: Object.assign({"Content-Type":"application/json"},
                             TOKEN ? {"x-hq-token":TOKEN} : {}),
      body: JSON.stringify(payload||{})
    }).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){
        if(r.status===401){ signOut(); throw new Error("Signed out. Reload and sign in."); }
        if(!r.ok) throw new Error((j && j.error) || ("Request failed ("+r.status+")"));
        return j;
      });
    });
  }

  /* ---- the gate ---- */
  function signOut(){
    TOKEN=null;
    try{ localStorage.removeItem("exodus_hq_token"); }catch(e){}
    showGate("Session ended. Sign in again.");
  }
  window.exodusSignOut = signOut;

  function showGate(msg){
    var g=document.getElementById("hqgate");
    if(g){ g.style.display="flex";
      var e=document.getElementById("hqgate-err"); if(e) e.textContent=msg||"";
      var i=document.getElementById("hqgate-pw"); if(i){ i.value=""; i.focus(); }
      return; }
    document.body.insertAdjacentHTML("afterbegin",
      '<div id="hqgate" style="position:fixed;inset:0;z-index:99999;display:flex;'
      +'align-items:center;justify-content:center;background:#05070b">'
      +'<div style="width:min(340px,90vw);text-align:center;font-family:ui-sans-serif,system-ui,sans-serif">'
      +'<div style="width:52px;height:52px;margin:0 auto 16px;border-radius:13px;'
      +'background:linear-gradient(150deg,#4b8cff,#12327d);display:flex;align-items:center;'
      +'justify-content:center;color:#eaf2ff;font-weight:800;font-size:20px">EX</div>'
      +'<div style="font-size:11px;letter-spacing:3px;color:#7dd3fc;font-weight:800;'
      +'text-transform:uppercase;margin-bottom:18px">Exodus HQ</div>'
      +'<input id="hqgate-pw" type="password" placeholder="Password" '
      +'style="width:100%;background:#0b1017;border:1px solid #2b3446;border-radius:9px;'
      +'padding:12px 14px;color:#fff;font-family:inherit;font-size:15px;text-align:center">'
      +'<button id="hqgate-go" style="width:100%;margin-top:9px;background:rgba(47,111,237,.24);'
      +'border:1px solid rgba(47,111,237,.6);border-radius:9px;padding:12px;color:#cfe0ff;'
      +'font-family:inherit;font-size:12px;font-weight:800;letter-spacing:1.2px;cursor:pointer">'
      +'UNLOCK</button>'
      +'<div id="hqgate-err" style="min-height:18px;margin-top:11px;font-size:12px;'
      +'color:#f87171;font-weight:700">'+(msg||"")+'</div></div></div>');
    var go=document.getElementById("hqgate-go"), pw=document.getElementById("hqgate-pw");
    function tryIt(){
      var err=document.getElementById("hqgate-err");
      err.textContent="Checking…"; err.style.color="#7dd3fc";
      fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({password:pw.value})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
        .then(function(o){
          if(!o.ok){ err.style.color="#f87171"; err.textContent=o.j.error||"Wrong password."; return; }
          TOKEN=o.j.token;
          try{ localStorage.setItem("exodus_hq_token",TOKEN); }catch(e){}
          document.getElementById("hqgate").remove();
          if(typeof boot==="function") boot();
        })
        .catch(function(){ err.style.color="#f87171"; err.textContent="Could not reach the server."; });
    }
    go.onclick=tryIt;
    pw.onkeydown=function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); tryIt(); } };
    pw.focus();
  }

  /* ---- the connector stand-in ---- */
  window.cowork = {
    callMcpTool: function(name, args){
      args = args || {};
      /* Supabase SQL is the only MCP tool the app still needs on this host.
         Drive, Gmail and Calendar are handled differently now — see below. */
      if (String(name).indexOf("execute_sql") >= 0) {
        return post("/api/db", { query: args.query }).then(function(j){
          /* the app expects the Cowork envelope, so hand back the same shape */
          return { content: [{ text: JSON.stringify(j.rows || []) }] };
        }).catch(function(e){
          return { isError: true, content: [{ text: String(e.message || e) }] };
        });
      }
      /* Gmail form scraping is replaced by the /api/form webhook — submissions
         are already in Postgres, so report none rather than pretending to read
         a mailbox. The Front Desk tab reads them out of the database. */
      if (String(name).indexOf("search_threads") >= 0)
        return Promise.resolve({ content: [{ text: JSON.stringify({ threads: [] }) }] });
      /* Drive sheet: Supabase is the source of truth on this host. */
      if (String(name).indexOf("read_file_content") >= 0)
        return Promise.resolve({ content: [{ text: JSON.stringify({ fileContent: "" }) }] });
      /* Reading the calendar. This used to hand back an empty list, which is why
         nothing ever showed on the live site even with a Google token set. */
      if (String(name).indexOf("list_events") >= 0)
        return post("/api/voice?route=events", args).then(function(j){
          return { content: [{ text: JSON.stringify({ events: (j && j.events) || [] }) }] };
        }).catch(function(){
          /* not connected, or Google said no — an empty week, not a broken page */
          return { content: [{ text: JSON.stringify({ events: [] }) }] };
        });
      if (String(name).indexOf("create_event") >= 0)
        return post("/api/calendar", args).then(function(j){
          return { content: [{ text: JSON.stringify(j) }] };
        }).catch(function(e){
          return { isError: true, content: [{ text: String(e.message || e) }] };
        });
      return Promise.resolve({ content: [{ text: "{}" }] });
    },

    askClaude: function(prompt, data){
      return post("/api/chat", { prompt: prompt, data: data })
        .then(function(j){ return j.text || ""; });
    }
  };

  /* Hold the app until it is unlocked. boot() runs from the gate instead. */
  window.__EXODUS_HOSTED__ = true;
  if(!TOKEN){
    document.addEventListener("DOMContentLoaded", function(){ showGate(""); });
  }
})();
</script>

<script>
/* ================= WHEN SOMETHING BREAKS, SAY SO =================
   A blank page tells you nothing and tells me less. Anything that throws while
   the app is starting now paints itself on screen — the message, the file and
   the line — so instead of "Safari will not open" there is something to read
   and send me. Costs nothing when everything is fine. */
(function(){
  var shown=false;
  function paint(title, detail){
    if(shown) return; shown=true;
    try{
      var d=document.createElement("div");
      d.setAttribute("style",
        "position:fixed;inset:0;z-index:99999;overflow:auto;"
        +"background:#0a0d12;color:#e8eef5;padding:22px 18px;"
        +"font:14px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;"
        +"-webkit-text-size-adjust:100%");
      d.innerHTML =
        '<div style="max-width:640px;margin:0 auto">'
        +'<div style="font-size:10px;font-weight:800;letter-spacing:2px;'
        +'text-transform:uppercase;color:#fca5a5;margin-bottom:10px">EXODUS HQ &middot; STARTUP ERROR</div>'
        +'<div style="font-size:17px;font-weight:800;margin-bottom:14px">'+title+'</div>'
        +'<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;'
        +'background:#11161f;border:1px solid #232c3a;border-radius:10px;padding:13px;'
        +'color:#cbd3de;margin:0 0 16px">'+detail+'</pre>'
        +'<div style="font-size:12.5px;color:#8e98a8;line-height:1.6">'
        +'Send me that text and I will know exactly what happened. '
        +'Your data is untouched — it lives in the database, not in this page.</div>'
        +'<button onclick="location.reload()" style="margin-top:16px;background:#2f6fed;'
        +'border:0;border-radius:9px;padding:13px 20px;color:#fff;font:inherit;'
        +'font-weight:800;cursor:pointer;min-height:46px">Reload</button>'
        +'</div>';
      (document.body||document.documentElement).appendChild(d);
    }catch(e){
      try{ document.title="Exodus error: "+title; }catch(e2){}
    }
  }
  function esc(t){ return String(t==null?"":t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  try{ window.onerror=function(msg,src,line,col,err){
    paint("The app hit an error while starting.",
      esc(msg)+"\n\n"+esc(String(src||"").split("/").pop())+"  line "+line+", col "+col
      +((err&&err.stack)?"\n\n"+esc(String(err.stack).slice(0,700)):""));
  }; }catch(e){}
  /* the safety net must never itself be the thing that breaks the page */
  if(window.addEventListener) window.addEventListener("unhandledrejection",function(ev){
    var r=ev&&ev.reason;
    paint("Something failed in the background.",
      esc((r&&(r.message||r))||"unknown")
      +((r&&r.stack)?"\n\n"+esc(String(r.stack).slice(0,700)):""));
  });
  /* if nothing has drawn after eight seconds, say that too */
  setTimeout(function(){
    try{
      var svg=document.getElementById("bld");
      var gate=document.querySelector(".gate, #gate");
      var drew = (svg && svg.innerHTML && svg.innerHTML.length>200) || gate;
      if(!drew) paint("The building never finished drawing.",
        "No error was thrown, but nothing rendered within eight seconds.\n"
        +"Usually this means the page was served from a stale cache.\n\n"
        +"Try: Settings, Apps, Safari, Clear History and Website Data.\n"
        +"Or open the site in a Private tab once.");
    }catch(e){}
  }, 8000);
})();

/* ================= THE REST OF A LEAD'S RECORD =================
   Stage, notes and contact details already had somewhere to live. These are the
   fields a real CRM needs and this one did not have: when they came in, what you
   owe them next and when, and a place for detail that is not a dated log entry.
   Same pattern as everything else — written locally the instant you type, then
   pushed to Postgres, so it survives a refresh and shows up on every device. */
function lxGet(n){ try{ return JSON.parse(LS("lx_"+keyOf(n))||"null")||{}; }catch(e){ return {}; } }
function lxPut(n,field,val){
  var o=lxGet(n); 
  if(val===""||val===null||val===undefined) delete o[field]; else o[field]=val;
  LS("lx_"+keyOf(n), JSON.stringify(o));
  refreshContacts();
  SBSAVE("lead", n);
}
/* when they came in — a real Date, or null */
function cameIn(n){
  var v=lxGet(n).came;
  if(!v) return null;
  var d=new Date(v+(v.length===7?"-01":"")+"T12:00:00");
  return isNaN(d.getTime())?null:d;
}
function cameInRaw(n){ return lxGet(n).came||""; }
/* "day" or "month" — he does not always know the exact date */
function camePrec(n){ return (cameInRaw(n).length===7)?"month":"day"; }
function cameLabel(n){
  var raw=cameInRaw(n); if(!raw) return "";
  var d=cameIn(n); if(!d) return raw;
  return raw.length===7
    ? d.toLocaleDateString(undefined,{month:"short",year:"numeric"})
    : d.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
}
function followUp(n){
  var v=lxGet(n).fu; if(!v) return null;
  var d=new Date(v+"T12:00:00");
  return isNaN(d.getTime())?null:d;
}
/* Days until a follow-up. followUp() anchors the stored date at midday so a
   timezone can never shunt it onto the wrong day — which means TODAY has to be
   measured from midday too. It was measured from midnight, so a follow-up set
   for today came out as +1 and read "in 1d": the "follow up today" label never
   once appeared, the pipeline's "N due" button skipped today's calls, and so
   did the dialer's overdue count. Same clock on both sides, and 0 means today. */
function fuDaysOut(n){
  var d=followUp(n); if(!d) return null;
  var t=new Date(); t.setHours(12,0,0,0);
  return Math.round((d-t)/86400000);
}

function refreshContacts(){
  STATE.leads.forEach(function(x){
    var o=cnGet(x.name);
    x.phone=(o.p!==undefined&&o.p!=="")?o.p:x.phone0;
    x.email=(o.e!==undefined&&o.e!=="")?o.e:x.email0;
    x.ig   =(o.s!==undefined&&o.s!=="")?o.s:x.social;
    x.edited=!!(o.p||o.e||o.s);
    x.hasPhone=!!findPhone(x.phone);
    x.hasEmail=/[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}/i.test(x.email||"");
    x.directOnly=x.hasPhone||x.hasEmail;
    x.hasContact=x.directOnly||!!(x.ig&&x.ig.length);
    /* your own status pick beats whatever the sheet implies */
    var so=stGet(x.name);
    x.stage = (so && STATUSES.indexOf(so)>=0) ? so : x.stageBase;
    x.stageSet = !!so;
    /* your own notes replace the sheet's */
    var no=ntGet(x.name);
    x.notes = (no===null) ? x.notesBase : no;
    x.notesSet = (no!==null);
    x.flag=x.flagBase;
    if(!x.hasContact) x.flag=x.owed>0?"Owes money — no way to reach them":x.flagBase;
  });
}

  {k:"EST", tz:"America/New_York",     f:"us"},
  {k:"BKK", tz:"Asia/Bangkok",         f:"th"},

function localTZ(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||"America/New_York"; }
  catch(e){ return "America/New_York"; }
}
function placeName(){
  var tz=localTZ();
  if(/Bangkok/i.test(tz)) return "Bangkok";
  if(/New_York/i.test(tz)) return "New York City";
  var bits=tz.split("/");
  return (bits[bits.length-1]||tz).replace(/_/g," ");
}
function inZone(tz,d){
  d=d||new Date();
  try{
    var f=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",
      hour12:false,weekday:"short",day:"2-digit",month:"short"});
    var parts={}; f.formatToParts(d).forEach(function(p){parts[p.type]=p.value;});
    var H=parseInt(parts.hour,10), M=parseInt(parts.minute,10);
    var h12=H%12; if(h12===0)h12=12;
    var mm2=(M<10?"0":"")+M;
    return {hh:H,mm:M,
            wd:parts.weekday,day:parts.day,mon:parts.month,
            txt:h12+":"+mm2,                       /* 7:25 */
            ampm:(H<12?"AM":"PM"),
            full:h12+":"+mm2+" "+(H<12?"AM":"PM")};
  }catch(e){
    var H2=d.getHours(),M2=d.getMinutes(),h2=H2%12||12,m2=(M2<10?"0":"")+M2;
    return {hh:H2,mm:M2,wd:"",day:"",mon:"",txt:h2+":"+m2,
            ampm:(H2<12?"AM":"PM"),full:h2+":"+m2+" "+(H2<12?"AM":"PM")};
  }
}
/* the one number the whole scene reads */
function nowHour(){ return inZone(localTZ()).hh + inZone(localTZ()).mm/60; }
function isNight(){ var h=nowHour(); return h<6.5 || h>=19.5; }
function isDusk(){ var h=nowHour(); return (h>=6.5&&h<8) || (h>=17.5&&h<19.5); }

/* Which calendar day a zone is on, as a plain number, so two zones can be

function zoneDayNo(tz,d){
  try{
    var f=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"});
    return f.format(d||new Date());
  }catch(e){ return ""; }

/* ---- a real clock face, hands set from your local time ---- */
function clockFace(cx,cy,r,face,rim,hands,tz){
  face=face||"#0f141b"; rim=rim||"#c8a86a"; hands=hands||"#e8edf5";
  var t=inZone(tz||localTZ());
  var hA=((t.hh%12)+t.mm/60)*30-90;
  var mA=t.mm*6-90;
  var g='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+face+'"/>';
  g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+rim+'" stroke-width="'+(r*0.11)+'" opacity=".9"/>';
  for(var k=0;k<12;k++){
    var a=k*30*Math.PI/180, lo=r*0.78, hi=r*0.9;
    g+='<line x1="'+(cx+Math.cos(a)*lo)+'" y1="'+(cy+Math.sin(a)*lo)
      +'" x2="'+(cx+Math.cos(a)*hi)+'" y2="'+(cy+Math.sin(a)*hi)
      +'" stroke="'+hands+'" stroke-width="'+(k%3===0?r*0.09:r*0.05)+'" opacity="'+(k%3===0?".9":".5")+'"/>';}
  g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(hA*Math.PI/180)*r*0.48)
    +'" y2="'+(cy+Math.sin(hA*Math.PI/180)*r*0.48)+'" stroke="'+hands+'" stroke-width="'+(r*0.11)+'" stroke-linecap="round"/>';
  g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(mA*Math.PI/180)*r*0.7)
    +'" y2="'+(cy+Math.sin(mA*Math.PI/180)*r*0.7)+'" stroke="'+hands+'" stroke-width="'+(r*0.075)+'" stroke-linecap="round"/>';
  g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.1)+'" fill="'+rim+'"/>';
  return g;}

/* Who is in the building right now, driven by the real local hour. */
function shift(){
  var h=nowHour(), wd=new Date().getDay(), mn=new Date().getMinutes();
  return {
    hour:h, minute:mn,
    /* ---- THE RULES OF THE BUILDING ----
       Doors close at ten. After that the only people in here are Glen, the
       three agents, the night cleaner and the guard on patrol. Everyone else
       has a life and goes home. The gym is the one exception — it stays open
       later than the desks, because that is the point of a gym. */
    closed:  h>=22 || h<5.5,           /* building locked to staff and guests */
    night:   h>=22 || h<5.5,
    guard:   h>=21.5 || h<6,           /* security overlaps the close */
    cleaning:(h>=6.5&&h<8.5) || (h>=22&&h<23.5),   /* morning crew, night crew */
    core:    h>=9 && h<18,             /* full floor */
    early:   h>=8.5 && h<9,
    evening: h>=18 && h<21.5,
    gymOpen: h>=5.5 && h<22.5,         /* open before the desks, shuts after */
    weekend: wd===0||wd===6,
    /* Where Glen is. He was only ever at the desk or by the drinks cabinet, on a
       flat half-hour switch, which read as a man twitching between two spots.
       Now the hour drives a proper rotation: mostly his office, but he does the
       rounds — the sales floor, the gym, the studio — and comes back. */
    glenWalking: (h%1)>=0.5,
    glenSpot: (function(){
      /* twelve five-minute slices an hour, so he moves without being frantic */
      var slice=Math.floor(((h%1)*60)/5);
      /* eight of the twelve he is in his own office, cigar man does not roam far */
      var plan=["desk","desk","cabinet","desk","sales","desk","gym","desk",
                "cabinet","studio","desk","boardroom"];
      return plan[slice%12];
    })()
  };
}

/* ============================ PARSERS ============================ */
function digits(s){return String(s||"").replace(/\D/g,"");}
function last10(s){var d=digits(s);return d.length>10?d.slice(-10):d;}
/* ================= IS THIS ACTUALLY A PHONE NUMBER? =================
   Glen tapped Dial and got connected to a spam line. The cause was this app
   assuming any ten digits must be American and stamping +1 on the front.
   PARTEEK GOEL is stored as 9996426347 — a perfectly good Indian mobile — and
   +19996426347 is not a real number anywhere, because 999 was never assigned
   as a US area code. Twilio dutifully routed it into the junk network.

   So: nothing gets dialed unless it is provably dialable. North American
   numbers are checked against the actual NANP rules. Anything else has to
   carry its own country code. No guessing, ever. */
function nanpWhy(d){
  if(d.length!==10) return "wrong length for a US number";
  var area=d.slice(0,3), exch=d.slice(3,6);
  if(area[0]==="0"||area[0]==="1") return "no US area code starts with "+area[0];
  if(exch[0]==="0"||exch[0]==="1") return "no US exchange starts with "+exch[0];
  if(area[1]==="1"&&area[2]==="1") return area+" is a service code, not an area code";
  if(area==="999") return "999 was never assigned as a US area code";
  if(area==="555") return "555 is a fictional area code";
  if(exch==="555"&&d.slice(6,8)==="01") return "555-01xx is a fictional number";
  return null;                                        /* null means it is fine */
}
function nanpOk(d){ return nanpWhy(d)===null; }

/* Returns the number to dial, or why it cannot be dialed. Never a guess. */
function dialable(raw){
  var t=String(raw||"").trim();
  if(!t) return {ok:false, why:"no number"};
  if(/@/.test(t)) return {ok:false, why:"that is an email, not a number"};
  var plus=/^\s*\+/.test(t);
  var d=t.replace(/[^0-9]/g,"");
  if(!d) return {ok:false, why:"no digits in it"};

  /* an explicit country code is taken at its word */
  if(plus){
    if(d.length<8||d.length>15) return {ok:false, why:"that is not a valid length"};
    return {ok:true, e164:"+"+d, note:d.length===11&&d[0]==="1"?"US":"international"};
  }
  if(d.length===11 && d[0]==="1" && nanpOk(d.slice(1))) return {ok:true, e164:"+"+d, note:"US"};
  if(d.length===10 && nanpOk(d))                        return {ok:true, e164:"+1"+d, note:"US"};

/* escape a value for SQL. null and undefined become NULL, numbers stay bare. */
function qv(v){
  if(v===null||v===undefined||v==="") return "null";
  if(typeof v==="number") return isFinite(v)?String(v):"null";
  if(typeof v==="boolean") return v?"true":"false";
  return "'"+String(v).replace(/'/g,"''")+"'";

function sbBadge(){

/* Supabase runs pg-safeupdate, which refuses a DELETE or UPDATE with no WHERE
   clause. That has now bitten twice — first the gym logs, then the students —
   and both times it failed silently for days. So it is checked here, before
   anything leaves the browser, and a mistake is loud instead of quiet. */
function unsafeSql(q){
  var t=String(q||"").replace(/\s+/g," ");
  var bad=[];
  t.split(";").forEach(function(part){
    var p2=part.trim(); if(!p2) return;
    if(/^delete\s+from\s+[a-z_.]+\s*$/i.test(p2)) bad.push(p2);
    else if(/^delete\s+from\s/i.test(p2) && !/\swhere\s/i.test(p2)) bad.push(p2);
    else if(/^update\s/i.test(p2) && !/\swhere\s/i.test(p2)) bad.push(p2);
  });
  return bad.length ? bad[0].slice(0,90) : null;
}

/* Run SQL. Resolves with rows, or rejects. Never throws into the UI. */
function sbSql(query){
  var unsafe=unsafeSql(query);
  if(unsafe){
    /* refuse to send it — a bare DELETE would wipe a table if the guard were
       ever switched off, and a bare UPDATE would touch every row */
    return Promise.reject(new Error(
      "Refused to send SQL with no WHERE clause: "+unsafe+". This is a bug — tell Glen."));
  }
  if(!(window.cowork&&window.cowork.callMcpTool))
    return Promise.reject(new Error("no connector"));
  SYNC.state="saving"; SYNC.queued++; sbBadge();
  return window.cowork.callMcpTool(SB,{project_id:SB_PROJ, query:query})
    .then(function(r){
      SYNC.queued--;
      var txt="";
      try{ txt = r && r.content && r.content[0] ? r.content[0].text : ""; }catch(e){}
      if(r && r.isError) throw new Error(txt||"query failed");
      /* the connector wraps rows in an untrusted-data fence; pull the JSON out */
      var m = String(txt).match(/\[[\s\S]*\]/);
      var rows=[];
      if(m){ try{ rows=JSON.parse(m[0]); }catch(e){ rows=[]; } }
      if(SYNC.queued<=0){ SYNC.queued=0; SYNC.state="ok"; SYNC.lastAt=new Date(); }
      sbBadge();
      return rows;
    })
    .catch(function(e){
      SYNC.queued=Math.max(0,SYNC.queued-1);
      SYNC.state="error"; SYNC.lastError=(e&&e.message)||String(e); sbBadge();
      throw e;
    });
}
