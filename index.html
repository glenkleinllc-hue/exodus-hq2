  var cur=all[i], st=cur.s;

  var h='<div class="scwrap" id="scwrap"><div class="scsheet" role="dialog" aria-label="Call script">'
   +'<div class="sc-h">'
     +'<span class="sc-part">'+esc(cur.part)+'</span>'
     +(st.n?'<span class="sc-num">Step '+st.n+'</span>':'')
     +'<b class="sc-t">'+st.t+'</b>'
     +'<a class="sc-doc" href="'+SCRIPT_URL+'" target="_blank" rel="noopener">Full doc</a>'
     +'<button class="sc-x" id="sc-x" title="Close">&times;</button>'
   +'</div>'
   +'<div class="sc-b">';

  if(st.q) st.q.forEach(function(line){ h+='<p class="sc-q">'+esc(line)+'</p>'; });
  if(st.story) h+='<div class="sc-story">'+esc(st.story).replace(/\n/g,"<br>")+'</div>';
  if(st.bullets){
    h+='<ul class="sc-ul">';
    st.bullets.forEach(function(b){ h+='<li>'+esc(b)+'</li>'; });
    h+='</ul>';
  }
  if(st.proof) h+='<p class="sc-proof">'+esc(st.proof)+'</p>';
  if(st.warn)  h+='<div class="sc-warn">'+st.warn+'</div>';
  if(st.note)  h+='<div class="sc-note">'+st.note+'</div>';

  h+='</div>'
   +'<div class="sc-f">'
     +'<button class="sc-nav" id="sc-prev"'+(i===0?" disabled":"")+'>&larr; Back</button>'
     +'<div class="sc-dots">';
  all.forEach(function(x,j){
    h+='<button class="sc-dot'+(j===i?" on":"")+'" data-scgo="'+j+'" '
      +'title="'+esc((x.s.n?"Step "+x.s.n+" — ":"")+x.s.t)+'"></button>';
  });
  h+='</div>'
     +'<span class="sc-of">'+(i+1)+' of '+all.length+'</span>'
     +'<button class="sc-nav go" id="sc-next"'+(i===all.length-1?" disabled":"")+'>Next &rarr;</button>'
   +'</div></div></div>';
  return h;
}


/* ============================ THE SKY, WHERE HE IS ============================
   A small panel next to the Jarvis bar. Everything in it is fetched — the place
   name is reverse-geocoded from his device, the temperature and the next 24
   hours come from the forecast. If there is no fix it says New York and says
   that it is the default, rather than quietly claiming to know. */
/* Every kind of weather has a drawing, so nothing ever falls through to a
   blank square: sun, part sun, cloud, overcast, fog, drizzle, rain, heavy rain,
   snow, sleet and thunder. All inline SVG — no icon font, nothing to load, and
   it works with no network. */
function wxIcon(sky, big){
  var s=String(sky||"").toLowerCase();
  var w=big?34:24;
  function sun(cx,cy,r){
    cx=cx||16; cy=cy||16; r=r||7;
    var rays='';
    for(var i=0;i<8;i++){
      var a=i*45*Math.PI/180;
      var x1=cx+Math.cos(a)*(r+3.2), y1=cy+Math.sin(a)*(r+3.2);
      var x2=cx+Math.cos(a)*(r+6.2), y2=cy+Math.sin(a)*(r+6.2);
      rays+='<path d="M'+x1.toFixed(1)+' '+y1.toFixed(1)+'L'+x2.toFixed(1)+' '+y2.toFixed(1)+'"/>';
    }
    return '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="#f6c65b"/>'
      +'<g stroke="#f6c65b" stroke-width="2.1" stroke-linecap="round">'+rays+'</g>';
  }
  function moon(){ return '<path d="M20 6a10 10 0 1 0 6 18A11 11 0 0 1 20 6z" fill="#dfe6f0"/>'; }
  function cloud(c,dy){
    dy=dy||0;
    return '<path transform="translate(0,'+dy+')" d="M9 23a5.5 5.5 0 0 1 .6-11 8 8 0 0 1 15.2 2.3A4.8 4.8 0 0 1 24 23z" fill="'
      +(c||"#9aa8ba")+'"/>';
  }
  function drops(c,heavy){
    var sw=heavy?2.8:2.1;
    return '<g stroke="'+(c||"#5b9bd5")+'" stroke-width="'+sw+'" stroke-linecap="round">'
      +'<path d="M11 25.5l-1.6 3.4M17 25.5l-1.6 3.4M23 25.5l-1.6 3.4"/></g>';
  }
  function flakes(){
    return '<g stroke="#d6e7f7" stroke-width="1.7" stroke-linecap="round">'
      +'<path d="M11 27h3M12.5 25.5v3M18 27h3M19.5 25.5v3M25 27h3M26.5 25.5v3"/></g>';
  }
  function bolt(){ return '<path d="M17.5 23l-4.5 6.5h4l-2.2 5.5 7.2-8h-4.2l2.2-4z" fill="#f6c65b"/>'; }
  function fog(){
    return '<g stroke="#98a4b4" stroke-width="2.2" stroke-linecap="round">'
      +'<path d="M6 25h20M9 29h16"/></g>';
  }
  var g;
  if(/severe thunder|thunderstorms with hail/.test(s)) g=cloud("#6b7684")+bolt()+drops("#9dc4e8",true);
  else if(/thunder/.test(s))              g=cloud("#7c8797")+bolt();
  else if(/heavy snow|snow shower/.test(s)) g=cloud("#a9b6c6")+flakes()+flakes();
  else if(/snow|sleet|grain/.test(s))     g=cloud("#a9b6c6")+flakes();
  else if(/freezing/.test(s))             g=cloud("#93a2b3")+flakes();
  else if(/heavy rain|violent|heavy shower/.test(s)) g=cloud("#7f8b9a")+drops("#5b9bd5",true);
  else if(/rain|shower/.test(s))          g=cloud()+drops();
  else if(/drizzle/.test(s))              g=cloud("#a4b0c0")+drops("#7fb3de");
  else if(/fog/.test(s))                  g=cloud("#8d99a8")+fog();
  else if(/overcast/.test(s))             g=cloud("#828d9c")+cloud("#9aa8ba",-3);
  else if(/partly/.test(s))               g=sun(12,12,5.5)+cloud();
  else if(/mostly cloudy/.test(s))        g=cloud("#8d99a8");
  else if(/mostly clear/.test(s))         g=sun(13,13,6)+cloud("#a8b4c4");
  else                                    g=sun();
  return '<svg viewBox="0 0 32 32" width="'+w+'" height="'+w+'" aria-hidden="true">'+g+'</svg>';
}

/* Tapping the panel opens the detail. Kept as its own overlay rather than a
   dashboard section, because it is a thing he looks at and closes, not a thing
   he scrolls past. Closes on its X or Escape, like everything else. */
var WX_OPEN=false;
function wxOpen(v){
  WX_OPEN=(v===undefined)?!WX_OPEN:!!v;
  document.body.classList.toggle("wxing", WX_OPEN);
  drawDash();
}
function wxHour(t){
  try{
    var d=new Date(t);
    var h=d.getHours();
    return (h===0?"12am":h<12?h+"am":h===12?"12pm":(h-12)+"pm");
  }catch(e){ return ""; }
}
function wxDay(iso){
  try{
    var d=new Date(iso+"T12:00:00");
    var today=new Date(); today.setHours(12,0,0,0);
    var diff=Math.round((d-today)/86400000);
    if(diff===0) return "Today";
    if(diff===1) return "Tomorrow";
    return DAYFULL[d.getDay()];
  }catch(e){ return iso; }
}
/* UV is the one number here that people misread. Say what it means. */
function uvWord(u){
  if(!isFinite(u)) return "";
  return u<=2?"low" : u<=5?"moderate" : u<=7?"high" : u<=10?"very high" : "extreme";
}

function wxSheet(){
  if(!WX_OPEN) return "";
  var w=(briefFresh()&&BRIEF&&BRIEF.weather)?BRIEF.weather.here:null;
  if(!w || w.error)
    return '<div class="wxwrap" id="wxwrap"><div class="wxsheet">'
      +'<div class="wx-h"><b>Weather</b>'
      +'<button class="wx-x" id="wx-x">&times;</button></div>'
      +'<div class="wx-b"><div class="nw-none">'
      +esc((w&&w.error)||"No forecast loaded. Tap Refresh on the headlines card.")
      +'</div></div></div></div>';

  var a=w.next24||{};
  var h='<div class="wxwrap" id="wxwrap"><div class="wxsheet" role="dialog" aria-label="Weather">'
   +'<div class="wx-h">'
     +'<span class="wx-hic">'+wxIcon(w.sky,true)+'</span>'
     +'<b>'+esc(w.place||"Where you are")+'</b>'
     +'<span class="wx-hs">'+(w.localTime?esc(w.localTime)+' &middot; ':'')
       +esc(w.sky)+'</span>'
     +'<button class="wx-x" id="wx-x" title="Close">&times;</button>'
   +'</div><div class="wx-b">';

  /* right now */
  h+='<div class="wx-big"><b>'+w.now+'&deg;</b>'
    +'<span>feels like '+w.feels+'&deg;</span></div>';

  h+='<div class="wx-facts">'
    +'<div><b>'+(isFinite(a.high)?a.high:w.high)+'&deg;</b><i>high, next 24h</i></div>'
    +'<div><b>'+(isFinite(a.low)?a.low:w.low)+'&deg;</b><i>low, next 24h</i></div>'
    +'<div><b>'+(isFinite(a.rainChance)?a.rainChance:(w.rainChance||0))+'%</b><i>rain</i></div>'
    +'<div><b>'+(isFinite(w.wind)?w.wind:"—")+'</b><i>mph wind</i></div>'
    +(isFinite(w.humidity)?'<div><b>'+w.humidity+'%</b><i>humidity</i></div>':'')
    +(isFinite(w.uv)?'<div><b>'+w.uv+'</b><i>UV '+uvWord(w.uv)+'</i></div>':'')
    +'</div>';

  if(a.worst && a.worst!==w.sky)
    h+='<div class="wx-warn">'+wxIcon(a.worst)+'<span><b>'+esc(a.worst)+'</b> in the next 24 hours</span></div>';

  if(w.sunrise||w.sunset){
    h+='<div class="wx-sun">'
      +(w.sunrise?'<span>&#9788; Sunrise <b>'+wxHour(w.sunrise)+'</b></span>':'')
      +(w.sunset?'<span>&#9790; Sunset <b>'+wxHour(w.sunset)+'</b></span>':'')
      +'</div>';
  }

  /* the next twelve hours */
  if(w.hours && w.hours.length){
    h+='<div class="wx-sec">Next 12 hours</div><div class="wx-hrs">';
    w.hours.forEach(function(x){
      h+='<div class="wx-hr">'
        +'<i>'+wxHour(x.t)+'</i>'
        +wxIcon(x.sky)
        +'<b>'+x.temp+'&deg;</b>'
        +'<em'+(x.rain>=30?' class="wet"':'')+'>'+(isFinite(x.rain)?x.rain+'%':'—')+'</em>'
        +'</div>';
    });
    h+='</div>';
  }

  /* the week */
  if(w.days && w.days.length){
    var top=0;
    w.days.forEach(function(d){ top=Math.max(top, d.high); });
    var bot=999;
    w.days.forEach(function(d){ bot=Math.min(bot, d.low); });
    var span=Math.max(1, top-bot);
    h+='<div class="wx-sec">The week</div><div class="wx-week">';
    w.days.forEach(function(d){
      /* the bar shows where this day's range sits inside the week's range, so
         a warm day and a cold one are visibly different at a glance */
      var left=Math.round((d.low-bot)/span*100);
      var wide=Math.max(8, Math.round((d.high-d.low)/span*100));
      h+='<div class="wx-d">'
        +'<span class="wx-dn">'+esc(wxDay(d.d))+'</span>'
        +wxIcon(d.sky)
        +'<span class="wx-lo">'+d.low+'&deg;</span>'
        +'<span class="wx-bar"><i style="left:'+left+'%;width:'+wide+'%"></i></span>'
        +'<span class="wx-hi">'+d.high+'&deg;</span>'
        +'<span class="wx-dr'+(d.rain>=30?" wet":"")+'">'
          +(isFinite(d.rain)?d.rain+'%':'')+'</span>'
        +'</div>';
    });
    h+='</div>';
  }

  h+='<div class="wx-src">Open-Meteo &middot; updated '
    +(briefFresh()?Math.max(0,Math.floor((Date.now()-BRIEF_AT)/60000))+' min ago':'—')
    +'</div>';
  return h+'</div></div></div>';
}

/* Today, tomorrow, then the next three days — small icons in a row, the way a
   phone does it. "Light drizzle coming" told him almost nothing; a strip of
   days tells him whether the week is worth filming outdoors at a glance. */
function wxStrip(w){
  var days=(w && w.days) || [];
  if(!days.length) return "";
  var out='<div class="wxstrip">';
  days.slice(0,5).forEach(function(d,i){
    var lab = i===0 ? "Today" : i===1 ? "Tmrw" : shortDayName(d.d);
    out+='<div class="wxs'+(i===0?" now":"")+'">'
      +'<i>'+esc(lab)+'</i>'
      +wxIcon(d.sky)
      +'<b>'+d.high+'&deg;</b>'
      +'<em>'+d.low+'&deg;</em>'
      +(d.rain>=30?'<u>'+d.rain+'%</u>':'')
      +'</div>';
  });
  return out+'</div>';
}
function shortDayName(iso){
  try{
    var d=new Date(iso+"T12:00:00");
    return DAYS[d.getDay()];
  }catch(e){ return ""; }
}

function wxPaint(){
  var host=document.getElementById("wxp");
  if(!host) return;
  var w=(briefFresh()&&BRIEF&&BRIEF.weather)?BRIEF.weather.here:null;
  if(!w || w.error){
    host.className="wxp empty";
    host.innerHTML='<button class="wx-get" id="wx-get">'
      +(w&&w.error?"Weather unavailable — retry":"Show my weather")+'</button>';
    var g=document.getElementById("wx-get");
    if(g) g.onclick=function(){ newsRefresh(); };
    return;
  }
  var a=w.next24||{};
  host.className="wxp open";
  host.title="Tap for the full forecast";
  host.onclick=function(){ wxOpen(true); };
  host.innerHTML=
     '<div class="wx-top">'
      +'<span class="wx-ic">'+wxIcon(w.sky,true)+'</span>'
      +'<span class="wx-now"><b>'+w.now+'&deg;</b><i>'+esc(w.sky)+'</i></span>'
      +'<span class="wx-place">'+esc(w.place||"Where you are")
        +(w.localTime?'<em>'+esc(w.localTime)+'</em>':'')+'</span>'
      +'<span class="wx-24">'
        +'<span><b>'+(isFinite(a.rainChance)?a.rainChance:(w.rainChance||0))+'%</b>'
          +'<i>rain</i></span>'
        +'<span><b>'+w.feels+'&deg;</b><i>feels</i></span>'
      +'</span>'
     +'</div>'
    +wxStrip(w);
}

/* The banner said NEW YORK CITY whatever the truth was. It follows him now. */
function bannerPlace(){
  var w=(briefFresh()&&BRIEF&&BRIEF.weather)?BRIEF.weather.here:null;
  if(w && w.place && !w.error) return w.place;
  var g=geoSaved();
  return g && g.place ? g.place : "New York City";
}

/* ============================ THE JARVIS BAR ============================
   One tap: the mic opens, the bars run, she hears you. Tap again and she
   answers out loud. It is the same recogniser and the same ask() the dock
   uses — this is a shortcut to it, not a second brain. */
function jvPaint(){
  var live=(typeof RECON!=="undefined" && RECON && MICWHO==="claudia");
  var think=!!(STATE && STATE.busy);
  var talking=false;
  try{ talking = !!(window.speechSynthesis && window.speechSynthesis.speaking); }catch(e){}
  try{ if(!talking && VOICE_AUDIO && !VOICE_AUDIO.paused) talking=true; }catch(e){}

  /* the small button in the Today header */
  var b=document.getElementById("jarvis");
  if(b){
    b.classList.toggle("live", !!live);
    b.classList.toggle("busy", !live && (think||talking));
  }

  /* The overlay. On screen only while something is genuinely happening — a
     waveform that is idle 99% of the time is furniture, which is exactly what
     the full-width bar had become. */
  var pop=document.getElementById("jvpop");
  if(pop){
    var on = live || think || talking;
    pop.hidden = !on;
    pop.classList.toggle("live", !!live);
    pop.classList.toggle("think", !live && think && !talking);
    pop.classList.toggle("talk", !!talking && !live);
    var lab=document.getElementById("jv-lab"), sub=document.getElementById("jv-sub");
    if(lab) lab.textContent = live ? "Listening…" : talking ? "Claudia" : "Thinking…";
    if(sub) sub.textContent = live ? "tap the button again when you are done"
          : talking ? "tap stop to cut her off" : "one moment";

    /* What she heard, and what she said. The whole exchange in this one panel,
       so there is never a second window open behind it. */
    var log=document.getElementById("jv-say");
    if(log){
      var rows=(STATE&&STATE.chat)||[];
      var mine="", hers="";
      for(var i=rows.length-1;i>=0 && (!mine||!hers);i--){
        var r=rows[i];
        var body=(typeof r.t==="string") ? r.t
               : Array.isArray(r.t) ? r.t.join(" \u00b7 ") : "";
        if(!body) continue;
        if(!hers && r.r==="ai") hers=body;
        else if(!mine && r.r==="me") mine=body;
      }
      var h2="";
      if(mine) h2+='<span class="jv-me">'+esc(mine)+'</span>';
      if(hers && !live) h2+='<span class="jv-her">'+esc(hers)+'</span>';
      log.innerHTML=h2;
      log.style.display=h2?"":"none";
    }
  }
}
function jvTap(){
  DOCK="assistant";
  if(VIEW==="home") drawDash();
  /* startMic handles start, stop and the permission failure message, and
     tapping again while it is live is how you stop it — so this one handler
     is both halves of the interaction. */
  setTimeout(function(){
    try{ startMic("claudia"); }catch(e){}
    jvPaint();
  },60);
}
/* The button is re-rendered with the dashboard, so this rebinds on every draw
   rather than once at boot. */
function wireJarvis(){
  (function go(){
    var b=document.getElementById("jarvis");
    if(!b) return;
    b.onclick=function(){ jvTap(); };
    /* The bars are drawn here rather than in the markup so the count is one
       number to change, not seven copies of a span. */
    var w=document.getElementById("jv-wave");
    if(w && !w.childElementCount){
      var bars="";
      for(var i=0;i<9;i++)
        bars+='<i style="animation-delay:'+(i*0.09).toFixed(2)+'s"></i>';
      w.innerHTML=bars;
    }
    var bf=document.getElementById("jv-brief");
    if(bf) bf.onclick=function(){ briefNow(); };
    var st=document.getElementById("jv-stop");
    if(st) st.onclick=function(){ briefStop(); };
    jvPaint();
  })();
}
/* one timer, not one per render */
setInterval(function(){ try{ jvPaint(); }catch(e){} }, 700);

/* ============================ WHERE HE IS ============================
   He asked her to always know his location. The browser will give it once he
   allows it, and it is remembered so he is asked once rather than every
   morning. Without permission this falls back to New York, which is where he
   is anyway, and the brief says which of the two it used. */
function geoSaved(){
  try{ var o=JSON.parse(LS("geo")||"null"); return (o&&isFinite(o.lat))?o:null; }
  catch(e){ return null; }
}
function geoSave(o){ try{ LS("geo", JSON.stringify(o)); }catch(e){} }
function geoAsk(cb){
  var have=geoSaved();
  /* A fix older than a day is worth refreshing — he travels. */
  if(have && (Date.now()-(have.at||0)) < 86400000){ if(cb) cb(have); return; }
  if(!navigator.geolocation){ if(cb) cb(have); return; }
  var done=false;
  function finish(v){ if(done) return; done=true; if(cb) cb(v); }
  setTimeout(function(){ finish(have); }, 6000);
  try{
    navigator.geolocation.getCurrentPosition(function(p){
      var o={lat:Math.round(p.coords.latitude*10000)/10000,
             lon:Math.round(p.coords.longitude*10000)/10000,
             tz:localTZ(), at:Date.now()};
      geoSave(o); BRIEF=null;          /* a new place means a new forecast */
      finish(o);
    }, function(){ finish(have); }, {timeout:5500, maximumAge:3600000});
  }catch(e){ finish(have); }
}

/* ============================ A TEXT, WAITING ============================
   Claudia writes it. It sits here, with the number and the words in front of
   him, until he presses Send. Nothing about that is a placeholder — /api/sms
   refuses anything that does not carry confirmed:true, and the page only sets
   that from this button. A text to a lead cannot be unsent. */
var SMS_DRAFT=null, SMS_SENDING=false, SMS_MSG="";

function smsDraft(who, tel, body){
  SMS_DRAFT={who:who||"", tel:tel||"", body:body||""};
  SMS_MSG=""; SMS_SENDING=false;
  if(VIEW==="home") drawDash();
}
function smsDiscard(){ SMS_DRAFT=null; SMS_MSG=""; if(VIEW==="home") drawDash(); }

function smsCard(){
  if(!SMS_DRAFT) return "";
  var d=SMS_DRAFT;
  var v=dialable(d.tel);
  var segs=Math.ceil((d.body||"").length/153)||1;
  return '<div class="smsd" id="smsd">'
    +'<div class="smsd-h"><b>Text ready to send</b>'
    +'<span>'+esc(d.who||"")+(d.who?" &middot; ":"")+esc(v.ok?v.e164:d.tel)+'</span>'
    +'<button class="smsd-x" id="sms-x">discard</button></div>'
    +'<textarea id="sms-body" placeholder="What to say">'+esc(d.body||"")+'</textarea>'
    +'<div class="smsd-f">'
    +'<button class="smsd-go" id="sms-go"'+(SMS_SENDING?" disabled":"")+'>'
    +(SMS_SENDING?"Sending…":"Send it")+'</button>'
    +'<span class="smsd-n">'
    +(SMS_MSG ? esc(SMS_MSG)
       : 'Claudia wrote this. <b>Nothing goes out until you press Send.</b> '
         +segs+' segment'+(segs>1?'s':''))
    +'</span></div></div>';
}

function smsSend(){
  if(!SMS_DRAFT || SMS_SENDING) return;
  var box=document.getElementById("sms-body");
  if(box) SMS_DRAFT.body=box.value;
  var body=(SMS_DRAFT.body||"").trim();
  if(!body){ SMS_MSG="Write something first."; drawDash(); return; }
  var v=dialable(SMS_DRAFT.tel);
  if(!v.ok){ SMS_MSG="That number is not textable: "+v.why; drawDash(); return; }
  if(!window.__EXODUS_HOSTED__){
    SMS_MSG="Texting only works on the live site."; drawDash(); return; }
  SMS_SENDING=true; SMS_MSG=""; drawDash();
  fetch("/api/sms",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({to:v.e164, body:body, name:SMS_DRAFT.who, confirmed:true})
  }).then(function(r){ return r.json().catch(function(){ return {}; }); })
    .then(function(j){
      SMS_SENDING=false;
      if(j && j.ok){
        var who=SMS_DRAFT.who||v.e164;
        /* it happened, so it goes in the record like any other contact */
        try{ actAdd(who, "Texted: "+body.slice(0,120)); }catch(e){}
        SMS_DRAFT=null;
        STATE.chat.push({r:"did",t:["Text sent to "+who]});
        paintLog();
      } else {
        SMS_MSG=(j && (j.error||j.why)) || "Twilio refused that.";
      }
      if(VIEW==="home") drawDash();
    })
    .catch(function(){

      if(VIEW==="home") drawDash();

/* ============================ THE COINS ============================
   Its own endpoint and its own one-minute cache, because a price is the only
   thing in the brief that is stale after two minutes. */
var CRYPTO=null;
/* The banner said NEW YORK CITY no matter where he was. It follows the same

function cryptoPaint(){
  var host=document.getElementById("tb-cx");
  if(!host) return;

  /* ₿ (U+20BF, the actual Bitcoin sign) and Ξ (capital Xi, which is what
     Ethereum uses). Both are plain Unicode — no icon font, nothing to load. */
  function one(k, nm, sym){
    var c=CRYPTO[k];
    if(!c || !isFinite(c.usd)) return "";
    var ch=c.change24h;

    var sign = (ch>=0?"+":"");
    return '<div class="cxp"><b><em class="cxs">'+sym+'</em>'
      +Math.round(c.usd).toLocaleString()+'</b>'
      +'<span>'+nm+(cls?' <i class="'+cls+'">'+sign+(ch||0).toFixed(1)+'%</i>':'')
      +'</span></div>';

function cryptoPull(){

})();

/* Spotify sends him back to this page with ?code=. Handle it before anything
   else draws, then pick the session back up on every later load. */
(function wireSpotify(){

  }, 800);

/* ========================= SPOTIFY, PROPERLY =========================
   The Web Playback SDK, not the embed. The embed was the mistake: it plays
   30-second previews unless the viewer is already logged into Spotify in that
   browser, and it hands the surrounding page no controls at all. Polishing it
   was polishing the wrong object.

   This makes the tab itself a Spotify device. Full tracks, real transport
   controls, the artwork, the position. Needs Premium — which is why I asked.

   AUTH: PKCE. There is no client secret in this flow by design, so there is
   nothing here that could leak. The Client ID is public — every web app using
   this flow ships it in its source — but Glen types it into the app rather
   than me committing it, so it stays out of his public repo regardless.

   The access token lives in memory and localStorage and expires in an hour;
   the refresh token renews it silently. Neither ever leaves his browser. */

var SPOT_SCOPES=[
  "streaming",                     /* the SDK itself */
  "user-read-email","user-read-private",
  "user-read-playback-state","user-modify-playback-state",
  "user-read-currently-playing",
  "playlist-read-private","playlist-read-collaborative"
].join(" ");

var SPOT=null;            /* the SDK Player */
var SPOT_DEV=null;        /* our device id */
var SPOT_ST=null;         /* last playback state */
var SPOT_MSG="";
var SPOT_OPEN=false;
var SPOT_READY=false;

function spotId(){ return (LS("spot_client")||"").trim(); }
function spotIdSet(v){ LS("spot_client", String(v||"").trim()); }
function spotTok(){ return LS("spot_tok")||""; }
function spotTokExp(){ return parseInt(LS("spot_exp")||"0",10)||0; }
function spotRefresh(){ return LS("spot_ref")||""; }
function spotLive(){ return !!spotTok() && Date.now() < spotTokExp()-30000; }
function spotRedirect(){
  /* Must match the redirect URI registered on the Spotify app exactly. The
     origin with a trailing slash is the least surprising thing to register.

     Guarded, because spotCard() renders inside dashView() and dashView() is
     exercised outside a browser by the test harnesses — a card that throws
     takes the whole dashboard down with it. */
  try{ return location.origin + "/"; }
  catch(e){ return "https://exodus-hq2.vercel.app/"; }
}

/* ---- PKCE ---- */
function spotRand(n){
  var a=new Uint8Array(n); crypto.getRandomValues(a);
  return Array.from(a).map(function(x){
    return "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~"[x%66];
  }).join("");
}
function spotB64url(buf){
  var b=String.fromCharCode.apply(null, new Uint8Array(buf));
  return btoa(b).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function spotChallenge(verifier){
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier))
    .then(spotB64url);
}

function spotConnect(){
  var id=spotId();
  if(!id){ SPOT_MSG="Paste your Client ID first."; drawDash(); return; }
  var verifier=spotRand(64);
  LS("spot_verifier", verifier);
  spotChallenge(verifier).then(function(challenge){
    var u="https://accounts.spotify.com/authorize"
      +"?client_id="+encodeURIComponent(id)
      +"&response_type=code"
      +"&redirect_uri="+encodeURIComponent(spotRedirect())
      +"&code_challenge_method=S256"
      +"&code_challenge="+encodeURIComponent(challenge)
      +"&scope="+encodeURIComponent(SPOT_SCOPES);
    location.href=u;
  }).catch(function(e){
    SPOT_MSG="Could not start sign-in: "+(e&&e.message||e); drawDash();
  });
}

/* Spotify sends him back here with ?code=. Swallow it, swap it for tokens, and
   clean the URL so a refresh does not try to reuse a spent code. */
function spotCatchReturn(){
  var q=new URLSearchParams(location.search);
  var code=q.get("code"), err=q.get("error");
  if(err){
    SPOT_MSG="Spotify said: "+err;
    history.replaceState({},"",location.pathname);
    return;
  }
  if(!code) return;
  var verifier=LS("spot_verifier")||"";
  history.replaceState({},"",location.pathname);
  if(!verifier){ SPOT_MSG="Sign-in expired. Try Connect again."; return; }
  spotToken({grant_type:"authorization_code", code:code,
             redirect_uri:spotRedirect(), code_verifier:verifier});
}

function spotToken(body){
  var id=spotId();
  if(!id) return Promise.reject(new Error("No Client ID"));
  body.client_id=id;
  return fetch("https://accounts.spotify.com/api/token",{
    method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams(body)
  }).then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.access_token) throw new Error(j.error_description||j.error||"No token");
      LS("spot_tok", j.access_token);
      LS("spot_exp", String(Date.now() + (j.expires_in||3600)*1000));
      if(j.refresh_token) LS("spot_ref", j.refresh_token);
      SPOT_MSG="";
      spotStart();
      return j.access_token;
    })
    .catch(function(e){
      SPOT_MSG=String(e.message||e);
      if(VIEW==="home") drawDash();
      throw e;
    });
}

/* The SDK asks for a token whenever it needs one, including after an hour when
   the old one dies. That callback is the only place refresh has to happen. */
function spotFreshToken(cb){
  if(spotLive()){ cb(spotTok()); return; }
  var ref=spotRefresh();
  if(!ref){ SPOT_MSG="Signed out. Connect again."; if(VIEW==="home") drawDash(); return; }
  spotToken({grant_type:"refresh_token", refresh_token:ref})
    .then(cb).catch(function(){});
}

function spotDisconnect(){
  try{ if(SPOT) SPOT.disconnect(); }catch(e){}
  SPOT=null; SPOT_DEV=null; SPOT_ST=null; SPOT_READY=false;
  ["spot_tok","spot_exp","spot_ref","spot_verifier"].forEach(function(k){
    try{ LS(k,""); }catch(e){}
  });
  if(VIEW==="home") drawDash();
}

/* ---- the player ---- */
function spotLoadSDK(){
  return new Promise(function(res, rej){
    if(window.Spotify && window.Spotify.Player) return res();
    if(document.getElementById("spot-sdk")){
      window.onSpotifyWebPlaybackSDKReady=res; return;
    }
    window.onSpotifyWebPlaybackSDKReady=res;
    var t=document.createElement("script");
    t.id="spot-sdk"; t.src="https://sdk.scdn.co/spotify-player.js"; t.async=true;
    t.onerror=function(){ rej(new Error("Could not load Spotify's player.")); };
    document.head.appendChild(t);
    setTimeout(function(){ if(!window.Spotify) rej(new Error("Spotify's player did not load.")); },12000);
  });
}

function spotStart(){
  if(SPOT || !spotTok()) return;
  spotLoadSDK().then(function(){
    SPOT=new window.Spotify.Player({
      name:"Exodus HQ",
      getOAuthToken:function(cb){ spotFreshToken(cb); },
      volume:0.6
    });
    SPOT.addListener("ready", function(d){
      SPOT_DEV=d.device_id; SPOT_READY=true; SPOT_MSG="";
      if(VIEW==="home") drawDash();
    });
    SPOT.addListener("not_ready", function(){ SPOT_READY=false; });
    SPOT.addListener("player_state_changed", function(st){
      SPOT_ST=st;
      if(VIEW==="home" && !dashBusy()) spotPaint();
    });
    /* The two failures he will actually hit, named rather than swallowed. */
    SPOT.addListener("authentication_error", function(e){
      SPOT_MSG="Spotify rejected the sign-in: "+(e&&e.message||"");
      if(VIEW==="home") drawDash();
    });
    SPOT.addListener("account_error", function(){
      SPOT_MSG="This needs a Spotify Premium account.";
      if(VIEW==="home") drawDash();
    });
    SPOT.addListener("initialization_error", function(e){
      SPOT_MSG=(e&&e.message)||"The player could not start in this browser.";
      if(VIEW==="home") drawDash();
    });
    SPOT.connect();
  }).catch(function(e){
    SPOT_MSG=String(e.message||e);
    if(VIEW==="home") drawDash();
  });
}

/* ---- the Web API, for the things the SDK cannot do itself ---- */
function spotApi(path, method, body){
  return new Promise(function(res, rej){
    spotFreshToken(function(tok){
      fetch("https://api.spotify.com/v1"+path,{
        method:method||"GET",
        headers:{Authorization:"Bearer "+tok,
                 "Content-Type":"application/json"},
        body:body?JSON.stringify(body):undefined
      }).then(function(r){
        if(r.status===204) return res(null);
        return r.json().then(function(j){
          if(!r.ok) return rej(new Error((j.error&&j.error.message)||("HTTP "+r.status)));
          res(j);
        }).catch(function(){ r.ok?res(null):rej(new Error("HTTP "+r.status)); });
      }).catch(rej);
    });
  });
}

/* Move playback onto this tab and start the playlist. */
/* His last choice, or the one he originally gave me. That original is one of
   Spotify's algorithmic playlists, which the API will not start — so the picker
   exists and this is only a starting point. */
var SPOT_PLAYLIST=(LS("spot_list")||"37i9dQZF1CKP6BedYNZqyO");
/* THE MISSING PIECE.

   The SDK will not emit audio until activateElement() has run inside a genuine
   user gesture. Connecting is not enough — the browser needs a tap it can
   attribute the sound to. Every control calls this first, and it is a no-op
   after the first time.

   This is why it connected and then sat there silent. */
var SPOT_ACTIVE=false;
function spotActivate(){
  if(SPOT_ACTIVE || !SPOT) return Promise.resolve();
  SPOT_ACTIVE=true;
  try{
    var r=SPOT.activateElement && SPOT.activateElement();
    return (r && r.then) ? r.catch(function(){}) : Promise.resolve();
  }catch(e){ return Promise.resolve(); }
}

function spotPlayHere(uri){
  if(!SPOT_DEV){ SPOT_MSG="The player is still starting — give it a second."; drawDash(); return; }
  var ctx = uri || (SPOT_PLAYLIST ? "spotify:playlist:"+SPOT_PLAYLIST : "");
  SPOT_MSG="";
  spotActivate().then(function(){
    return spotApi("/me/player","PUT",{device_ids:[SPOT_DEV], play:false});
  }).then(function(){
    var body = ctx ? {context_uri:ctx} : undefined;
    return spotApi("/me/player/play?device_id="+encodeURIComponent(SPOT_DEV),"PUT",body);
  }).catch(function(e){
    /* Spotify's own words, not a shrug. The one he will hit most is a
       Spotify-owned algorithmic playlist, which cannot be started this way —
       so say that, and point him at his own. */
    var m=String(e.message||e);
    if(/not found|restricted|invalid/i.test(m))
      m="Spotify would not start that playlist. Their own algorithmic playlists "
       +"cannot be played through the API — pick one of yours below.";
    SPOT_MSG=m;

/* His own playlists, so he is not stuck on one hard-coded id. */

/* ======================== THE SPORTS TICKER ========================
   ESPN's scoreboard, with the real team logos, in his order: NFL, NBA, MLB,
   NHL, then everything else. Live games first — a game in progress is the only
   score that is actually news.

   The logos come from ESPN's own CDN and need no key. A team without one falls
   back to its abbreviation on its own colour, so a row is never a gap. */
/* The badge is the base layer and is ALWAYS drawn. The crest fades in on top of
   it once the bytes arrive.

   This is the whole reason the ticker read as broken: every cell was a remote
   PNG, and until it loaded the cell was blank. Blank cells look like a bug, and
   he was right to call it one. Now the worst case is three letters on the
   team's own colour — which is a scoreboard. */
/* Text only. No remote images anywhere in this ticker.

   Three passes were spent trying to make ESPN's crests behave, and his own
   screenshot showed how that ended: crests floating away from their scores,
   solid coloured squares where a badge should be, cards stretched apart. Every
   one of those comes from laying out around 500px PNGs I do not control, which
   arrive at different times over a connection I cannot see.

   A three-letter badge on the team's own colour renders identically every time,
   cannot half-load, and reads perfectly at this size. Always right beats
   sometimes prettier. */
function spLogo(t){
  var ab=String(t.team||"?").slice(0,3).toUpperCase();
  var c=t.color||"";
  /* ESPN gives some teams a colour so dark the letters vanish into it. */
  var dark = c && parseInt(c.replace("#",""),16) < 0x333333;
  var st = c ? ' style="background:'+esc(c)+(dark?';color:#dfe6f0':'')+'"' : '';
  return '<span class="sp-lg"'+st+'>'+esc(ab)+'</span>';
}
/* A game only renders if it is actually a game: two sides, both with a real
   abbreviation. ESPN's MMA scoreboard returns fighters with none of that, and
   they were being drawn as half-empty cells. */
function spOk(g){
  var t=g.teams||[];
  if(t.length!==2) return false;
  for(var i=0;i<2;i++){
    var a=String(t[i].team||"").trim();
    if(!a || a==="?" || a.length>5) return false;
  }
  return true;
}

function spGame(g){
  if(!spOk(g)) return "";
  var t=g.teams||[];
  var cls = g.live ? "sp-g live" : g.done ? "sp-g done" : "sp-g";
  var state = g.live ? '<span class="sp-live">LIVE</span>'
            : g.done ? '<span class="sp-st">FINAL</span>'
            : '<span class="sp-st">'+esc(spWhen(g.detail))+'</span>';

  /* One row per side, stacked. Two short rows read faster than one long one,
     and it is how every scoreboard on television does it. */
  function side(x){
    var sc = (x.score===null||x.score===undefined||x.score==="") ? "" : x.score;
    /* NOT "win" — that is the floating-window class in the building view, and
       it drags anything wearing it out of the flow as a 300px absolute box.
       Scoped names only inside this ticker. */
    return '<span class="sp-r'+(x.winner?" sp-win":"")+'">'
      +spLogo(x)
      +'<b>'+esc(x.team)+'</b>'
      +'<i>'+esc((g.live||g.done)?sc:"")+'</i></span>';
  }

  var inner='<span class="sp-hd"><em>'+esc(g.league)+'</em>'+state+'</span>'
    +side(t[0])+side(t[1]);
  return g.link
    ? '<a class="'+cls+'" href="'+esc(g.link)+'" target="_blank" rel="noopener noreferrer">'
      +inner+'</a>'
    : '<span class="'+cls+'">'+inner+'</span>';
}
/* "8/6 - 8:00 PM EDT" carries a real date. Read it, so a game in September can
   be told apart from one tonight. The year is not in the string, so it is
   assumed to be this one — and a month well behind us means next year. */
function spDate(detail){
  var m=String(detail||"").match(/(\d{1,2})\/(\d{1,2})/);
  if(!m) return null;
  var now=new Date();
  var mo=parseInt(m[1],10)-1, day=parseInt(m[2],10);
  var yr=now.getFullYear();
  if(mo < now.getMonth()-6) yr++;
  var d=new Date(yr, mo, day);
  return isNaN(d.getTime()) ? null : d;
}

/* "8/6 - 8:00 PM EDT" is a database field, not something a person says. */
function spWhen(d){
  var t=String(d||"");
  if(!t) return "";
  if(/scheduled/i.test(t)) return "SOON";
  var m=t.match(/(\d{1,2})\/(\d{1,2})/);
  var hm=t.match(/(\d{1,2}:\d{2}\s*[AP]M)/i);
  if(m && hm) return m[1]+"/"+m[2]+" "+hm[1].toUpperCase().replace(/\s+/,"");
  if(hm) return hm[1].toUpperCase().replace(/\s+/,"");
  return t.slice(0,16).toUpperCase();
}

function spPaint(){
  var host=document.getElementById("sptick");
  if(!host) return;
  var all=(briefFresh()&&BRIEF&&BRIEF.scores) ? BRIEF.scores : [];

  /* Only scores he can actually use. A fixture seven weeks out is not a score,
     and out of season most of what ESPN returns is exactly that. Live and
     finished always; upcoming inside the next week — three days was too tight
     and left August showing nothing but baseball. */
  var soon=Date.now()+7*86400000;
  var games=all.filter(function(g){
    if(!spOk(g)) return false;
    if(g.live || g.done) return true;
    var d=spDate(g.detail);
    return d ? d.getTime() < soon : false;
  });

  /* College football alone returns 99 fixtures, so a flat cap is needed — but a
     flat TWO per league was worse: in August the other leagues are dark and he
     was left looking at one lonely baseball card in a wide panel, which is what
     he saw and called glitched.

     So: round-robin across the leagues, taking one from each in turn until the
     rail is full. Four sports on and he gets a spread; one sport on and it
     fills the rail rather than leaving a gap. Live games jump the queue. */
  var WANT=10;
  var byLg={}, order=[];
  games.forEach(function(g){
    var k=g.league||"?";
    if(!byLg[k]){ byLg[k]=[]; order.push(k); }
    byLg[k].push(g);
  });
  var picked=games.filter(function(g){ return g.live; });
  var seen={};
  picked.forEach(function(g){ seen[g.league+"|"+g.name]=1; });
  for(var round=0; picked.length<WANT && round<12; round++){
    var added=false;
    for(var oi=0; oi<order.length && picked.length<WANT; oi++){
      var g2=byLg[order[oi]][round];
      if(!g2) continue;
      var key=g2.league+"|"+g2.name;
      if(seen[key]) continue;
      seen[key]=1; picked.push(g2); added=true;
    }
    if(!added) break;
  }
  games=picked;
  if(!games.length){ host.className="sptick"; host.innerHTML=""; return; }

  var rows=games.map(spGame).filter(Boolean).join("");
  if(!rows){ host.className="sptick"; host.innerHTML=""; return; }
  host.className="sptick on";
  host.innerHTML='<div class="sp-lbl">SCORES</div><div class="sp-rail">'+rows+'</div>';
}

/* ======================= WHAT SHE KNOWS ABOUT HIM =======================
   Glen asked for all of it: the business, his patterns, and the personal side.
   Facts accumulate here and go into her prompt every time, so she is not
   starting from nothing every morning.

   Kept locally AND pushed to agent_memory, so it survives a new laptop. The
   local copy is what she reads from — a memory that needs a network round trip
   to remember your name is not a memory. */
var MEM_SCOPES=["leads","money","content","habits","personal","general"];

function memLoad(){
  try{ var a=JSON.parse(LS("cl_mem")||"[]"); return Array.isArray(a)?a:[]; }
  catch(e){ return []; }
}
function memSave(a){ try{ LS("cl_mem", JSON.stringify(a.slice(-300))); }catch(e){} }

function memAdd(fact, scope){
  fact=String(fact||"").trim();
  if(!fact || fact.length<4) return false;
  if(fact.length>220) fact=fact.slice(0,217)+"…";
  scope=String(scope||"general").toLowerCase();
  if(MEM_SCOPES.indexOf(scope)<0) scope="general";

  var a=memLoad();
  /* Near-duplicates are the thing that turns a memory into a wall of noise.
     Same scope, same opening — treat it as an update, not a new fact. */
  function norm(v){ return String(v||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").trim(); }
  var key=norm(fact);
  for(var i=0;i<a.length;i++){
    var k2=norm(a[i].f);
    if(a[i].s!==scope) continue;
    /* One containing the other is a restatement — "closes best on Tuesdays" and
       "closes best on Tuesdays and Thursdays" are one fact, updated. Twenty
       characters of shared opening is enough to be sure and short enough to
       catch the real cases. */
    var same = k2===key
      || (key.length>20 && k2.indexOf(key)===0)
      || (k2.length>20 && key.indexOf(k2)===0);
    if(same){
      a[i].f=fact; a[i].at=Date.now(); a[i].n=(a[i].n||1)+1;
      memSave(a);
      try{ SBW.remember("claudia", fact, 3, scope); }catch(e){}
      return true;
    }
  }
  a.push({f:fact, s:scope, at:Date.now(), n:1});
  memSave(a);
  try{ SBW.remember("claudia", fact, 3, scope); }catch(e){}
  return true;
}
function memForget(match){
  var q=String(match||"").toLowerCase();
  if(!q) return 0;
  var a=memLoad(), before=a.length;
  a=a.filter(function(x){ return String(x.f||"").toLowerCase().indexOf(q)<0; });
  memSave(a);
  return before-a.length;
}

/* The block that goes into her prompt. Grouped by scope so she can tell the
   difference between a fact about a lead and a fact about him, and capped so a
   year of notes never crowds out the actual question. */
function memoryBlock(){
  var a=memLoad();
  /* whatever came down from the cloud on load, still honoured */
  var seed=(typeof MEMORY!=="undefined" && MEMORY && MEMORY.claudia) ? MEMORY.claudia : "";
  if(!a.length && !seed) return "";

  var by={};
  a.forEach(function(x){ (by[x.s]=by[x.s]||[]).push(x); });
  var out="# WHAT YOU KNOW ABOUT GLEN\\n";
  if(seed) out+=seed+"\\n";
  MEM_SCOPES.forEach(function(sc){
    var rows=by[sc]; if(!rows||!rows.length) return;
    rows.sort(function(p,q){ return (q.at||0)-(p.at||0); });
    out+="\\n"+sc.toUpperCase()+":\\n";
    rows.slice(0,14).forEach(function(x){ out+="  - "+x.f+"\\n"; });
  });
  return out+"\\n";
}

/* Her side of it: [[MEM {...}]] blocks are pulled out of the reply, stored, and
   never shown to him. He asked for a memory, not a filing cabinet with a UI. */
function memRunActions(text){
  var out=String(text||""), kept=0;
  var re=/\[\[MEM\s*(\{[\s\S]*?\})\s*\]\]/g, m, found=[];
  while((m=re.exec(out))!==null) found.push(m);
  found.forEach(function(hit){
    var o=null;
    try{ o=JSON.parse(hit[1]); }catch(e){ return; }
    if(!o) return;
    if(o.forget){ memForget(o.forget); return; }
    if(memAdd(o.fact, o.scope)) kept++;
  });
  out=out.replace(/\[\[MEM\s*\{[\s\S]*?\}\s*\]\]/g,"").replace(/\n{3,}/g,"\n\n").trim();
  return {text:out, kept:kept};
}

/* ============================ THE MORNING BRIEF ============================
   "Hello Glen", the weather, what the world is doing, and today's plan read back
   exactly as he typed it.

   Written in code, not by Claudia, and that is the point. He asked for the
   schedule word for word; a model asked to repeat text verbatim will quietly
   improve it. This assembles the sentence from real values and hands the
   finished thing to her voice.

   Weather and headlines come from /api/brief, which fetches them server-side —
   no news organisation allows a browser to read its RSS feed directly. When
   that call fails she says the feed is down. She does not guess a temperature
   and she does not invent a headline. */

var BRIEF=null, BRIEF_AT=0, BRIEF_BUSY=false;
var BRIEF_TTL=900000;                    /* what counts as still-current */

function briefFresh(){ return !!BRIEF && (Date.now()-BRIEF_AT) < BRIEF_TTL; }

function briefFetch(cb){
  if(briefFresh()){ cb(BRIEF); return; }
  if(!window.__EXODUS_HOSTED__){
    cb({offline:true, why:"The briefing feed only runs on the live site."});
    return;
  }
  if(BRIEF_BUSY){ setTimeout(function(){ briefFetch(cb); },400); return; }
  BRIEF_BUSY=true;
  var done=false;
  function finish(v){ if(done) return; done=true; BRIEF_BUSY=false; cb(v); }
  setTimeout(function(){ finish({offline:true, why:"The briefing feed did not answer."}); },9000);
  /* Where he is, if he has ever allowed it. Without a fix the server falls back
     to New York and says so in locationFrom, so the brief is never quietly
     telling him about the wrong city. */
  var g=geoSaved();
  var q="/api/brief?n=4";
  if(g) q+="&lat="+g.lat+"&lon="+g.lon+"&tz="+encodeURIComponent(g.tz||"");
  fetch(q)
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(!j){ finish({offline:true, why:"The briefing feed returned an error."}); return; }
      BRIEF=j; BRIEF_AT=Date.now(); finish(j);
    })
    .catch(function(){ finish({offline:true, why:"Could not reach the briefing feed."}); });
}

/* One city, as a sentence rather than a readout. Spoken aloud, "69 and mostly
   clear, up to 87" is a person talking; "temp: 69F, condition: clear" is not. */
/* One line, about where he is, covering the next 24 hours — not a two-city
   readout. He asked for exactly this: his location, his local time, and what
   the sky is going to do between now and tomorrow. */
function briefWx(b){
  var w=b && b.weather && b.weather.here;
  if(!w) return "";
  if(w.error) return "Weather unavailable right now.";
  var where=w.place||"Where you are";
  var t=where+(w.localTime?", "+w.localTime:"")+": "+w.now+" and "+w.sky;
  if(isFinite(w.feels) && Math.abs(w.feels-w.now)>=7) t+=", feels like "+w.feels;
  t+=".";
  var a=w.next24;
  if(a && isFinite(a.high)){
    t+=" Next 24 hours: "+a.high+" down to "+a.low;
    if(a.worst && a.worst!==w.sky) t+=", "+a.worst+" coming";
    if(isFinite(a.rainChance) && a.rainChance>=30) t+=", "+a.rainChance+"% chance of rain";
    t+=".";
  }
  return t;
}

function briefNews(b, max){
  if(!b || !b.news || !b.news.length) return [];
  return b.news.slice(0, max||4).map(function(x){ return x.title+" — "+x.src; });
}

/* Today's plan, exactly as it sits in the box. No trimming beyond whitespace at
   the ends, no re-wording, no "it looks like you have". If the box is empty it
   says the box is empty. */
function todayVerbatim(){
  var i=new Date().getDay();
  return (LS("week_plan_"+i)||"").replace(/^\s+|\s+$/g,"");
}
function todayLabelNow(){ return dayLabel(new Date().getDay()); }

/* Which tab the top-left card is showing. Remembered, because a man who
   watches something every evening should not have to click twice for it. */
var NEWSTAB=(LS("newstab")==="watch") ? "watch" : "news";
/* Folded or not. It runs a lot taller than the task list beside it, and some
   days he does not want to look at the world at all. */
var NEWS_SHUT=(LS("news_shut")==="1");
/* The two cards in the left column fold as well, so he can shut whichever he
   is not using and the column still closes off against the headlines. */
var TASK_SHUT=(LS("task_shut")==="1");
var MT_SHUT=(LS("mt_shut")==="1");
function taskFold(){ TASK_SHUT=!TASK_SHUT; LS("task_shut", TASK_SHUT?"1":""); drawDash(); }
function mtFold(){ MT_SHUT=!MT_SHUT; LS("mt_shut", MT_SHUT?"1":""); drawDash(); }
function newsFold(){
  NEWS_SHUT=!NEWS_SHUT;
  LS("news_shut", NEWS_SHUT?"1":"");
  drawDash();
}
function newsTab(k){
  NEWSTAB=(k==="watch")?"watch":"news";
  LS("newstab", NEWSTAB);
  drawDash();
}

/* TalentFLX, opened properly rather than embedded.

   An iframe was the obvious thing and it is the wrong thing: a login page
   inside someone else's frame is blocked by most sites' frame policy, and
   where it is not blocked it is exactly the shape a phishing page takes. It
   opens in its own tab, on its own domain, where the address bar says what it
   is. */
function watchBox(){

    +'<a class="wt-go" href="'+TALENTFLX+'" target="_blank" rel="noopener noreferrer">'
      +'<span class="wt-ic">'
        +'<svg viewBox="0 0 24 24" aria-hidden="true">'
        +'<rect x="1.5" y="4" width="17" height="16" rx="2.6" fill="none" '
          +'stroke="currentColor" stroke-width="1.7"/>'
        +'<path d="M18.5 10.5 L22.5 7.6 v8.8 l-4-2.9 z" fill="currentColor"/>'
        +'<path d="M8 9.2 v5.6 l4.6 -2.8 z" fill="currentColor"/>'
        +'</svg></span>'
      +'<span class="wt-t"><b>Movies &amp; TV</b><i>talentflx.com &#8599;</i></span>'
    +'</a>'
    +'<div class="wt-n">Opens in its own tab so the login is on TalentFLX\'s own '
      +'address, not inside this page. The screen in the basement theatre goes to '

    +'</div>';
}

/* ---- the desks ----
   The eight things he actually reads. Order is his: sport, USA, men's health,
   global, trading, high-impact, Thailand, military, history — folded into
   eight desks because several of those are the same desk. */
var DESKS=[
  {k:"all",      nm:"All"},
  {k:"world",    nm:"Global"},
  {k:"usa",      nm:"USA"},
  {k:"military", nm:"Military"},
  {k:"thailand", nm:"Thailand"},
  {k:"sport",    nm:"Sport"},
  {k:"fitness",  nm:"Health"}
];
var NEWSDESK=LS("newsdesk")||"all";
var NEWS_OFF=0;                 /* how far into the pool Refresh has walked */
var NEWS_PAGE=9;

/* A masthead's own colour, so the eye learns the badge before it reads it.
   Anything not listed gets the house blue rather than a guess at a brand. */
var SRCCOL={
  "BBC":"#bb1919","BBC Sport":"#bb1919","Reuters":"#ff8000","AP":"#e03131",
  "Al Jazeera":"#fa9000","Guardian":"#0057b8","DW":"#00a5ff","NPR":"#4a7ec7",
  "CBC":"#e51937","ToI":"#1d68b5","CNBC":"#005594","MarketWatch":"#00a949",
  "Yahoo Fin":"#7b16ff","Investing":"#1d68b5","CoinDesk":"#f7a600",
  "Cointelegraph":"#f7a600","ESPN":"#c8102e","ESPN NFL":"#c8102e",
  "ESPN NBA":"#c8102e","ESPN MLB":"#c8102e","ESPN Soccer":"#c8102e",
  "Men's Health":"#e4002b","M&F":"#e4002b","Runner's World":"#e4002b",
  "Stronger by Science":"#22a06b","Outside":"#00b3a4","Healthline":"#0fb3a1",
  "NYT Well":"#cfd4dc","CBS":"#0057b8","ABC":"#1a7fd4","The Hill":"#0a3161",
  "Bangkok Post":"#00529b","Thaiger":"#f0b323","Thailand":"#ed1c24",
  "Defense News":"#8a9199","War on the Rocks":"#8a9199",
  "Breaking Defense":"#8a9199","Task & Purpose":"#8a9199",
  "Smithsonian":"#c8a86a","History Today":"#c8a86a",
  "Ancient Origins":"#c8a86a","Live Science":"#7a5cff"
};
function srcCol(s){ return SRCCOL[s] || "#5b7fb8"; }

/* Everything fetched, in the desk he is looking at. */
function newsPool(){
  if(!briefFresh() || !BRIEF || BRIEF.offline) return [];
  var all=BRIEF.headlines || BRIEF.news || [];
  if(NEWSDESK!=="all") return all.filter(function(x){ return x.cat===NEWSDESK; });

  /* The server returns the desks one after another, so "All" straight off the
     wire is twelve world stories, then twelve USA, then twelve markets. That is
     not "all", it is "world, and scroll for the rest". Round-robin them so the
     first screen has one of everything — which is the point of the tab. */
  var buckets={}, order=[];
  all.forEach(function(x){
    var c=x.cat||"other";
    if(!buckets[c]){ buckets[c]=[]; order.push(c); }
    buckets[c].push(x);
  });
  var out=[], i=0, more=true;
  while(more){
    more=false;
    for(var j=0;j<order.length;j++){
      var row=buckets[order[j]][i];
      if(row){ out.push(row); more=true; }
    }
    i++;
  }
  return out;
}

/* The headlines, as links. Every one opens the real article at the real
   publisher — this is a reader, not a rewrite, and nothing is summarised by
   anything. Refresh walks an offset through the pool, so tapping it genuinely
   gives him different stories rather than redrawing the same nine. */
function newsList(){
  if(!briefFresh() || !BRIEF || BRIEF.offline)
    return '<div class="nw-none">Tap Refresh for what is happening right now — '
      +'BBC, Reuters, AP, CNBC, ESPN, Bangkok Post and a dozen more.</div>';
  var pool=newsPool();
  if(!pool.length)
    return '<div class="nw-none">'
      +esc(BRIEF.newsError||"Nothing came back for that desk just now.")+'</div>';

  var off=NEWS_OFF % pool.length;
  var rows=[];
  for(var i=0;i<Math.min(NEWS_PAGE,pool.length);i++) rows.push(pool[(off+i)%pool.length]);

  return rows.map(function(x){
    var href=x.link||"";
    /* Only ever http(s). A feed is outside content, and a javascript: URL in a
       title field is exactly the shape that attack takes. */
    if(!/^https?:\/\//i.test(href)) href="";
    var c=srcCol(x.src);
    return (href
      ? '<a class="nw" href="'+esc(href)+'" target="_blank" rel="noopener noreferrer">'
      : '<div class="nw">')
      +'<span class="nw-s" style="--sc:'+c+'">'+esc(x.src)+'</span>'
      +'<span class="nw-t">'+esc(x.title)+'</span>'
      +(href?'<span class="nw-go">&#8599;</span>':'')
      +(href?'</a>':'</div>');
  }).join("");
}

/* How old what he is looking at actually is. A count of stories says nothing
   about whether they are current, which is the only thing he asked. */
function newsAge(){
  if(!briefFresh() || !BRIEF || BRIEF.offline) return "tap refresh";
  var n2=(BRIEF.headlines||BRIEF.news||[]).length;
  var mins=Math.floor((Date.now()-BRIEF_AT)/60000);
  var when = mins<1 ? "just now" : mins===1 ? "1 min ago" : mins+" min ago";
  return n2+" stories &middot; "+when;
}

function newsDeskTabs(){
  var counts=(briefFresh()&&BRIEF&&BRIEF.counts)||{};
  return '<div class="ndesks">'+DESKS.map(function(d){
    var n2 = d.k==="all"
      ? (briefFresh()&&BRIEF&&BRIEF.headlines?BRIEF.headlines.length:0)
      : (counts[d.k]||0);
    return '<button class="ndesk'+(NEWSDESK===d.k?" on":"")+'" data-ndesk="'+d.k+'">'
      +esc(d.nm)+(n2?'<i>'+n2+'</i>':'')+'</button>';
  }).join("")+'</div>';
}
function newsDeskSet(k){
  NEWSDESK=k; LS("newsdesk",k); NEWS_OFF=0; drawDash();
}

/* Refresh does two things in order: walk to the next set of stories we already
   have, and if we have walked the whole pool, go and get new ones. That way a
   tap is instant and still eventually brings genuinely new material. */
function newsRefresh(){
  var pool=newsPool();
  if(pool.length > NEWS_PAGE && (NEWS_OFF+NEWS_PAGE) < pool.length){
    NEWS_OFF+=NEWS_PAGE;
    drawDash();
    return;
  }
  NEWS_OFF=0;
  var lab=document.getElementById("news-n");
  if(lab) lab.textContent="fetching…";
  BRIEF=null;
  geoAsk(function(){
    briefFetch(function(){ if(VIEW==="home") drawDash(); });
  });
}
/* Once a day was wrong. A news panel that is a day old is a newspaper, and he
   noticed immediately. It pulls on arrival, and then every fifteen minutes for
   as long as the page is open. The server caches for two minutes, so this costs
   almost nothing and keeps the panel current. */
function newsDaily(){
  if(briefFresh()) return;
  geoAsk(function(){
    briefFetch(function(){ if(VIEW==="home") drawDash(); });
  });
}
var NEWS_TIMER=null;
function newsAuto(){
  if(NEWS_TIMER) return;
  NEWS_TIMER=setInterval(function(){
    /* Do not redraw over him mid-sentence, and do not fetch for a tab nobody
       is looking at. */
    if(document.hidden) return;
    if(typeof dashBusy==="function" && dashBusy()) return;
    BRIEF=null;
    briefFetch(function(){ if(VIEW==="home" && !dashBusy()) drawDash(); });
  }, 900000);
  /* and catch up the moment he comes back to the tab */
  try{
    document.addEventListener("visibilitychange", function(){
      if(!document.hidden && !briefFresh()) newsDaily();
    });
  }catch(e){}
}

/* Which parts he actually asked for. "Weather?" gets weather, not a monologue. */
function briefIntent(q){
  var t=String(q||"").toLowerCase().replace(/[^a-z0-9\s']/g," ");
  var full = /\b(good morning|morning claudia|hello claudia|hi claudia|hey claudia|brief me|briefing|the brief|rundown|run me down|start my day|what s my day|whats my day|catch me up|sitrep)\b/.test(t);
  if(full) return {hello:true, wx:true, news:true, sport:true, plan:true};
  var sport= /\b(sports?|scores?|the game|last night s games|espn|who won|nfl|nba|mlb|nhl|premier league)\b/.test(t);
  var wx   = /\b(weather|forecast|temperature|how hot|how cold|raining|rain today)\b/.test(t);
  var news = /\b(news|headlines|world news|global news|what s happening in the world|whats happening in the world|going on in the world)\b/.test(t);
  var plan = /\b(my schedule|today s schedule|todays schedule|my day|today s plan|todays plan|what am i doing today|what s on today|whats on today|read me today|read today)\b/.test(t);
  if(wx||news||sport||plan)
    return {hello:false, wx:wx, news:news, sport:sport, plan:plan};
  /* A bare "hey" used to fire the whole briefing. That is exactly backwards —
     he asked for an assistant he can talk to, who briefs him when he asks for
     a brief. So a greeting is now just a greeting: it goes to her, she answers
     like a person, and the briefing has its own button and its own words. */
  return null;
}

/* Assemble it. Returns the exact words she will say. */
/* The reasons all end in a full stop already, and "the feed did not answer.." is

/* ESPN gives three-letter codes. Spoken aloud they are gibberish, so the ones
   he is likely to hear get their real name. Anything unlisted is read as-is —
   better a code than a wrong guess at a city. */
var TEAMS={

  PHI:"the Phillies",NYM:"the Mets",ATL:"Atlanta",WSH:"Washington",MIA:"Miami",

function teamName(code){ return TEAMS[code] || code; }

function briefWhy(b){
  return String((b && b.why) || "the feed is down").replace(/\.\s*$/, "");
}
/* The greeting changes. The same eleven words every morning is the thing that
   makes an assistant feel like a vending machine, and he noticed. Picked at
   random from the ones that fit the hour, never the same as last time. */
var HELLOS={
  early:["You're up early, Glen.","Early start, Glen.","Up before the sun, Glen.",
         "Morning, Glen — you beat the alarm."],
  morning:["Good morning, Glen.","Morning, Glen.","Right then, Glen — morning.",
           "Morning, boss.","Good morning. Let's get into it, Glen.",
           "Up and at it, Glen."],
  afternoon:["Afternoon, Glen.","Good afternoon, Glen.","Afternoon, boss.",
             "Right, Glen — afternoon."],
  evening:["Evening, Glen.","Good evening, Glen.","Evening, boss.",
           "Evening, Glen. Long one?"],
  late:["You're up late, Glen.","Still going, Glen?","Late one, Glen.",
        "Burning it, Glen."]
};
function briefHello(){
  var hr=new Date().getHours();
  var band = hr<5 ? "late" : hr<8 ? "early" : hr<12 ? "morning"
           : hr<17 ? "afternoon" : hr<23 ? "evening" : "late";
  var pool=HELLOS[band]||HELLOS.morning;
  var last=LS("hello_last")||"";
  var pick=pool[Math.floor(Math.random()*pool.length)];
  /* never the same one twice running */
  for(var i=0;i<6 && pick===last;i++) pick=pool[Math.floor(Math.random()*pool.length)];
  LS("hello_last", pick);
  return pick;
}

/* A word or two on where things stand, so the briefing has a point of view
   rather than being a list read at him. */
function briefTake(b){
  try{
    var m=money();
    if(m.chase>0){
      var who=(STATE.leads||[]).filter(function(L){ return L.owed>0 && !L.deferred; });
      if(who.length) return "$"+m.chase.toLocaleString()+" is sitting with "
        +(who.length===1?who[0].name:who.length+" people")+" — that is the first call.";
    }
    var due=(typeof dueNow==="function")?dueNow():[];
    if(due.length) return due.length===1
      ? "One follow-up is due: "+due[0].L.name+"."
      : due.length+" follow-ups are due today.";

}

function briefText(b, want){
  var d=new Date();
  var lines=[];

  if(want.hello){
    /* The order he asked for: greeting, date, time, weather, news, sport,
       then his own day. */
    var w0=(b && b.weather && b.weather.here) || null;
    var clock=(w0 && w0.localTime) ? w0.localTime
      : d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
    lines.push(briefHello()+" It's "+DAYFULL[d.getDay()]+", "
      +MON[d.getMonth()]+" "+d.getDate()+", and it's "+clock+".");
  }

  if(want.wx){
    if(b && b.offline) lines.push("No weather — "+briefWhy(b)+".");
    else {
      var a=briefWx(b);
      lines.push(a || "No weather came back just now.");
    }
  }

  if(want.news){
    if(b && b.offline) lines.push("No headlines — "+briefWhy(b)+".");
    else {
      /* The lead story gets its summary read out; the two behind it get a line
         each. That is a briefing. A list of five bare titles is a feed. */
      var rows=(b && (b.news||b.headlines)) || [];
      if(!rows.length) lines.push("No headlines came back just now.");
      else {
        var lead=rows[0];
        lines.push("Biggest thing out there: "+lead.title+" — "+lead.src+".");
        if(lead.sum) lines.push(lead.sum);
        var rest=rows.slice(1,3);
        if(rest.length){
          lines.push("Also:");
          rest.forEach(function(x){ lines.push("• "+x.title+" — "+x.src); });
        }
      }
    }
  }

  if(want.sport){
    if(b && b.offline) lines.push("No sport — "+briefWhy(b)+".");
    else {
      var live=(b.scores||[]).filter(function(x){ return x.live; });
      var fin =(b.scores||[]).filter(function(x){ return x.done; }).slice(0,3);
      var soon=(b.scores||[]).filter(function(x){ return !x.live && !x.done; }).slice(0,3);
      /* Read out, "TB" is a noise. Said as "Tampa Bay" it is a sentence. */
      function score(g){
        var t=(g.teams||[]).map(function(x){
          return teamName(x.team)+" "+(x.score===null?"-":x.score); });
        return t.join(", ")+(g.detail?" ("+g.detail+")":"");
      }
      /* THE HEADLINE, not the scoreboard. He was unambiguous about this: a
         column of three-letter abbreviations read aloud is noise. The lead
         ESPN story with what it is about, and at most one live game — because
         a game in progress is the one score that is actually news. */
      var lead=b.espnLead||(b.sport||[])[0];
      if(lead){
        lines.push("On ESPN: "+lead.title+".");
        if(lead.sum) lines.push(lead.sum);
      }
      if(live.length){
        var g=live[0];
        var t=(g.teams||[]).map(function(x){ return teamName(x.team)+" "+x.score; });
        lines.push("Live: "+t.join(" against ")
          +(g.detail?", "+g.detail.toLowerCase():"")+".");
      }
      if(!lead && !live.length) lines.push("No sport came back just now.");
    }
  }

  if(want.plan){
    var lab=todayLabelNow(), plan=todayVerbatim();
    var take=briefTake(b);
    if(take) lines.push(take);
    lines.push("Today is "+lab+".");
    if(plan) lines.push("Word for word, what you wrote: “"+plan+"”");
    else lines.push("You have not written anything in today's box.");

    var tk=(typeof dtLoad==="function") ? dtLoad() : [];
    var open=tk.filter(function(x){ return !x.done; });
    if(open.length)
      lines.push(open.length+" task"+(open.length>1?"s":"")+" still open: "
        +open.map(function(x){ return x.b; }).join("; ")+".");
    else if(tk.length) lines.push("Every task on today's list is ticked off.");
  }

  return lines.join("\n");
}

/* Stop her mid-sentence.

   She has a real voice and the brief is read aloud, so there has to be a way to
   cut it off that is not closing the tab. This stops the ElevenLabs audio, the
   browser's own speech, and the recogniser if it happens to be listening — all
   three, because which one is running is not something he should have to know. */
function briefStop(){
  /* stopSpeaking() already handles both voices — the ElevenLabs <audio> and the
     browser's own synthesiser. Reuse it rather than writing a second version
     that will drift out of step with it. */
  try{ stopSpeaking(); }catch(e){}
  /* and stop listening, if that is what is happening instead */
  try{ if(RECON && REC){ if(REC.__stop) REC.__stop(); else REC.stop(); } }catch(e){}
  try{ jvPaint(); }catch(e){}
}

/* Run it and put it in the log. Deliberately does not touch the model: it is
   instant, it is free, and it cannot get the wording wrong. */
function briefRun(want, q){
  if(q){ STATE.chat.push({r:"me",t:q}); SBW.said("claudia","glen",q); }
  STATE.busy=true; paintLog();
  ["ci","mci","dk-in"].forEach(function(id){
    var t=document.getElementById(id); if(t){ t.value=""; t.style.height="auto"; } });
  briefFetch(function(b){
    var t=briefText(b, want);
    STATE.chat.push({r:"ai",t:t});
    SBW.said("claudia","agent",t);
    /* Read aloud without the bullet characters — a voice saying "bullet" is
       the tell that a machine wrote it. */
    sayAs("claudia", t.replace(/•\s*/g,"").replace(/“|”/g,""));
    STATE.busy=false; paintLog();
    if(VIEW==="home") drawDash();
  });
}

    renderWins();};
  var ra=document.getElementById("tb-all");
  if(ra) ra.onclick=function(){ WINS.forEach(function(w){w.min=false;}); renderWins(); };

  /* the corner grip resizes */
  var gs=document.querySelectorAll("[data-size]");
  for(var g=0;g<gs.length;g++) gs[g].onmousedown=function(ev){
    var id=this.getAttribute("data-size"), w=null;
    for(var k=0;k<WINS.length;k++) if(WINS[k].id===id) w=WINS[k];
    if(!w) return;
    winFocus(w);
    DRAG={w:w, resize:true, ox:ev.clientX-w.w, oy:ev.clientY-w.h};
    if(ev.stopPropagation) ev.stopPropagation();
    if(ev.preventDefault) ev.preventDefault();
  };

  /* dragging by the title bar */
  var dh=document.querySelectorAll("[data-drag]");
  for(var d=0;d<dh.length;d++) dh[d].onmousedown=function(ev){
    var id=this.getAttribute("data-drag"), w=null;

    if(ev.preventDefault) ev.preventDefault();
  };
}

/* one pair of listeners for all dragging, attached once */
function winDragInit(){
  document.onmousemove=function(ev){
    if(!DRAG) return;
    var host=document.getElementById("wins");
    var el=document.querySelector('.win[data-w="'+DRAG.w.id+'"]');
    if(DRAG.resize){
      DRAG.w.w=Math.max(340, ev.clientX-DRAG.ox);
      DRAG.w.h=Math.max(240, ev.clientY-DRAG.oy);
      if(el){ el.style.width=DRAG.w.w+"px"; el.style.height=DRAG.w.h+"px"; }
      return;
    }
    var maxX=host?host.clientWidth-120:2000, maxY=host?host.clientHeight-40:2000;
    DRAG.w.x=Math.max(-40,Math.min(maxX, ev.clientX-DRAG.ox));
    DRAG.w.y=Math.max(0,  Math.min(maxY, ev.clientY-DRAG.oy));
    if(el){ el.style.left=DRAG.w.x+"px"; el.style.top=DRAG.w.y+"px"; }
  };
  document.onmouseup=function(){ DRAG=null; };
}

/* ---------------- boardroom: the seven day glance ----------------
   Sunday to Saturday, always in that order, always the same seven boxes. It
   wipes itself every Sunday so Monday morning is never last week's list. This
   is deliberately NOT the Google Calendar — that is the Calls tab. This is the
   shape of Glen's week: which days Amazon owns and what he intends to do with
   the rest. */
var DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DAYFULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var AMAZON=[1,4,5,6];                 /* Mon, Thu, Fri, Sat */

function weekStamp(){
  var d=new Date(); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-d.getDay());   /* back to Sunday */
  return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
}
function weekRoll(){
  /* a new Sunday means a clean board */
  var have=LS("week_stamp"), now=weekStamp();
  if(have!==now){
    for(var i=0;i<7;i++){ LS("week_plan_"+i,""); LS("week_done_"+i,""); }
    LS("week_stamp",now);
    return true;
  }
  return false;
}
/* Thursday, thursday, thu and 4 all mean the same day. She should not have to
   guess which spelling the app accepts, and a brief that lists every accepted
   form is a brief nobody reads. */
function dayIndex(v){
  if(v===null||v===undefined||v==="") return null;
  if(typeof v==="number" && v>=0 && v<=6) return v|0;
  var t=String(v).trim().toLowerCase();
  if(/^[0-6]$/.test(t)) return parseInt(t,10);
  if(t==="today")     return new Date().getDay();
  if(t==="tomorrow")  return (new Date().getDay()+1)%7;
  if(t==="yesterday") return (new Date().getDay()+6)%7;
  for(var i=0;i<7;i++){
    var full=DAYFULL[i].toLowerCase();
    if(t===full || t===full.slice(0,3) || t===DAYS[i].toLowerCase()) return i;
  }
  return null;
}

function dayLabel(i){
  var v=LS("week_lab_"+i);
  if(v!==null&&v!==undefined&&v!=="") return v;
  return AMAZON.indexOf(i)>=0 ? "Amazon" : "Off";
}

/* One submission per person. formsubmit sends a mail for every submit, and the
   same person filling the form twice used to show up twice — so ten rows that
   were really five. This keeps the newest of each and hides the rest, locally
   and in Postgres. */
function formIdent(f){
  var e=(f.email||"").toLowerCase().trim();
  if(e) return "e:"+e;
  var ph=last10(f.phone||"");
  if(ph && ph.length===10) return "p:"+ph;
  return "n:"+keyOf(f.name||"");
}
function dedupeForms(){
  var seen={}, dupes=[], keep=[];
  /* newest first, so the one we keep is the most recent */
  var sorted=(STATE.forms||[]).slice().sort(function(a,b){ return (b.date||0)-(a.date||0); });
  sorted.forEach(function(f){
    var id=formIdent(f);
    if(seen[id]){ dupes.push(f); return; }
    seen[id]=true; keep.push(f);
  });
  if(!dupes.length) return 0;

  var dz=LJ("forms_dismissed",[]);
  dupes.forEach(function(f){
    var k=keyOf(f.name||f.email||"");
    if(k && dz.indexOf(k)<0) dz.push(k);
  });
  LJset("forms_dismissed",dz);

  /* in the database, collapse on email then on phone, keeping the newest row */
  sbRun(
    "with ranked as (select id, row_number() over ("
    + "partition by coalesce(nullif(lower(btrim(email)),''), nullif(regexp_replace(coalesce(phone,''),'\\D','','g'),''), lower(btrim(coalesce(name,'')))) "
    + "order by submitted_at desc nulls last, created_at desc) as rn from form_submissions) "
    + "update form_submissions f set pulled_into_crm = true from ranked r "
    + "where f.id = r.id and r.rn > 1");

  STATE.forms = keep;
  redraw();
  return dupes.length;
}
function formDismissed(f){
  var dz=LJ("forms_dismissed",[]);
  var k=keyOf(f.name||f.email||"");
  return k ? dz.indexOf(k)>=0 : false;
}

   Twilio is Phase 4. Until then this is an honest shell plus the one thing
   that is useful right now: everyone worth calling, in order, with tap-to-dial. */
/* ==================== THE DIALER ====================
   Twilio rings Glen's phone, he picks up, Twilio then dials the lead and bridges
   the two. The call shows the Twilio number as caller ID and the outcome writes
   itself onto the lead's activity log when it ends.

   The keys sit in Vercel, so this only works on the live site. When it cannot
   work it says why in one line and the tel: links still hand off to the phone —
   no dead buttons, no silent failures. */
var DIAL={live:null, why:"", busy:"", last:null, confirm:null};

function dialerReady(){
  return DIAL.live!==false && !!window.__EXODUS_HOSTED__;
}

/* Nothing is dialled on one tap any more. The first tap shows you the exact
   number in full international form and waits. That is the check that would
   have stopped the spam call. */
function askCall(name, number){
  var v=dialable(number);
  if(!v.ok){
    DIAL.confirm=null;
    DIAL.last={bad:1,t:name+": "+v.why+". Fix the number on their record first."};
    redraw(); return;
  }
  DIAL.confirm={name:name, e164:v.e164, note:v.note};
  DIAL.last=null;
  redraw();
}
function cancelCall(){ DIAL.confirm=null; redraw(); }

function placeCall(name, number){
  if(DIAL.busy) return;
  var v=dialable(number);
  if(!v.ok){
    DIAL.confirm=null;
    DIAL.last={bad:1,t:name+": "+v.why+"."};
    redraw(); return;
  }
  var tel=v.e164;
  DIAL.confirm=null;
  DIAL.busy=name; DIAL.last={wait:1,t:"Ringing your phone… pick up and it will dial "+name+"."};
  redraw();

  var headers={"Content-Type":"application/json"};
  try{ var tk=localStorage.getItem("exodus_hq_token"); if(tk) headers["x-hq-token"]=tk; }catch(e){}

  fetch("/api/voice?route=call",{method:"POST",headers:headers,body:JSON.stringify({to:tel,name:name})})
    .then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){
        if(!r.ok){
          if(r.status===503){
            DIAL.live=false;
            DIAL.why=j.missing&&j.missing.length
              ? "Missing in Vercel: "+j.missing.join(", ")
              : (j.error||"Dialer is not configured.");
          }
          throw new Error(j.error||("Twilio said "+r.status));
        }
        return j;
      });
    })
    .then(function(j){
      DIAL.live=true; DIAL.why="";
      DIAL.last={good:1,t:"Calling. Your phone is ringing — answer it and Twilio dials "+name+"."};
      /* log the attempt straight away; the outcome arrives from Twilio later */
      actAdd(name,"Dialled from the dialer.");
      SBW.activity(name);
    })
    .catch(function(e){
      DIAL.last={bad:1,t:String(e.message||e)};
    })
    .then(function(){ DIAL.busy=""; redraw(); });
}

/* ---------------- a lead you can actually work ----------------
   Click any name on the Pipeline and it opens as a record: contact details,
   status, a running activity log you append to, and free notes. Everything is
   stored against the lead's name so it survives a Drive re-read. */
var OPENLEAD=null;
function actLoad(n){ return LJ("act_"+keyOf(n),[]); }

/* ============ REMOVING A LEAD FOR GOOD ============
   Duplicates were unkillable: the pipeline could hide a row but the record stayed
   in Postgres and came straight back on the next pull. Deleting has to clear
   BOTH sides — the database row and every local override keyed on the name —
   otherwise the next sync resurrects it, or worse, a new person with the same
   name inherits a dead lead's notes and stage.

   Deliberately not undoable. It asks first. */
var DEL_ASK=null;
/* True only while salesPipe() is rendering inside a dashboard section rather
   than as the whole Sales room. */
var DASH_INLINE=false;          /* the name currently awaiting a confirm */

function leadWipeLocal(name){
  var k=keyOf(name);
  ["pr_","st_","nt_","lx_","cn_","act_","pay_"].forEach(function(pre){
    try{ localStorage.removeItem("exodus_"+pre+k); }catch(e){}
  });
  /* anything he added by hand lives in its own list */
  try{
    var ml=mlLoad().filter(function(x){ return keyOf(x.name)!==k; });
    mlSave(ml);
  }catch(e){}
}

function leadDelete(name){
  var k=keyOf(name);
  /* off the screen immediately — waiting on the network to remove a duplicate
     feels broken */
  STATE.leads=(STATE.leads||[]).filter(function(L){ return keyOf(L.name)!==k; });
  SBLEADS=(typeof SBLEADS!=="undefined"&&SBLEADS)
    ? SBLEADS.filter(function(L){ return keyOf(L.name)!==k; }) : SBLEADS;
  leadWipeLocal(name);
  if(OPENLEAD && keyOf(OPENLEAD)===k) OPENLEAD=null;
  DEL_ASK=null;

  /* and gone from the database, with a WHERE on it */
  sbRun("delete from lead_activity where name_key="+qv(k)+";"
       +" delete from payments where name_key="+qv(k)+";"
       +" delete from leads where name_key="+qv(k)+";");
  /* a form submission with the same person would re-import them on the next
     pull, so it is dismissed at the same time */
  try{ sbRun("update form_submissions set pulled_into_crm=true"
        +" where lower(trim(coalesce(name,'')))="+qv(k)+";"); }catch(e){}

  refreshContacts();
  redraw();
  if(VIEW==="home") drawDash();
}
function actAdd(n,txt){
  var a=actLoad(n);
  a.unshift({t:txt,d:new Date().toISOString()});
  LJset("act_"+keyOf(n),a);
}
function leadBy(n){
  for(var i=0;i<STATE.leads.length;i++) if(keyOf(STATE.leads[i].name)===keyOf(n)) return STATE.leads[i];
  return null;
}

function formToLead(f){
  return {name:f.name||f.email||"Unknown",
    phone:f.phone||"", email:f.email||"", ig:"",
    source:"Form submission"+(f.date?" "+((f.date.getMonth?f.date.getMonth():0)+1)+"/"+(f.date.getDate?f.date.getDate():""):""),
    notes:(f.interest?"Asked about: "+f.interest:"Came in through the form."),
    stage:"New Lead"};
}
function alreadyMine(nm){
  return mlLoad().some(function(x){return keyOf(x.name)===keyOf(nm);});
}
function wireMissAdd(){
  function msg(t,tone){
    var el=document.getElementById("fd-msg");
    if(el) el.innerHTML=t?'<div class="fdnote '+(tone||"")+'">'+t+'</div>':"";
  }

  /* Check for new leads — re-reads the database and the mailbox */
  var rl=document.getElementById("fd-reload");
  if(rl) rl.onclick=function(){
    msg("Checking&hellip;","wait");
    sbPull().then(function(){
      if(window.cowork && window.cowork.callMcpTool){
        return window.cowork.callMcpTool(GMAIL,{query:"from:submissions@formsubmit.co",pageSize:50})
          .then(function(r){
            var fromMail=parseForms(unwrap(r).threads)||[];
            var seen={};
            STATE.forms=fromMail.concat(SBFORMS).filter(function(f){
              var k=formIdent(f); if(seen[k])return false; seen[k]=1; return true;})
              .sort(function(a,b){return (b.date||0)-(a.date||0);});
          }).catch(function(){ STATE.forms=SBFORMS; });
      }
      STATE.forms=SBFORMS;
    }).then(function(){
      redraw();
      msg("Checked. "+(STATE.forms||[]).length+" submissions on file.","good");
    }).catch(function(){ msg("Could not reach the database just then.","bad"); });
  };

  /* Collapse duplicates */
  var dd=document.getElementById("fd-dedupe");
  if(dd) dd.onclick=function(){
    var n=dedupeForms();
    msg(n?("Collapsed "+n+" duplicate"+(n===1?"":"s")+"."):"Nothing left to collapse.","good");
  };

  /* Add a lead by hand — for when the form fails you */
  var mb=document.getElementById("fd-manual");
  if(mb) mb.onclick=function(){
    var box=document.getElementById("fd-manualform");
    if(!box) return;
    if(box.innerHTML){ box.innerHTML=""; return; }
    box.innerHTML='<div class="tform" style="margin-top:10px">'
      +'<input id="fm-name" placeholder="Name">'
      +'<input id="fm-phone" placeholder="Phone">'
      +'<input id="fm-email" placeholder="Email">'
      +'<input id="fm-want" placeholder="What they want">'
      +'<button id="fm-save">Add To Pipeline</button></div>';
    var sv=document.getElementById("fm-save");
    sv.onclick=function(){
      function v(id){var e=document.getElementById(id);return e?e.value.trim():"";}
      var nm=v("fm-name")||v("fm-email")||v("fm-phone");
      if(!nm){ var e=document.getElementById("fm-name"); if(e)e.focus(); return; }
      var mine=mlLoad();
      mine.push({name:nm, phone:v("fm-phone"), email:v("fm-email"), ig:"",
                 source:"Added by hand", notes:v("fm-want"), stage:"New Lead"});
      mlSave(mine);
      actAdd(nm,"Added by hand from the front desk.");
      var base=STATE.leads.filter(function(x){return !x.manual;});
      STATE.leads=base.concat(mlLoad().map(mlToLead));
      refreshContacts(); SBW.lead(nm); SBW.activity(nm);
      box.innerHTML=""; drawBuilding(); redraw();
      msg(nm+" added to the pipeline.","good");
    };
  };

  /* the X on a row — take it off the front desk for good */
  var dr=document.querySelectorAll("[data-drop]");
  for(var q=0;q<dr.length;q++) dr[q].onclick=function(){
    var nm=this.getAttribute("data-drop");
    var dz=LJ("forms_dismissed",[]);
    if(dz.indexOf(keyOf(nm))<0){ dz.push(keyOf(nm)); LJset("forms_dismissed",dz); }
    sbRun("update form_submissions set pulled_into_crm=true where lower(btrim(coalesce(name,'')))="
      +qv(keyOf(nm)));
    redraw();
  };

  function pull(list){
    var mine=mlLoad(), added=0;
    list.forEach(function(f){
      var rec=formToLead(f);
      if(alreadyMine(rec.name)) return;
      mine.push(rec);
      actAdd(rec.name,"Pulled in from the form submission. Nobody has contacted them yet.");
      added++;});
    if(!added) return;
    mlSave(mine);
    /* rebuild the lead list so the new records appear straight away */
    var base=STATE.leads.filter(function(x){return !x.manual;});
    STATE.leads=base.concat(mlLoad().map(mlToLead));
    refreshContacts();
    drawBuilding();
    redraw();
  }
  var one=document.querySelectorAll(".addone");
  for(var i=0;i<one.length;i++) one[i].onclick=function(){
    var f=MISSCACHE[parseInt(this.getAttribute("data-mi"),10)];
    if(f) pull([f]);};
  var all=document.getElementById("miss-all");
  if(all) all.onclick=function(){ pull(MISSCACHE.slice()); };
}
