<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- ===== Install to the home screen =====
       Android and Chrome read manifest.json. iOS ignores it and uses the
       apple- tags below, so both are here. "standalone" is what removes the
       browser chrome and makes it open like a real app. -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#05070b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exodus HQ">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<meta name="theme-color" content="#080a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Exodus HQ</title>
<style>
:root{
  color-scheme: dark;
  /* A working palette, not a neon one. Neutral graphite surfaces stepped a few
     shades apart so panels read as panels, one restrained blue used only for
     what is interactive, and status colours desaturated to the point where a
     screen full of them still looks like business software. */
  --blk:#12141a; --blk2:#171a21; --blk3:#1e2229; --blk4:#272c35;
  --blu:#4b7bd4; --blu2:#8fb3e8; --blu3:#6d97dd; --ice:#5fa8b8;
  /* page, panel, raised surface — each step clearly lighter than the last */
  --paper:#14171d; --paper2:#1b1f26; --raise:#22262f;
  --ink:#eceef2; --mut:#98a0ae; --line:#2f3540;
  --green:#5fb37c; --red:#d4736f; --amber:#c9a25c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45}
.wrap{max-width:1700px;margin:0 auto;padding:12px 16px 60px}

/* ============ MASTHEAD ============ */
.top{position:relative;overflow:hidden;border-radius:14px;padding:0;
  background:linear-gradient(160deg,#1b1f26 0%,#1e232b 55%,#191d24 100%);
  border:1px solid #2f3540;
  box-shadow:0 10px 28px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05)}
/* the two big coloured washes are gone — a masthead should not glow */
.top:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 120% at 10% -30%, rgba(75,123,212,.10), transparent 62%)}
.top:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:100% 26px, 26px 100%;
  mask-image:linear-gradient(180deg,#000,transparent 78%)}
.tbar{position:relative;display:flex;align-items:center;gap:15px;flex-wrap:wrap;
  padding:20px 26px 18px}
.mark{width:48px;height:48px;border-radius:12px;flex:none;position:relative;
  background:linear-gradient(150deg,#4b8cff,#12327d);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;
  color:#eaf2ff;letter-spacing:-.5px;
  box-shadow:0 6px 20px rgba(47,111,237,.5), inset 0 1px 0 rgba(255,255,255,.28)}
h1{font-size:23px;font-weight:700;letter-spacing:-.5px;line-height:1.05;color:#fff}
.sub{font-size:9.5px;color:var(--blu2);letter-spacing:2.8px;text-transform:uppercase;
  margin-top:5px;font-weight:700;opacity:.88}
.cd{margin-left:auto;text-align:right;padding-left:22px;border-left:1px solid rgba(255,255,255,.1)}
.cd .n{font-size:38px;font-weight:800;letter-spacing:-2.2px;line-height:.92;
  color:#fff;text-shadow:0 0 30px rgba(47,111,237,.75)}
.cd .l{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.45);margin-top:5px;font-weight:700}
.rule{position:relative;height:1px;background:linear-gradient(90deg,
  transparent, rgba(47,111,237,.75) 18%, rgba(34,211,238,.55) 52%, transparent)}
.kpis{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  gap:1px;background:rgba(255,255,255,.07)}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.038),rgba(255,255,255,.012));
  padding:14px 16px 15px}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.9px;line-height:1;
  font-variant-numeric:tabular-nums;color:#fff}
.kpi .k{font-size:8px;letter-spacing:1.6px;text-transform:uppercase;
  color:rgba(255,255,255,.42);margin-top:6px;font-weight:700}
.kpi.warn .v{color:#ff8f8f} .kpi.good .v{color:#5ee3a4} .kpi.blue .v{color:var(--blu2)}

/* ============ TOP BAR ============ */
.topbar{display:flex;align-items:center;gap:0;flex-wrap:nowrap;margin-bottom:9px;
  padding:0 14px;height:52px;border-radius:11px;
  background:linear-gradient(160deg,#090d14,#0f1622);
  border:1px solid #1e2634;box-shadow:0 6px 20px rgba(0,0,0,.38)}
.tb-brand{display:flex;align-items:center;gap:8px;flex:none;padding-right:15px}
.tb-mark{width:24px;height:24px;border-radius:7px;flex:none;
  background:linear-gradient(150deg,#4b8cff,#12327d);color:#eaf2ff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;
  box-shadow:0 3px 12px rgba(47,111,237,.4)}
.tb-name{font-size:9.5px;font-weight:800;letter-spacing:2.4px;color:#b9c1cf}
.tb-here{flex:none;padding:0 15px;border-left:1px solid #1e2634;display:flex;
  align-items:baseline;gap:8px}
.tb-time{font-size:19px;font-weight:800;letter-spacing:-.9px;line-height:1;color:#fff;
  font-variant-numeric:tabular-nums}
.tb-time .ap{font-size:9.5px;font-weight:800;letter-spacing:.5px;color:var(--blu2);
  margin-left:3px}
.tb-sub{font-size:8.5px;color:var(--mut);font-weight:700;letter-spacing:1.1px;
  text-transform:uppercase;white-space:nowrap}
.tb-cd{flex:none;text-align:right;padding-left:15px;border-left:1px solid #1e2634;
  display:flex;align-items:baseline;gap:7px}
.tb-cd b{font-size:19px;font-weight:800;color:var(--blu2);letter-spacing:-.9px;line-height:1;
  font-variant-numeric:tabular-nums}
.tb-cd i{font-size:8px;font-style:normal;color:var(--mut);font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;max-width:62px;line-height:1.15}
.syncdot{width:7px;height:7px;border-radius:50%;flex:none;margin-left:11px;
  background:#3a4452;box-shadow:0 0 0 3px rgba(255,255,255,.04);cursor:help;transition:.2s}
.syncdot.ok{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.16)}
.syncdot.saving{background:#7dd3fc;box-shadow:0 0 0 3px rgba(125,211,252,.18);
  animation:sbp 1s ease-in-out infinite}
.syncdot.error{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.2)}
.syncbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:13px;
  padding:12px 14px;border-radius:11px;background:rgba(248,113,113,.11);
  border:1px solid rgba(248,113,113,.4)}
.syncbar b{font-size:13px;font-weight:800;color:#fca5a5}
.syncbar span{flex:1 1 100%;font-size:11.5px;color:#cbd3de;line-height:1.5}
.syncbar button{flex:none;background:#dc4c4c;border:0;border-radius:8px;padding:10px 16px;
  color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.syncbar button:disabled{opacity:.6;cursor:default}

/* ---- pipeline: stage bands ---- */
.pgrp{display:flex;align-items:center;gap:9px;margin:18px 0 8px;padding:0 2px}
.pgrp:first-child{margin-top:4px}
.pgrp-d{width:9px;height:9px;border-radius:50%;background:var(--gc);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 22%,transparent)}
.pgrp b{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#e6ecf4}
.pgrp i{font-style:normal;font-size:10px;font-weight:800;color:var(--gc);
  background:color-mix(in srgb,var(--gc) 15%,transparent);border-radius:20px;padding:3px 9px;
  font-variant-numeric:tabular-nums}
.pgrp:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,
  color-mix(in srgb,var(--gc) 34%,transparent),transparent)}

/* ---- the dialer console ---- */
.console{margin:13px 0 15px;border-radius:13px;overflow:hidden;
  background:linear-gradient(168deg,#07100c,#0a1512 55%,#070d0b);
  border:1px solid rgba(34,197,94,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.con-t{display:flex;align-items:center;gap:10px;padding:11px 15px;
  border-bottom:1px solid rgba(34,197,94,.16);background:rgba(34,197,94,.05)}
.con-t b{font-size:10.5px;font-weight:800;letter-spacing:2.6px;color:#4ade80}
.con-t i{font-style:normal;font-size:9px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:#5b6472;margin-left:auto}
.con-live{width:8px;height:8px;border-radius:50%;background:#374151;flex:none}
.con-live.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2);
  animation:conBlink 2.4s infinite}
@keyframes conBlink{0%,100%{opacity:1}50%{opacity:.45}}
.con-g{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(34,197,94,.12)}
.con-n{padding:13px 8px;text-align:center;background:#080f0d}
.con-n b{display:block;font-size:23px;font-weight:800;color:#e8f5ee;letter-spacing:-1px;
  font-variant-numeric:tabular-nums;line-height:1}
.con-n i{display:block;font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:1.1px;
  text-transform:uppercase;color:#5b6472;margin-top:5px}
.con-n.p b{color:#c084fc} .con-n.n b{color:#e2e8f0}
.con-n.w b{color:#fbbf24} .con-n.r b{color:#f87171}
.cl-h{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin:0 0 9px;padding:0 2px}
.cl-h b{font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#4ade80}
.cl-h span{font-size:11px;color:var(--mut)}
.dlr.nodial{opacity:.62}
.dlbad{display:block;font-style:normal;font-size:10px;color:#fca5a5;margin-top:3px}

/* ---- the sort bar ---- */
.sortbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 12px;padding:0 2px}
.sb-l{display:flex;align-items:center;gap:7px;font-size:9px;font-weight:800;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--mut)}
.sb-l select{background:var(--raise);border:1px solid var(--line);border-radius:8px;
  padding:8px 11px;color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:600}
.sb-l select:focus{outline:none;border-color:var(--blu)}
.sb-b{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 13px;
  color:var(--mut);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.sb-b:hover{color:var(--ink);border-color:#3d4552}
.sb-b.on{border-color:var(--blu);color:#cfe0ff;background:rgba(75,123,212,.14)}
.sb-b.due{border-color:rgba(212,115,111,.5);color:#e6a5a2;background:rgba(212,115,111,.12)}
.sb-n{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--mut);font-variant-numeric:tabular-nums}

/* ---- the source sheet ---- */
.srcbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:18px;padding:13px 15px;
  border-radius:11px;background:var(--paper2);border:1px solid var(--line)}
.src-l{font-size:9px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut)}
.src-a{font-size:13px;font-weight:700;color:var(--blu2);text-decoration:none}
.src-a:hover{text-decoration:underline;color:#c2d8f7}
.src-n{flex:1 1 100%;font-size:11px;color:var(--mut);line-height:1.5}

/* ---- the four headline numbers, editable ---- */
.ovrbox{margin-bottom:18px;padding:16px;border-radius:12px;background:var(--paper2);
  border:1px solid var(--line)}
.ovr-h{font-size:9px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;
  color:var(--mut);margin-bottom:10px}
.ovr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 0;
  border-top:1px solid var(--line)}
.ovr-l{flex:1;min-width:0}
.ovr-l b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.ovr-l i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:3px}
.ovr-f{flex:none;display:flex;align-items:center;gap:6px}
.ovr-f span{font-size:14px;font-weight:700;color:var(--mut)}
.ovr-i{width:120px;background:var(--raise);border:1px solid var(--line);border-radius:8px;
  padding:10px 11px;color:var(--ink);font-family:inherit;font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums}
.ovr-i:focus{outline:none;border-color:var(--blu)}
.ovr-x{flex:none;background:transparent;border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;color:var(--mut);font-family:inherit;font-size:11.5px;font-weight:700;
  cursor:pointer}
.ovr-x:hover:not(:disabled){color:var(--ink);border-color:#3d4552}
.ovr-x:disabled{opacity:.35;cursor:default}

/* ---- the came-in cell ---- */
.camecell input.cin-came{width:100%;background:var(--paper2);border:1px solid transparent;
  border-radius:6px;padding:5px 7px;color:var(--ink);font-family:inherit;font-size:12px}
.camecell input.cin-came:hover{border-color:var(--line);background:var(--raise)}
.camecell input.cin-came:focus{outline:none;border-color:var(--blu);
  box-shadow:0 0 0 3px rgba(75,123,212,.2)}
.fuflag{display:inline-block;margin-top:4px;font-size:8.5px;font-weight:800;letter-spacing:.9px;
  text-transform:uppercase;border-radius:20px;padding:2px 8px}
.fuflag.soon{background:rgba(75,123,212,.15);color:#9dbdf0}
.fuflag.tod{background:rgba(201,162,92,.18);color:#e0c48a}
.fuflag.od{background:rgba(212,115,111,.18);color:#e6a5a2}

/* ---- the record block on a lead ---- */
.lc-rec{margin-top:15px;padding:15px;border-radius:12px;background:var(--paper2);
  border:1px solid var(--line)}
.lc-rec-h{font-size:9px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;
  color:var(--mut);margin-bottom:12px}
.lc-due{margin-top:11px;padding:10px 12px;border-radius:9px;font-size:12px;font-weight:700;
  background:rgba(75,123,212,.12);border:1px solid rgba(75,123,212,.32);color:#bcd4f7}
.lc-due.tod{background:rgba(201,162,92,.14);border-color:rgba(201,162,92,.4);color:#e6cf9b}
.lc-due.od{background:rgba(212,115,111,.14);border-color:rgba(212,115,111,.42);color:#eeb4b1}

/* ---- the dialer queue ---- */
.dl{display:flex;flex-direction:column;gap:8px}
.dlr{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;border-radius:11px;
  background:var(--paper2);border:1px solid var(--line);border-left:3px solid var(--line)}
.dl-i{flex:none;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;background:var(--raise);border:1px solid var(--line);
  font-size:11px;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.dlm{flex:1;min-width:0}
.dlm b{display:block;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.dl-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}
.dl-st{font-size:8.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--sc);border:1px solid color-mix(in srgb,var(--sc) 40%,transparent);
  background:color-mix(in srgb,var(--sc) 12%,transparent);border-radius:20px;padding:2px 8px}
.dl-sub{font-size:10.5px;color:var(--mut)}
.dl-owe{font-size:10px;font-weight:800;color:#e6a5a2}
.dl-num{display:block;font-style:normal;margin-top:6px;font-size:15px;font-weight:600;
  color:#cfd6e2;font-variant-numeric:tabular-nums;letter-spacing:.4px}
.dl-fu{display:block;font-style:normal;margin-top:5px;font-size:10.5px;color:#9dbdf0}
.dl-fu.od{color:#e6a5a2;font-weight:700}
.dl-note{display:block;font-style:normal;margin-top:5px;font-size:11px;color:var(--mut);
  line-height:1.45}
.dl-act{flex:none;display:flex;align-items:center;gap:7px}
.dl-call{background:linear-gradient(150deg,#3f8f5f,#2c6b45);border:0;border-radius:9px;
  padding:0 18px;height:42px;color:#eaf5ee;font-family:inherit;font-size:12px;font-weight:800;
  letter-spacing:1.3px;cursor:pointer}
.dl-call:hover:not(:disabled){filter:brightness(1.13)}
.dl-call:disabled{opacity:.45;cursor:default}
.dl-call.busy{background:linear-gradient(150deg,#b4903f,#8a6d28)}
.dl-s{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;text-decoration:none;font-size:15px;cursor:pointer;
  background:var(--raise);border:1px solid var(--line);color:var(--mut);font-family:inherit}
.dl-s:hover{border-color:var(--blu);color:var(--ink)}
.dlr.pri{border-left-color:#a855f7;background:rgba(168,85,247,.05)}

/* the directory is a phone book, so the number is the point */
.dirnum a{font-size:14px;font-weight:700;letter-spacing:.3px}

/* ---- the microphone ---- */
.micbtn.rec{border-color:#f87171 !important;color:#fff !important;
  background:rgba(248,113,113,.22) !important}
.micbar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:210;
  display:flex;align-items:center;gap:11px;max-width:min(560px,calc(100vw - 24px));
  padding:12px 14px;border-radius:14px;
  background:rgba(12,17,24,.97);backdrop-filter:blur(12px);
  border:1px solid rgba(248,113,113,.45);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.mb-dot{width:10px;height:10px;border-radius:50%;background:#f87171;flex:none;
  animation:mbPulse 1.1s infinite}
@keyframes mbPulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.55)}
  50%{box-shadow:0 0 0 8px rgba(248,113,113,0)}}
.mb-t{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:#fca5a5;flex:none}
.mb-w{flex:1;min-width:0;font-size:13px;color:#e8eef5;line-height:1.4;
  max-height:44px;overflow:hidden}
.mb-x{flex:none;background:#dc4c4c;border:0;border-radius:9px;padding:9px 15px;
  color:#fff;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;min-height:40px}

/* the last-resort play button */
.voicechip{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:200;
  background:linear-gradient(150deg,#22d3ee,#0e7490);border:0;border-radius:999px;
  padding:14px 24px;color:#04222a;font-family:inherit;font-size:14px;font-weight:800;
  box-shadow:0 10px 34px rgba(0,0,0,.5);cursor:pointer;animation:vcIn .18s ease-out}
@keyframes vcIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

@keyframes sbp{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ PLAN ============ */
.sect{margin-top:0}
.sect-h{display:flex;align-items:baseline;gap:12px;margin-bottom:9px;flex-wrap:wrap}
.sect-h h2{font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:var(--blu2);font-weight:800}
.cdmini{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:700}
.cdmini span{color:#fff;font-size:14px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.sect-h .hint{font-size:11px;color:var(--mut);margin-left:auto;font-style:italic}
.tower{position:relative;background:linear-gradient(180deg,#191d24,#15181e);border:1px solid #2f3540;
  border-radius:16px;padding:9px;box-shadow:0 16px 46px rgba(5,7,11,.42)}

/* ---- assistant popup on the map ---- */
.reopen{position:absolute;right:16px;top:18px;z-index:6;background:rgba(10,14,20,.85);
  border:1px solid #2b3446;border-radius:22px;padding:8px 15px;cursor:pointer;font-family:inherit;
  font-weight:800;font-size:10.5px;color:#c6ccd8;letter-spacing:1.2px;text-transform:uppercase;
  backdrop-filter:blur(6px);transition:.14s;display:none}
.reopen:hover{border-color:var(--blu2);color:#fff}
.reopen.show{display:block}
.daytog{position:absolute;left:118px;top:18px;z-index:6;background:rgba(10,14,20,.82);

/* Idle rooms are readable on their own. A room with people in it is fully lit.

svg.bld .flr{cursor:pointer;opacity:.8;transition:opacity .16s ease}

.cal{display:flex;gap:7px;align-items:flex-start;overflow-x:auto;padding-bottom:4px}

  letter-spacing:.5px;width:11px}

.calgrid{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;flex:1}
.cc{width:15px;height:15px;border-radius:3px;border:1px solid transparent;padding:0;
  cursor:pointer;font-family:inherit;background:rgba(255,255,255,.05);transition:.13s}
.cc.yes{background:#22c55e}
.cc.rest{background:#1e5a8a}
.cc.no{background:rgba(248,113,113,.42)}

.cc.now{outline:2px solid #7dd3fc;outline-offset:1px}
.cc:hover:not(.future){transform:scale(1.28);z-index:2}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;font-size:10px;
  color:var(--mut);font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.k{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.k.yes{background:#22c55e} .k.rest{background:#1e5a8a}
.k.no{background:rgba(248,113,113,.42)}
.k.amzk{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1.5px rgba(251,191,36,.75)}

/* ---- sales whiteboard ---- *//* ---- sales whiteboard ---- */
.wbtop{display:flex;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.wbcols{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.wbcol{background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.08);
  border-top:3px solid var(--wc);border-radius:9px;padding:10px 11px 11px}

  font-weight:800;margin-bottom:7px}

/* ---- training library ---- */
.tpill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);
  border-radius:20px;padding:5px 12px;color:#a9b3c2;font-family:inherit;font-size:10.5px;

.thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:34px;height:34px;border-radius:50%;background:rgba(8,12,18,.78);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;padding-left:2px;
  border:1px solid rgba(255,255,255,.24)}

.libt i{font-size:10.5px;font-style:normal;color:var(--mut);line-height:1.4}
.libr{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.libr a{font-size:10.5px;font-weight:800;color:#9dc4ff;text-decoration:none;letter-spacing:.4px}
.libr a:hover{color:#fff}
.tform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tform input,.tform select{background:#1c2028;border:1px solid #232c3a;border-radius:7px;
  padding:8px 10px;color:#e4e9f2;font-family:inherit;font-size:12px}
.tform input:focus,.tform select:focus{outline:none;border-color:#3b82f6}
.tform #tr-note{grid-column:1/-1}
.tform button{grid-column:1/-1;background:rgba(47,111,237,.22);border:1px solid rgba(47,111,237,.6);
  border-radius:7px;padding:9px;color:#cfe0ff;font-family:inherit;font-size:11.5px;
  font-weight:800;letter-spacing:.9px;cursor:pointer}
.tform button:hover{background:rgba(47,111,237,.38);color:#fff}
@media (max-width:640px){.tform{grid-template-columns:1fr}}

/* ---- the seven day glance ---- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.wkd{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
  border-radius:9px;padding:8px 8px 9px;min-width:0;transition:.2s}
.wkd.today{border-color:rgba(59,130,246,.6);background:rgba(59,130,246,.07);
  box-shadow:0 0 0 2px rgba(59,130,246,.12)}

.wkd-h{display:flex;align-items:center;gap:5px;margin-bottom:7px}

.chk{margin-left:auto;width:19px;height:19px;flex:none;border-radius:5px;cursor:pointer;

.chk:hover{border-color:#4ade80}
.chk.on{background:#4ade80;border-color:#4ade80;color:#08120c}
.wlab{width:100%;background:#1c2028;border:1px solid #232c3a;border-radius:5px;

.wplan{width:100%;min-height:86px;resize:vertical;background:#1c2028;border:1px solid #232c3a;

.brd{display:flex;align-items:center;gap:13px;margin-top:14px;padding:13px 15px;

/* the PIN screen */

/* ============ PANEL ============ */
/* a dark scrim so the floor plan drops away while you work */
.scrim{position:absolute;inset:0;z-index:8;background:rgba(3,5,9,.62);
  backdrop-filter:blur(2px);display:none;pointer-events:none}
.scrim.open{display:block}

/* the working window, centred over the floor plan */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(760px,calc(100% - 48px));height:min(760px,calc(100% - 48px));
  z-index:9;display:none;flex-direction:column;
  background:rgba(9,13,19,.97);border:1px solid #2a3446;border-radius:15px;overflow:hidden;
  box-shadow:0 34px 90px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.07);
  font-size:12px}
.panel.open{display:flex}
/* once dragged it anchors to left/top, so drop the centring transform */
.panel.moved{transform:none}
.panel .p-b{overflow-y:auto;flex:1;padding:13px 15px}
.pclose{margin-left:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:7px;color:#c6ccd8;font-size:17px;line-height:1;cursor:pointer;padding:2px 9px 4px;
  font-family:inherit;transition:.14s}
.pclose:hover{background:rgba(248,113,113,.2);border-color:#f87171;color:#fff}
.p-h{cursor:grab}
.p-h:active{cursor:grabbing}

/* everything inside the window scales down a notch */
/* jump straight between rooms without closing the window */
.proom{display:flex;gap:5px;flex-wrap:wrap;padding:9px 14px;
  background:rgba(255,255,255,.03);border-bottom:1px solid #1e2734}
.prb{display:flex;align-items:center;gap:6px;background:#131a24;border:1px solid #26303d;

  color:#96a0b0;cursor:pointer;transition:.13s;letter-spacing:.2px}
.prb:hover{border-color:var(--blu);color:#fff}
.prb.on{background:linear-gradient(150deg,#1e4fb0,#12327d);border-color:#3b82f6;color:#fff}
.prb .e{font-size:13px;line-height:1}
.panel .tabs{margin-bottom:11px}

.panel .pill{font-size:11px;padding:3.5px 10px}
.panel .legend{padding:7px 10px;gap:11px;margin-bottom:10px}
.panel .lg{font-size:10.5px}
.panel .btn{font-size:11.5px;padding:7px 14px}

.p-h{background:linear-gradient(115deg,#080a0e,#16203a);color:#fff;padding:14px 22px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--blu)}

  text-transform:uppercase;font-weight:800}
.p-b{padding:17px 22px}
.tabs{display:flex;gap:3px;flex-wrap:wrap;border-bottom:1.5px solid var(--line);margin-bottom:15px}

.prdot{width:17px;height:17px;padding:0;border-radius:50%;cursor:pointer;display:block;
  background:transparent;border:2px solid #4a5568;transition:background .12s,border-color .12s}

.card.dk{background:linear-gradient(150deg,#111c33,#0a1220);border-color:#243044;color:#fff}
.card.dk h4{color:var(--blu2)} .card.dk .v{color:#fff} .card.dk .d{color:rgba(255,255,255,.55)}
.card h4{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);
  margin-bottom:7px;font-weight:800}
.card .v{font-size:25px;font-weight:800;letter-spacing:-1.1px;color:#fff;line-height:1;
  font-variant-numeric:tabular-nums}
.card .v.r{color:#fca5a5} .card .v.g{color:#86efac} .card .v.a{color:#fcd34d}
.card .d{font-size:11.5px;color:var(--mut);margin-top:5px}
.skel{background:repeating-linear-gradient(45deg,#0f151e,#0f151e 9px,#141b26 9px,#141b26 18px);
  border:1.5px dashed #243044;border-radius:11px;padding:22px 16px;text-align:center;color:var(--mut)}
.skel .t{font-weight:700;color:var(--ink);font-size:13px;margin-bottom:3px}
.skel .s{font-size:11.5px}
.bar{height:8px;background:#1b2330;border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blu3),var(--blu2));border-radius:4px}
.scr{background:var(--raise);border:1px solid var(--line);border-left:3px solid var(--blu);
  border-radius:0 9px 9px 0;padding:11px 14px;margin-bottom:8px}
.scr .lbl{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--blu2);
  font-weight:800;margin-bottom:5px}
.scr .tx{font-size:12.5px;line-height:1.55}
.steps{counter-reset:s;list-style:none}
.steps li{counter-increment:s;position:relative;padding:5px 0 5px 28px;font-size:12.5px;
  border-bottom:1px solid #1b222c}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:19px;height:19px;
  border-radius:50%;background:var(--blu);color:#04101f;font-size:9.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.notes-h{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.notes-h h4{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-weight:800}
.saved{font-size:10px;color:var(--green);font-weight:800;opacity:0;transition:.3s;letter-spacing:.6px}
.saved.on{opacity:1}
textarea.notes{width:100%;min-height:130px;border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-family:inherit;font-size:12.5px;line-height:1.6;resize:vertical;
  background:#1a1e25;color:var(--ink)}
textarea.notes:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px rgba(47,111,237,.14)}
.mini{width:82px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;
  font-size:12px;text-align:right;font-variant-numeric:tabular-nums;background:#1a1e25;color:var(--ink)}
.mini:focus{outline:none;border-color:var(--blu)}
.wide{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-family:inherit;
  font-size:12.5px;background:#1a1e25;color:var(--ink)}
.wide:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
/* inline editable contact cells */
input.cn{width:100%;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-family:inherit;
  font-size:11.5px;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;transition:.12s}
input.cn:hover{border-color:var(--line);background:#22262f}
input.cn:focus{outline:none;border-color:var(--blu);background:#1b1f27;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
input.cn::placeholder{color:#5a6474;font-style:italic}
input.cn.ok{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.45)}
.softflag{font-size:10px;color:var(--mut);font-weight:600;margin-top:3px}
.badge .dot2{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px;
  padding:9px 12px;background:var(--raise);border:1px solid var(--line);border-radius:10px}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink);
  letter-spacing:.3px}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
select.stsel{width:100%;background:#1a1e25;border:1px solid var(--line);border-radius:7px;
  padding:6px 7px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
select.stsel:focus{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
textarea.ntbox{width:100%;min-width:180px;background:transparent;border:1px solid transparent;
  border-radius:7px;padding:5px 7px;font-family:inherit;font-size:11.5px;line-height:1.5;
  color:var(--ink);resize:vertical}
textarea.ntbox:hover{border-color:var(--line);background:#22262f}
textarea.ntbox:focus{outline:none;border-color:var(--blu);background:#1b1f27;
  box-shadow:0 0 0 3px rgba(59,130,246,.16)}
textarea.ntbox::placeholder{color:#5a6474;font-style:italic}
.addbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.addform{display:none;background:#1c2028;border:1px solid var(--line);border-radius:11px;
  padding:14px 16px;margin-bottom:13px}
.addform.open{display:block}
.af-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.af-grid label,.addform label{font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--mut);font-weight:800}
.af-grid input,.af-grid select,.addform input{margin-top:4px}
.manualflag{display:inline-block;font-size:8.5px;letter-spacing:.9px;text-transform:uppercase;
  font-weight:800;color:#93c5fd;background:rgba(59,130,246,.14);padding:1.5px 6px;border-radius:3px;
  margin-top:4px;cursor:pointer}
.manualflag:hover{background:rgba(248,113,113,.16);color:#fca5a5}
.editedflag{display:inline-block;font-size:8.5px;letter-spacing:.9px;text-transform:uppercase;
  font-weight:800;color:#86efac;background:rgba(74,222,128,.13);padding:1.5px 6px;border-radius:3px;margin-top:4px}
a.lnk{color:var(--blu2);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(125,211,252,.5)}
a.lnk:hover{color:#bfdbfe}
.btn{background:linear-gradient(150deg,#4b8cff,#1a3f9e);border:none;border-radius:8px;color:#fff;
  font-family:inherit;font-weight:800;font-size:12.5px;padding:9px 17px;cursor:pointer;letter-spacing:.3px}
.btn:hover{filter:brightness(1.08)}
.btn.gh{background:none;border:1px solid var(--line);color:var(--mut);font-weight:600}
.btn.gh:hover{border-color:var(--red);color:#fca5a5}
.btn.gh:hover{border-color:var(--red);color:var(--red)}

/* ============ ASSISTANT CHAT ============ */
.chat{background:linear-gradient(168deg,#181b22,#131b28);border:1px solid #232b38;
  border-radius:14px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.chat-h{padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1f2734}
.av{width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;
  box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.av svg{width:100%;height:100%;display:block}
.chat-h .who{color:#fff;font-weight:700;font-size:13.5px}
.chat-h .st{font-size:9.5px;color:var(--ice);letter-spacing:1.3px;text-transform:uppercase;
  font-weight:700;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ice);display:inline-block;
  margin-right:5px;box-shadow:0 0 8px var(--ice)}
.log{max-height:340px;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:88%;font-size:12.8px;line-height:1.6;padding:10px 13px;border-radius:12px;
  white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(150deg,#2f6fed,#173a8f);color:#fff;
  border-bottom-right-radius:3px}
.msg.ai{align-self:flex-start;background:#1a2230;color:#e6eaf2;border:1px solid #27303f;
  border-bottom-left-radius:3px}
.msg.sys{align-self:center;background:none;color:#5b6472;font-size:11px;font-style:italic;padding:2px}
.chat-f{padding:12px 16px;border-top:1px solid #1f2734;display:flex;gap:9px;align-items:flex-end}
.chat-f textarea{flex:1;background:#1c2028;border:1px solid #27303f;border-radius:9px;color:#eceff5;
  font-family:inherit;font-size:12.8px;padding:10px 12px;resize:none;min-height:42px;max-height:120px;line-height:1.5}
.chat-f textarea:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px rgba(47,111,237,.15)}
.send{background:linear-gradient(150deg,#4b8cff,#1a3f9e);border:none;border-radius:9px;color:#fff;
  font-family:inherit;font-weight:800;font-size:12.5px;padding:11px 18px;cursor:pointer;
  letter-spacing:.4px;transition:.14s;flex:none}
.send:hover{filter:brightness(1.1)} .send:disabled{opacity:.45;cursor:default}
.iconbtn{background:#131a26;border:1px solid #27303f;border-radius:9px;color:#9aa3b4;
  font-size:15px;line-height:1;padding:10px 12px;cursor:pointer;flex:none;transition:.14s}
.iconbtn:hover{border-color:var(--blu);color:#fff}
.iconbtn.on{border-color:var(--ice);color:var(--ice)}
.iconbtn.rec{border-color:#f87171;color:#fca5a5;background:rgba(248,113,113,.12);
  animation:pulseRec 1.1s infinite}
@keyframes pulseRec{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}50%{box-shadow:0 0 0 7px rgba(248,113,113,0)}}
.typing{display:inline-flex;gap:3.5px;align-items:center}
.typing i{width:5px;height:5px;border-radius:50%;background:#7a8394;animation:bl 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.foot{text-align:center;font-size:10.5px;color:var(--mut);margin-top:20px;font-style:italic}
.uc{display:inline-block;background:var(--amber);color:#fff;font-size:8.5px;font-weight:800;
  letter-spacing:1.4px;text-transform:uppercase;padding:3px 9px;border-radius:4px}
.wk{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.wkrow{background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:10px 13px;
  margin-bottom:7px;display:flex;gap:12px;align-items:flex-start}
.wkrow .dt{font-size:9.5px;font-weight:800;letter-spacing:1px;color:var(--blu2);
  text-transform:uppercase;white-space:nowrap;padding-top:2px}
.wkrow .bd{flex:1;font-size:12.5px;line-height:1.55;white-space:pre-wrap}

/* ---------- the wall safe ---------- */
.vlock{max-width:460px;margin:26px auto;text-align:center}
.vlock-i{width:70px;height:70px;margin:0 auto 14px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;background:linear-gradient(160deg,#2a2f38,#191d24);
  border:1px solid #3a4150;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.vlock-t b{display:block;font-size:15px;color:var(--ink);letter-spacing:.2px}
.vlock-t i{display:block;font-style:normal;font-size:12.5px;color:var(--mut);margin-top:4px}
.vpin{display:flex;gap:8px;justify-content:center;margin-top:16px}
.vpin input{width:130px;text-align:center;letter-spacing:8px;font-size:19px;padding:11px 10px;
  background:var(--paper2);border:1px solid var(--line);border-radius:9px;color:var(--ink)}
.vpin input:focus{outline:none;border-color:var(--blu)}
.vbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:14px;
  padding:9px 12px;border:1px solid rgba(74,222,128,.28);border-radius:10px;
  background:rgba(74,222,128,.06)}
.vbar-o{font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:#4ade80}
.vbar-n{flex:1;min-width:0;font-size:11.5px;color:var(--mut)}
.vcard td{background:rgba(168,85,247,.05)}
.voff{opacity:.45}
.vuse{font-size:10px;color:var(--mut);margin-top:3px;letter-spacing:.3px}
.vuse.hot{color:var(--amber)}
.vsec{display:flex;gap:4px;align-items:center}
.vsec input{flex:1;min-width:0}
.veye{background:none;border:1px solid var(--line);border-radius:6px;color:var(--mut);
  cursor:pointer;font-size:11px;padding:0 6px;height:28px;flex:none}
.veye:hover{border-color:var(--blu);color:var(--ink)}
.vdel{background:none;border:0;color:#4a5462;cursor:pointer;font-size:17px;line-height:1;padding:2px 5px}
.vdel:hover{color:var(--red)}
.vsel{width:100%;background:var(--paper2);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font-size:12px;padding:6px 7px;font-family:inherit}
.vtog{background:none;border:1px solid var(--line);border-radius:20px;color:var(--mut);
  cursor:pointer;font-size:10px;letter-spacing:.5px;padding:3px 9px;text-transform:uppercase}
.vtog.on{border-color:rgba(74,222,128,.5);color:#4ade80;background:rgba(74,222,128,.09)}

/* =========================================================
   THE DASHBOARD
   The homepage. Quiet, flat, and readable at a glance. Rules it keeps to:
   one blue for anything interactive, numbers in tabular figures so columns
   line up, and no panel taller than a screen without its own scroll.
   ========================================================= */
.vswitch{display:flex;align-items:center;gap:7px;background:var(--raise);
  border:1px solid var(--line);border-radius:9px;padding:8px 13px;cursor:pointer;
  color:var(--mut);font-family:inherit;font-size:11.5px;font-weight:700;
  letter-spacing:.4px;flex:none;transition:.14s}
.vswitch:hover{color:var(--ink);border-color:var(--blu);background:#262b35}
.vs-ic{width:14px;height:14px;display:block;opacity:.85}
.vs-ic svg{width:14px;height:14px;display:block}

.dash{display:none}
body.homeview .dash{display:block;margin-top:12px}
body.homeview .tower{display:none}

/* ---- today ---- */
.dsh-hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:12px;
  margin-bottom:12px}
.dsh-today{background:var(--paper2);border:1px solid var(--line);border-radius:13px;
  padding:16px 18px;min-width:0;position:relative;overflow:hidden}
.dsh-today.amz{border-color:#33405c}
.dsh-today:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--blu)}
.dsh-today.amz:before{background:#5b78a8}
.dsh-today.tick:before{background:var(--green)}
.dt-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:3px}
.dt-day{font-size:19px;font-weight:800;letter-spacing:-.4px}
.dt-dat{font-size:11px;color:var(--mut);font-weight:700;letter-spacing:.8px;
  text-transform:uppercase}
.dt-tag{font-size:9.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  border-radius:20px;padding:3px 10px;border:1px solid}
.dt-tag.amz{color:#a8bde0;border-color:#3d4d6b;background:rgba(91,120,168,.14)}
.dt-tag.off{color:var(--green);border-color:rgba(95,179,124,.4);background:rgba(95,179,124,.1)}
.dt-plan{font-size:14px;line-height:1.6;white-space:pre-wrap;margin-top:9px;
  min-height:44px;color:var(--ink)}
.dt-plan.none{color:var(--mut);font-style:italic}
.dt-act{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.dt-tk{background:none;border:1px solid var(--line);border-radius:8px;padding:8px 14px;
  color:var(--mut);font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;
  letter-spacing:.4px;transition:.14s}
.dt-tk:hover{border-color:var(--blu);color:var(--ink)}
.dt-tk.on{border-color:rgba(95,179,124,.5);color:var(--green);background:rgba(95,179,124,.1)}

/* the next thing that needs doing */
.dsh-next{background:var(--paper2);border:1px solid var(--line);border-radius:13px;
  padding:15px 17px;min-width:0;display:flex;flex-direction:column}
.dn-h{font-size:9.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  color:var(--blu2);margin-bottom:11px}
.dn-row{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid #23282f;
  font-size:12.5px}
.dn-row:first-of-type{border-top:0}
.dn-row b{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.dn-row i{font-style:normal;color:var(--mut);font-size:11px;flex:none}
.dn-dot{width:7px;height:7px;border-radius:50%;flex:none}
.dn-clear{color:var(--mut);font-size:12.5px;padding:12px 0}

/* ---- the seven days ---- */
.dsh-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;
  margin-bottom:14px}
.dw-d{background:var(--paper2);border:1px solid var(--line);border-radius:11px;
  padding:11px 11px 13px;min-width:0;min-height:112px;cursor:pointer;transition:.14s;
  display:flex;flex-direction:column}
.dw-d:hover{border-color:var(--blu)}
.dw-d.now{border-color:var(--blu);background:#1e2530}
.dw-d.done{opacity:.62}
.dw-n{font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--mut);display:flex;justify-content:space-between;align-items:center;gap:4px}
.dw-d.now .dw-n{color:var(--blu2)}
.dw-tick{color:var(--green);font-size:11px}
.dw-lab{font-size:9.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;
  margin-top:5px;color:#7f8b9c}
.dw-d.amz .dw-lab{color:#a8bde0}
.dw-p{font-size:11.5px;line-height:1.45;color:var(--ink);margin-top:7px;flex:1;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.dw-p.none{color:#5f6875;font-style:italic}

/* ---- the numbers ---- */
.dsh-kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.dk-c{background:var(--paper2);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;min-width:0;cursor:pointer;transition:.14s}
.dk-c:hover{border-color:var(--blu)}
.dk-h{font-size:9px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;
  color:var(--mut)}
.dk-v{font-size:26px;font-weight:800;letter-spacing:-1.1px;margin-top:5px;
  font-variant-numeric:tabular-nums;line-height:1.05}
.dk-v.g{color:var(--green)} .dk-v.b{color:var(--blu2)}
.dk-v.a{color:var(--amber)} .dk-v.r{color:var(--red)}
.dk-d{font-size:10.5px;color:var(--mut);margin-top:4px}

/* ---- panels ---- */
.dsh-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:12px}
.dp{background:var(--paper2);border:1px solid var(--line);border-radius:13px;
  min-width:0;display:flex;flex-direction:column;overflow:hidden}
.dp-h{display:flex;align-items:center;gap:9px;padding:13px 16px 11px;
  border-bottom:1px solid #23282f}
.dp-t{flex:1;min-width:0;font-size:12.5px;font-weight:700;letter-spacing:.2px}
.dp-t em{font-style:normal;color:var(--mut);font-weight:600;font-size:11px;margin-left:6px}
.dp-go{background:none;border:1px solid var(--line);border-radius:7px;padding:5px 11px;
  color:var(--mut);font-family:inherit;font-size:10.5px;font-weight:700;cursor:pointer;
  letter-spacing:.4px;flex:none;transition:.14s;white-space:nowrap}
.dp-go:hover{border-color:var(--blu);color:var(--ink)}
.dp-b{padding:6px 16px 15px;min-width:0}
.dp-b.tight{padding-top:2px}
.dp-scr{max-height:290px;overflow-y:auto}
.dp-none{color:var(--mut);font-size:12.5px;padding:18px 0;text-align:center}

/* a person to call */
.dcall{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #23282f}
.dcall:first-child{border-top:0}
.dcall .who{flex:1;min-width:0}
.dcall .who b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.dcall .who i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);
  margin-top:2px;font-variant-numeric:tabular-nums}
.dcall .prdot2{width:8px;height:8px;border-radius:50%;background:#a855f7;flex:none}
.dcall .owe{font-size:11.5px;font-weight:700;color:var(--amber);
  font-variant-numeric:tabular-nums;flex:none}
.dcall .dbtn{background:rgba(75,123,212,.16);border:1px solid rgba(75,123,212,.5);
  border-radius:7px;padding:6px 12px;color:var(--blu2);font-family:inherit;
  font-size:10.5px;font-weight:800;letter-spacing:.6px;cursor:pointer;flex:none;transition:.14s}
.dcall .dbtn:hover{background:rgba(75,123,212,.3);color:#fff}
.dcall .dbtn[disabled]{opacity:.35;cursor:default}

/* stage bars */

/* =========================================================
   MOBILE  —  phone-first layout
   ========================================================= */
/* ---------------------------------------------------------------
   EVERYTHING BELOW IS THE PHONE.
   It has to be the LAST thing in this stylesheet. It used to sit near the
   top, which meant several hundred desktop rules came after it and quietly
   won on source order. A later rule setting .wtitle back to display flex beat
   the phone rule hiding it, so the window title bar reappeared on phones, and
   a later wrapping rule beat the single scrolling row of tabs. Same
   specificity, later wins. Keeping the phone rules last is the whole fix.
   --------------------------------------------------------------- */

/* ==================== PHONE ====================
   Everything here is inside a max-width query, so the desktop layout is
   untouched. The building is NOT hidden on a phone — it is the point of the
   app. It is shown small, and tapping a room zooms the drawing into that room
   so every desk, door and screen inside is big enough to hit with a thumb. */
.mstack, .mtopstats, .mzoom{display:none}

@media (max-width: 820px){

  /* The markup order suits a desktop. On a phone the column is reordered so it
     reads: numbers, building, zoom strip, then whatever is open. */
  /* THE ONE THAT BROKE EVERYTHING.
     .tower is a flex column, and a flex child defaults to min-width:auto —
     "never shrink below your own content". The zoom strip's content is ~718px
     wide, so it refused to be 390 and dragged .tower, .sect and .wrap out to
     718 with it. Every panel then inherited that width and ran off the screen.
     overflow-x:auto on the strip did nothing, because the element itself was
     the thing refusing to be narrow.

     min-width:0 on every child is the fix. Then the strip scrolls inside 390px
     instead of making the page 718px. */
  .tower{padding:0;border:0;background:none;box-shadow:none;
    display:flex;flex-direction:column;min-width:0;max-width:100%}
  .tower > *{min-width:0;max-width:100%}
  .wrap, .sect{min-width:0;max-width:100%;overflow-x:clip}
  #mtopstats{order:0}
  .tower > svg.bld{order:1}
  #mzoom{order:2}
  #mstack{order:3}
  #wins{order:4}
  #taskbar{order:5}
  #roomsm{order:6}

  /* ---- the building, always visible ---- */
  /* THE BLACK BARS.
     An SVG always keeps the shape of its viewBox. Set width:100% and the height
     follows exactly, and there is no spare room — no bars. Put ANY max-height on
     it and the box becomes wider than the drawing wants, so the drawing centres
     itself and pads both sides with background. That was the black space.

     So: no max-height, ever. Width drives, height follows, the drawing fills the
     frame edge to edge at every zoom level. A room crop that happens to be tall
     is simply tall — which is right, because it is legible. */
  .tower > svg.bld{display:block;width:100%;height:auto;max-width:100%;max-height:none;
    border-radius:12px;background:#181c23;border:1px solid #1b2230;
    touch-action:pan-x pan-y pinch-zoom}
  body.mroom .tower > svg.bld{max-height:none}
  /* the frame around it must not add its own margin either */
  .tower{padding:0;border:0;background:none;box-shadow:none}
  .hotlinks{overflow:hidden}

  .navb, .rtip, .wgrip, .scrim, .rooms-m, .taskbar{display:none !important}

  /* ---- the numbers ---- */
  .mtopstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:9px}
  .mstat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);
    border-radius:9px;padding:9px 6px;text-align:center;min-width:0}
  .mstat b{display:block;font-size:16px;font-weight:800;color:#fff;letter-spacing:-.6px;
    font-variant-numeric:tabular-nums;line-height:1}
  .mstat i{display:block;font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:.7px;
    text-transform:uppercase;color:var(--mut);margin-top:4px;line-height:1.2}

  /* ---- the zoom strip ---- */
  .mzoom{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    -webkit-overflow-scrolling:touch;margin:9px 0 4px;padding-bottom:2px;
    min-width:0;max-width:100%}
  .mzoom::-webkit-scrollbar{display:none}
  .mzb{flex:none;display:flex;align-items:center;gap:6px;min-height:42px;padding:0 13px;
    border-radius:10px;cursor:pointer;font-family:inherit;font-size:12px;font-weight:800;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:#a9b3c2;
    white-space:nowrap;-webkit-tap-highlight-color:transparent}
  .mzb i{font-style:normal;font-size:15px;line-height:1}
  .mzb.on{background:color-mix(in srgb,var(--ac,#3b82f6) 20%,transparent);
    border-color:var(--ac,#3b82f6);color:#fff}
  .mzb.wide{flex:1;justify-content:center}

  /* ---- the stack ---- */
  .mstack{display:block}

  .mquick{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:11px}
  .mquick button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
    min-height:68px;padding:9px 4px;border-radius:11px;cursor:pointer;font-family:inherit;
    background:linear-gradient(160deg,#1f242c,#232830);border:1px solid #232c3a;
    color:#c9d2df;font-size:10.5px;font-weight:800;line-height:1.2;text-align:center;
    -webkit-tap-highlight-color:transparent}
  .mquick button i{font-style:normal;font-size:20px;line-height:1}
  .mquick button:active{border-color:#3b82f6;color:#fff}

  .mrooms{display:flex;flex-direction:column;gap:8px}
  .mroom{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    background:linear-gradient(160deg,#1c2028,#1e2229);
    border:1px solid #232c3a;border-left:3px solid var(--ac);
    border-radius:12px;padding:13px 14px;cursor:pointer;font-family:inherit;
    min-height:66px;-webkit-tap-highlight-color:transparent}
  .mroom:active{background:linear-gradient(160deg,#232830,#262b34);border-color:var(--ac)}
  .mri{font-size:23px;line-height:1;flex:none;width:28px;text-align:center}
  .mrt{flex:1;min-width:0}
  .mrt b{display:block;font-size:15.5px;font-weight:800;color:#fff;letter-spacing:-.2px}
  .mrt i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:3px;line-height:1.35}
  .mrc{flex:none;font-size:15px;color:var(--ac)}

  .mgo{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}
  .mgo button{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);
    border-radius:10px;padding:14px 8px;color:#a9b3c2;font-family:inherit;font-size:12px;
    font-weight:800;cursor:pointer}
  .mgo button:active{background:rgba(255,255,255,.1);color:#fff}

  /* ---- the room header ---- */
  .mrhd{display:flex;align-items:center;gap:11px;position:sticky;top:0;z-index:8;
    margin:6px 0 9px;padding:9px 11px;border-radius:12px;
    background:rgba(9,13,19,.95);backdrop-filter:blur(9px);
    border:1px solid #232c3a;border-left:3px solid var(--ac)}
  .mrbk{flex:none;width:42px;height:42px;border-radius:10px;font-size:25px;line-height:1;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);
    color:#dbe3ee;font-family:inherit;cursor:pointer;padding:0 0 3px}
  .mrbk:active{background:rgba(255,255,255,.14)}
  .mrhn{flex:1;min-width:0}
  .mrhn b{display:block;font-size:15px;font-weight:800;color:#fff;letter-spacing:-.2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrhn i{display:block;font-style:normal;font-size:8px;font-weight:800;letter-spacing:1.1px;
    text-transform:uppercase;color:var(--mut);margin-top:3px}
  .mrhi{flex:none;font-size:21px}

  /* ---- windows become the page ----
     Everything in here is belt and braces against a single wide child pushing
     the whole panel off the screen. min-width:0 is the important one: a flex or
     grid child defaults to min-width:auto, which refuses to shrink below its
     content, and one long email address or unbroken URL then drags the entire
     row wider than the phone. */
  .wins{position:static;inset:auto;pointer-events:auto;max-width:100%;overflow-x:hidden}
  .win, .wbody, .wbody > *{max-width:100%;min-width:0}
  .wbody{overflow-x:hidden}
  .wbody div, .wbody section, .wbody label, .wbody p, .wbody span{min-width:0}
  .wbody table{table-layout:fixed;width:100%}
  .wbody pre, .wbody code{white-space:pre-wrap;word-break:break-word}
  .wbody a, .wbody b, .wbody i, .wbody td, .wbody th{overflow-wrap:anywhere}
  .mono{overflow-wrap:anywhere}
  .grid2 > *, .grid3 > *, .lc-g > *, .af-grid > *, .dirhead > *{min-width:0}
  .card, .kpi, .cardv{min-width:0;max-width:100%}
  .card .v, .cchero b{overflow-wrap:anywhere}
  .win{position:static !important;left:auto !important;top:auto !important;
    width:auto !important;height:auto !important;min-width:0;
    margin:0;border:0;background:none;box-shadow:none;z-index:auto !important}
  .wtitle{display:none}
  .wbody{overflow:visible;max-height:none;padding:0 0 26px}

  /* one scrolling row, never four stacked ones. The base .tabs rule sets
     flex-wrap:wrap and display:flex alone does not undo it. */
  .wbody .tabs{position:sticky;top:56px;z-index:6;display:flex;flex-wrap:nowrap;
    gap:6px;overflow-x:auto;overflow-y:hidden;min-width:0;max-width:100%;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -2px 12px;
    padding:9px 2px;border-bottom:0;
    background:rgba(9,13,19,.96);backdrop-filter:blur(9px);border-radius:10px}
  .wbody .tabs::-webkit-scrollbar{display:none}
  /* the dead space where the hidden title bar used to be */
  .win{gap:0}
  .wbody{padding-top:0}
  .wbody .tabs::-webkit-scrollbar{display:none}
  .wbody .tab{flex:none;padding:0 16px;font-size:13.5px;min-height:46px;
    display:flex;align-items:center}
  /* anything scrolled to must clear the sticky header and tabs */
  .wbody > *, .wbody table tr{scroll-margin-top:124px}

  .tbox{position:static;left:auto;top:auto;transform:none;width:auto;margin-top:9px}
  .tbox.show{transform:none}
  .tb-face{width:58px;height:58px}
  .tb-line{font-size:13px}

  /* ================= TYPING =================
     16px is the threshold below which iOS zooms the whole page on focus, which
     is what made every field feel like a fight. Everything that takes text is
     at least that, and at least 48px tall so a thumb can find it. */
  input, textarea, select{font-size:16px !important;line-height:1.45}
  input, select{min-height:48px}
  textarea{min-height:88px}
  select, .jsel, .stsel{min-height:48px;padding:11px 12px}
  button, .cbtn, .fdbtn, .tbi{min-height:46px}
  /* the day tick on The Week was 19px — too small to hit reliably */
  /* both of these were a couple of pixels under a comfortable thumb — 34 and 36
     on a 40-ish target. Rounded up so the sweep is clean rather than nearly. */
  .chk{min-height:0;width:42px;height:42px;font-size:18px}
  .mc, .qd{min-height:0}
  .xbtn{min-height:0}
  .xbtn{width:42px;height:42px;font-size:19px}
  .mnav{min-height:46px;min-width:50px;font-size:16px}
  .mnav.today{min-width:0;font-size:12px}
  .sin,.vin,.cin,.lin{padding:12px 13px}
  .cn{min-height:48px;padding:11px 12px}
  .qrow input,.addbar input{min-height:50px}
  .qrow button,.addbar button{min-height:50px;font-size:14px}
  .bkrow{flex-wrap:wrap}
  .bkrow i{flex:1 1 100%;min-width:0;margin-bottom:3px}
  .bkrow input{flex:1 1 100%;min-height:48px;padding:11px 12px}

  /* talking to an agent should feel like a messaging app: the log takes what is
     left, the composer stays put. 100dvh shrinks when the keyboard opens.

     The plan above is hidden the moment a chat is open, because a keyboard plus
     a floor plan plus a conversation does not fit on a phone and the chat is
     what you came for. The zoom strip still gets you out. */
  body.mchatopen .tower > svg.bld{display:none}
  body.mchatopen .mtopstats{display:none}

  body.mroom .chat{display:flex;flex-direction:column;
    height:calc(100dvh - 260px);min-height:300px;border-radius:12px}
  body.mroom.mchatopen .chat{height:calc(100dvh - 150px)}
  .chat, .chat *{max-width:100%}
  .chat .log{overflow-x:hidden}
  .msg{word-break:break-word;overflow-wrap:anywhere}
  .chat-f{flex-wrap:nowrap}
  .chat-f textarea{min-width:0}
  body.mroom .chat .chat-h{flex:none}
  body.mroom .chat .log{flex:1 1 auto;max-height:none;overflow-y:auto;
    -webkit-overflow-scrolling:touch}
  body.mroom .chat-f{flex:none;position:sticky;bottom:0;z-index:4;
    background:rgba(9,13,19,.97);backdrop-filter:blur(9px);
    padding:11px 12px calc(11px + env(safe-area-inset-bottom))}
  body.mroom .chat-f textarea{min-height:50px;max-height:132px}
  body.mroom .chat-f .send{min-height:50px;padding:0 18px}
  body.mroom .chat-f .iconbtn{min-height:50px;min-width:50px}

  /* ---- one column everywhere ---- */
  .grid2, .grid3, .stu-g, .stu-g2, .lc-g, .ccp, .wbcols,
  .macs, .mrow, .mrow5, .tform, .wtrow, .af-grid{
    display:grid !important;grid-template-columns:1fr !important;gap:9px}
  .qrow, .addbar, .fdtools, .lc-act{display:flex !important;flex-wrap:wrap;gap:8px}
  .qrow input, .addbar input{flex:1 1 100%}
  .qrow button, .addbar button, .mrow button, .mrow5 button{flex:1 1 100%;padding:14px;height:auto}
  .fdbtn{flex:1 1 100%;text-align:center}
  .lc-act .cbtn{flex:1 1 46%;justify-content:center;text-align:center}
  .tlab{display:none}

  .wk{grid-template-columns:1fr 1fr;gap:8px}
  .wplan{min-height:78px}
  .mgrid,.calday{gap:4px}
  .mc{font-size:13px}
  .t7{grid-template-columns:repeat(4,1fr)}
  .lib{grid-template-columns:1fr 1fr}
  .dirhead{grid-template-columns:1fr 1fr}
  .dircopy .btn{flex:1 1 100%;text-align:center}
  .wkp-h{flex-wrap:wrap}
  .wkp-go{flex:1 1 100%;min-height:48px}

  /* ---- search sticks under the tabs ---- */
  .lsrch{position:sticky;top:112px;z-index:5;flex-wrap:wrap;margin:10px -2px 9px;
    padding:8px 2px;background:rgba(9,13,19,.97);backdrop-filter:blur(9px);border-radius:10px}
  .lsrch input{flex:1 1 auto;min-height:48px}
  .lscount{flex:1 1 100%;order:3}
  .scroll{max-height:none;overflow:visible;border:0;background:none}
  .scroll.big{max-height:none;overflow:visible;border:0;background:none}

  .pills{gap:6px}
  .pill{min-height:42px;font-size:12.5px;padding:0 14px;display:inline-flex;align-items:center}
  .openlead{font-size:16px;font-weight:800}
  .diract{display:flex;gap:7px}
  .dbtn{width:46px;height:46px;font-size:17px;margin:0}
  .con-g{grid-template-columns:repeat(3,1fr)}
  .con-n b{font-size:20px}
  .pgrp{margin:16px 0 7px}
  .micbar{left:8px;right:8px;transform:none;max-width:none;flex-wrap:wrap}
  .mb-w{flex:1 1 100%;order:3;max-height:60px}
  .dlr{flex-wrap:wrap;padding:13px}
  .dlm{flex:1 1 calc(100% - 40px)}
  .dl-act{flex:1 1 100%;margin-top:11px}
  .dl-call{flex:1}
  .dl-num{font-size:16px}

  /* ---- tables become cards ----
     The label used to sit in a 30% column beside the value, which left the value
     about 200px wide and squashed every name, email and note into a thin ribbon.
     The label now goes ABOVE its value on its own line, so the value gets the
     full width of the card. Taller, but readable, and everything lines up. */
  .wbody table{display:block;border:0;table-layout:auto}
  .wbody table thead{display:none}
  .wbody table tbody,.wbody table tr,.wbody table td{display:block;width:auto !important}
  .wbody table tr{margin-bottom:12px;padding:15px 14px;border:1px solid rgba(255,255,255,.1);
    border-radius:13px;background:rgba(255,255,255,.035)}
  .wbody table td{display:block;padding:0 0 13px;border:0}
  .wbody table td:last-child{padding-bottom:0}
  .wbody table td:before{content:attr(data-l);display:block;margin-bottom:6px;
    font-size:8.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--mut)}
  /* Only the things you type into should stretch. The blanket width:100% was
     also hitting the priority dot and turning it into a full-width ellipse. */
  .wbody table td > input,
  .wbody table td > textarea,
  .wbody table td > select{width:100%}
  .wbody table td > *{min-width:0;max-width:100%}
  /* the blanket 46px minimum for buttons was stretching it into a pill */
  /* Looks like a 26px dot, but the tappable box is 40px. background-clip keeps
     the colour inside the content box so the padding is invisible. */
  .prdot{width:40px;height:40px;min-height:0 !important;flex:none;border-radius:50%;
    padding:7px;background-clip:content-box;box-sizing:border-box}
  .wbody table td:has(> .prdot){top:8px;right:8px}
  .wbody table td[data-l="Priority"]{top:8px;right:8px}
  .wbody table td.nm-c{padding-bottom:11px;border-bottom:1px solid rgba(255,255,255,.07);
    margin-bottom:12px}
  .wbody table td.nm-c:before{display:none}
  .wbody table td.nm-c .openlead{font-size:17px;font-weight:800;text-align:left}
  /* the priority dot belongs beside the name, not on a line of its own */
  /* the dot belongs in the top-right corner of the card, beside the name */
  .wbody table tr{position:relative}
  /* The data-l value is written from the column header at render time, so it is
     the bullet glyph rather than the word. Match on the cell that actually
     contains the dot instead of trusting the label. */
  .wbody table td:has(> .prdot){position:absolute;top:13px;right:13px;
    width:auto !important;padding:0;margin:0;z-index:2}
  .wbody table td:has(> .prdot):before{display:none}
  .wbody table td[data-l="Priority"]{position:absolute;top:13px;right:13px;
    width:auto !important;padding:0;margin:0;z-index:2}
  .wbody table td[data-l="Priority"]:before{display:none}
  .wbody table td.nm-c{padding-right:44px}

  /* room to breathe everywhere else */
  .wbody h4.sh{margin-top:20px;font-size:9.5px;letter-spacing:1.6px}
  .wbody .card{padding:14px 15px}
  .wbody .info,.wbody .hint,.wbody .alert{font-size:12.5px;line-height:1.6;padding:13px 14px}
  .wbody label{display:block;margin-bottom:11px}
  .wbody .note-c{font-size:11.5px;line-height:1.55}
  .lg{font-size:11px}
  .legend{gap:9px;line-height:1.8}

  .chat .log{max-height:52vh}
  .msg{max-width:92%;font-size:14.5px}
  .lc-nm{font-size:17px}
  .cchero > div:first-child b{font-size:28px}
  .mtoggle{right:10px;bottom:calc(10px + env(safe-area-inset-bottom))}
  .mchat{position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;
    max-height:84vh;border-radius:15px 15px 0 0;z-index:60}
  .scrpart{font-size:9px;letter-spacing:1.6px;padding:9px 11px}
}

/* ---- what is left of the old phone stylesheet ----
   This block predates the rewrite. Most of it styled a UI that no longer
   exists — .panel, .kpis, .tbar, .p-h, .reopen all have zero usages now — and
   because it sits AFTER the main phone block it was quietly overriding it. In
   particular it forced svg.bld to min-width 620px and put the building in a
   sideways-scrolling box, which is exactly why the plan ran off the screen.
   What survives here is only the handful of rules that do not fight anything. */
@media (max-width:820px){

<script>
/* ==================== VERCEL SHIM ====================
   On Cowork this page talked to the outside world through window.cowork. On
   your own server that object does not exist, so this rebuilds it against the
   API routes in /api. Every call in the app below is unchanged — it still says
   window.cowork.callMcpTool(...) and window.cowork.askClaude(...).

   Nothing secret lives here. The Supabase key and the Anthropic key stay on the
   server; this page only ever holds the sign-in token. */
(function(){
  /* ONE FILE, TWO HOMES.
     Inside Cowork, window.cowork already exists and the real connectors are
     live — so this shim stands down completely and the page behaves exactly as
     it always has. On your own server there is no window.cowork, so the shim
     installs itself and routes everything through /api instead.

     That means there is only ever one file to edit. No divergence, no second
     copy to keep in step. */
  var HOSTED = !(window.cowork && typeof window.cowork.callMcpTool === "function");
  if (!HOSTED) return;                       // running in Cowork — nothing to do

  var TOKEN = null;
  try { TOKEN = localStorage.getItem("exodus_hq_token"); } catch(e){}

  function post(path, payload){
    return fetch(path, {
      method:"POST",
      headers: Object.assign({"Content-Type":"application/json"},
                             TOKEN ? {"x-hq-token":TOKEN} : {}),
      body: JSON.stringify(payload||{})
    }).then(function(r){
      return r.json().catch(function(){return {};}).then(function(j){
        if(r.status===401){ signOut(); throw new Error("Signed out. Reload and sign in."); }
        if(!r.ok) throw new Error((j && j.error) || ("Request failed ("+r.status+")"));
        return j;
      });
    });
  }

  /* ---- the gate ---- */
  function signOut(){
    TOKEN=null;
    try{ localStorage.removeItem("exodus_hq_token"); }catch(e){}
    showGate("Session ended. Sign in again.");
  }
  window.exodusSignOut = signOut;

  function showGate(msg){
    var g=document.getElementById("hqgate");
    if(g){ g.style.display="flex";
      var e=document.getElementById("hqgate-err"); if(e) e.textContent=msg||"";
      var i=document.getElementById("hqgate-pw"); if(i){ i.value=""; i.focus(); }
      return; }
    document.body.insertAdjacentHTML("afterbegin",
      '<div id="hqgate" style="position:fixed;inset:0;z-index:99999;display:flex;'
      +'align-items:center;justify-content:center;background:#05070b">'
      +'<div style="width:min(340px,90vw);text-align:center;font-family:ui-sans-serif,system-ui,sans-serif">'
      +'<div style="width:52px;height:52px;margin:0 auto 16px;border-radius:13px;'
      +'background:linear-gradient(150deg,#4b8cff,#12327d);display:flex;align-items:center;'
      +'justify-content:center;color:#eaf2ff;font-weight:800;font-size:20px">EX</div>'
      +'<div style="font-size:11px;letter-spacing:3px;color:#7dd3fc;font-weight:800;'
      +'text-transform:uppercase;margin-bottom:18px">Exodus HQ</div>'
      +'<input id="hqgate-pw" type="password" placeholder="Password" '
      +'style="width:100%;background:#0b1017;border:1px solid #2b3446;border-radius:9px;'
      +'padding:12px 14px;color:#fff;font-family:inherit;font-size:15px;text-align:center">'
      +'<button id="hqgate-go" style="width:100%;margin-top:9px;background:rgba(47,111,237,.24);'
      +'border:1px solid rgba(47,111,237,.6);border-radius:9px;padding:12px;color:#cfe0ff;'
      +'font-family:inherit;font-size:12px;font-weight:800;letter-spacing:1.2px;cursor:pointer">'
      +'UNLOCK</button>'
      +'<div id="hqgate-err" style="min-height:18px;margin-top:11px;font-size:12px;'
      +'color:#f87171;font-weight:700">'+(msg||"")+'</div></div></div>');
    var go=document.getElementById("hqgate-go"), pw=document.getElementById("hqgate-pw");
    function tryIt(){
      var err=document.getElementById("hqgate-err");
      err.textContent="Checking…"; err.style.color="#7dd3fc";
      fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({password:pw.value})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
        .then(function(o){
          if(!o.ok){ err.style.color="#f87171"; err.textContent=o.j.error||"Wrong password."; return; }
          TOKEN=o.j.token;
          try{ localStorage.setItem("exodus_hq_token",TOKEN); }catch(e){}
          document.getElementById("hqgate").remove();
          if(typeof boot==="function") boot();
        })
        .catch(function(){ err.style.color="#f87171"; err.textContent="Could not reach the server."; });
    }
    go.onclick=tryIt;
    pw.onkeydown=function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); tryIt(); } };
    pw.focus();
  }

  /* ---- the connector stand-in ---- */
  window.cowork = {
    callMcpTool: function(name, args){
      args = args || {};
      /* Supabase SQL is the only MCP tool the app still needs on this host.
         Drive, Gmail and Calendar are handled differently now — see below. */
      if (String(name).indexOf("execute_sql") >= 0) {
        return post("/api/db", { query: args.query }).then(function(j){
          /* the app expects the Cowork envelope, so hand back the same shape */
          return { content: [{ text: JSON.stringify(j.rows || []) }] };
        }).catch(function(e){
          return { isError: true, content: [{ text: String(e.message || e) }] };
        });
      }
      /* Gmail form scraping is replaced by the /api/form webhook — submissions
         are already in Postgres, so report none rather than pretending to read
         a mailbox. The Front Desk tab reads them out of the database. */
      if (String(name).indexOf("search_threads") >= 0)
        return Promise.resolve({ content: [{ text: JSON.stringify({ threads: [] }) }] });
      /* Drive sheet: Supabase is the source of truth on this host. */
      if (String(name).indexOf("read_file_content") >= 0)
        return Promise.resolve({ content: [{ text: JSON.stringify({ fileContent: "" }) }] });
      /* Reading the calendar. This used to hand back an empty list, which is why
         nothing ever showed on the live site even with a Google token set. */
      if (String(name).indexOf("list_events") >= 0)
        return post("/api/voice?route=events", args).then(function(j){
          return { content: [{ text: JSON.stringify({ events: (j && j.events) || [] }) }] };
        }).catch(function(){
          /* not connected, or Google said no — an empty week, not a broken page */
          return { content: [{ text: JSON.stringify({ events: [] }) }] };
        });
      if (String(name).indexOf("create_event") >= 0)
        return post("/api/calendar", args).then(function(j){
          return { content: [{ text: JSON.stringify(j) }] };
        }).catch(function(e){
          return { isError: true, content: [{ text: String(e.message || e) }] };
        });
      return Promise.resolve({ content: [{ text: "{}" }] });
    },

    askClaude: function(prompt, data){
      return post("/api/chat", { prompt: prompt, data: data })
        .then(function(j){ return j.text || ""; });
    }
  };

  /* Hold the app until it is unlocked. boot() runs from the gate instead. */
  window.__EXODUS_HOSTED__ = true;
  if(!TOKEN){
    document.addEventListener("DOMContentLoaded", function(){ showGate(""); });
  }
})();
</script>

<script>
/* ================= WHEN SOMETHING BREAKS, SAY SO =================
   A blank page tells you nothing and tells me less. Anything that throws while
   the app is starting now paints itself on screen — the message, the file and
   the line — so instead of "Safari will not open" there is something to read
   and send me. Costs nothing when everything is fine. */
(function(){
  var shown=false;
  function paint(title, detail){
    if(shown) return; shown=true;
    try{
      var d=document.createElement("div");
      d.setAttribute("style",
        "position:fixed;inset:0;z-index:99999;overflow:auto;"
        +"background:#0a0d12;color:#e8eef5;padding:22px 18px;"
        +"font:14px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;"
        +"-webkit-text-size-adjust:100%");
      d.innerHTML =
        '<div style="max-width:640px;margin:0 auto">'
        +'<div style="font-size:10px;font-weight:800;letter-spacing:2px;'

function inZone(tz,d){
  d=d||new Date();
  try{
    var f=new Intl.DateTimeFormat("en-GB",{timeZone:tz,hour:"2-digit",minute:"2-digit",
      hour12:false,weekday:"short",day:"2-digit",month:"short"});
    var parts={}; f.formatToParts(d).forEach(function(p){parts[p.type]=p.value;});
    var H=parseInt(parts.hour,10), M=parseInt(parts.minute,10);
    var h12=H%12; if(h12===0)h12=12;
    var mm2=(M<10?"0":"")+M;
    return {hh:H,mm:M,
            wd:parts.weekday,day:parts.day,mon:parts.month,
            txt:h12+":"+mm2,                       /* 7:25 */
            ampm:(H<12?"AM":"PM"),
            full:h12+":"+mm2+" "+(H<12?"AM":"PM")};
  }catch(e){
    var H2=d.getHours(),M2=d.getMinutes(),h2=H2%12||12,m2=(M2<10?"0":"")+M2;

/* ---- a real clock face, hands set from your local time ---- *//* ---- a real clock face, hands set from your local time ---- */
function clockFace(cx,cy,r,face,rim,hands,tz){
  face=face||"#0f141b"; rim=rim||"#c8a86a"; hands=hands||"#e8edf5";
  var t=inZone(tz||localTZ());
  var hA=((t.hh%12)+t.mm/60)*30-90;
  var mA=t.mm*6-90;
  var g='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+face+'"/>';
  g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+rim+'" stroke-width="'+(r*0.11)+'" opacity=".9"/>';
  for(var k=0;k<12;k++){
    var a=k*30*Math.PI/180, lo=r*0.78, hi=r*0.9;
    g+='<line x1="'+(cx+Math.cos(a)*lo)+'" y1="'+(cy+Math.sin(a)*lo)
      +'" x2="'+(cx+Math.cos(a)*hi)+'" y2="'+(cy+Math.sin(a)*hi)
      +'" stroke="'+hands+'" stroke-width="'+(k%3===0?r*0.09:r*0.05)+'" opacity="'+(k%3===0?".9":".5")+'"/>';}
  g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(hA*Math.PI/180)*r*0.48)
    +'" y2="'+(cy+Math.sin(hA*Math.PI/180)*r*0.48)+'" stroke="'+hands+'" stroke-width="'+(r*0.11)+'" stroke-linecap="round"/>';
  g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(mA*Math.PI/180)*r*0.7)
    +'" y2="'+(cy+Math.sin(mA*Math.PI/180)*r*0.7)+'" stroke="'+hands+'" stroke-width="'+(r*0.075)+'" stroke-linecap="round"/>';
  g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*0.1)+'" fill="'+rim+'"/>';
  return g;}

/* Who is in the building right now, driven by the real local hour. */
function shift(){
  var h=nowHour(), wd=new Date().getDay(), mn=new Date().getMinutes();
  return {
    hour:h, minute:mn,
    /* ---- THE RULES OF THE BUILDING ----
       Doors close at ten. After that the only people in here are Glen, the
       three agents, the night cleaner and the guard on patrol. Everyone else
       has a life and goes home. The gym is the one exception — it stays open
       later than the desks, because that is the point of a gym. */
    closed:  h>=22 || h<5.5,           /* building locked to staff and guests */
    night:   h>=22 || h<5.5,
    guard:   h>=21.5 || h<6,           /* security overlaps the close */
    cleaning:(h>=6.5&&h<8.5) || (h>=22&&h<23.5),   /* morning crew, night crew */
    core:    h>=9 && h<18,             /* full floor */
    early:   h>=8.5 && h<9,
    evening: h>=18 && h<21.5,
    gymOpen: h>=5.5 && h<22.5,         /* open before the desks, shuts after */
    weekend: wd===0||wd===6,
    /* Where Glen is. He was only ever at the desk or by the drinks cabinet, on a
       flat half-hour switch, which read as a man twitching between two spots.
       Now the hour drives a proper rotation: mostly his office, but he does the
       rounds — the sales floor, the gym, the studio — and comes back. */
    glenWalking: (h%1)>=0.5,

function digits(s){return String(s||"").replace(/\D/g,"");}
function last10(s){var d=digits(s);return d.length>10?d.slice(-10):d;}
/* ================= IS THIS ACTUALLY A PHONE NUMBER? =================
   Glen tapped Dial and got connected to a spam line. The cause was this app
   assuming any ten digits must be American and stamping +1 on the front.
   PARTEEK GOEL is stored as 9996426347 — a perfectly good Indian mobile — and
   +19996426347 is not a real number anywhere, because 999 was never assigned
   as a US area code. Twilio dutifully routed it into the junk network.

   So: nothing gets dialed unless it is provably dialable. North American
   numbers are checked against the actual NANP rules. Anything else has to
   carry its own country code. No guessing, ever. */
function nanpWhy(d){
  if(d.length!==10) return "wrong length for a US number";
  var area=d.slice(0,3), exch=d.slice(3,6);
  if(area[0]==="0"||area[0]==="1") return "no US area code starts with "+area[0];
  if(exch[0]==="0"||exch[0]==="1") return "no US exchange starts with "+exch[0];
  if(area[1]==="1"&&area[2]==="1") return area+" is a service code, not an area code";
  if(area==="999") return "999 was never assigned as a US area code";
  if(area==="555") return "555 is a fictional area code";
  if(exch==="555"&&d.slice(6,8)==="01") return "555-01xx is a fictional number";
  return null;                                        /* null means it is fine */
}
function nanpOk(d){ return nanpWhy(d)===null; }

/* Returns the number to dial, or why it cannot be dialed. Never a guess. */
function dialable(raw){
  var t=String(raw||"").trim();
  if(!t) return {ok:false, why:"no number"};
  if(/@/.test(t)) return {ok:false, why:"that is an email, not a number"};
  var plus=/^\s*\+/.test(t);
  var d=t.replace(/[^0-9]/g,"");
  if(!d) return {ok:false, why:"no digits in it"};

  /* an explicit country code is taken at its word */
  if(plus){
    if(d.length<8||d.length>15) return {ok:false, why:"that is not a valid length"};
    return {ok:true, e164:"+"+d, note:d.length===11&&d[0]==="1"?"US":"international"};
  }
  if(d.length===11 && d[0]==="1" && nanpOk(d.slice(1))) return {ok:true, e164:"+"+d, note:"US"};
  if(d.length===10 && nanpOk(d))                        return {ok:true, e164:"+1"+d, note:"US"};
  if(d.length===10){
    var w=nanpWhy(d);
    /* a real foreign mobile usually starts 6-9; a mangled US number usually
       fails on the area or exchange rules. Say which, do not just guess. */
    return {ok:false, why:w+". If it is not American, put the country code in front."};
  }
  if(d.length<10)  return {ok:false, why:"too short to be a phone number"};
  return {ok:false, why:"add the country code with a + in front"};
}

   Everything Glen types lands in Postgres so both agents remember it between
   sessions and between machines. The page still writes localStorage first, so
   the UI never waits on the network and keeps working if the database is
   unreachable — the database is the durable copy, localStorage is the cache. */
var SB      = "mcp__c486918c-e912-42c6-afbb-2ba11b6b1912__execute_sql";
var SB_PROJ = "eeeleawnlcmpgcwqianl";
var SYNC    = {state:"idle", queued:0, lastError:null, lastAt:null};

/* escape a value for SQL. null and undefined become NULL, numbers stay bare. */
function qv(v){
  if(v===null||v===undefined||v==="") return "null";
  if(typeof v==="number") return isFinite(v)?String(v):"null";
  if(typeof v==="boolean") return v?"true":"false";
  return "'"+String(v).replace(/'/g,"''")+"'";
}
function qn(v){                                  /* numeric or 0 */
  var n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));

function sbBadge(){

           : SYNC.state==="saving" ? "Saving…"
