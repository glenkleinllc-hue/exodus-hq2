<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <!-- ===== Install to the home screen =====
       Android and Chrome read manifest.json. iOS ignores it and uses the
       apple- tags below, so both are here. "standalone" is what removes the
       browser chrome and makes it open like a real app. -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#05070b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exodus HQ">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<meta name="theme-color" content="#080a0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Exodus HQ</title>
<style>
:root{
  color-scheme: dark;
  /* A working palette, not a neon one. Neutral graphite surfaces stepped a few
     shades apart so panels read as panels, one restrained blue used only for
     what is interactive, and status colours desaturated to the point where a
     screen full of them still looks like business software. */
  --blk:#12141a; --blk2:#171a21; --blk3:#1e2229; --blk4:#272c35;
  --blu:#4b7bd4; --blu2:#8fb3e8; --blu3:#6d97dd; --ice:#5fa8b8;
  /* page, panel, raised surface — each step clearly lighter than the last */
  --paper:#14171d; --paper2:#1b1f26; --raise:#22262f;
  --ink:#eceef2; --mut:#98a0ae; --line:#2f3540;
  --green:#5fb37c; --red:#d4736f; --amber:#c9a25c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  background:var(--paper);color:var(--ink);font-size:14px;line-height:1.45}
.wrap{max-width:1700px;margin:0 auto;padding:12px 16px 60px}

/* ============ MASTHEAD ============ */
.top{position:relative;overflow:hidden;border-radius:14px;padding:0;
  background:linear-gradient(160deg,#1b1f26 0%,#1e232b 55%,#191d24 100%);
  border:1px solid #2f3540;
  box-shadow:0 10px 28px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05)}
/* the two big coloured washes are gone — a masthead should not glow */
.top:before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 120% at 10% -30%, rgba(75,123,212,.10), transparent 62%)}
.top:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:100% 26px, 26px 100%;
  mask-image:linear-gradient(180deg,#000,transparent 78%)}
.tbar{position:relative;display:flex;align-items:center;gap:15px;flex-wrap:wrap;
  padding:20px 26px 18px}
.mark{width:48px;height:48px;border-radius:12px;flex:none;position:relative;
  background:linear-gradient(150deg,#4b8cff,#12327d);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;
  color:#eaf2ff;letter-spacing:-.5px;
  box-shadow:0 6px 20px rgba(47,111,237,.5), inset 0 1px 0 rgba(255,255,255,.28)}
h1{font-size:23px;font-weight:700;letter-spacing:-.5px;line-height:1.05;color:#fff}
.sub{font-size:9.5px;color:var(--blu2);letter-spacing:2.8px;text-transform:uppercase;
  margin-top:5px;font-weight:700;opacity:.88}
.cd{margin-left:auto;text-align:right;padding-left:22px;border-left:1px solid rgba(255,255,255,.1)}
.cd .n{font-size:38px;font-weight:800;letter-spacing:-2.2px;line-height:.92;
  color:#fff;text-shadow:0 0 30px rgba(47,111,237,.75)}
.cd .l{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.45);margin-top:5px;font-weight:700}
.rule{position:relative;height:1px;background:linear-gradient(90deg,
  transparent, rgba(47,111,237,.75) 18%, rgba(34,211,238,.55) 52%, transparent)}
.kpis{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  gap:1px;background:rgba(255,255,255,.07)}
.kpi{background:linear-gradient(180deg,rgba(255,255,255,.038),rgba(255,255,255,.012));
  padding:14px 16px 15px}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.9px;line-height:1;
  font-variant-numeric:tabular-nums;color:#fff}
.kpi .k{font-size:8px;letter-spacing:1.6px;text-transform:uppercase;
  color:rgba(255,255,255,.42);margin-top:6px;font-weight:700}
.kpi.warn .v{color:#ff8f8f} .kpi.good .v{color:#5ee3a4} .kpi.blue .v{color:var(--blu2)}

/* ============ TOP BAR ============ */
/* min-height, not height: the clocks wrap onto a second row on a narrow window
   and the banner has to grow around them rather than clip them. The player that
   used to live here is gone — Glen asked for it out, and it was the only reason
   this bar was ever 96px tall. */
.topbar{display:flex;align-items:center;gap:0;flex-wrap:nowrap;margin-bottom:9px;
  padding:8px 14px;min-height:62px;border-radius:11px;
  background:linear-gradient(160deg,#090d14,#0f1622);
  border:1px solid #1e2634;box-shadow:0 6px 20px rgba(0,0,0,.38)}
.tb-brand{display:flex;align-items:center;gap:8px;flex:none;padding-right:15px}
.tb-mark{width:24px;height:24px;border-radius:7px;flex:none;
  background:linear-gradient(150deg,#4b8cff,#12327d);color:#eaf2ff;
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;
  box-shadow:0 3px 12px rgba(47,111,237,.4)}
.tb-name{font-size:9.5px;font-weight:800;letter-spacing:2.4px;color:#b9c1cf}
.tb-here{flex:none;padding:0 15px;border-left:1px solid #1e2634;display:flex;
  align-items:baseline;gap:8px}
.tb-time{font-size:19px;font-weight:800;letter-spacing:-.9px;line-height:1;color:#fff;
  font-variant-numeric:tabular-nums}
.tb-time .ap{font-size:9.5px;font-weight:800;letter-spacing:.5px;color:var(--blu2);
  margin-left:3px}
.tb-sub{font-size:8.5px;color:var(--mut);font-weight:700;letter-spacing:1.1px;
  text-transform:uppercase;white-space:nowrap}
.tb-cd{flex:none;text-align:right;padding-left:15px;border-left:1px solid #1e2634;
  display:flex;align-items:baseline;gap:7px}
.tb-cd b{font-size:19px;font-weight:800;color:var(--blu2);letter-spacing:-.9px;line-height:1;
  font-variant-numeric:tabular-nums}
.tb-cd i{font-size:8px;font-style:normal;color:var(--mut);font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase;max-width:62px;line-height:1.15}
.syncdot{width:7px;height:7px;border-radius:50%;flex:none;margin-left:11px;
  background:#3a4452;box-shadow:0 0 0 3px rgba(255,255,255,.04);cursor:help;transition:.2s}
.syncdot.ok{background:#4ade80;box-shadow:0 0 0 3px rgba(74,222,128,.16)}
.syncdot.saving{background:#7dd3fc;box-shadow:0 0 0 3px rgba(125,211,252,.18);
  animation:sbp 1s ease-in-out infinite}
.syncdot.error{background:#f87171;box-shadow:0 0 0 3px rgba(248,113,113,.2)}
.syncbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:13px;
  padding:12px 14px;border-radius:11px;background:rgba(248,113,113,.11);
  border:1px solid rgba(248,113,113,.4)}
.syncbar b{font-size:13px;font-weight:800;color:#fca5a5}
.syncbar span{flex:1 1 100%;font-size:11.5px;color:#cbd3de;line-height:1.5}
.syncbar button{flex:none;background:#dc4c4c;border:0;border-radius:8px;padding:10px 16px;
  color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer}
.syncbar button:disabled{opacity:.6;cursor:default}

/* ---- pipeline: stage bands, each one foldable ---- */
.pgrp{display:flex;align-items:center;gap:9px;margin:18px 0 8px;padding:4px 2px;
  width:100%;background:none;border:0;border-radius:7px;cursor:pointer;
  font-family:inherit;text-align:left;transition:background .12s}
.pgrp:hover{background:rgba(255,255,255,.035)}
.pgrp:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
/* the chevron: points down when the band is open, right when it is shut */
.pgrp-c{width:0;height:0;flex:none;margin-right:-2px;
  border-left:5px solid transparent;border-right:5px solid transparent;
  border-top:6px solid var(--gc);transition:transform .16s;transform-origin:50% 35%}
.pgrp.shut .pgrp-c{transform:rotate(-90deg)}
.pgrp.shut b{color:var(--mut)}
.pgbody.shut{display:none}
.pgrp:first-child{margin-top:4px}
.pgrp-d{width:9px;height:9px;border-radius:50%;background:var(--gc);flex:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 22%,transparent)}
.pgrp b{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#e6ecf4}
.pgrp i{font-style:normal;font-size:10px;font-weight:800;color:var(--gc);
  background:color-mix(in srgb,var(--gc) 15%,transparent);border-radius:20px;padding:3px 9px;
  font-variant-numeric:tabular-nums}
.pgrp:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,
  color-mix(in srgb,var(--gc) 34%,transparent),transparent)}

/* ---- the dialer console ---- */
.console{margin:13px 0 15px;border-radius:13px;overflow:hidden;
  background:linear-gradient(168deg,#07100c,#0a1512 55%,#070d0b);
  border:1px solid rgba(34,197,94,.26);box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.con-t{display:flex;align-items:center;gap:10px;padding:11px 15px;
  border-bottom:1px solid rgba(34,197,94,.16);background:rgba(34,197,94,.05)}
.con-t b{font-size:10.5px;font-weight:800;letter-spacing:2.6px;color:#4ade80}
.con-t i{font-style:normal;font-size:9px;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:#5b6472;margin-left:auto}
.con-live{width:8px;height:8px;border-radius:50%;background:#374151;flex:none}
.con-live.on{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.2);
  animation:conBlink 2.4s infinite}
@keyframes conBlink{0%,100%{opacity:1}50%{opacity:.45}}
.con-g{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:rgba(34,197,94,.12)}
.con-n{padding:13px 8px;text-align:center;background:#080f0d}
.con-n b{display:block;font-size:23px;font-weight:800;color:#e8f5ee;letter-spacing:-1px;
  font-variant-numeric:tabular-nums;line-height:1}
.con-n i{display:block;font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:1.1px;
  text-transform:uppercase;color:#5b6472;margin-top:5px}
.con-n.p b{color:#c084fc} .con-n.n b{color:#e2e8f0}
.con-n.w b{color:#fbbf24} .con-n.r b{color:#f87171}
.cl-h{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin:0 0 9px;padding:0 2px}
.cl-h b{font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#4ade80}
.cl-h span{font-size:11px;color:var(--mut)}
.dlr.nodial{opacity:.62}
.dlbad{display:block;font-style:normal;font-size:10px;color:#fca5a5;margin-top:3px}

/* ---- the sort bar ---- */
.sortbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:0 0 12px;padding:0 2px}
.sb-l{display:flex;align-items:center;gap:7px;font-size:9px;font-weight:800;letter-spacing:1.3px;
  text-transform:uppercase;color:var(--mut)}
.sb-l select{background:var(--raise);border:1px solid var(--line);border-radius:8px;
  padding:8px 11px;color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:600}
.sb-l select:focus{outline:none;border-color:var(--blu)}
.sb-b{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 13px;
  color:var(--mut);font-family:inherit;font-size:12px;font-weight:700;cursor:pointer}
.sb-b:hover{color:var(--ink);border-color:#3d4552}
.sb-b.on{border-color:var(--blu);color:#cfe0ff;background:rgba(75,123,212,.14)}
.sb-b.due{border-color:rgba(212,115,111,.5);color:#e6a5a2;background:rgba(212,115,111,.12)}
.sb-n{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--mut);font-variant-numeric:tabular-nums}

/* ---- the source sheet ---- */
.srcbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-top:18px;padding:13px 15px;
  border-radius:11px;background:var(--paper2);border:1px solid var(--line)}
.src-l{font-size:9px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--mut)}
.src-a{font-size:13px;font-weight:700;color:var(--blu2);text-decoration:none}
.src-a:hover{text-decoration:underline;color:#c2d8f7}
.src-n{flex:1 1 100%;font-size:11px;color:var(--mut);line-height:1.5}

/* ---- the four headline numbers, editable ---- */
.ovrbox{margin-bottom:18px;padding:16px;border-radius:12px;background:var(--paper2);
  border:1px solid var(--line)}
.ovr-h{font-size:9px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;
  color:var(--mut);margin-bottom:10px}
.ovr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 0;
  border-top:1px solid var(--line)}
.ovr-l{flex:1;min-width:0}
.ovr-l b{display:block;font-size:13.5px;font-weight:700;color:var(--ink)}
.ovr-l i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:3px}
.ovr-f{flex:none;display:flex;align-items:center;gap:6px}
.ovr-f span{font-size:14px;font-weight:700;color:var(--mut)}
.ovr-i{width:120px;background:var(--raise);border:1px solid var(--line);border-radius:8px;
  padding:10px 11px;color:var(--ink);font-family:inherit;font-size:15px;font-weight:700;
  font-variant-numeric:tabular-nums}
.ovr-i:focus{outline:none;border-color:var(--blu)}
.ovr-x{flex:none;background:transparent;border:1px solid var(--line);border-radius:8px;
  padding:9px 12px;color:var(--mut);font-family:inherit;font-size:11.5px;font-weight:700;
  cursor:pointer}
.ovr-x:hover:not(:disabled){color:var(--ink);border-color:#3d4552}
.ovr-x:disabled{opacity:.35;cursor:default}

/* ---- the came-in cell ---- */
.camecell input.cin-came{width:100%;background:var(--paper2);border:1px solid transparent;
  border-radius:6px;padding:5px 7px;color:var(--ink);font-family:inherit;font-size:12px}
.camecell input.cin-came:hover{border-color:var(--line);background:var(--raise)}
.camecell input.cin-came:focus{outline:none;border-color:var(--blu);
  box-shadow:0 0 0 3px rgba(75,123,212,.2)}
.fuflag{display:inline-block;margin-top:4px;font-size:8.5px;font-weight:800;letter-spacing:.9px;
  text-transform:uppercase;border-radius:20px;padding:2px 8px}
.fuflag.soon{background:rgba(75,123,212,.15);color:#9dbdf0}
.fuflag.tod{background:rgba(201,162,92,.18);color:#e0c48a}
.fuflag.od{background:rgba(212,115,111,.18);color:#e6a5a2}

/* ---- the record block on a lead ---- */
.lc-rec{margin-top:15px;padding:15px;border-radius:12px;background:var(--paper2);
  border:1px solid var(--line)}
.lc-rec-h{font-size:9px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;
  color:var(--mut);margin-bottom:12px}
.lc-due{margin-top:11px;padding:10px 12px;border-radius:9px;font-size:12px;font-weight:700;
  background:rgba(75,123,212,.12);border:1px solid rgba(75,123,212,.32);color:#bcd4f7}
.lc-due.tod{background:rgba(201,162,92,.14);border-color:rgba(201,162,92,.4);color:#e6cf9b}
.lc-due.od{background:rgba(212,115,111,.14);border-color:rgba(212,115,111,.42);color:#eeb4b1}

/* ---- the dialer queue ---- */
.dl{display:flex;flex-direction:column;gap:8px}
.dlr{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;border-radius:11px;
  background:var(--paper2);border:1px solid var(--line);border-left:3px solid var(--line)}
.dl-i{flex:none;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;
  justify-content:center;background:var(--raise);border:1px solid var(--line);
  font-size:11px;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.dlm{flex:1;min-width:0}
.dlm b{display:block;font-size:15px;font-weight:700;color:var(--ink);letter-spacing:-.2px}
.dl-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px}
.dl-st{font-size:8.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--sc);border:1px solid color-mix(in srgb,var(--sc) 40%,transparent);
  background:color-mix(in srgb,var(--sc) 12%,transparent);border-radius:20px;padding:2px 8px}
.dl-sub{font-size:10.5px;color:var(--mut)}
.dl-owe{font-size:10px;font-weight:800;color:#e6a5a2}
.dl-num{display:block;font-style:normal;margin-top:6px;font-size:15px;font-weight:600;
  color:#cfd6e2;font-variant-numeric:tabular-nums;letter-spacing:.4px}
.dl-fu{display:block;font-style:normal;margin-top:5px;font-size:10.5px;color:#9dbdf0}
.dl-fu.od{color:#e6a5a2;font-weight:700}
.dl-note{display:block;font-style:normal;margin-top:5px;font-size:11px;color:var(--mut);
  line-height:1.45}
.dl-act{flex:none;display:flex;align-items:center;gap:7px}
.dl-call{background:linear-gradient(150deg,#3f8f5f,#2c6b45);border:0;border-radius:9px;
  padding:0 18px;height:42px;color:#eaf5ee;font-family:inherit;font-size:12px;font-weight:800;
  letter-spacing:1.3px;cursor:pointer}
.dl-call:hover:not(:disabled){filter:brightness(1.13)}
.dl-call:disabled{opacity:.45;cursor:default}
.dl-call.busy{background:linear-gradient(150deg,#b4903f,#8a6d28)}
.dl-s{width:42px;height:42px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;text-decoration:none;font-size:15px;cursor:pointer;
  background:var(--raise);border:1px solid var(--line);color:var(--mut);font-family:inherit}
.dl-s:hover{border-color:var(--blu);color:var(--ink)}
.dlr.pri{border-left-color:#a855f7;background:rgba(168,85,247,.05)}

/* the directory is a phone book, so the number is the point */
.dirnum a{font-size:14px;font-weight:700;letter-spacing:.3px}

/* ---- the microphone ---- */
.micbtn.rec{border-color:#f87171 !important;color:#fff !important;
  background:rgba(248,113,113,.22) !important}
.micbar{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + env(safe-area-inset-bottom));z-index:210;
  display:flex;align-items:center;gap:11px;max-width:min(560px,calc(100vw - 24px));
  padding:12px 14px;border-radius:14px;
  background:rgba(12,17,24,.97);backdrop-filter:blur(12px);
  border:1px solid rgba(248,113,113,.45);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.mb-dot{width:10px;height:10px;border-radius:50%;background:#f87171;flex:none;
  animation:mbPulse 1.1s infinite}
@keyframes mbPulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.55)}
  50%{box-shadow:0 0 0 8px rgba(248,113,113,0)}}
.mb-t{font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;
  color:#fca5a5;flex:none}
.mb-w{flex:1;min-width:0;font-size:13px;color:#e8eef5;line-height:1.4;
  max-height:44px;overflow:hidden}
.mb-x{flex:none;background:#dc4c4c;border:0;border-radius:9px;padding:9px 15px;
  color:#fff;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;min-height:40px}

/* the last-resort play button */
.voicechip{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom));z-index:200;
  background:linear-gradient(150deg,#22d3ee,#0e7490);border:0;border-radius:999px;
  padding:14px 24px;color:#04222a;font-family:inherit;font-size:14px;font-weight:800;
  box-shadow:0 10px 34px rgba(0,0,0,.5);cursor:pointer;animation:vcIn .18s ease-out}
@keyframes vcIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}

@keyframes sbp{0%,100%{opacity:1}50%{opacity:.35}}

/* ============ PLAN ============ */
.sect{margin-top:0}
.sect-h{display:flex;align-items:baseline;gap:12px;margin-bottom:9px;flex-wrap:wrap}
.sect-h h2{font-size:11px;letter-spacing:2.6px;text-transform:uppercase;color:var(--blu2);font-weight:800}
.cdmini{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);font-weight:700}
.cdmini span{color:#fff;font-size:14px;font-weight:800;letter-spacing:-.4px;font-variant-numeric:tabular-nums}

.mtoggle{position:absolute;right:14px;bottom:14px;top:auto;left:auto;transform:none;z-index:6;

.mtoggle .pic svg{width:100%;height:100%;display:block}

@keyframes pl{0%{box-shadow:0 0 0 0 rgba(34,211,238,.5)}70%{box-shadow:0 0 0 8px rgba(34,211,238,0)}100%{box-shadow:0 0 0 0 rgba(34,211,238,0)}}

  line-height:1;padding:0 2px;font-family:inherit}
.mclose:hover{color:#fff}
svg.bld{width:100%;height:auto;display:block;max-width:none;margin:0;border-radius:9px}
/* Idle rooms are readable on their own. A room with people in it is fully lit.
   Hover is a nudge, not a spotlight — you can still see the whole floor. */
svg.bld .flr{cursor:pointer;opacity:.8;transition:opacity .16s ease}
svg.bld .flr.busy{opacity:1}
svg.bld .flr.on{opacity:1}
svg.bld .flr.hov{opacity:1}
svg.bld .flr .hit{fill:transparent;stroke:transparent;stroke-width:3;transition:.16s}
svg.bld .flr.on .hit{fill:rgba(59,130,246,.06);stroke:#3b82f6;stroke-width:3}

svg.bld .stairs,svg.bld .stairsup,svg.bld .exitdoor,svg.bld .enterdoor{cursor:pointer}
svg.bld .stairs .hit,svg.bld .stairsup .hit,
svg.bld .exitdoor .hit,svg.bld .enterdoor .hit{fill:transparent;stroke:transparent}

/* ---- quick food box ---- *//* ---- quick food box ---- */
.qrow{display:flex;gap:8px;margin-top:9px}
.qrow input{flex:1;background:#1c2028;border:1px solid #232c3a;border-radius:8px;
  padding:10px 12px;color:#e4e9f2;font-family:inherit;font-size:13px}
.qrow input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.13)}
.qrow button{background:rgba(74,222,128,.18);border:1px solid rgba(74,222,128,.55);
  border-radius:8px;padding:0 18px;color:#9df3bf;font-family:inherit;font-size:11.5px;
  font-weight:800;letter-spacing:.9px;cursor:pointer;white-space:nowrap}
.qrow button:hover{background:rgba(74,222,128,.32);color:#fff}
.qprev{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;min-height:0}
.fq{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.09);border-radius:7px;padding:5px 9px;
  font-size:10px;color:var(--mut);font-weight:700}
.fq b{font-size:11px;color:#e4e9f2;font-weight:800;text-transform:capitalize}
.fq.unk{border-color:rgba(251,191,36,.4);background:rgba(251,191,36,.07)}
.fq.unk b{color:#fbbf24}
.fq.tot{border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.09)}
.fq.tot b{color:#4ade80}
.mrow{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px}
.mrow input{background:#1c2028;border:1px solid #232c3a;border-radius:7px;padding:8px 10px;
  color:#e4e9f2;font-family:inherit;font-size:12.5px;min-width:0}
.mrow input:focus{outline:none;border-color:#3b82f6}
.mrow button{background:rgba(47,111,237,.22);border:1px solid rgba(47,111,237,.6);border-radius:7px;
  padding:0 16px;color:#cfe0ff;font-family:inherit;font-size:11px;font-weight:800;
  letter-spacing:.8px;cursor:pointer;white-space:nowrap}
.mrow button:hover{background:rgba(47,111,237,.38);color:#fff}
@media (max-width:640px){.mrow{grid-template-columns:1fr 1fr}.mrow input:first-child{grid-column:1/-1}
  .mrow button{grid-column:1/-1;padding:9px}}
.fq.guess{border-color:rgba(125,211,252,.36);background:rgba(125,211,252,.06)}
.fq u{text-decoration:none;font-size:8px;font-weight:800;letter-spacing:.6px;
  text-transform:uppercase;color:#7dd3fc;margin-top:1px}
.manual{margin-top:12px}
.manual summary{font-size:10.5px;color:var(--mut);cursor:pointer;font-weight:700;
  letter-spacing:.5px;list-style:none}
.manual summary::-webkit-details-marker{display:none}
.manual summary:before{content:"+ ";color:var(--blu2)}
.manual[open] summary:before{content:"– "}
.manual summary:hover{color:#cfe6fb}

.did.jd{color:#e8cf9a;background:rgba(200,168,106,.14);border-color:rgba(200,168,106,.44)}
.jbanner{display:flex;align-items:center;gap:13px;padding:12px 15px;border-radius:10px;
  background:linear-gradient(135deg,rgba(200,168,106,.14),rgba(200,168,106,.03));
  border:1px solid rgba(200,168,106,.36)}
.jbf{width:52px;height:52px;flex:none;border-radius:9px;overflow:hidden;border:2px solid #c8a86a}
.jbf svg{width:100%;height:100%;display:block}
.jbanner b{display:block;font-size:14px;font-weight:800;color:#fff;letter-spacing:-.2px}
.jbanner span{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.didrow{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 8px}
.did{font-size:10px;font-weight:800;letter-spacing:.4px;color:#bde86f;
  background:rgba(132,204,22,.13);border:1px solid rgba(132,204,22,.4);
  border-radius:14px;padding:4px 10px}

/* ---- the trainer's dialogue box: video-game style, bottom of the plan ---- */
.tbox{--ac:#84cc16;position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) scale(.97);
  z-index:11;display:none;opacity:0;pointer-events:none;
  width:min(560px,calc(100% - 48px));
  background:linear-gradient(180deg,rgba(7,10,14,.975),rgba(12,17,22,.975));
  border:2px solid var(--ac);border-radius:13px;padding:15px 18px 15px 15px;
  backdrop-filter:blur(3px);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--ac) 13%, transparent),
    0 28px 64px rgba(0,0,0,.72);
  transition:opacity .14s ease, transform .14s ease}
.tbox.show{display:flex;gap:16px;align-items:flex-start;opacity:1;
  transform:translate(-50%,-50%) scale(1)}
.tb-face{width:82px;height:82px;flex:none;border-radius:10px;overflow:hidden;
  border:2px solid var(--ac)}
.tb-face svg{width:100%;height:100%;display:block}
.tb-body{flex:1;min-width:0}
.tb-name{font-size:10px;font-weight:800;letter-spacing:2.4px;color:var(--ac);
  display:flex;align-items:center;gap:9px;margin-bottom:8px}
.tb-name span{font-size:7px;letter-spacing:1.4px;color:#070b10;background:var(--ac);
  border-radius:3px;padding:2px 5px}
.tb-line{font-size:14px;line-height:1.55;color:#eef3f8;font-weight:600}
.tb-cta{margin-top:10px;font-size:9px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--ac);animation:tblink 1.5s ease-in-out infinite}
@keyframes tblink{0%,100%{opacity:1}50%{opacity:.42}}
.tbanner{display:flex;align-items:center;gap:13px;padding:12px 15px;border-radius:10px;
  background:linear-gradient(135deg,rgba(132,204,22,.13),rgba(132,204,22,.03));
  border:1px solid rgba(132,204,22,.34)}
.tbf{width:52px;height:52px;flex:none;border-radius:9px;overflow:hidden;border:2px solid #84cc16}
.tbf svg{width:100%;height:100%;display:block}
.tbanner b{display:block;font-size:14px;font-weight:800;color:#fff;letter-spacing:-.2px}
.tbanner span{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.t7{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.t7d{border-radius:8px;padding:8px 4px 9px;text-align:center;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08)}
.t7d b{display:block;font-size:8.5px;font-weight:800;letter-spacing:.8px;color:var(--mut)}
.t7d span{display:block;font-size:8px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;
  color:#8b95a6;margin-top:4px}
.t7d i{display:block;font-style:normal;font-size:12px;font-weight:800;color:#dbe2ec;margin-top:4px;
  font-variant-numeric:tabular-nums}
.t7d u{display:block;text-decoration:none;font-size:6.5px;font-weight:800;letter-spacing:.9px;
  text-transform:uppercase;color:#60a5fa;margin-top:3px}
.t7d.g{background:rgba(34,197,94,.14);border-color:rgba(34,197,94,.4)}
.t7d.g span{color:#4ade80}
.t7d.b{background:rgba(59,130,246,.12);border-color:rgba(59,130,246,.36)}
.t7d.b span{color:#60a5fa}
.t7d.r{background:rgba(220,76,76,.12);border-color:rgba(220,76,76,.36)}
.t7d.r span{color:#fca5a5}
@media (max-width:820px){
  .tbox{position:static;left:auto;top:auto;transform:none;width:auto;margin-top:9px}
  .tbox.show{transform:none}
  .t7{grid-template-columns:repeat(4,1fr)}}

/* ---- Claudia books it ---- *//* ---- Claudia books it ---- */
.bookc{border-color:rgba(200,168,106,.34);
  background:linear-gradient(135deg,rgba(200,168,106,.09),rgba(255,255,255,.02))}
.bkmsg{margin-top:10px;padding:9px 12px;border-radius:8px;font-size:12px;font-weight:700;
  line-height:1.5;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);color:#cbd3de}
.bkmsg.wait{color:#7dd3fc;border-color:rgba(125,211,252,.3)}
.bkmsg.bad{color:#fca5a5;border-color:rgba(248,113,113,.34);background:rgba(248,113,113,.07)}
.bkmsg.good{color:#9df3bf;border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.09)}
.bkcard{margin-top:11px;padding:12px 13px;border-radius:9px;background:rgba(255,255,255,.035);
  border:1px solid rgba(200,168,106,.28)}
.bkrow{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.bkrow i{font-style:normal;font-size:7.5px;font-weight:800;letter-spacing:1.1px;
  text-transform:uppercase;color:var(--mut);min-width:74px;flex:none}
.bkrow input{flex:1;min-width:0;background:#1c2028;border:1px solid #232c3a;border-radius:6px;
  padding:7px 9px;color:#e4e9f2;font-family:inherit;font-size:12.5px}
.bkrow input:focus{outline:none;border-color:#c8a86a}
.bkwhen{font-size:11px;font-weight:800;letter-spacing:.4px;color:#e6c96a;margin:9px 0 11px}
.bkact{display:flex;gap:8px;flex-wrap:wrap}
.bkact button{background:linear-gradient(145deg,#e6c96a,#8a6f18);border:none;border-radius:7px;
  padding:9px 16px;color:#0b0d12;font-family:inherit;font-size:11.5px;font-weight:800;
  letter-spacing:.6px;cursor:pointer}
.bkact button:hover{filter:brightness(1.1)}
.bkact button.ghost{background:none;border:1px solid rgba(255,255,255,.16);color:#a9b3c2}
.bkact button.ghost:hover{border-color:#f87171;color:#fca5a5;filter:none}

/* ---- macros, meals and weight ---- *//* ---- macros, meals and weight ---- */
.macs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:13px}
.mac{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
  border-top:3px solid var(--mc);border-radius:9px;padding:10px 12px 11px}
.mac h4{font-size:7.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut);
  font-weight:800;margin-bottom:6px}
.mac .v{font-size:21px;font-weight:800;color:#fff;letter-spacing:-1px;line-height:1;
  font-variant-numeric:tabular-nums}
.mac .v span{font-size:10px;font-weight:700;color:var(--mut);letter-spacing:0;margin-left:3px}
.mac .bar{height:5px;border-radius:3px;background:rgba(255,255,255,.08);margin:8px 0 6px;overflow:hidden}
.mac .bar i{display:block;height:100%;border-radius:3px}
.mac .d{font-size:9px;color:var(--mut);font-weight:700;letter-spacing:.3px}
.mrow5{display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:7px;align-items:center}
.mrow5 input{background:#1c2028;border:1px solid #232c3a;border-radius:7px;padding:8px 9px;
  color:#e4e9f2;font-family:inherit;font-size:12.5px;min-width:0;width:100%}
.mrow5 input:focus{outline:none;border-color:#3b82f6}
.mrow5 button{background:rgba(47,111,237,.22);border:1px solid rgba(47,111,237,.6);border-radius:7px;
  padding:0 15px;height:34px;color:#cfe0ff;font-family:inherit;font-size:11px;font-weight:800;
  letter-spacing:.8px;cursor:pointer;white-space:nowrap}
.mrow5 button:hover{background:rgba(47,111,237,.38);color:#fff}
.tlab{font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--mut);
  white-space:nowrap}
.dayh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:16px 0 7px;
  padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.07)}
.dayh b{font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--blu2)}
.dayh span{font-size:10.5px;font-weight:800;color:#dbe2ec;font-variant-numeric:tabular-nums}
.mealr{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:7px;
  background:rgba(255,255,255,.026);margin-bottom:4px}
.mbd{flex:1;min-width:0;font-size:12px;color:#dbe2ec;line-height:1.4}
.mnum{text-align:right;min-width:38px;font-size:12.5px;font-weight:800;color:#fff;
  font-variant-numeric:tabular-nums;flex:none}
.mnum i{display:block;font-style:normal;font-size:7px;font-weight:800;letter-spacing:.8px;
  text-transform:uppercase;color:var(--mut);margin-top:1px}
.mealr .xbtn{margin-left:0}
.wtrow{display:grid;grid-template-columns:auto 1fr auto;gap:8px;margin-top:9px}
.wtrow input{background:#1c2028;border:1px solid #232c3a;border-radius:7px;padding:8px 10px;
  color:#e4e9f2;font-family:inherit;font-size:12.5px;min-width:0}
.wtrow input:focus{outline:none;border-color:#3b82f6}
.wtrow button{background:rgba(74,222,128,.18);border:1px solid rgba(74,222,128,.55);border-radius:7px;
  padding:0 17px;color:#9df3bf;font-family:inherit;font-size:11px;font-weight:800;
  letter-spacing:.8px;cursor:pointer}
.wtrow button:hover{background:rgba(74,222,128,.34);color:#fff}
.wtlist{margin-top:10px;display:flex;flex-direction:column;gap:3px}
.wtr{display:flex;align-items:center;gap:11px;padding:5px 10px;border-radius:6px;
  background:rgba(255,255,255,.026)}
.wtr i{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.6px;color:#7dd3fc;min-width:38px}
.wtr b{font-size:14px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.wtr span{font-size:10.5px;font-weight:800;color:var(--mut);font-variant-numeric:tabular-nums}
.wtr span.up{color:#fca5a5} .wtr span.dn{color:#4ade80}
.wtr .xbtn{margin-left:auto}
@media (max-width:760px){.macs{grid-template-columns:1fr 1fr}
  .mrow5{grid-template-columns:1fr 1fr}.mrow5 input:first-child{grid-column:1/-1}
  .mrow5 button{grid-column:1/-1}.tlab{display:none}}

/* ---- consistency: one month ---- *//* ---- consistency: one month ---- */
.gymnow{display:flex;align-items:baseline;gap:12px;padding:11px 15px;border-radius:10px;
  background:linear-gradient(135deg,rgba(59,130,246,.14),rgba(34,197,94,.05));
  border:1px solid rgba(59,130,246,.28);margin-bottom:13px;flex-wrap:wrap}
.gymnow b{font-size:26px;font-weight:800;color:#fff;letter-spacing:-1.2px;
  font-variant-numeric:tabular-nums;line-height:1}
.gymnow b em{font-size:11px;font-style:normal;font-weight:800;color:var(--blu2);margin-left:4px}
.gymnow i{font-size:10px;font-style:normal;font-weight:800;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--mut)}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.mhead b{font-size:14px;font-weight:800;color:#fff;letter-spacing:-.2px;min-width:132px}
.mnav{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:6px;
  padding:5px 11px;color:#a9b3c2;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer}
.mnav:hover:not(:disabled){border-color:#3b82f6;color:#fff}
.mnav:disabled{opacity:.3;cursor:default}
.mnav.today{font-size:10px;letter-spacing:.6px;padding:5px 10px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mdn{text-align:center;font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
  color:var(--mut);padding-bottom:2px}
.mdn.a{color:#60a5fa}
.mc{aspect-ratio:1;border-radius:7px;border:1px solid rgba(255,255,255,.09);cursor:pointer;
  background:rgba(255,255,255,.035);color:#5b6472;font-family:inherit;font-size:12px;
  font-weight:800;padding:0;transition:.13s;display:flex;align-items:center;justify-content:center}
.mc:hover:not(:disabled){transform:scale(1.07);border-color:#7dd3fc}
.mc.pad{border:none;background:none;cursor:default;pointer-events:none}
.mc.fut{opacity:.28;cursor:default}
.mc.g{background:#22c55e;border-color:#22c55e;color:#06210f}
.mc.b{background:#3b82f6;border-color:#3b82f6;color:#04142e}
.mc.r{background:#dc4c4c;border-color:#dc4c4c;color:#2a0a0a}
.mc.now{outline:2px solid #facc15;outline-offset:1px}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;font-size:10px;
  color:var(--mut);font-weight:700}
.legend span{display:flex;align-items:center;gap:5px}
.k{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}
.k.yes{background:#22c55e} .k.work{background:#3b82f6}
.k.no{background:#dc4c4c} .k.blank{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16)}

/* ---- sales whiteboard ---- *//* ---- sales whiteboard ---- *//* ---- sales whiteboard ---- */
.wbtop{display:flex;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.wbcols{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.wbcol{background:rgba(255,255,255,.028);border:1px solid rgba(255,255,255,.08);
  border-top:3px solid var(--wc);border-radius:9px;padding:10px 11px 11px}
.wbcol h5{font-size:8px;letter-spacing:1.3px;text-transform:uppercase;color:var(--wc);
  font-weight:800;margin-bottom:7px}
.wbcol textarea{min-height:118px}
@media (max-width:820px){.wbcols{grid-template-columns:1fr}}

/* ---- training library ---- */
.tpill{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.13);
  border-radius:20px;padding:5px 12px;color:#a9b3c2;font-family:inherit;font-size:10.5px;
  font-weight:800;letter-spacing:.5px;cursor:pointer;margin:0 5px 6px 0}
.tpill:hover{border-color:#3b82f6;color:#fff}
.tpill.on{background:rgba(47,111,237,.24);border-color:#3b82f6;color:#fff}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-top:4px}
.libc{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
  border-radius:9px;overflow:hidden;display:flex;flex-direction:column}
.thumb{position:relative;display:block;aspect-ratio:16/9;background:#1c2028;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.nolink{background:linear-gradient(140deg,#131a26,#1c2028)}
.thumb .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:34px;height:34px;border-radius:50%;background:rgba(8,12,18,.78);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;padding-left:2px;
  border:1px solid rgba(255,255,255,.24)}
.thumb:hover .play{background:#e0342c;border-color:#e0342c}
.libt{padding:9px 11px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.trk{font-size:7px;font-weight:800;letter-spacing:1.1px;text-transform:uppercase;
  color:#7dd3fc;background:rgba(125,211,252,.1);padding:2px 6px;border-radius:3px;align-self:flex-start}
.libt b{font-size:12px;font-weight:800;color:#e8edf5;line-height:1.3}
.libt i{font-size:10.5px;font-style:normal;color:var(--mut);line-height:1.4}
.libr{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:6px}
.libr a{font-size:10.5px;font-weight:800;color:#9dc4ff;text-decoration:none;letter-spacing:.4px}
.libr a:hover{color:#fff}
.tform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tform input,.tform select{background:#1c2028;border:1px solid #232c3a;border-radius:7px;
  padding:8px 10px;color:#e4e9f2;font-family:inherit;font-size:12px}
.tform input:focus,.tform select:focus{outline:none;border-color:#3b82f6}
.tform #tr-note{grid-column:1/-1}
.tform button{grid-column:1/-1;background:rgba(47,111,237,.22);border:1px solid rgba(47,111,237,.6);
  border-radius:7px;padding:9px;color:#cfe0ff;font-family:inherit;font-size:11.5px;
  font-weight:800;letter-spacing:.9px;cursor:pointer}
.tform button:hover{background:rgba(47,111,237,.38);color:#fff}
@media (max-width:640px){.tform{grid-template-columns:1fr}}

/* ---- the seven day glance ---- */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.wkd{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);
  border-radius:9px;padding:8px 8px 9px;min-width:0;transition:.2s}
.wkd.today{border-color:rgba(59,130,246,.6);background:rgba(59,130,246,.07);
  box-shadow:0 0 0 2px rgba(59,130,246,.12)}
.wkd.done{background:rgba(74,222,128,.055);border-color:rgba(74,222,128,.32)}
.wkd-h{display:flex;align-items:center;gap:5px;margin-bottom:7px}
.wkd-h b{font-size:11px;font-weight:800;letter-spacing:1.3px;color:#dfe5ee;text-transform:uppercase}
.tdy{font-size:6.5px;font-weight:800;letter-spacing:.8px;color:#7dd3fc;
  background:rgba(125,211,252,.15);padding:2px 4px;border-radius:3px}
.chk{margin-left:auto;width:19px;height:19px;flex:none;border-radius:5px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.18);
  color:#0b0f16;font-size:12px;font-weight:800;line-height:1;font-family:inherit;padding:0}
.chk:hover{border-color:#4ade80}
.chk.on{background:#4ade80;border-color:#4ade80;color:#08120c}

/* ============ PANEL ============ *//* ============ PANEL ============ *//* ============ PANEL ============ */
/* a dark scrim so the floor plan drops away while you work */
.scrim{position:absolute;inset:0;z-index:8;background:rgba(3,5,9,.62);
  backdrop-filter:blur(2px);display:none;pointer-events:none}
.scrim.open{display:block}

/* ---- floating working windows ---- */
.wins{position:absolute;inset:0;z-index:9;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;
  min-width:300px;border-radius:12px;overflow:hidden;
  background:linear-gradient(178deg,#0b0f16,#0e131c);
  border:1px solid #2a3446;
  box-shadow:0 26px 70px rgba(0,0,0,.66), 0 0 0 1px rgba(255,255,255,.04) inset}
.wtitle{display:flex;align-items:center;gap:9px;padding:9px 10px 9px 13px;flex:none;
  background:linear-gradient(180deg,#141c28,#0e141d);border-bottom:1px solid #232c3a;
  cursor:move;user-select:none}
.wic{font-size:14px;line-height:1;flex:none}
.wtitle b{font-size:12.5px;font-weight:800;color:#fff;letter-spacing:-.1px;white-space:nowrap}
.wno{font-size:7.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbtn{margin-left:auto;width:22px;height:22px;flex:none;border-radius:5px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#a9b3c2;
  font-size:13px;line-height:1;font-family:inherit;padding:0}
.wbtn+.wbtn{margin-left:0}
.wbtn:hover{background:rgba(255,255,255,.12);color:#fff}
.wbtn.x:hover{background:rgba(248,113,113,.22);border-color:rgba(248,113,113,.5);color:#fca5a5}
.wbody{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 15px 16px}
.wbody .tabs{position:sticky;top:0;z-index:2;padding:11px 0 10px;
  background:linear-gradient(180deg,#0b0f16 72%,rgba(11,15,22,0))}
.wbody::-webkit-scrollbar{width:9px}
.wbody::-webkit-scrollbar-thumb{background:#26303e;border-radius:5px}
.wbody::-webkit-scrollbar-thumb:hover{background:#33404f}
.wgrip{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;
  background:linear-gradient(135deg,transparent 48%,rgba(255,255,255,.22) 48%,
    rgba(255,255,255,.22) 56%,transparent 56%,transparent 70%,
    rgba(255,255,255,.22) 70%,rgba(255,255,255,.22) 78%,transparent 78%)}
.wgrip:hover{background:linear-gradient(135deg,transparent 46%,#7dd3fc 46%,#7dd3fc 56%,
    transparent 56%,transparent 68%,#7dd3fc 68%,#7dd3fc 78%,transparent 78%)}

/* the strip of minimised windows */
.taskbar{position:absolute;left:12px;bottom:12px;z-index:10;display:none;gap:7px;flex-wrap:wrap;
  max-width:calc(100% - 200px)}
.taskbar.show{display:flex}
.tbi{display:flex;align-items:center;gap:7px;background:rgba(8,12,20,.92);
  border:1px solid rgba(125,211,252,.34);border-radius:9px;padding:7px 13px;

.tbi.all{border-color:rgba(255,255,255,.2);color:#a9b3c2}
@media (max-width:820px){
  .wins{position:static;inset:auto}

  .wtitle{cursor:default}
  .wgrip{display:none}
  .wbody{max-height:none;overflow:visible;padding:0 12px 14px}

/* ============ PANEL ============ */
/* a dark scrim so the floor plan drops away while you work */
.scrim{position:absolute;inset:0;z-index:8;background:rgba(3,5,9,.62);
  backdrop-filter:blur(2px);display:none;pointer-events:none}
.scrim.open{display:block}

/* the working window, centred over the floor plan */
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(760px,calc(100% - 48px));height:min(760px,calc(100% - 48px));
  z-index:9;display:none;flex-direction:column;
  background:rgba(9,13,19,.97);border:1px solid #2a3446;border-radius:15px;overflow:hidden;
  box-shadow:0 34px 90px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.07);
  font-size:12px}

/* once dragged it anchors to left/top, so drop the centring transform */

.panel .p-b{overflow-y:auto;flex:1;padding:13px 15px}
.pclose{margin-left:8px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
  border-radius:7px;color:#c6ccd8;font-size:17px;line-height:1;cursor:pointer;padding:2px 9px 4px;
  font-family:inherit;transition:.14s}

  text-transform:uppercase;font-weight:800}

.alert b{color:#fca5a5}
.info{background:rgba(59,130,246,.09);border-left:3px solid var(--blu);border-radius:0 8px 8px 0;
  padding:11px 14px;margin-bottom:13px;font-size:12.5px;color:#c9d8ef}
.info b{color:#bfdbfe}
.okbox{background:rgba(74,222,128,.09);border-left:3px solid var(--green);border-radius:0 8px 8px 0;
  padding:11px 14px;margin-bottom:13px;font-size:12.5px;color:#c2ecd3}
.okbox b{color:#86efac}
.empty{text-align:center;padding:32px;color:var(--mut);font-size:13px}
.spin{text-align:center;padding:34px;color:var(--mut);font-size:12.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:11px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px}
.card{background:var(--raise);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
.card.dk{background:linear-gradient(150deg,#111c33,#0a1220);border-color:#243044;color:#fff}
.card.dk h4{color:var(--blu2)} .card.dk .v{color:#fff} .card.dk .d{color:rgba(255,255,255,.55)}
.card h4{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);
  margin-bottom:7px;font-weight:800}
.card .v{font-size:25px;font-weight:800;letter-spacing:-1.1px;color:#fff;line-height:1;
  font-variant-numeric:tabular-nums}
.card .v.r{color:#fca5a5} .card .v.g{color:#86efac} .card .v.a{color:#fcd34d}
.card .d{font-size:11.5px;color:var(--mut);margin-top:5px}
.skel{background:repeating-linear-gradient(45deg,#0f151e,#0f151e 9px,#141b26 9px,#141b26 18px);
  border:1.5px dashed #243044;border-radius:11px;padding:22px 16px;text-align:center;color:var(--mut)}
.skel .t{font-weight:700;color:var(--ink);font-size:13px;margin-bottom:3px}
.skel .s{font-size:11.5px}
.bar{height:8px;background:#1b2330;border-radius:4px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blu3),var(--blu2));border-radius:4px}
.scr{background:var(--raise);border:1px solid var(--line);border-left:3px solid var(--blu);
  border-radius:0 9px 9px 0;padding:11px 14px;margin-bottom:8px}
.scr .lbl{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--blu2);
  font-weight:800;margin-bottom:5px}
.scr .tx{font-size:12.5px;line-height:1.55}
.steps{counter-reset:s;list-style:none}
.steps li{counter-increment:s;position:relative;padding:5px 0 5px 28px;font-size:12.5px;
  border-bottom:1px solid #1b222c}
.steps li:before{content:counter(s);position:absolute;left:0;top:5px;width:19px;height:19px;
  border-radius:50%;background:var(--blu);color:#04101f;font-size:9.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center}
.notes-h{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.notes-h h4{font-size:8.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mut);font-weight:800}
.saved{font-size:10px;color:var(--green);font-weight:800;opacity:0;transition:.3s;letter-spacing:.6px}
.saved.on{opacity:1}
textarea.notes{width:100%;min-height:130px;border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;font-family:inherit;font-size:12.5px;line-height:1.6;resize:vertical;
  background:#1a1e25;color:var(--ink)}
textarea.notes:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px rgba(47,111,237,.14)}
.mini{width:82px;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-family:inherit;
  font-size:12px;text-align:right;font-variant-numeric:tabular-nums;background:#1a1e25;color:var(--ink)}
.mini:focus{outline:none;border-color:var(--blu)}
.wide{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-family:inherit;
  font-size:12.5px;background:#1a1e25;color:var(--ink)}
.wide:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px rgba(47,111,237,.12)}
/* inline editable contact cells */
input.cn{width:100%;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-family:inherit;
  font-size:11.5px;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums;transition:.12s}
input.cn:hover{border-color:var(--line);background:#22262f}
input.cn:focus{outline:none;border-color:var(--blu);background:#1b1f27;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
input.cn::placeholder{color:#5a6474;font-style:italic}
input.cn.ok{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.45)}
.softflag{font-size:10px;color:var(--mut);font-weight:600;margin-top:3px}
.badge .dot2{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:middle}
.legend{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px;
  padding:9px 12px;background:var(--raise);border:1px solid var(--line);border-radius:10px}
.lg{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink);
  letter-spacing:.3px}
.lg i{width:11px;height:11px;border-radius:3px;display:inline-block}
select.stsel{width:100%;background:#1a1e25;border:1px solid var(--line);border-radius:7px;
  padding:6px 7px;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
select.stsel:focus{outline:none;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
textarea.ntbox{width:100%;min-width:180px;background:transparent;border:1px solid transparent;
  border-radius:7px;padding:5px 7px;font-family:inherit;font-size:11.5px;line-height:1.5;
  color:var(--ink);resize:vertical}
textarea.ntbox:hover{border-color:var(--line);background:#22262f}
textarea.ntbox:focus{outline:none;border-color:var(--blu);background:#1b1f27;
  box-shadow:0 0 0 3px rgba(59,130,246,.16)}
textarea.ntbox::placeholder{color:#5a6474;font-style:italic}
.addbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.addform{display:none;background:#1c2028;border:1px solid var(--line);border-radius:11px;
  padding:14px 16px;margin-bottom:13px}
.addform.open{display:block}
.af-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:10px}
.af-grid label,.addform label{font-size:8.5px;letter-spacing:1.3px;text-transform:uppercase;
  color:var(--mut);font-weight:800}
.af-grid input,.af-grid select,.addform input{margin-top:4px}
/* removing a lead — small until you need it, then loud */
.delone{display:block;margin-top:5px;background:none;border:0;padding:0;text-align:left;
  color:#4a5462;font-family:inherit;font-size:8.5px;font-weight:800;letter-spacing:.9px;
  text-transform:uppercase;cursor:pointer;transition:color .14s}
.delone:hover{color:var(--red)}
.delask{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:5px;
  padding:5px 8px;border:1px solid rgba(212,115,111,.5);border-radius:8px;
  background:rgba(212,115,111,.1);font-size:10.5px;color:#f0b8b6;font-weight:600}
.delask.lc{margin:0 0 0 auto}
.delask button{background:none;border:1px solid var(--line);border-radius:6px;
  padding:3px 9px;font-family:inherit;font-size:10px;font-weight:800;cursor:pointer;
  letter-spacing:.5px}
.delask .dy{border-color:var(--red);color:var(--red)}
.delask .dy:hover{background:var(--red);color:#160a0a}
.delask .dn{color:var(--mut)}
.delask .dn:hover{color:var(--ink);border-color:var(--blu)}
.lc-del{margin-left:auto;background:none;border:1px solid var(--line);border-radius:7px;
  padding:5px 11px;color:var(--mut);font-family:inherit;font-size:10.5px;font-weight:700;
  cursor:pointer;letter-spacing:.4px;transition:.14s;flex:none}
.lc-del:hover{border-color:var(--red);color:var(--red)}

.manualflag{display:inline-block;font-size:8.5px;letter-spacing:.9px;text-transform:uppercase;
  font-weight:800;color:#93c5fd;background:rgba(59,130,246,.14);padding:1.5px 6px;border-radius:3px;
  margin-top:4px;cursor:pointer}
.manualflag:hover{background:rgba(248,113,113,.16);color:#fca5a5}
.editedflag{display:inline-block;font-size:8.5px;letter-spacing:.9px;text-transform:uppercase;
  font-weight:800;color:#86efac;background:rgba(74,222,128,.13);padding:1.5px 6px;border-radius:3px;margin-top:4px}
a.lnk{color:var(--blu2);font-weight:600;text-decoration:none;border-bottom:1px solid rgba(125,211,252,.5)}
a.lnk:hover{color:#bfdbfe}
.btn{background:linear-gradient(150deg,#4b8cff,#1a3f9e);border:none;border-radius:8px;color:#fff;
  font-family:inherit;font-weight:800;font-size:12.5px;padding:9px 17px;cursor:pointer;letter-spacing:.3px}
.btn:hover{filter:brightness(1.08)}
.btn.gh{background:none;border:1px solid var(--line);color:var(--mut);font-weight:600}
.btn.gh:hover{border-color:var(--red);color:#fca5a5}
.btn.gh:hover{border-color:var(--red);color:var(--red)}

/* ============ ASSISTANT CHAT ============ */
.chat{background:linear-gradient(168deg,#181b22,#131b28);border:1px solid #232b38;
  border-radius:14px;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.chat-h{padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #1f2734}
.av{width:38px;height:38px;border-radius:50%;flex:none;overflow:hidden;
  box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.av svg{width:100%;height:100%;display:block}
.chat-h .who{color:#fff;font-weight:700;font-size:13.5px}
.chat-h .st{font-size:9.5px;color:var(--ice);letter-spacing:1.3px;text-transform:uppercase;
  font-weight:700;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ice);display:inline-block;
  margin-right:5px;box-shadow:0 0 8px var(--ice)}
.log{max-height:340px;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.msg{max-width:88%;font-size:12.8px;line-height:1.6;padding:10px 13px;border-radius:12px;
  white-space:pre-wrap;word-wrap:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(150deg,#2f6fed,#173a8f);color:#fff;
  border-bottom-right-radius:3px}
.msg.ai{align-self:flex-start;background:#1a2230;color:#e6eaf2;border:1px solid #27303f;
  border-bottom-left-radius:3px}
.msg.sys{align-self:center;background:none;color:#5b6472;font-size:11px;font-style:italic;padding:2px}
.chat-f{padding:12px 16px;border-top:1px solid #1f2734;display:flex;gap:9px;align-items:flex-end}
.chat-f textarea{flex:1;background:#1c2028;border:1px solid #27303f;border-radius:9px;color:#eceff5;
  font-family:inherit;font-size:12.8px;padding:10px 12px;resize:none;min-height:42px;max-height:120px;line-height:1.5}
.chat-f textarea:focus{outline:none;border-color:var(--blu);box-shadow:0 0 0 3px rgba(47,111,237,.15)}
.send{background:linear-gradient(150deg,#4b8cff,#1a3f9e);border:none;border-radius:9px;color:#fff;
  font-family:inherit;font-weight:800;font-size:12.5px;padding:11px 18px;cursor:pointer;
  letter-spacing:.4px;transition:.14s;flex:none}
.send:hover{filter:brightness(1.1)} .send:disabled{opacity:.45;cursor:default}
.iconbtn{background:#131a26;border:1px solid #27303f;border-radius:9px;color:#9aa3b4;
  font-size:15px;line-height:1;padding:10px 12px;cursor:pointer;flex:none;transition:.14s}
.iconbtn:hover{border-color:var(--blu);color:#fff}
.iconbtn.on{border-color:var(--ice);color:var(--ice)}
.iconbtn.rec{border-color:#f87171;color:#fca5a5;background:rgba(248,113,113,.12);
  animation:pulseRec 1.1s infinite}
@keyframes pulseRec{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.5)}50%{box-shadow:0 0 0 7px rgba(248,113,113,0)}}
.typing{display:inline-flex;gap:3.5px;align-items:center}
.typing i{width:5px;height:5px;border-radius:50%;background:#7a8394;animation:bl 1.3s infinite}
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}
.foot{text-align:center;font-size:10.5px;color:var(--mut);margin-top:20px;font-style:italic}
.uc{display:inline-block;background:var(--amber);color:#fff;font-size:8.5px;font-weight:800;
  letter-spacing:1.4px;text-transform:uppercase;padding:3px 9px;border-radius:4px}
.wk{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.wkrow{background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:10px 13px;
  margin-bottom:7px;display:flex;gap:12px;align-items:flex-start}
.wkrow .dt{font-size:9.5px;font-weight:800;letter-spacing:1px;color:var(--blu2);
  text-transform:uppercase;white-space:nowrap;padding-top:2px}
.wkrow .bd{flex:1;font-size:12.5px;line-height:1.55;white-space:pre-wrap}

/* ---------- the wall safe ---------- */
.vlock{max-width:460px;margin:26px auto;text-align:center}
.vlock-i{width:70px;height:70px;margin:0 auto 14px;border-radius:14px;display:flex;
  align-items:center;justify-content:center;background:linear-gradient(160deg,#2a2f38,#191d24);
  border:1px solid #3a4150;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.vlock-t b{display:block;font-size:15px;color:var(--ink);letter-spacing:.2px}
.vlock-t i{display:block;font-style:normal;font-size:12.5px;color:var(--mut);margin-top:4px}
.vpin{display:flex;gap:8px;justify-content:center;margin-top:16px}
.vpin input{width:130px;text-align:center;letter-spacing:8px;font-size:19px;padding:11px 10px;
  background:var(--paper2);border:1px solid var(--line);border-radius:9px;color:var(--ink)}
.vpin input:focus{outline:none;border-color:var(--blu)}
.vbar{display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:14px;
  padding:9px 12px;border:1px solid rgba(74,222,128,.28);border-radius:10px;
  background:rgba(74,222,128,.06)}
.vbar-o{font-size:10.5px;font-weight:700;letter-spacing:1.4px;color:#4ade80}
.vbar-n{flex:1;min-width:0;font-size:11.5px;color:var(--mut)}
.vcard td{background:rgba(168,85,247,.05)}
.voff{opacity:.45}
.vuse{font-size:10px;color:var(--mut);margin-top:3px;letter-spacing:.3px}
.vuse.hot{color:var(--amber)}
.vsec{display:flex;gap:4px;align-items:center}
.vsec input{flex:1;min-width:0}
.veye{background:none;border:1px solid var(--line);border-radius:6px;color:var(--mut);
  cursor:pointer;font-size:11px;padding:0 6px;height:28px;flex:none}
.veye:hover{border-color:var(--blu);color:var(--ink)}
.vdel{background:none;border:0;color:#4a5462;cursor:pointer;font-size:17px;line-height:1;padding:2px 5px}
.vdel:hover{color:var(--red)}
.vsel{width:100%;background:var(--paper2);border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font-size:12px;padding:6px 7px;font-family:inherit}
.vtog{background:none;border:1px solid var(--line);border-radius:20px;color:var(--mut);
  cursor:pointer;font-size:10px;letter-spacing:.5px;padding:3px 9px;text-transform:uppercase}
.vtog.on{border-color:rgba(74,222,128,.5);color:#4ade80;background:rgba(74,222,128,.09)}

/* ============ THE FOUR CLOCKS IN THE BANNER ============ */
.tb-zones{display:flex;align-items:stretch;flex:1;min-width:0;gap:0;
  padding:0 6px 0 15px;border-left:1px solid #1e2634;overflow:hidden}
.tbz{display:flex;align-items:center;gap:7px;padding:0 13px;min-width:0;flex:none;
  border-radius:8px}
.tbz.home{background:rgba(75,123,212,.11)}
.tbz-f{width:17px;height:11.5px;flex:none;border-radius:2px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.tbz-f svg{display:block;width:100%;height:100%}
.tbz-x{min-width:0;line-height:1.15}
/* both are spans, so they have to be told to stack — inline they ran together
   on one line and read as "9:22am +1BANGKOK" */
.tbz-t,.tbz-k{display:block}
.tbz-t{font-size:13.5px;font-weight:800;letter-spacing:-.4px;color:#e9edf4;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.tbz-t em{font-style:normal;font-size:8px;font-weight:800;color:var(--mut);
  margin-left:2px;letter-spacing:.3px}
.tbz.home .tbz-t{color:#fff}
.tbz-k{font-size:7.5px;font-weight:800;letter-spacing:1.5px;color:#6f7a8a;
  text-transform:uppercase;white-space:nowrap}
.tbz.home .tbz-k{color:var(--blu2)}
/* the day marker, for when a zone is on a different date to him */
.tbz-d{font-size:7.5px;font-weight:800;color:var(--amber);margin-left:3px}

/* Every stage renders its own table, so without a fixed layout each one sized
   its columns to its own rows and the columns stepped sideways down the page.
   The <th> widths are the contract; this makes the browser honour them. */
.wbody .scroll.big table{table-layout:fixed;width:100%}
.wbody .scroll.big th:nth-child(2){width:210px}
.wbody .scroll.big td.nm-c{overflow-wrap:anywhere}

/* The pipeline sitting inside a dashboard section. It brings its own scroller,
   so this is only a frame: room to breathe and a rule to sit against. */
.crmwrap{margin-top:12px;border-top:1px solid var(--line);padding-top:14px}
.crmwrap .wbody{padding:0;background:none;border:0}
.crmwrap .scroll.big{max-height:none}
@media(max-width:640px){ .crmwrap{margin-top:9px;padding-top:10px} }

/* ---- reach buttons on a CRM row ---- */
.rbx{display:flex;gap:4px;flex-wrap:wrap}
.rb{flex:1 1 auto;min-width:38px;padding:6px 4px;border-radius:7px;cursor:pointer;
  font-family:inherit;font-size:9.5px;font-weight:800;letter-spacing:.7px;
  text-transform:uppercase;border:1px solid;transition:.13s}
.rb.call{background:rgba(34,197,94,.12);border-color:rgba(34,197,94,.4);color:#6fe0a0}
.rb.call:hover:not([disabled]){background:var(--green);color:#04140a}
.rb.alt{background:rgba(200,168,106,.11);border-color:rgba(200,168,106,.38);color:#dcbe86}
.rb.alt:hover:not([disabled]){background:var(--gold);color:#140f04}
.rb.txt{background:rgba(75,123,212,.12);border-color:rgba(75,123,212,.4);color:#9dbdf0}
.rb.txt:hover:not([disabled]){background:var(--blu);color:#fff}
.rb[disabled]{opacity:.28;cursor:default}
@media (max-width:640px){ .rb{flex:1 1 30%;font-size:11px;padding:9px 4px} }

/* =========================================================
   THE PROFESSIONAL PASS
   Mostly subtraction. A dashboard shown to a paying client should have one
   typographic voice, one border colour and one rhythm — most of what read as
   "unfinished" was four slightly different greys and three card radii.
   ========================================================= */

/* Section headings: a quiet eyebrow rule and a heavier title, so the eye finds
   the four sections without them shouting. */
.sec{margin-bottom:26px}
.sec-h{align-items:baseline;padding-bottom:11px;margin-bottom:15px;
  border-bottom:1px solid rgba(255,255,255,.07)}
.sec-h h2{font-size:16.5px;font-weight:800;letter-spacing:-.45px;color:#fff}
.sec-h .sec-s{font-size:11.5px;color:#77828f;letter-spacing:.1px}

/* One radius and one border across every card on the page. Before this there
   were 9px, 10px, 11px, 12px and 13px in use within a single screen. */
.tcard,.plat,.dp,.crmmoney .cm,.stgstrip .sg,.opdock,.smsd{border-radius:12px}
.tcard,.dp{border-color:rgba(255,255,255,.075)}

/* Numbers line up in columns everywhere, without exception. A money column
   whose digits do not align is the thing that makes a page look homemade. */
.cm b,.sg b,.an-v,.dfact b,.plat-big,.nw-t,.sb-n{font-variant-numeric:tabular-nums}

/* The pipeline, tightened. Rows were 4px taller than they needed to be, which
   cost about one lead per screen. */
.wbody .scroll.big table{border-collapse:separate;border-spacing:0}
.wbody .scroll.big th{font-size:8.5px;letter-spacing:1.3px;color:#6d7787;
  padding:9px 10px;background:rgba(255,255,255,.022);font-weight:800}
.wbody .scroll.big td{padding:9px 10px;vertical-align:top}
.wbody .scroll.big tbody tr{transition:background .1s}
.wbody .scroll.big tbody tr:hover{background:rgba(255,255,255,.022)}
.crmwrap .pills{gap:6px}
.crmwrap .legend{opacity:.9}

/* ================= THE SPORTS TICKER =================
   A rail of small fixed-width cards. Fixed width matters: the cards no longer
   stretch to fill the rail, which is what pulled their contents apart. */
.sptick{display:none;min-width:0}
.toprow .sptick:not(.on){display:flex;align-items:center;justify-content:center;
  border-radius:12px;background:rgba(255,255,255,.02);border:1px solid #1b232d}
.toprow .sptick:not(.on):after{content:"No games right now";font-size:11px;color:#4a5462}
.sptick.on{display:flex;align-items:stretch;margin:0;min-width:0;
  border-radius:12px;overflow:hidden;
  background:linear-gradient(120deg,#0c1219,#0f1620 60%,#0c1219);
  border:1px solid #1f2934}
.sp-lbl{flex:none;display:flex;align-items:center;padding:0 12px;
