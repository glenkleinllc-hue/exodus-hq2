function wireFoodQuick(){
  var box=document.getElementById("fd-quick"), go=document.getElementById("fd-go"),
      prev=document.getElementById("fd-prev");
  if(!box) return;

  function preview(){
    if(!prev) return;
    var r=foodParse(box.value);
    if(!box.value.trim()){prev.innerHTML="";return;}
    var bits=r.items.map(function(x){
      return '<span class="fq'+(x.guessed?" guess":"")+'"><b>'+esc(x.qty+" "+x.unit+" "+x.name)+'</b>'
        +x.kcal+' cal &middot; '+x.p+'p &middot; '+x.c+'c &middot; '+x.fat+'f'
        +(x.guessed?'<u>assumed portion</u>':'')+'</span>';});
    r.unknown.forEach(function(u){
      bits.push('<span class="fq unk"><b>'+esc(u.qty+" "+u.unknown)+'</b>Claudia will estimate</span>');});
    prev.innerHTML=bits.join("")
      +(r.items.length?'<span class="fq tot"><b>Total</b>'+r.kcal+' cal &middot; '+r.p+'p &middot; '
        +r.c+'c &middot; '+r.fat+'f</span>':"");
  }
  box.oninput=preview;
  preview();

  function add(){
    var raw=box.value.trim(); if(!raw)return;
    var r=foodParse(raw);
    if(r.unknown.length && window.cowork && window.cowork.askClaude){
      if(prev) prev.innerHTML='<span class="fq unk"><b>Working it out…</b>asking Claudia</span>';
      var q=r.unknown.map(function(u){return u.qty+" "+u.unknown;}).join(", ");
      window.cowork.askClaude(
        "Estimate the nutrition for exactly this food and quantity: \""+q+"\". "
        +"Reply with ONLY four whole numbers separated by commas, in this order: "
        +"calories, protein grams, carb grams, fat grams. No words, no units, no explanation. "
        +"Example reply: 430,38,22,19",[])
      .then(function(ans){
        var m=String(ans).match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
        var k=r.kcal, pp=r.p, cc=r.c, ff=r.fat;
        if(m){ k+=parseInt(m[1],10); pp+=parseInt(m[2],10);
               cc+=parseInt(m[3],10); ff+=parseInt(m[4],10); }
        save(raw,k,pp,cc,ff);})
      .catch(function(){ save(raw,r.kcal,r.p,r.c,r.fat); });
    } else {
      save(raw,r.kcal,r.p,r.c,r.fat);
    }
  }
  function save(what,k,pp,cc,ff){
    var a=fdLoad();
    a.push({d:new Date().toISOString(),what:what,
      kcal:String(k),p:String(pp),c:String(cc||0),f:String(ff||0)});
    fdSave(a);
    redraw();
  }
  if(go) go.onclick=add;
  box.onkeydown=function(ev){ if(ev.key==="Enter"){ev.preventDefault();add();} };
}

/* ---- Claudia books appointments on the real calendar ---- */
var BOOKDRAFT=null;
function bookPad(n){ return (n<10?"0":"")+n; }
function bookISO(d){
  return d.getFullYear()+"-"+bookPad(d.getMonth()+1)+"-"+bookPad(d.getDate())
    +"T"+bookPad(d.getHours())+":"+bookPad(d.getMinutes())+":00";
}
function bookPretty(iso){
  var d=new Date(iso.replace(/Z$/,""));
  if(isNaN(d)) return iso;
  return DAYFULL[d.getDay()]+", "+MON[d.getMonth()]+" "+d.getDate()
    +" at "+((d.getHours()%12)||12)+":"+bookPad(d.getMinutes())
    +(d.getHours()<12?"am":"pm");
}
function bookRender(msg,tone){
  var el=document.getElementById("bk-out"); if(!el)return;
  if(msg){ el.innerHTML='<div class="bkmsg '+(tone||"")+'">'+msg+'</div>'; return; }
  if(!BOOKDRAFT){ el.innerHTML=""; return; }
  var b=BOOKDRAFT;
  el.innerHTML='<div class="bkcard">'
    +'<div class="bkrow"><i>What</i><input id="bk-t" value="'+esc(b.summary||"")+'"></div>'
    +'<div class="bkrow"><i>Starts</i><input id="bk-s" type="datetime-local" value="'+esc(b.start||"")+'"></div>'
    +'<div class="bkrow"><i>Minutes</i><input id="bk-d" type="number" min="5" step="5" value="'+(b.mins||30)+'"></div>'
    +'<div class="bkrow"><i>Their email</i><input id="bk-e" value="'+esc(b.email||"")+'" placeholder="optional"></div>'
    +'<div class="bkwhen">'+esc(bookPretty(b.start))+' &middot; '+(b.mins||30)+' min &middot; Eastern</div>'
    +'<div class="bkact"><button id="bk-save">Put It On My Calendar</button>'
    +'<button id="bk-cancel" class="ghost">Cancel</button></div></div>';
  wireBook();
}
function wireBook(){
  var go=document.getElementById("bk-go"), inp=document.getElementById("bk-in");

  function read(){
    if(!inp||!inp.value.trim())return;
    var raw=inp.value.trim();
    bookRender("Claudia is reading that&hellip;","wait");
    var now=new Date();
    var ask="You are booking a calendar appointment. Right now it is "+bookISO(now)
      +" in America/New_York. Read this request and reply with ONLY a JSON object, no prose, "
      +'no code fence: {"summary":"...","start":"YYYY-MM-DDTHH:MM:00","mins":30,"email":""} . '
      +"start must be local Eastern time in exactly that format. mins is the length in minutes, "
      +"default 30. email is the other person's address if one is given, otherwise an empty string. "
      +"The request: "+raw;
    if(!(window.cowork&&window.cowork.askClaude)){
      bookRender("Claudia is not reachable right now. Add it manually below.","bad"); return; }
    window.cowork.askClaude(ask,[]).then(function(ans){
      var t=typeof ans==="string"?ans:JSON.stringify(ans);
      var m=t.match(/\{[\s\S]*\}/);
      if(!m){ bookRender("She could not make sense of that. Try naming the day and the time.","bad"); return; }
      var o;
      try{ o=JSON.parse(m[0]); }catch(e){
        bookRender("She could not make sense of that. Try naming the day and the time.","bad"); return; }
      if(!o.start||isNaN(new Date(o.start))){
        bookRender("No clear date and time in that. Try \"Thursday at 2pm\".","bad"); return; }
      BOOKDRAFT={summary:o.summary||raw, start:String(o.start).slice(0,16),
                 mins:parseInt(o.mins,10)||30, email:o.email||""};
      bookRender(null);
    }).catch(function(){
      bookRender("Could not reach Claudia. Try again in a moment.","bad"); });
  }
  if(go) go.onclick=read;
  if(inp) inp.onkeydown=function(ev){ if(ev.key==="Enter"){ev.preventDefault();read();} };

  var cn=document.getElementById("bk-cancel");
  if(cn) cn.onclick=function(){ BOOKDRAFT=null; bookRender(null); };

  var sv=document.getElementById("bk-save");
  if(sv) sv.onclick=function(){
    function v(id){var e=document.getElementById(id);return e?e.value.trim():"";}
    var title=v("bk-t")||"Call", start=v("bk-s"), mins=parseInt(v("bk-d"),10)||30, em=v("bk-e");
    if(!start||isNaN(new Date(start))){ bookRender("That start time is not valid.","bad"); return; }
    var st=new Date(start);
    var en=new Date(st.getTime()+mins*60000);
    var args={calendarId:MYCAL, summary:title, timeZone:MYTZ,
      startTime:bookISO(st), endTime:bookISO(en), addGoogleMeetUrl:true,
      description:"Booked from Exodus HQ."};
    if(/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) args.attendees=[{email:em}];
    bookRender("Putting it on your calendar&hellip;","wait");
    window.cowork.callMcpTool(CALNEW,args).then(function(r){
      var bad=r&&r.isError;
      if(bad){ bookRender("Google turned that down. Check the time is not in the past.","bad"); return; }
      BOOKDRAFT=null;
      var el=document.getElementById("bk-in"); if(el)el.value="";
      bookRender("<b>Booked.</b> "+esc(title)+" &mdash; "+esc(bookPretty(bookISO(st)))
        +". Hit Reload to see it in the list below.","good");
    }).catch(function(){
      bookRender("Could not reach your calendar just now.","bad"); });
  };
}

var FILTER="all";
var ORD=STATUSES;
var LSEARCH="";      /* what is typed in the pipeline search box */
var LSORT="came-new";  /* how the pipeline is ordered */
var LGROUP=true;       /* stage bands on, or one flat list */

var SORTS=[
  {k:"came-new", nm:"Newest in first"},
  {k:"came-old", nm:"Oldest in first"},
  {k:"stage",    nm:"By stage"},
  {k:"name",     nm:"A to Z"},
  {k:"owed",     nm:"Owes the most"},
  {k:"follow",   nm:"Follow-up due"}
];

/* One sorter for the whole app. Purple always rides at the top, whatever the
   chosen order — that is the point of flagging someone. */
function sortLeads(list){
  function t(x){ var d=cameIn(x.name); return d?d.getTime():null; }
  return list.slice().sort(function(a,b){
    var pa=prGet(a.name)?0:1, pb=prGet(b.name)?0:1;
    if(pa!==pb) return pa-pb;
    if(LSORT==="came-new"||LSORT==="came-old"){
      var ta=t(a), tb=t(b);
      /* undated people go last either way — an unknown date is not "oldest" */
      if(ta===null&&tb===null) return String(a.name).localeCompare(String(b.name));
      if(ta===null) return 1;
      if(tb===null) return -1;
      return LSORT==="came-new" ? tb-ta : ta-tb;
    }
    if(LSORT==="owed") return (b.owed||0)-(a.owed||0);
    if(LSORT==="name") return String(a.name).localeCompare(String(b.name));
    if(LSORT==="follow"){
      var fa=fuDaysOut(a.name), fb=fuDaysOut(b.name);
      if(fa===null&&fb===null) return String(a.name).localeCompare(String(b.name));
      if(fa===null) return 1;
      if(fb===null) return -1;
      return fa-fb;
    }
    var sd=ORD.indexOf(a.stage)-ORD.indexOf(b.stage);
    if(sd) return sd;
    return String(a.name).localeCompare(String(b.name));
  });
}

/* Runs over the rows already in the DOM. No re-render, so the caret stays put
   and typing never stutters, however long the list gets. */
function lsApply(){
  var box=document.getElementById("lsearch");
  var q=(box?box.value:LSEARCH).toLowerCase().trim();
  LSEARCH=box?box.value:LSEARCH;
  var rows=document.querySelectorAll("tr[data-row]"), shown=0;
  for(var i=0;i<rows.length;i++){
    var hit=!q || rows[i].getAttribute("data-row").indexOf(q)>=0;
    rows[i].style.display=hit?"":"none";
    if(hit) shown++;
  }
  /* A folded band must never hide a search result — that is how you conclude a
     lead does not exist and stop chasing them. While there is a query every band
     is forced open; clearing the box puts them back the way he had them. */
  var bs=document.querySelectorAll("[data-pgbody]");
  for(var b1=0;b1<bs.length;b1++){
    var lab=bs[b1].getAttribute("data-pgbody");
    bs[b1].classList.toggle("shut", !q && pgIsShut(lab));
  }
  var hs=document.querySelectorAll("[data-pgrp]");
  for(var h1=0;h1<hs.length;h1++){
    var l2=hs[h1].getAttribute("data-pgrp");
    hs[h1].classList.toggle("shut", !q && pgIsShut(l2));
  }
  try{ pgFoldLabel(); }catch(e){}

  var c=document.getElementById("lscount");
  if(c) c.textContent=q?(shown+" of "+rows.length):(rows.length+" leads");
  return shown;
}
/* ---- which stage bands are folded shut ----
   Kept in localStorage rather than in a variable, because "I never want to see
   Dead Leads" is a standing preference, not a thing to re-do every morning.
   Keyed by the band's label, which is the stage name. */
function pgShutLoad(){
  try{ var o=JSON.parse(LS("pgrp_shut")||"{}"); return (o&&typeof o==="object")?o:{}; }
  catch(e){ return {}; }
}
function pgShutSave(o){ try{ LS("pgrp_shut", JSON.stringify(o)); }catch(e){} }
/* Collapsed to start. He asked for it, and it is right: the point of the CRM on
   the dashboard is to see the shape of the pipeline, then open the band you are
   working. Nine open bands is a wall.

   Only on the first visit — after that his own choices win, including choosing
   to leave everything open. */
function pgSeedShut(){
  if(LS("pgrp_seeded")==="1") return;
  LS("pgrp_seeded","1");
  var o=pgShutLoad();
  var any=false;
  STATUSES.forEach(function(st){ if(!o[st]){ o[st]=1; any=true; } });
  /* the purple band stays open — those are the people he is chasing today */
  if(o["Chasing Right Now"]) delete o["Chasing Right Now"];
  if(any) pgShutSave(o);
}
function pgIsShut(label){
  pgSeedShut();
  return !!pgShutLoad()[label];
}
function pgToggle(label){
  var o=pgShutLoad();
  if(o[label]) delete o[label]; else o[label]=1;
  pgShutSave(o);
  return !!o[label];
}
/* Fold or unfold everything on screen in one go. */
function pgSetAll(shut){
  var o=pgShutLoad();
  var hs=document.querySelectorAll("[data-pgrp]");
  for(var i=0;i<hs.length;i++){
    var lab=hs[i].getAttribute("data-pgrp");
    if(shut) o[lab]=1; else delete o[lab];
    pgPaint(lab, shut);
  }
  pgShutSave(o);
  pgFoldLabel();
}
/* Move the classes. No re-render — see the note at the top of this file. */
function pgPaint(label, shut){
  var hs=document.querySelectorAll('[data-pgrp="'+cssq(label)+'"]');
  for(var i=0;i<hs.length;i++){
    hs[i].classList.toggle("shut", shut);
    hs[i].setAttribute("aria-expanded", shut?"false":"true");
    hs[i].setAttribute("title", shut?"Show these":"Hide these");
  }
  var bs=document.querySelectorAll('[data-pgbody="'+cssq(label)+'"]');
  for(var j=0;j<bs.length;j++) bs[j].classList.toggle("shut", shut);
}
/* Stage names are plain words today, but a label with a quote in it would break
   the selector, so it gets escaped properly rather than hopefully. */
function cssq(v){
  return String(v).replace(/["\\]/g, "\\$&");
}
/* Are we mostly open or mostly shut? Drives the one button that does both. */
function pgAllShut(){
  var hs=document.querySelectorAll("[data-pgrp]");
  if(!hs.length) return false;
  for(var i=0;i<hs.length;i++) if(!hs[i].classList.contains("shut")) return false;
  return true;
}
function pgFoldLabel(){
  var b=document.getElementById("l-fold");
  if(!b) return;
  var shut=pgAllShut();
  b.textContent = shut ? "Open all" : "Collapse all";
  b.classList.toggle("on", shut);
}

var DSEARCH="";

function dsApply(){
  var box=document.getElementById("dsearch");
  var q=(box?box.value:DSEARCH).toLowerCase().trim();
  DSEARCH=box?box.value:DSEARCH;
  var rows=document.querySelectorAll("tr[data-drow]"), shown=0;
  for(var i=0;i<rows.length;i++){
    var hit=!q || rows[i].getAttribute("data-drow").indexOf(q)>=0;
    rows[i].style.display=hit?"":"none";
    if(hit) shown++;
  }
  var c=document.getElementById("dscount");
  if(c) c.textContent=q?(shown+" of "+rows.length):(rows.length+" people");
  return shown;
}

function gymView(){
  var now=new Date(); now.setHours(0,0,0,0);
  var y=now.getFullYear(), m=now.getMonth();
  var mStart=new Date(y,m,1), mDays=new Date(y,m+1,0).getDate();
  var w=wkLoad();
  var mine=w.filter(function(x){var d=new Date(x.d);return d.getFullYear()===y&&d.getMonth()===m;});

  /* best run of consecutive training days inside this month */
  var trained={};
  mine.forEach(function(x){ trained[new Date(x.d).getDate()]=true; });
  var best=0,run=0,cur=0;
  for(var i=1;i<=mDays;i++){
    if(trained[i]){run++; if(run>best)best=run;} else run=0;
  }
  /* current run, counted back from today */
  for(var b2=0;b2<40;b2++){
    var dd=new Date(now); dd.setDate(dd.getDate()-b2);
    if(dd<mStart) break;
    if(trained[dd.getDate()]) cur++; else break;
  }
  var elapsed=Math.min(now.getDate(),mDays);
  var perWeek=elapsed?Math.round(mine.length/elapsed*7*10)/10:0;

  var ws=wtLoad().slice().sort(function(a2,b3){return new Date(b3.d)-new Date(a2.d);});
  var latest=ws[0], first=ws[ws.length-1];
  var change=(latest&&first&&ws.length>1)
    ? Math.round((parseFloat(latest.w)-parseFloat(first.w))*10)/10 : null;

  var h='<div class="grid3" style="margin-bottom:13px">'
   +'<div class="card dk"><h4>'+MON[m]+' Workouts</h4><div class="v">'+mine.length+'</div>'
   +'<div class="d">'+perWeek+' a week so far</div></div>'
   +'<div class="card"><h4>Best Streak</h4><div class="v'+(best?" g":"")+'">'+best+'</div>'
   +'<div class="d">days in a row, this month</div></div>'
   +'<div class="card"><h4>On Now</h4><div class="v'+(cur?" g":"")+'">'+cur+'</div>'
   +'<div class="d">'+(cur?"keep it going":"train today and start one")+'</div></div>'
   +'<div class="card"><h4>Weight</h4><div class="v">'+(latest?esc(latest.w):"&mdash;")+'</div>'
   +'<div class="d">'+(change===null?"log a second one to see the trend"
        :(change>0?"up ":change<0?"down ":"level ")+Math.abs(change)+" since you started")+'</div></div></div>';

  /* ---- log a session ---- */
  h+='<div class="card"><h4>Log Today\'s Session</h4>'
   +'<div class="qrow"><input id="wkin" placeholder="Squat 5x5 @ 275 · bench 3x8 @ 205 · 20 min sauna" autocomplete="off">'
   +'<button id="wkadd">Log It</button></div></div>';

  /* ---- weight ---- */
  h+='<div class="card" style="margin:13px 0"><h4>Weight</h4>'
   +'<div class="wtrow">'
   +'<input id="wt-date" type="date" value="'+dkey(new Date())+'">'
   +'<input id="wt-val" type="number" step="0.1" inputmode="decimal" placeholder="lbs">'
   +'<button id="wt-add">Save</button></div>';
  if(ws.length){
    h+='<div class="wtlist">';
    ws.slice(0,10).forEach(function(r,ri){
      var prev=ws[ri+1];
      var dl=prev?Math.round((parseFloat(r.w)-parseFloat(prev.w))*10)/10:null;
      var dt=new Date(r.d+"T12:00:00");
      h+='<div class="wtr"><i>'+(dt.getMonth()+1)+'/'+dt.getDate()+'</i>'
        +'<b>'+esc(r.w)+'</b>'
        +'<span class="'+(dl>0?"up":dl<0?"dn":"")+'">'+(dl===null?"&mdash;":(dl>0?"+":"")+dl)+'</span>'
        +'<button class="xbtn" data-wtdel="'+r.d+'">&times;</button></div>';});
    h+='</div>';
    if(ws.length>10) h+='<div class="d" style="margin-top:6px">Showing the last 10 of '+ws.length+'.</div>';
  } else {
    h+='<div class="d" style="margin-top:8px">Just a date and a number. Weigh in on the same day each week '
     +'and the trend does the talking.</div>';
  }
  h+='</div>';

  /* ---- this month's sessions ---- */
  if(!mine.length){
    /* He may well have painted green squares without writing the session down.
       Saying "nothing logged" while the headline says 6 sessions is the kind of
       contradiction that made him stop trusting the number. */
    var onlyGreen=sessionsInMonth(new Date());
    h+='<div class="info">'
      +(onlyGreen
        ? onlyGreen+' day'+(onlyGreen===1?'':'s')+' marked green on the calendar this '
          +MON[m]+', but nothing written down. Type what you did and hit Log It.'
        : 'Nothing logged in '+MON[m]+' yet. Type what you did and hit Log It.')
      +'</div>';
  }else{
    /* Written sessions here; the headline count also includes days he only
       painted green on the calendar, so say which is which rather than showing
       two different numbers with the same label. */
    var greenOnly=sessionsInMonth(new Date())-mine.length;
    h+='<h4 class="sh">'+MON[m]+' Sessions &mdash; '+mine.length+' written'
      +(greenOnly>0?' <span style="color:var(--mut);font-weight:600">+ '+greenOnly
        +' marked on the calendar = '+sessionsInMonth(new Date())+' total</span>':'')
      +'</h4>';
    mine.slice().reverse().forEach(function(x){
      var dt=new Date(x.d);
      var gi=w.indexOf(x);
      h+='<div class="wkrow"><div class="dt">'+DAYS[dt.getDay()]+'<br>'+(dt.getMonth()+1)+'/'+dt.getDate()+'</div>'

       +'<button class="xbtn wkdel" data-i="'+gi+'">&times;</button></div>';});

  if(older>0) h+='<div class="hint">'+older+' session'+(older===1?"":"s")+' logged before this month are '
    +'still saved — they just do not count toward the numbers above.</div>';
  return h;
}

/* ================= CONSISTENCY =================
   One month at a time, nothing clever. Green trained, blue worked (Amazon),
   red missed. Click a square to cycle it. Rolls onto the next month by itself. */
function dkey(d){ return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2); }
var MON=["January","February","March","April","May","June","July","August","September","October","November","December"];

/* "" = nothing set yet, "g" trained, "b" work, "r" missed */
function dayState(d){
  var v=LS("cs_"+dkey(d));
  if(v==="g"||v==="b"||v==="r") return v;
  /* nothing set: fall back to the workout log, then to the Amazon rota */
  var w=wkLoad(), t=d.toDateString();
  if(w.some(function(x){return new Date(x.d).toDateString()===t;})) return "g";
  if(AMAZON.indexOf(d.getDay())>=0) return "b";
  return "";
}
function nextState(v){ return v==="g" ? "b" : v==="b" ? "r" : "g"; }

/* ============ DID HE TRAIN THAT DAY? ============
   There were two answers to this and they disagreed. The workout log holds the
   sessions he types; the consistency calendar holds a green square per day.
   Claude S. counted only the log, so a month of green squares still reported
   "0 sessions" — exactly what Glen spotted. One function now, both stores feed
   it: a green square counts, a logged workout counts, and a day recorded in
   both counts once.

   dayState already falls back to the log, so a logged day shows green on the
   calendar. This is the other half of that bridge. */
function trainedDays(year, month){
  var seen={};
  wkLoad().forEach(function(x){
    if(!x||!x.d) return;
    var d=new Date(x.d);
    if(isNaN(d.getTime())) return;
    if(year!==undefined && (d.getFullYear()!==year || d.getMonth()!==month)) return;
    seen[dkey(d)]=1;
  });
  var from, to;
  if(year===undefined){
    from=new Date(); from.setFullYear(from.getFullYear()-2);
    to=new Date();
  } else {
    from=new Date(year,month,1);
    to=new Date(year,month+1,0);
  }
  var cur=new Date(from.getFullYear(),from.getMonth(),from.getDate());
  var guard=0;
  while(cur<=to && guard++<1000){
    if(LS("cs_"+dkey(cur))==="g") seen[dkey(cur)]=1;
    cur.setDate(cur.getDate()+1);
  }
  return Object.keys(seen).sort();
}
function sessionsInMonth(d){
  d=d||new Date();
  return trainedDays(d.getFullYear(), d.getMonth()).length;
}
/* Monday start, because a training week is not a calendar week. */
function sessionsThisWeek(){
  var now=new Date(); now.setHours(0,0,0,0);
  var dow=(now.getDay()+6)%7;
  var mon=new Date(now); mon.setDate(mon.getDate()-dow);
  var n=0;
  for(var i=0;i<7;i++){
    var d=new Date(mon); d.setDate(mon.getDate()+i);
    if(d>now) break;
    if(LS("cs_"+dkey(d))==="g"){ n++; continue; }
    var hit=wkLoad().some(function(x){
      return x && x.d && dkey(new Date(x.d))===dkey(d); });
    if(hit) n++;
  }
  return n;
}
/* His rota is Amazon Mon/Thu/Fri/Sat, so the next free day is the honest answer
   to "when am I next training". If today is free and untrained, it is today. */
function nextTrainingDay(){
  var now=new Date(); now.setHours(0,0,0,0);
  for(var i=0;i<14;i++){
    var d=new Date(now); d.setDate(now.getDate()+i);
    if(AMAZON.indexOf(d.getDay())>=0) continue;
    if(i===0 && LS("cs_"+dkey(d))==="g") continue;
    return { d:d, when: i===0 ? "today" : i===1 ? "tomorrow" : DAYFULL[d.getDay()] };
  }
  return null;
}

function consistView(){
  var now=new Date(); now.setHours(0,0,0,0);
  var off=parseInt(LS("cs_off")||"0",10);          /* months away from today */
  var view=new Date(now.getFullYear(), now.getMonth()+off, 1);
  var y=view.getFullYear(), m=view.getMonth();
  var first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();

  var g=0,b=0,r=0,blank=0;
  for(var i=1;i<=days;i++){
    var d=new Date(y,m,i);
    if(d>now){blank++;continue;}
    var st=dayState(d);
    if(st==="g")g++; else if(st==="b")b++; else if(st==="r")r++; else blank++;
  }
  var done=g+b, counted=g+b+r;
  var pct=counted?Math.round(g/counted*100):0;

  /* the clock, because he asked to see it when he walks into the gym */
  var t=inZone(localTZ());
  var h='<div class="gymnow"><b>'+t.txt+'<em>'+t.ampm.toLowerCase()+'</em></b>'
   +'<i>'+DAYFULL[new Date().getDay()]+' &middot; '+MON[new Date().getMonth()]+' '+new Date().getDate()
   +', '+new Date().getFullYear()+'</i></div>';

  h+='<div class="grid3" style="margin-bottom:13px">'
   +'<div class="card dk"><h4>Trained</h4><div class="v" style="color:#22c55e">'+g+'</div>'
   +'<div class="d">'+pct+'% of the days you marked</div></div>'
   +'<div class="card"><h4>Work Days</h4><div class="v" style="color:#3b82f6">'+b+'</div>'
   +'<div class="d">Amazon shifts</div></div>'
   +'<div class="card"><h4>Missed</h4><div class="v" style="color:#f87171">'+r+'</div>'
   +'<div class="d">'+blank+' still blank</div></div></div>';

  h+='<div class="mhead">'
   +'<button class="mnav" data-mv="-1">&larr;</button>'
   +'<b>'+MON[m]+' '+y+'</b>'
   +'<button class="mnav" data-mv="1"'+(off>=0?' disabled':'')+'>&rarr;</button>'
   +(off!==0?'<button class="mnav today" data-mv="0">This month</button>':'')
   +'</div>';

  h+='<div class="mgrid">';
  DAYS.forEach(function(dn,ix){
    h+='<div class="mdn'+(AMAZON.indexOf(ix)>=0?" a":"")+'">'+dn+'</div>';});
  for(var pad=0;pad<first.getDay();pad++) h+='<div class="mc pad"></div>';
  for(var dd=1;dd<=days;dd++){
    var day=new Date(y,m,dd);
    var future=day>now;
    var st=future?"":dayState(day);
    var cls="mc"+(st?" "+st:"")+(future?" fut":"")
      +(day.toDateString()===new Date().toDateString()?" now":"");
    h+='<button class="'+cls+'"'+(future?' disabled':'')+' data-cs="'+dkey(day)+'">'+dd+'</button>';}
  h+='</div>';

  h+='<div class="legend">'
   +'<span><i class="k yes"></i>Trained</span>'
   +'<span><i class="k work"></i>Work</span>'
   +'<span><i class="k no"></i>Missed</span>'
   +'<span><i class="k blank"></i>Not set</span></div>';
  h+='<div class="hint">Click a day to cycle it: green trained &rarr; blue work &rarr; red missed &rarr; blank. '
   +'Days you log in the Workout Log turn green on their own, and your Amazon shifts start blue.</div>';
  return h;
}

var UNITS={oz:"oz",ounce:"oz",ounces:"oz",cup:"cup",cups:"cup",tbsp:"tbsp",tablespoon:"tbsp",
  tablespoons:"tbsp",slice:"slice",slices:"slice",scoop:"scoop",scoops:"scoop",

/* One item off a line: "8oz chicken breast", "2 eggs", "chipotle bowl".
   With no number in front, it uses a sensible portion rather than assuming 1. */
function foodOne(txt){
  var t=String(txt||"").toLowerCase().trim();
  if(!t) return null;
  var qty=null, unit="";
  var m=t.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:[.,]\d+)?)\s*([a-z]*)\s*(.*)$/);
  if(m){
    var q=m[1];
    if(q.indexOf("/")>0){
      var mixed=q.match(/^(\d+)\s+(\d+)\/(\d+)$/);
      if(mixed) qty=parseFloat(mixed[1])+parseFloat(mixed[2])/parseFloat(mixed[3]);
      else { var fr=q.split("/"); qty=parseFloat(fr[0])/parseFloat(fr[1]); }
    } else qty=parseFloat(q.replace(",","."));
    if(m[2]&&UNITS[m[2]]){ unit=UNITS[m[2]]; t=m[3]; }
    else if(m[2])         { t=m[2]+" "+m[3]; }
    else                  { t=m[3]; }
    t=t.trim();
  }
  if(qty!==null&&(isNaN(qty)||qty<=0)) qty=null;
  t=t.replace(/^(of|a|an|some|my)\s+/,"").replace(/[.,;!]+$/,"").trim();
  t=t.replace(/\s+/g," ");
  if(!t) return null;

  /* an exact name wins outright. Otherwise the longest name contained in what
     he typed wins, so "chicken breast" beats "chicken" but "burger" never
     turns into "cheeseburger". */
  var best=null;
  if(FOODS[t]) best=t;
  if(!best) for(var k in FOODS){
    if(t.indexOf(k)>=0){ if(!best||k.length>best.length) best=k; }
  }
  if(!best) for(var k2 in FOODS){
    if(t.length>=4&&k2.indexOf(t)>=0){ if(!best||k2.length<best.length) best=k2; }
  }
  if(!best) return {unknown:t, qty:(qty===null?1:qty), unit:unit};

  var f=FOODS[best];
  var baseUnit=f[4], perPortion=f[5];
  var n;                              /* how many base units */
  if(qty===null){
    n=perPortion;                     /* he just named the food */
    unit=baseUnit;
  } else if(unit==="g"){
    n = baseUnit==="oz" ? qty/28.35 : qty/100;
  } else if(unit==="lb"){
    n = baseUnit==="oz" ? qty*16 : qty;
  } else if(unit&&unit!==baseUnit){
    n = qty;                          /* different unit we cannot convert — treat as a count */
  } else {
    n = qty;
    unit = baseUnit;
  }

  return {name:best, qty:Math.round(n*100)/100, unit:unit||baseUnit,
    kcal:Math.round(f[0]*n), p:Math.round(f[1]*n),
    c:Math.round(f[2]*n),    fat:Math.round(f[3]*n),
    guessed:(qty===null)};
}
/* a whole line: "8oz chicken, 1 cup rice, 2 eggs" */
function foodParse(line){
  var parts=String(line||"").split(/[,+]|\band\b|\bwith\b/);
  var out={items:[],unknown:[],kcal:0,p:0,c:0,fat:0};
  parts.forEach(function(x){
    var r=foodOne(x); if(!r)return;
    if(r.unknown){out.unknown.push(r);return;}
    out.items.push(r); out.kcal+=r.kcal; out.p+=r.p; out.c+=r.c; out.fat+=r.fat;});
  return out;
}

/* ============================================================
   THE DASHBOARD  —  the homepage
   ------------------------------------------------------------
   Glen asked for one page to track everything, with the floor plan still one
   tap away. Nothing here owns any data: every figure is read from the same
   functions the rooms use, so the dashboard can never drift out of step with
   the panel it summarises. Every block is a door — tapping it opens the room
   that actually does the work.
   ============================================================ */
var VIEW = (LS("view")==="floor") ? "floor" : "home";

function setView(v){
  VIEW = (v==="floor") ? "floor" : "home";
  LS("view", VIEW);
  document.body.classList.toggle("homeview", VIEW==="home");
  if(VIEW==="home"){ closePanel(); drawDash(); }
  else { drawBuilding(); redraw(); }
  paintSwitch();
}
function paintSwitch(){
  var t=document.getElementById("vs-t"), ic=document.getElementById("vs-ic");
  if(t) t.textContent = (VIEW==="home") ? "Building" : "Dashboard";
  if(ic) ic.innerHTML = (VIEW==="home")
    /* going to the building: a floor plan */
    ? '<svg viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="1.5" fill="none" '
      +'stroke="currentColor" stroke-width="1.4"/><path d="M6 1 V13 M6 7 H13" stroke="currentColor" '
      +'stroke-width="1.4"/></svg>'
    /* going home: four tiles */
    : '<svg viewBox="0 0 14 14"><rect x="1" y="1" width="5" height="5" rx="1" fill="currentColor"/>'
      +'<rect x="8" y="1" width="5" height="5" rx="1" fill="currentColor" opacity=".55"/>'
      +'<rect x="1" y="8" width="5" height="5" rx="1" fill="currentColor" opacity=".55"/>'
      +'<rect x="8" y="8" width="5" height="5" rx="1" fill="currentColor"/></svg>';
}

/* ---- opening a module WITHOUT leaving the dashboard ----
   Tapping a panel used to throw him into the floor plan, which is the opposite
   of what a homepage is for. Now the room's own panel opens as a sheet on top of
   the dashboard: same tabs, same content, same handlers — it is the real room,
   just rendered here. Only the Building button changes views.

   DASH_MOD is the open module, or null. It is deliberately not part of WINS:
   those are the draggable desktop windows that belong to the floor plan, and
   mixing the two is what would make the view flicker. */
var DASH_MOD=null;          /* {room, tab} */
/* The CRM is the thing he works in for an hour at a stretch, so it opens wide
   and stays wide. Remembered, because having to re-expand it every time is the
   kind of friction that makes someone stop using a tool. */
var DASH_WIDE = LS("dash_wide")==="1";
/* Rooms that are worth the whole screen by default. */
var WIDE_BY_DEFAULT={sales:1};

function dashOpen(room,tab){
  if(!FLOORS[room]) return;
  var tabs=FLOORS[room].tabs||[];
  tab=Math.max(0, Math.min(tabs.length-1, tab||0));
  /* the pipeline gets the full screen the first time, then whatever he chose */
  if(WIDE_BY_DEFAULT[room] && LS("dash_wide")===null) DASH_WIDE=true;
  DASH_MOD={room:room, tab:tab};
  drawDash();
  /* start at the top of the sheet, not wherever the page was scrolled */
  var sh=document.getElementById("dsheet-b");
  if(sh) sh.scrollTop=0;
}
function dashClose(){ DASH_MOD=null; drawDash(); }
function dashTab(i){ if(DASH_MOD){ DASH_MOD.tab=i; drawDash(); } }

/* Kept because a lot of call sites say "go here". It no longer switches views. */

/* ============ TODAY'S CHECKLIST ============
   His own list for the day, one row per item so it can actually be ticked. Kept
   per date, so yesterday's list is still there and today starts clean.

   Deliberately separate from week_plan: that is the freeform plan Claudia writes,
   this is the list he crosses off. Both are visible; neither overwrites the
   other.

   The agents can reach this too — telling Claudia "done for today" ticks
   everything, which is why it lives in one store rather than in the markup. */
function dtKey(d){ return "dtasks_"+dkey(d||new Date()); }
function dtLoad(d){ try{ return JSON.parse(LS(dtKey(d))||"[]")||[]; }catch(e){ return []; } }
function dtSave(a,d){ LS(dtKey(d), JSON.stringify(a)); SBSAVE("daytasks"); }
function dtAdd(body){
  var a=dtLoad();
  a.push({b:String(body||""), done:false});
  dtSave(a);
  return a.length-1;
}
function dtToggle(i){
  var a=dtLoad(); if(!a[i]) return;
  a[i].done=!a[i].done; dtSave(a);
}
function dtSet(i,body){
  var a=dtLoad(); if(!a[i]) return;
  a[i].b=String(body||""); dtSave(a);
}
function dtDel(i){
  var a=dtLoad(); if(i<0||i>=a.length) return;
  a.splice(i,1); dtSave(a);
}
/* used by the agents: "everything is done" */
function dtAllDone(v){
  var a=dtLoad();
  a.forEach(function(t){ t.done = (v!==false); });
  dtSave(a);
  return a.length;
}
function dtOpenCount(){ return dtLoad().filter(function(t){ return !t.done; }).length; }
function dtDoneCount(){ return dtLoad().filter(function(t){ return t.done; }).length; }

/* Seed the list from the day's plan the first time he opens it, so the checklist
   is not empty next to a plan that has five things in it. Splits on lines and on
   full stops, because he writes both ways. */
function dtSeedFromPlan(){
  if(dtLoad().length) return 0;
  var plan=(LS("week_plan_"+new Date().getDay())||"").trim();
  if(!plan) return 0;
  /* Lookbehind ((?<=\.)) is not safe on older Safari and this app has been
     bitten by Safari before, so split on newlines then on ". " by hand. */
  var bits=[];
  plan.split(/\n+/).forEach(function(line){
    line.replace(/\.\s+/g, ".\u0001").split("\u0001").forEach(function(part){
      var t=part.replace(/^[-*\u2022\s]+/,"").trim();
      if(t.length>2) bits.push(t);
    });
  });
  if(!bits.length) return 0;
  dtSave(bits.map(function(b){ return {b:b, done:false}; }));
  return bits.length;
}

/* ---- the pieces of today ---- */
function todayPlan(){ return (LS("week_plan_"+new Date().getDay())||"").trim(); }
function todayDone(){ return LS("week_done_"+new Date().getDay())==="1"; }

/* Everybody with a follow-up that has come due, soonest first. This is the list
   that actually earns money, so it is the one thing on the page that is allowed
   to shout. */
function dueNow(){
  var out=[];
  (STATE.leads||[]).forEach(function(L){
    var d=fuDaysOut(L.name);
    if(d===null||d===undefined) return;
    if(d<=0) out.push({L:L,days:d});
  });
  out.sort(function(a,b){ return a.days-b.days; });
  return out;
}
/* Who to ring today: anything overdue, then the purple list, then whoever is
   owed money. Never the same person twice. */
function callToday(){
  var seen={}, out=[];
  function add(L,why){
    var k=keyOf(L.name); if(seen[k]) return; seen[k]=true;
    out.push({L:L,why:why});
  }
  dueNow().forEach(function(x){
    var d=x.days;
    add(x.L, d<0 ? Math.abs(d)+"d overdue" : "due today");
  });
  (STATE.leads||[]).forEach(function(L){ if(prGet(L.name)) add(L,"priority"); });
  (STATE.leads||[]).forEach(function(L){ if(L.owed>0&&!L.deferred) add(L,"owes money"); });
  return out;
}
/* refreshContacts has already merged his own stage pick over the sheet's, so
   L.stage is the answer — reaching for stGet again would second-guess it. */
function stageCounts(){
  var c={};
  STATUSES.forEach(function(st){ c[st]=0; });
  (STATE.leads||[]).forEach(function(L){
    var st=stageFix(L.stage||stGet(L.name)||"New Lead");
    if(STATUSES.indexOf(st)<0) st="New Lead";
    c[st]++;
  });
  return c;
}
/* days trained in a row, counting back from today */
function trainStreak(){
  var n=0, d=new Date(); d.setHours(0,0,0,0);
  for(var i=0;i<400;i++){
    var st=dayState(d);
    if(st==="g") n++;
    else if(i===0 && st!=="r") { /* today not marked yet — do not break the run */ }
    else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}
/* Weigh-ins are stored as {d:"YYYY-MM-DD", w:pounds}. This read s2[0] and callers
   reached for .t, which is not a field on the record — the dashboard would have
   printed "undefined" the first time Glen weighed himself. The gym panel had it
   right all along; this brings the rest into line. */
function latestWeight(){
  var a=wtLoad().filter(function(x){ return x && x.d && x.w!==undefined && x.w!==""; });
  if(!a.length) return null;
  a.sort(function(x,y){ return String(y.d).localeCompare(String(x.d)); });
  var top=a[0];
  return { d:top.d, w:top.w, label:String(top.w).replace(/[^0-9.]/g,"")+" lb" };
}
/* ============ THE IDEA BANK ============
   Hooks and formats, kept in Postgres so they follow him between his phone and
   his laptop. Seeded from what actually travels on short-form travel content:
   exact cost breakdowns with receipts, "things I wish I knew before", hyper-local
   food under a minute, and a journey with a beginning and an end — the arc Itchy
   Boots turned into 2.5 million subscribers. */
/* ============ CONTENT ANALYTICS ============
   Instagram and TikTok carry the business, YouTube is third — that is the order
   they appear in. PLATS is left alone because the studio uses it elsewhere.

   Everything here is computed from social_history, which gets a row per platform
   per day. Nothing is invented: where there is no history there is no line, and
   it says so rather than drawing a flattering curve out of a single reading. */
var ANALYTICS_ORDER=[
  {k:"ig",     db:"instagram", nm:"Instagram", goal:10000, col:"#e1306c"},
  {k:"tiktok", db:"tiktok",    nm:"TikTok",    goal:10000, col:"#ff2d55"},
  {k:"yt",     db:"youtube",   nm:"YouTube",   goal:1000,  col:"#ff4444"}
];

function folNow(k){ return parseInt(LS("fol_"+k)||"0",10)||0; }

/* 9,302,600 does not belong on a dashboard card. 9.3M does. */
function abbr(n){
  n=Number(n)||0;
  if(n>=1e9) return (n/1e9).toFixed(n>=1e10?0:1).replace(/\.0$/,"")+"B";
  if(n>=1e6) return (n/1e6).toFixed(n>=1e7?0:1).replace(/\.0$/,"")+"M";
  if(n>=1e4) return Math.round(n/1e3)+"K";
  if(n>=1e3) return (n/1e3).toFixed(1).replace(/\.0$/,"")+"K";
  return String(n);
}
/* a follower delta, and the colour that goes with it */
function dfmt(d){ return d===null||d===undefined ? "&mdash;"
  : (d>0?"+":"")+Number(d).toLocaleString(); }
function dcls(d){ return d===null||d===undefined ? "" : (d>0?"g":d<0?"r":""); }
/* "2026-05-29" -> "29 May" */
function shortDate(iso){
  var s2=String(iso||"").slice(0,10).split("-");
  if(s2.length<3) return String(iso||"");
  var m=parseInt(s2[1],10)-1;
  return parseInt(s2[2],10)+" "+(MON[m]||"").slice(0,3);
}

/* Every reading we have, oldest first, as {key:"YYYY-MM-DD", n:number}. The live
   number is appended so the line always ends at today even before today's
   history row exists. */
function folSeries(k){
  var full=(PLAT_FULL[k]||k);
  var out=folHist().filter(function(x){ return x.p===full; })
    .map(function(x){ return { key:String(x.d).slice(0,10), n:Number(x.n)||0 }; })
    .sort(function(a,b){ return a.key.localeCompare(b.key); });
  var today=dkey(new Date()), now=folNow(k);
  if(out.length && out[out.length-1].key===today) out[out.length-1].n=now;
  else if(now) out.push({ key:today, n:now });
  return out;
}
/* change over n days, or null when there is not enough history to be honest */
function folDelta(k,days){
  var s2=folSeries(k);
  if(s2.length<2) return null;
  var cut=new Date(); cut.setDate(cut.getDate()-days);
  var cutKey=dkey(cut), base=null;
  for(var i=0;i<s2.length;i++){ if(s2[i].key<=cutKey) base=s2[i]; }
  if(!base) base=s2[0];
  var last=s2[s2.length-1];
  if(base===last) return null;
  return last.n-base.n;
}
/* followers a day, measured over whatever history exists */
function folPerDay(k){
  var s2=folSeries(k);
  if(s2.length<2) return null;
  var a=s2[0], b=s2[s2.length-1];
  var days=Math.max(1, Math.round(
    (new Date(b.key+"T12:00:00")-new Date(a.key+"T12:00:00"))/86400000));
  return (b.n-a.n)/days;
}
/* On this pace, does he hit the goal before the flight? null when unknowable. */
function folEta(k,goal){
  var per=folPerDay(k), now=folNow(k);
  if(per===null || per<=0 || now>=goal) return null;
  var days=Math.ceil((goal-now)/per);
  var when=new Date(); when.setDate(when.getDate()+days);
  return { days:days, when:when, beatsBangkok: when<=BANGKOK };
}
/* what he needs per day from here to make the goal by 5 December */
function folNeedPerDay(k,goal){
  var left=Math.max(0, goal-folNow(k));
  var days=Math.max(1, Math.ceil((BANGKOK-new Date())/86400000));
  return left/days;
}

/* ---- views a day, period by period ----
   The follower chart needs follower readings, and TikTok's Insights screens never
   show a follower total — only views. But he HAS sent four periods of view data,
   so the card can carry a real chart today by plotting the metric he actually has.
   Each period becomes one point at its midpoint, valued at views per day, so
   uneven period lengths compare fairly. */
function reachSeries(k){
  return reachRows(k).map(function(r){
    var s2=new Date(String(r.s)+"T12:00:00"), e2=new Date(String(r.e)+"T12:00:00");
    var mid=new Date((s2.getTime()+e2.getTime())/2);
    return { key:dkey(mid), n:Math.round(Number(r.v||0)/Number(r.days||1)),
             label:shortDate(r.s)+" - "+shortDate(r.e) };
  }).filter(function(x){ return x.n>0; });
}

/* Which chart a card shows. Followers when there is a real curve, otherwise the
   view data — never an empty box when there is something true to draw. */
var CHART_MODE={};        /* per platform: "fol" | "reach" */
function chartMode(k){
  if(CHART_MODE[k]) return CHART_MODE[k];
  return folSeries(k).length>1 ? "fol" : (reachSeries(k).length>1 ? "reach" : "fol");
}

/* ---- the chart ----
   A small area chart drawn as SVG. Single readings and flat lines are handled
   explicitly: one point draws nothing, because a straight line implies a trend
   that has not been measured. */
function folChart(k,col,w,h){
  var mode=chartMode(k);
  var s2 = mode==="reach" ? reachSeries(k) : folSeries(k);
  w=w||300; h=h||64;
  if(!s2.length) return '<div class="chart-none">No readings yet</div>';
  if(s2.length===1) return '<div class="chart-none">'
    +(mode==="reach" ? "One period on record" : "First reading logged")
    +' &middot; '+(mode==="reach" ? "add another window and the line starts"
                                  : "log again tomorrow and the line starts")+'</div>';

  var lo=Math.min.apply(null,s2.map(function(p){return p.n;}));
  var hi=Math.max.apply(null,s2.map(function(p){return p.n;}));
  var span=Math.max(1,hi-lo), pad=span*0.18;
  lo-=pad; hi+=pad;
  var X=function(i){ return (i/(s2.length-1))*(w-2)+1; };
  var Y=function(n){ return h-2-((n-lo)/(hi-lo))*(h-6); };

  var line=s2.map(function(p,i){
    return (i?"L":"M")+X(i).toFixed(1)+" "+Y(p.n).toFixed(1); }).join(" ");
  var area=line+" L"+X(s2.length-1).toFixed(1)+" "+h+" L"+X(0).toFixed(1)+" "+h+" Z";
  var gid="cg"+k+Math.round(w);
  var up=s2[s2.length-1].n>=s2[0].n;

  return '<div class="chartbox'+(up?"":" dn")+'">'
    +'<span class="chart-t">'+(mode==="reach"?"views a day":"followers")+'</span>'
    +'<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" '
    +'role="img" aria-label="follower growth">'
    +'<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="'+col+'" stop-opacity=".34"/>'
    +'<stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="'+area+'" fill="url(#'+gid+')"/>'
    +'<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" '
    +'stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+X(s2.length-1).toFixed(1)+'" cy="'+Y(s2[s2.length-1].n).toFixed(1)+'" '
    +'r="3" fill="'+col+'"/></svg>'
    +'<span class="chart-n">'+s2.length+' readings</span></div>';
}

/* ---- reach and engagement ----
   The follower count is the goal, but reach is the leading indicator: views fall
   first, then followers stop. These come off his own Insights screens, derived by
   subtracting nested windows, so every period is exact. */
function reachRows(k){
  var full=(PLAT_FULL[k]||k);
  try{
    return (JSON.parse(LS("fol_reach")||"[]")||[])
      .filter(function(x){ return x.p===full; })
      .sort(function(a,b){ return String(a.s).localeCompare(String(b.s)); });
  }catch(e){ return []; }
}
/* the most recent period, and the one before it, for a like-for-like comparison */
function reachLatest(k){
  var r=reachRows(k);
  return r.length ? r[r.length-1] : null;
}
function reachPerDay(row){
  if(!row||!row.days) return null;
  return Math.round(Number(row.v||0)/Number(row.days));
}
/* Views a day over the last 30 days of recorded periods, and the 30 before that.
   Periods are uneven, so this weights by days rather than averaging averages. */
function reachWindow(k, backDays, spanDays){
  var rows=reachRows(k);
  if(!rows.length) return null;
  var end=new Date(); end.setDate(end.getDate()-backDays);
  var start=new Date(end); start.setDate(start.getDate()-spanDays);
  var v=0, d=0, nf=0;
  rows.forEach(function(row){
    var rs=new Date(String(row.s)+"T12:00:00"), re=new Date(String(row.e)+"T12:00:00");
    /* how much of this period lands inside the window */
    var lo=rs>start?rs:start, hi=re<end?re:end;
    var overlap=Math.round((hi-lo)/86400000)+1;
    if(overlap<=0) return;
    var frac=overlap/Number(row.days||1);
    v+=Number(row.v||0)*Math.min(1,frac);
    if(row.nf!==null&&row.nf!==undefined) nf+=Number(row.nf)*Math.min(1,frac);
    d+=Math.min(overlap, Number(row.days||1));
  });
  if(!d) return null;
  return { views:Math.round(v), days:d, perDay:Math.round(v/d), net:Math.round(nf) };
}
/* Is reach accelerating or falling off a cliff? Compared like for like. */
function reachMomentum(k){
  var now=reachWindow(k,0,30), before=reachWindow(k,30,30);
  if(!now||!before||!before.perDay) return null;
  var pct=(now.perDay-before.perDay)/before.perDay*100;
  var label = pct>=25 ? "Accelerating"
            : pct>=-10 ? "Holding"
            : pct>=-50 ? "Slowing"
            : "Falling hard";
  var cls   = pct>=25 ? "up" : pct>=-10 ? "flat" : pct>=-50 ? "down" : "bad";
  return { pct:Math.round(pct), label:label, cls:cls,
           now:now.perDay, before:before.perDay };
}
/* Everything on record, for the twelve-month headline. */
function reachTotal(k, field){
  return reachRows(k).reduce(function(t,r){ return t+Number(r[field]||0); },0);
}

var MT_DEL=null;    /* which meeting is asking to be deleted, if any */
function mtLoad(){ try{ return JSON.parse(LS("meetings")||"[]")||[]; }catch(e){ return []; } }
function mtSave(a){ LS("meetings", JSON.stringify(a)); SBSAVE("meetings"); }
function calendlyBase(){ return (LS("calendly")||"").trim(); }
function calendlyLink(){
  var b=calendlyBase();
  if(!b) return "";
  if(!/^https?:\/\//i.test(b)) b="https://"+b.replace(/^\/+/,"");
  return b.replace(/\/+$/,"");
}
var MEET_FALLBACK="https://meet.google.com/landing";
function mtLinkFor(m){
  if(m && m.link) return m.link;
  return calendlyLink() || MEET_FALLBACK;
}
/* Soonest first. Anything with no time sits at the bottom rather than vanishing,
   because a booked call with a missing time is still a booked call.

   Returns {i, m} pairs, where i is the row's position in the STORED list. This
   matters: mtLoad() re-parses the JSON on every call, so it hands back brand new
   objects each time and mtLoad().indexOf(m) is always -1. Rendering with that
   index gave every row data-mti="-1", and every edit then hit `if(!a[-1]) return`
   and silently did nothing. Carrying the real index is the fix. */
function mtSorted(){
  var a=mtLoad().map(function(m,i){ return {i:i, m:m}; });
  a.sort(function(x,y){
    var xd=x.m.at?new Date(x.m.at).getTime():Infinity;
    var yd=y.m.at?new Date(y.m.at).getTime():Infinity;
    if(xd!==yd) return xd-yd;
    return String(x.m.name||"").localeCompare(String(y.m.name||""));
  });
  return a;
}
function mtWhen(m){
  if(!m.at) return "no time set";
  var d=new Date(m.at);
  if(isNaN(d.getTime())) return "no time set";
  var now=new Date();
  var t=d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
  if(d.toDateString()===now.toDateString()) return "today "+t;
  var tm=new Date(now); tm.setDate(tm.getDate()+1);
  if(d.toDateString()===tm.toDateString()) return "tomorrow "+t;
  if(d<now) return "was "+DAYS[d.getDay()]+" "+(d.getMonth()+1)+"/"+d.getDate();
  return DAYS[d.getDay()]+" "+(d.getMonth()+1)+"/"+d.getDate()+" "+t;
}
/* datetime-local wants local wall-clock, not an ISO string with a Z on the end —
   feeding it UTC shifts every meeting by the timezone offset. */
function mtLocalValue(at){
  if(!at) return "";
  var d=new Date(at);
  if(isNaN(d.getTime())) return "";
  function two(n){ return (n<10?"0":"")+n; }
  return d.getFullYear()+"-"+two(d.getMonth()+1)+"-"+two(d.getDate())
    +"T"+two(d.getHours())+":"+two(d.getMinutes());
}
function mtIsPast(m){
  if(!m.at) return false;
  var d=new Date(m.at);
  return !isNaN(d.getTime()) && d < new Date();
}

/* Change over the last n days. There were two of these and they disagreed: this

/* how many leads came in during the last 7 days, by their own date */
function newThisWeek(){
  var cut=new Date(); cut.setDate(cut.getDate()-7);
  var cutKey=dkey(cut);
  return (STATE.leads||[]).filter(function(L){
    var raw=cameInRaw(L.name);
    if(!raw) return false;
    return (raw.length===7 ? raw+"-01" : raw) >= cutKey;
  }).length;
}

var OPERATORS=[
  {k:"assistant", npc:"claudia", nm:"Claudia",   role:"Chief of staff", ac:"#22d3ee"},
  {k:"sales",     npc:"jordan",  nm:"Jordan",    role:"Sales",          ac:"#c8a86a"},

/* ============ THE OPERATOR DOCK  ("jarvis mode") ============
   Three faces pinned to the bottom-left corner. Tapping one opens a small dock
   above them — not the full-screen sheet — so the dashboard stays visible while
   he talks. He speaks, they answer out loud, and nothing covers the numbers he
   was reading.

   The dock reuses the existing chat state for each agent (CHAT / JCHAT / TCHAT)
   so a conversation started here continues in their room and the other way
   round. One conversation per person, two places to have it. */
var DOCK=null;              /* which agent's dock is open, or null */
var DOCK_MIN=false;

function operatorBar(){
  var h='<div class="opdock" id="opdock">'
   +'<div class="opdock-h"><b>Your Operators</b>'
   +'<span>always on &middot; they can change things, not just advise</span>'
   +'<button class="brf" id="op-brief" title="Hello, the weather, the news and '
   +'today read back exactly as you typed it">Brief me</button></div>';

  /* The faces come first now. When this was pinned to a corner the conversation
     had to open upwards, above them; in the page it reads top to bottom. */
  h+=opFaces();

  if(DOCK){
    var o=null;
    OPERATORS.forEach(function(x){ if(x.k===DOCK) o=x; });
    if(o){
      var n=NPC[o.npc];
      var log=dockLog(DOCK);
      h+='<div class="opchat" style="--oc:'+o.ac+'">'
        +'<div class="dk-h">'
          +'<span class="dk-f">'+(n?n.face():"")+'</span>'
          +'<span class="dk-who"><b>'+esc(o.nm)+'</b><i>'+esc(o.role)+'</i></span>'
          +'<button class="dk-b" data-dkroom="'+o.k+'" title="Open the full room">Full</button>'
          +'<button class="dk-x" id="dk-close" title="Close">&times;</button>'
        +'</div>'
        +'<div class="dk-log" id="dk-log">';
      if(!log.length)
        h+='<div class="dk-hi">'+esc(dockGreeting(o))+'</div>';
      else log.slice(-6).forEach(function(m2){
        var body = (typeof m2.t==="string") ? m2.t
                 : Array.isArray(m2.t) ? m2.t.join(" · ") : String(m2.t||"");
        if(!body) return;
        h+='<div class="dk-m '+(m2.r==="me"?"me":m2.r==="did"?"did":"them")+'">'
          +esc(body)+'</div>';
      });
      if(dockBusy(DOCK)) h+='<div class="dk-m them think">thinking…</div>';
      h+='</div>'
        +'<div class="dk-f2">'
          +'<button class="dk-mic'+(dockMicLive(o.k)?" on":"")+'" id="dk-mic" '
          +'title="Tap, speak, tap again">'
          +(dockMicLive(o.k)?"&#9632;":"&#127908;")+'</button>'
          +'<input id="dk-in" placeholder="Say it, or type it" autocomplete="off">'
          +'<button class="dk-spk'+(SPEAK?" on":"")+'" id="dk-spk" '
          +'title="'+esc(voiceLabel())+'">'+(SPEAK?"&#128266;":"&#128263;")+'</button>'
          +'<button class="dk-go" id="dk-send">Send</button>'
        +'</div>'
        +'</div>';
    }
  }

  h+='</div>';
  return h;
}

/* The three faces, split out so the bar can put them above the conversation
   instead of below it. */
function opFaces(){
  var h='<div class="opfaces">';

/* One conversation per agent, shared with their room. */
/* The real stores: Claudia lives on STATE.chat, the other two on their own
   arrays. Rows are {r:"me"|"ai"|"sys"|"did", t:text}. */
function dockLog(k){
  try{
    if(k==="assistant") return (STATE&&STATE.chat)||[];
    if(k==="sales")     return JCHAT||[];
    if(k==="gym")       return TCHAT||[];
  }catch(e){}
  return [];
}
function dockBusy(k){
  try{
    if(k==="assistant") return !!(STATE&&STATE.busy);
    if(k==="sales")     return !!JBUSY;
    if(k==="gym")       return !!TBUSY;
  }catch(e){}
  return false;
}
/* the mic is a single shared recogniser; MICWHO says who it is pointed at */
function dockMicWho(k){
  return k==="sales" ? "jordan" : k==="gym" ? "claude" : "claudia";
}
function dockMicLive(k){ return RECON && MICWHO===dockMicWho(k); }
function dockGreeting(o){
  if(o.k==="assistant") return "Ask me about your day, your week or your calendar.";
  if(o.k==="sales")     return "Who are we closing? I can see the whole pipeline.";
  return "Tell me what you ate or lifted and I write it down.";
}


/* Send whatever is in the dock to whoever is open. Routes into the same ask
   functions their rooms use, so actions, memory and voice all behave the same. */
function dockSend(){
  var box=document.getElementById("dk-in");
  var t=box?box.value.trim():"";
  if(!t||!DOCK) return;
  if(box) box.value="";
  try{
    if(DOCK==="assistant")      ask(t);
    else if(DOCK==="sales")     jAsk(t);
    else if(DOCK==="gym")       tAsk(t);
  }catch(e){}
  setTimeout(function(){ if(VIEW==="home") drawDash(); },80);
}
function dockOpen(k){
  DOCK=(DOCK===k)?null:k;
  if(VIEW==="home") drawDash();
  setTimeout(function(){
    var b=document.getElementById("dk-in"); if(b&&!isPhone()) b.focus();
  },80);
}

/* The open module, drawn as a sheet over the dashboard. This is the actual room
   panel — tabBody() reads STATE.floor and STATE.tab, so we point STATE at the
   module, render, and every existing handler in wire() finds the same markup it
   always has. */
function dashSheet(){
  if(!DASH_MOD) return "";
  var R=FLOORS[DASH_MOD.room]; if(!R) return "";
  var keepFloor=STATE.floor, keepTab=STATE.tab;
  STATE.floor=DASH_MOD.room; STATE.tab=DASH_MOD.tab;

  catch(e){ body='<div class="dp-none">That module hit a snag: '
    +esc((e&&e.message)||e)+'</div>'; }
  STATE.floor=keepFloor; STATE.tab=keepTab;

  var tabs=(R.tabs||[]).length>1
    ? '<div class="tabs">'+R.tabs.map(function(t,i){
        return '<button class="tab'+(DASH_MOD.tab===i?" on":"")+'" data-dtab="'+i+'">'
          +esc(t)+'</button>';}).join("")+'</div>'
    : "";

  return '<div class="dsheet-wrap'+(DASH_WIDE?" wide":"")+'">'
    +'<div class="dsheet" role="dialog" aria-label="'+esc(R.nm)+'">'
      +'<div class="dsheet-h">'
        +'<span class="dsheet-ic">'+R.ic+'</span>'
        +'<b>'+esc(R.nm)+'</b><span class="dsheet-no">'+esc(R.no)+'</span>'
        +'<button class="dsheet-fl" id="dsheet-wide" '
        +'title="'+(DASH_WIDE?"Back to a narrower panel":"Fill the screen")+'">'
        +(DASH_WIDE?"Narrow":"Expand")+'</button>'
        +'<button class="dsheet-fl" id="dsheet-floor" title="Show this room in the building">'
        +'In the building</button>'
        +'<button class="dsheet-x" id="dsheet-x" title="Close — everything is saved">'
        +'&times;</button>'
      +'</div>'
      +'<div class="dsheet-b" id="dsheet-b"><div class="wbody">'+tabs
      +'<div class="tb">'+body+'</div></div></div>'
    +'</div></div>';
}

var NEWS_TRIED=false;
function drawDash(){
  var host=document.getElementById("dash");
  if(!host) return;
  /* Once per session, once per day: he asked for it updated every day and the
     honest way is to check when he arrives, not to promise a cron. */
  if(!NEWS_TRIED){ NEWS_TRIED=true;
    setTimeout(function(){ try{ newsDaily(); newsAuto(); }catch(e){} },900); }
  try{ host.innerHTML=dashView()+dashSheet()+scriptSheet()+wxSheet(); }
  catch(e){
    host.innerHTML='<div class="dp"><div class="dp-b"><div class="dp-none">'
      +'The dashboard hit a snag: '+esc((e&&e.message)||e)+'</div></div></div>';
    return;
  }
  document.body.classList.toggle("dsheeting", !!DASH_MOD);
  wireDash();
  /* Separate try blocks on purpose. These shared one, and when spPaint() threw
     it took the weather, the banner and the music down with it — three things
     apparently broken, one actual bug. */
  try{ wxPaint(); }catch(e){}
  try{ bannerPaint(); }catch(e){}
  try{ spPaint(); }catch(e){}
  try{ wireJarvis(); }catch(e){}
  try{ spotMount(); }catch(e){}
  /* Everything inside the sheet is a real room panel, so it needs the room's own
     handlers — the same wire() the floating windows use. */
  if(DASH_MOD){
    var keepFloor=STATE.floor, keepTab=STATE.tab;
    STATE.floor=DASH_MOD.room; STATE.tab=DASH_MOD.tab;
    try{ wire(); }catch(e){}
    STATE.floor=keepFloor; STATE.tab=keepTab;
  } else if(document.getElementById("dash-crm")){
    /* The pipeline is rendered straight into the page now, so it needs the same
       handlers the room gives it — the sort box, the search, the stage selects,
       every editable cell. Same call, pointed at sales tab 1. */
    var kf=STATE.floor, kt=STATE.tab;
    STATE.floor="sales"; STATE.tab=1;
    try{ wire(); }catch(e){}
    STATE.floor=kf; STATE.tab=kt;
  }
}

/* Escape is the one keyboard way out, bound once rather than per render. */
var ESC_BOUND=false;
function bindEscape(){
  if(ESC_BOUND) return;
  ESC_BOUND=true;
  document.addEventListener("keydown", function(ev){
    if(ev.key!=="Escape") return;
    if(WX_OPEN){ wxOpen(false); return; }
    if(SCRIPT_OPEN){ scriptOpen(false); return; }
    if(DASH_MOD){ dashClose(); return; }
    if(DOCK){ DOCK=null; if(VIEW==="home") drawDash(); }
  });
}

function wireDash(){
  bindEscape();
  var vs=document.getElementById("vswitch");
  if(vs) vs.onclick=function(){ setView(VIEW==="home"?"floor":"home"); };

  /* ---- the module sheet ---- */
  var sx=document.getElementById("dsheet-x");
  if(sx) sx.onclick=dashClose;

  (function(){

      var r=foodParse(box.value);
      var bits=r.items.map(function(x){
        return '<span class="fq'+(x.guessed?" guess":"")+'"><b>'
          +esc(x.qty+" "+x.unit+" "+x.name)+'</b>'+x.kcal+' cal &middot; '+x.p+'p</span>';});

        +' cal &middot; '+r.p+'p</span>');
      prev.innerHTML=bits.join("");
    }
    function store(what,k,pp,cc,ff){
      var a=fdLoad();
      a.push({d:new Date().toISOString(),what:what,
        kcal:String(k),p:String(pp),c:String(cc||0),f:String(ff||0)});
      fdSave(a);
      box.value=""; if(prev) prev.innerHTML="";
      drawDash();
    }
    function add(){
      var raw=box.value.trim(); if(!raw) return;
      var r=foodParse(raw);
      if(r.unknown.length && window.cowork && window.cowork.askClaude){
        if(prev) prev.innerHTML='<span class="fq unk"><b>Working it out\u2026</b>asking Claudia</span>';

          "Estimate the nutrition for exactly this food and quantity: \""+q+"\". "
          +"Reply with ONLY four whole numbers separated by commas, in this order: "
          +"calories, protein grams, carb grams, fat grams. No words, no units, no explanation. "
          +"Example reply: 430,38,22,19",[])
        .then(function(ans){
          var mm=String(ans).match(/(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/);
          var k=r.kcal, pp=r.p, cc=r.c, ff=r.fat;
          if(mm){ k+=parseInt(mm[1],10); pp+=parseInt(mm[2],10);
                  cc+=parseInt(mm[3],10); ff+=parseInt(mm[4],10); }
          store(raw,k,pp,cc,ff);})
        .catch(function(){ store(raw,r.kcal,r.p,r.c,r.fat); });
      } else store(raw,r.kcal,r.p,r.c,r.fat);
    }
    box.oninput=paint;
    box.onkeydown=function(ev){ if(ev.key==="Enter"){ ev.preventDefault(); add(); } };
    if(go) go.onclick=add;
  })();

/* ================= THE WALL SAFE =================
   Logins, accounts and what goes out every month, behind a PIN. Closing it
   locks it again, so it is shut by default every time the app loads.

   Being straight about what this is: a PIN on a web page is a privacy screen,
   not encryption. It stops someone glancing at your laptop. It is not a
   password manager and anything stored here sits in your database as plain
   text. Fine for a Netflix login or a card's last four. Do not put your bank
   or email password in it. */
var VAULT_OPEN=false, VAULT_TRY="", VAULT_MSG="", VAULT_TAB="money";
var VAULT_PIN="1919";

function vxLoad(k){ try{ return JSON.parse(LS("vault_"+k)||"[]")||[]; }catch(e){ return []; } }
function vxSave(k,rows){ LS("vault_"+k, JSON.stringify(rows)); SBSAVE("vault_"+k); }
function vxAdd(k,row){ var a=vxLoad(k); a.push(row); vxSave(k,a); }
function vxSet(k,i,field,val){ var a=vxLoad(k); if(!a[i])return; a[i][field]=val; vxSave(k,a); }
function vxDel(k,i){ var a=vxLoad(k); a.splice(i,1); vxSave(k,a); }
function vaultLock(){ VAULT_OPEN=false; VAULT_TRY=""; VAULT_MSG=""; }

function money2(n){
  var v=parseFloat(n); if(isNaN(v)) v=0;
  return "$"+v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
/* everything that leaves the account in a month, whatever its cadence */
function monthlyOut(){
  return vxLoad("expenses").filter(function(x){return x.active!==false;})
    .reduce(function(t,x){
      var a=parseFloat(x.amount)||0;
      if(x.cadence==="yearly") a=a/12;
      else if(x.cadence==="weekly") a=a*52/12;
      else if(x.cadence==="one-off") a=0;
      return t+a;},0);
}

function vaultView(){
  /* ---------- shut ---------- */
  if(!VAULT_OPEN){
    return '<div class="vlock">'
      +'<div class="vlock-i">'
        +'<svg viewBox="0 0 40 40" width="40" height="40"><circle cx="20" cy="20" r="18" fill="none" '
        +'stroke="#4a5462" stroke-width="2"/><circle cx="20" cy="20" r="11" fill="none" stroke="#39414d" '
        +'stroke-width="1.4"/><circle cx="20" cy="20" r="3.4" fill="#c9a25c"/></svg>'
      +'</div>'
      +'<div class="vlock-t"><b>The safe is locked</b>'
      +'<i>Logins, accounts, and everything that goes out each month.</i></div>'
      +'<div class="vpin">'
        +'<input id="v-pin" type="password" inputmode="numeric" maxlength="8" '
        +'placeholder="PIN" value="'+esc(VAULT_TRY)+'" autocomplete="off">'
        +'<button class="btn" id="v-open">Open</button>'
      +'</div>'
      +(VAULT_MSG?'<div class="bkmsg bad">'+esc(VAULT_MSG)+'</div>':'')

      +'passing glance out. It is not encryption, and what you store here sits in your database as '
      +'plain text. Good for a streaming login or a card&rsquo;s last four. Keep your bank and email '
      +'passwords in a real password manager.</div>'
      +'</div>';
  }

  /* ---------- open ---------- */
  var accts=vxLoad("accounts"), exps=vxLoad("expenses"), logins=vxLoad("logins");
  var cash=accts.filter(function(a){return a.kind!=="credit";})

  var owed=accts.filter(function(a){return a.kind==="credit";})

  var out=monthlyOut();

  var h='<div class="vbar"><span class="vbar-o">&#9679; OPEN</span>'
   +'<span class="vbar-n">Locks itself when you close it, and on every reload.</span>'
   +'<button class="btn gh" id="v-close">Close the safe</button></div>';

  /* the four numbers that matter */
  h+='<div class="grid3" style="margin-bottom:14px">'
   +'<div class="card dk"><h4>In The Accounts</h4><div class="v">'+money2(cash)+'</div>'
   +'<div class="d">'+accts.filter(function(a){return a.kind!=="credit";}).length+' account'
   +(accts.filter(function(a){return a.kind!=="credit";}).length===1?"":"s")+'</div></div>'
   +'<div class="card"><h4>On The Cards</h4><div class="v'+(owed>0?" r":"")+'">'+money2(owed)+'</div>'
   +'<div class="d">what you owe right now</div></div>'
   +'<div class="card"><h4>Out Every Month</h4><div class="v" style="color:var(--amber)">'+money2(out)+'</div>'
   +'<div class="d">'+exps.filter(function(x){return x.active!==false;}).length+' running</div></div>'

   +money2(cash-owed-out)+'</div><div class="d">after the cards and the bills</div></div></div>';

  /* which drawer */
  h+='<div class="pills">'
   +[["money","Accounts &amp; Cards"],["bills","Monthly Out"],["logins","Logins"]]

        return '<button class="pill'+(VAULT_TAB===t[0]?" on":"")+'" data-vt="'+t[0]+'">'+t[1]+'</button>';

   +'</div>';

  function fld(kind,i,field,val,ph,type){
    return '<input class="vin" data-vk="'+kind+'" data-vi="'+i+'" data-vf="'+field+'" '
      +(type?'type="'+type+'" ':'')+'value="'+esc(val==null?"":val)+'" placeholder="'+ph+'">';

  if(VAULT_TAB==="money"){

    else {
      h+='<div class="scroll big"><table><thead><tr><th>What</th><th style="width:118px">Kind</th>'
       +'<th style="width:130px">Where</th><th style="width:74px">Last 4</th>'
       +'<th style="width:120px">Balance</th><th style="width:120px">Limit</th>'
       +'<th>Note</th><th style="width:40px"></th></tr></thead><tbody>';
      accts.forEach(function(a,i){
        var isCard=a.kind==="credit";
        var used=isCard&&a.limit_amt ? Math.round((parseFloat(a.balance)||0)/parseFloat(a.limit_amt)*100) : null;
        h+='<tr'+(isCard?' class="vcard"':'')+'>'
         +'<td data-l="What" class="nm-c">'+fld("accounts",i,"label",a.label,"Chase checking")+'</td>'
         +'<td data-l="Kind"><select class="vsel" data-vk="accounts" data-vi="'+i+'" data-vf="kind">'
         +["checking","savings","credit","cash","other"].map(function(k){
             return '<option'+(a.kind===k?" selected":"")+'>'+k+'</option>';}).join("")
         +'</select></td>'
         +'<td data-l="Where">'+fld("accounts",i,"institution",a.institution,"Chase")+'</td>'
         +'<td data-l="Last 4">'+fld("accounts",i,"last4",a.last4,"1234")+'</td>'
         +'<td data-l="Balance">'+fld("accounts",i,"balance",a.balance,"0.00")+'</td>'
         +'<td data-l="Limit">'+(isCard?fld("accounts",i,"limit_amt",a.limit_amt,"5000")
              +(used!==null?'<div class="vuse'+(used>=70?" hot":"")+'">'+used+'% used</div>':''):'<span class="dirno">&mdash;</span>')+'</td>'
         +'<td data-l="Note">'+fld("accounts",i,"note",a.note,"anything worth remembering")+'</td>'
         +'<td data-l="Remove"><button class="vdel" data-vk="accounts" data-vi="'+i+'" title="Remove">&times;</button></td>'
         +'</tr>';});
      h+='</tbody></table></div>';

/* Stamp each cell with its column name so tables can stack into cards on a phone. */
function labelCells(){
  var tables=document.querySelectorAll(".wbody table");
  for(var t=0;t<tables.length;t++){
    var hs=tables[t].querySelectorAll("thead th"),names=[];
    for(var i=0;i<hs.length;i++) names.push(hs[i].textContent.trim());
    if(!names.length)continue;
    var rows=tables[t].querySelectorAll("tbody tr");
    for(var r=0;r<rows.length;r++){
      var tds=rows[r].children;
      for(var c=0;c<tds.length;c++) if(names[c]) tds[c].setAttribute("data-l",names[c]);
    }
  }
}
/* One place that re-renders whatever working windows are open. Every handler
   calls this instead of reaching for #tabbody directly. */
/* Is he typing into the dashboard right now?

   This matters more than it looks. redraw() runs from all sorts of background
   work — a save landing, a save FAILING and painting its warning bar, a pull
   finishing. Each of those replaced the dashboard's innerHTML, which threw away
   the box he had half-filled and the caret with it. Meeting notes and the food
   box both lost text this way.

   So: a background repaint never interrupts him. The numbers catch up the moment
   he clicks away, which is soon enough. */
function dashBusy(){
  var host=document.getElementById("dash");
  var a=document.activeElement;
  if(!host||!a||a===document.body) return false;
  if(!host.contains(a)) return false;
  var t=(a.tagName||"").toLowerCase();
  return t==="input" || t==="textarea" || t==="select";
}
/* One repaint for the whole app.

   Glen's rule: "every module on this app should update if something is changed
   in another". So there is exactly one place that repaints, everything routes
   through it, and every view reads the same store rather than keeping a copy.
   Telling Claudia the day is done ticks the checklist because the checklist is
   drawn from day_tasks, not from the markup that was there a second ago. */
function redraw(){
  renderWins(); drawMobileStack();
  /* the dashboard summarises the same numbers the rooms hold, so it repaints
     whenever anything is saved — unless he is mid-sentence in it */
  if(VIEW==="home" && !dashBusy()) drawDash();
}

    if(dsc) dsc.onclick=function(){dsb.value="";DSEARCH="";dsApply();dsb.focus();};
  }
  var cpy=document.querySelectorAll("button[data-copy]");
  for(var c4=0;c4<cpy.length;c4++) cpy[c4].onclick=function(){
    var self=this, txt=this.getAttribute("data-copy"), was=this.textContent;
    function done(ok){ self.textContent=ok?"Copied":"Select and copy"; 
      setTimeout(function(){self.textContent=was;},1400); }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);});
      else done(false);
    }catch(e){done(false);}
  };

  /* status picker */
  var sts=document.querySelectorAll("select.stsel");
  for(var s2=0;s2<sts.length;s2++) sts[s2].onchange=function(){
    stSet(this.getAttribute("data-n"),this.value);
    refreshContacts();SBW.lead(this.getAttribute("data-n"));drawBuilding();
    redraw();};

  /* per-lead notes */
  var nts=document.querySelectorAll("textarea.ntbox");
  for(var n2=0;n2<nts.length;n2++){
    nts[n2].oninput=function(){
      var nm=this.getAttribute("data-n");
      ntSet(nm,this.value);
      /* update the in-memory lead immediately too, so anything reading STATE
         between now and the next refresh sees the real text */
      var L=leadBy(nm); if(L){ L.notes=this.value; L.notesSet=true; }
      SBSAVE("lead", nm);
      this.style.borderColor="var(--green)";};
    nts[n2].onblur=function(){
      var self=this;
      refreshContacts();
      setTimeout(function(){self.style.borderColor="";},700);};
  }

  /* inline contact editing — save as you type, no re-render so focus is kept */
  var at=document.getElementById("addtoggle"),af=document.getElementById("addform");
  if(at&&af){
    at.onclick=function(){af.classList.toggle("open");
      if(af.classList.contains("open")){var n=document.getElementById("nl-name");if(n)n.focus();}};
    var cn2=document.getElementById("nl-cancel");
    if(cn2)cn2.onclick=function(){af.classList.remove("open");};
    var sv=document.getElementById("nl-save");
    if(sv)sv.onclick=function(){
      function v(id){var e=document.getElementById(id);return e?e.value.trim():"";}
      var nm=v("nl-name");
      if(!nm){var e=document.getElementById("nl-name");if(e)e.focus();return;}
      mlAdd({name:nm,phone:v("nl-phone"),email:v("nl-email"),ig:v("nl-ig"),
             stage:v("nl-stage")||"New Lead",source:v("nl-source"),notes:v("nl-notes")});
      /* the second number lives with the other contact overrides, which is
         where altPhone() and the Alt button read it from */
      var p2=v("nl-p2");
      if(p2) cnPut(nm,"p2",p2);
      var base=STATE.leads.filter(function(x){return !x.manual;});
      STATE.leads=base.concat(mlLoad().map(mlToLead));
      refreshContacts();drawBuilding();
      redraw();};
  }
  /* ---- removing a lead ---- */
  var dask=document.querySelectorAll("[data-delask]");
  for(var q9=0;q9<dask.length;q9++) dask[q9].onclick=function(ev){
    ev.stopPropagation();
    DEL_ASK=this.getAttribute("data-delask");
    redraw(); if(VIEW==="home") drawDash(); };
  var dno=document.querySelectorAll("[data-delno]");
  for(var q8=0;q8<dno.length;q8++) dno[q8].onclick=function(ev){
    ev.stopPropagation(); DEL_ASK=null;
    redraw(); if(VIEW==="home") drawDash(); };
  var dyes=document.querySelectorAll("[data-delyes]");
  for(var q7=0;q7<dyes.length;q7++) dyes[q7].onclick=function(ev){
    ev.stopPropagation(); leadDelete(this.getAttribute("data-delyes")); };

  var mf=document.querySelectorAll(".manualflag");
  for(var q2=0;q2<mf.length;q2++) mf[q2].onclick=function(){
    mlDel(parseInt(this.getAttribute("data-mi"),10));
    var base=STATE.leads.filter(function(x){return !x.manual;});
    STATE.leads=base.concat(mlLoad().map(mlToLead));
    refreshContacts();drawBuilding();
    redraw();};

  var cns=document.querySelectorAll("input.cn");
  for(var c=0;c<cns.length;c++){
    cns[c].oninput=function(){
      cnPut(this.getAttribute("data-n"),this.getAttribute("data-k"),this.value.trim());
      this.classList.add("ok");
      drawBuilding();};
    cns[c].onblur=function(){
      var self=this;
      /* tidy a 10-digit number into 000-000-0000 on the way out */
      if(this.getAttribute("data-k")==="p"){
        var d=String(this.value).replace(/\D/g,"");
        if(d.length===10||d.length===11){
          this.value=fmtPhone(d);
          cnPut(this.getAttribute("data-n"),"p",this.value);
        }
      }
      setTimeout(function(){self.classList.remove("ok");},900);};
  }

  [["mic","ci"],["mmic","mci"]].forEach(function(pair){
    var mb=document.getElementById(pair[0]);
    if(mb) mb.onclick=function(){ stopSpeaking(); startMic("claudia"); };});
  [["spk"],["mspk"]].forEach(function(pair){
    var sb=document.getElementById(pair[0]);
    if(sb) sb.onclick=function(){
      SPEAK=!SPEAK; LS("speak",SPEAK?"1":"0");
      if(!SPEAK) stopSpeaking();
      else if(!ttsReady()){
        STATE.chat.push({r:"sys",t:"This browser has no speech synthesis, so she cannot read replies aloud."});
        paintLog();
      } else say("Voice on.");
      ["spk","mspk"].forEach(function(id){
        var e=document.getElementById(id);
        if(e){e.classList.toggle("on",SPEAK);e.textContent=SPEAK?"🔊":"🔇";}});};});

  var ci=document.getElementById("ci"),cs=document.getElementById("cs");
  if(ci&&cs){
    cs.onclick=function(){ask(ci.value.trim());};
    ci.onkeydown=function(e){
      if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(ci.value.trim());}};
    ci.oninput=function(){ci.style.height="auto";ci.style.height=Math.min(ci.scrollHeight,120)+"px";};
  }

  var pa=document.getElementById("pl-add");
  if(pa) pa.onclick=function(){
    function v(id){var e=document.getElementById(id);return e?e.value.trim():"";}
    var u=v("pl-url"); if(!u){var e=document.getElementById("pl-url");if(e)e.focus();return;}
    if(!/^https?:\/\//i.test(u)) u="https://"+u;
    var a=[]; try{a=JSON.parse(LS("playlists")||"[]");}catch(e2){}
    a.push({n:v("pl-name")||u,u:u}); LS("playlists",JSON.stringify(a));
    redraw();};
  var pld=document.querySelectorAll(".pldel");
  for(var p3=0;p3<pld.length;p3++) pld[p3].onclick=function(){
    var a=[]; try{a=JSON.parse(LS("playlists")||"[]");}catch(e2){}
    a.splice(parseInt(this.getAttribute("data-i"),10),1);LS("playlists",JSON.stringify(a));
    redraw();};

  var fa=document.getElementById("fd-add");
  if(fa){
    var addF=function(){
      function v(id){var e=document.getElementById(id);return e?e.value.trim():"";}
      var what=v("fd-what"); if(!what){var e=document.getElementById("fd-what");if(e)e.focus();return;}
      var a=fdLoad();a.push({d:new Date().toISOString(),what:what,
        kcal:v("fd-kcal")||"0",p:v("fd-prot")||"0",c:v("fd-carb")||"0",f:v("fd-fat")||"0"});fdSave(a);
      redraw();};
    fa.onclick=addF;
    ["fd-what","fd-kcal","fd-prot","fd-carb","fd-fat"].forEach(function(id){
      var e=document.getElementById(id);
      if(e)e.onkeydown=function(ev){if(ev.key==="Enter"){ev.preventDefault();addF();}};});
  }
  var fdd=document.querySelectorAll(".fddel");
  for(var f2=0;f2<fdd.length;f2++) fdd[f2].onclick=function(){
    var a=fdLoad();a.splice(parseInt(this.getAttribute("data-i"),10),1);fdSave(a);
    redraw();};
  var gls=document.querySelectorAll("input.gl");
  for(var g2=0;g2<gls.length;g2++) gls[g2].onchange=function(){
    LS(this.getAttribute("data-g"),this.value||"0");
    redraw();};

  var wi=document.getElementById("wkin"),wa=document.getElementById("wkadd");
  if(wi&&wa){
    var addW=function(){
      var v=wi.value.trim();if(!v)return;
      var a=wkLoad();a.push({d:new Date().toISOString(),t:v});wkSave(a);
      redraw();};
    wa.onclick=addW;
    wi.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();addW();}};
  }
  var wd=document.querySelectorAll(".wkdel");
  for(var k=0;k<wd.length;k++) wd[k].onclick=function(){
    var a=wkLoad();a.splice(parseInt(this.getAttribute("data-i"),10),1);wkSave(a);
    redraw();};

}

/* On the hosted build the sign-in gate calls boot(). On Cowork there is no gate,
   so boot immediately as before. */
/* ---- windows: escape closes the front one, drag listeners go on once ---- */
(function wireWinShell(){
  winDragInit();
  if(window.addEventListener) window.addEventListener("resize",function(){
    clearTimeout(window._rsz);
    window._rsz=setTimeout(placeHotLinks,120);
  });
  document.onkeydown=function(e){
    if(e.key!=="Escape") return;
    var open=WINS.filter(function(w){return !w.min;});
    if(!open.length) return;
    open.sort(function(a2,b2){return b2.z-a2.z;});
    winClose(open[0].id);
  };
})();

/* ---- the dashboard / building switch (wired once, it lives in the top bar) ---- */
(function wireSwitch(){
  var vs=document.getElementById("vswitch");
  if(vs) vs.onclick=function(){ setView(VIEW==="home"?"floor":"home"); };
})();

/* ---- assistant popup on the map (wired once) ---- */
(function wireMapChat(){
  var t=document.getElementById("mtoggle"),box=document.getElementById("mchat"),
      cl=document.getElementById("mclose"),mi=document.getElementById("mci"),ms=document.getElementById("mcs");
  if(!t||!box)return;
  function open(){box.classList.add("open");t.style.display="none";paintLog();
    if(mi)setTimeout(function(){mi.focus();},60);}
  function shut(){box.classList.remove("open");t.style.display="flex";}
  t.onclick=open; if(cl)cl.onclick=shut;
  if(ms&&mi){
    ms.onclick=function(){ask(mi.value.trim());};
    mi.onkeydown=function(e){
      if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask(mi.value.trim());}};
    mi.oninput=function(){mi.style.height="auto";mi.style.height=Math.min(mi.scrollHeight,110)+"px";};
  }
})();

/* On the hosted build the sign-in gate calls boot() once it has a token.
   With no gate configured, or a token already stored, start straight away. */
(function(){
  /* The dashboard is home. Whichever view he was last on is remembered, so
     jumping into the building and refreshing does not throw him back out. */
  try{
    document.body.classList.toggle("homeview", VIEW==="home");
    paintSwitch();
    if(VIEW==="home") drawDash();
  }catch(e){}

  /* In Cowork the shim stood down, so __EXODUS_HOSTED__ was never set and we
     start straight away. On the server the gate sets it, and boot waits until
     there is a token. */
  if(!window.__EXODUS_HOSTED__){ boot(); return; }
  var t=null; try{ t=localStorage.getItem("exodus_hq_token"); }catch(e){}
  if(t) boot();
})();
